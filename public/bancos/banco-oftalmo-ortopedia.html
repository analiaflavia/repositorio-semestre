"En el adulto la luxación más frecuente es la anterior de hombro y en el niño la posterior de codo. Predominan en el miembro superior, se asocian a traumatismos deportivos y son más frecuentes en varones jóvenes. Por evolución son aguda, inveterada cuando pasan más de tres semanas, y recidivante.","w":["Invierte ambos grupos etarios.","La luxación de cadera del niño es infrecuente.","La cadera no encabeza la lista del adulto.","Correcta: hombro anterior en el adulto y codo posterior en el niño."]},{"s":"ORT","c":15,"t":"Luxación inveterada","q":"¿A partir de cuánto tiempo se considera inveterada una luxación?","o":["Más de tres semanas","Más de la tres meses","Más de una semana","Más de 24 horas"],"a":0,"e":"Las luxaciones se clasifican por mecanismo en traumática, congénita y patológica, y por evolución en aguda, inveterada cuando pasan más de tres semanas, y recidivante. El manejo es reducción precoz, inmovilización y rehabilitación, con radiografía antes y después de reducir.","w":["Correcta: tres semanas es el umbral de la luxación inveterada.","Tres meses supera el umbral.","Una semana no alcanza el umbral descrito.","Veinticuatro horas sigue siendo aguda."]},{"s":"ORT","c":15,"t":"Tiempos de inmovilización","q":"Relacione el tiempo de inmovilización de la luxación de miembro inferior con la de miembro superior:","o":["Inferior unas 12 semanas; superior 3 a 4 semanas de inmovilización","Inferior unas 5 semanas; superior 3 a 4 semanas","Inferior unas 5 semanas; superior 8 a 10 semanas de inmovilización","Inferior unas 3 semanas; superior 5 a 6 semanas de inmovilización"],"a":1,"e":"El miembro inferior requiere más tiempo de inmovilización, con promedio de 5 semanas, frente a las 3 a 4 semanas del superior. Prolongarla tiene costo: rigidez articular, atrofia muscular, calcificaciones, necrosis avascular, inestabilidad recurrente y artrosis.","w":["Doce semanas es excesivo incluso abajo.","Correcta: unas 5 semanas abajo y 3 a 4 arriba.","Ocho a diez semanas produciría rigidez importante.","Invierte ambos plazos."]},{"s":"ORT","c":15,"t":"Fractura intraarticular","q":"Artrocentesis con hemartros que contiene grasa y médula ósea amarilla. ¿Qué indica?","o":["Lesión del cruzado anterior","Lesión de colaterales","Fractura intraarticular","Artritis por cristales"],"a":2,"e":"Las fracturas intraarticulares comprometen las caras articulares y su hallazgo típico es el hemartros con grasa y médula ósea amarilla, porque el trazo abre la cavidad medular hacia la articulación. Su manejo es habitualmente quirúrgico para restituir la congruencia.","w":["La lesión del cruzado anterior da hemartros sin grasa.","La lesión de colaterales da líquido claro.","Correcta: la grasa y la médula indican apertura del canal medular.","La artritis por cristales no produce hemartros con grasa."]},{"s":"ORT","c":15,"t":"Clasificación de Seddon","q":"Paciente con parestesias del plexo radial por uso prolongado de muletas y recuperación rápida. ¿Qué grado de Seddon es?","o":["Neurotmesis","Axonotmesis","Sección con retracción","Neuropraxia"],"a":3,"e":"Seddon ordena la lesión nerviosa en neuropraxia, la más leve, con lesión de la vaina de mielina, parestesias y recuperación rápida, como la del plexo radial por muletas; axonotmesis, con ruptura axonal sin compromiso de envolturas y degeneración walleriana distal; y neurotmesis, con ruptura del nervio y sus envolturas.","w":["La neurotmesis tiene mal pronóstico y requiere cirugía.","La axonotmesis tarda meses en recuperarse.","No es una categoría de la clasificación de Seddon.","Correcta: lesión mielínica pura con recuperación rápida."]},{"s":"ORT","c":15,"t":"Axonotmesis","q":"¿Qué ocurre en la axonotmesis?","o":["Ruptura axonal con degeneración walleriana distal","Compresión reversible sin daño estructural","Ruptura del nervio con sus envolturas","Lesión solo de la vaina de mielina"],"a":0,"e":"En la axonotmesis hay ruptura axonal sin compromiso de las envolturas, con degeneración walleriana distal y recuperación en meses con rehabilitación. La neuropraxia es la lesión mielínica con recuperación rápida y la neurotmesis la ruptura del nervio y sus envolturas. Sunderland la subdivide en cinco grados.","w":["Correcta: axón roto con envolturas conservadas.","La compresión reversible corresponde a la neuropraxia.","Esa es la neurotmesis.","Esa es la neuropraxia."]},{"s":"ORT","c":15,"t":"Lesión arterial y venosa","q":"Relacione la lesión arterial con la venosa según el color del miembro y el pulso:","o":["Arterial cianosis con pulso normal; venosa palidez con pulso disminuido","Arterial palidez con pulso disminuido; venosa cianosis con pulso normal","Arterial cianosis con pulso disminuido; venosa palidez con pulso normal","Arterial palidez con pulso aumentado; venosa cianosis con pulso ausente"],"a":1,"e":"Ambas lesiones vasculares comparten las tres P de dolor, parestesia y parálisis. La arterial agrega palidez y pulso disminuido; la venosa cursa con cianosis por congestión y pulso normal. La medida principal es la compresión de la zona, con el torniquete reservado a casos concretos.","w":["Invierte ambos cuadros.","Correcta: palidez con pulso débil frente a cianosis con pulso normal.","La cianosis traduce estasis venosa, no isquemia arterial.","El pulso no aumenta en una lesión arterial."]},{"s":"ORT","c":15,"t":"Ventana isquémica","q":"¿A partir de cuántas horas comienza la necrosis muscular en la isquemia de una extremidad?","o":["A partir de las 48 horas","A partir de las 24 horas","A partir de las 6 horas","A partir de los 30 minutos"],"a":2,"e":"En la isquemia de una extremidad la necrosis muscular comienza a partir de las 6 horas, y el tejido nervioso es todavía más sensible. Esa ventana explica la urgencia de la revascularización y coincide con el plazo del síndrome compartimental, donde la fasciotomía ideal es dentro de las 4 horas.","w":["Cuarenta y ocho horas está muy por encima del umbral.","Veinticuatro horas implica necrosis irreversible.","Correcta: 6 horas es el umbral de necrosis muscular.","A los 30 minutos aún no hay necrosis establecida."]},{"s":"ORT","c":15,"t":"Subluxación","q":"¿Qué diferencia una subluxación de una luxación completa?","o":["La subluxación no requiere reducción","La subluxación no se ve en radiografía","La subluxación no produce dolor","La subluxación no deforma la articulación"],"a":3,"e":"La subluxación es una luxación incompleta que no deforma la articulación, aunque sí produce dolor y disfunción. Su ejemplo más frecuente es la del codo: la cabeza del radio se desplaza parcialmente sin afectar la unión humerocubital, es decir el codo de niñera del niño de 1 a 4 años, con radiografía normal.","w":["El codo de niñera requiere reducción inmediata.","La radiografía normal es un hallazgo, no la definición.","Sí produce dolor y disfunción.","Correcta: la ausencia de deformidad la distingue de la luxación completa."]},{"s":"ORT","c":15,"t":"Complicaciones de la luxación","q":"¿Cuáles son las complicaciones tempranas más comunes de la luxación?","o":["Lesiones neurovasculares y de ligamentos","Calcificaciones y atrofia muscular","Rigidez articular y artrosis","Inestabilidad recurrente crónica"],"a":0,"e":"Las complicaciones tempranas de la luxación son las lesiones neurovasculares y de ligamentos, que deben buscarse antes y después de reducir. Las tardías derivan de un manejo inadecuado o de inmovilización prolongada: rigidez, atrofia, calcificaciones, necrosis avascular, inestabilidad recurrente y artrosis.","w":["Correcta: lo neurovascular y ligamentario es lo precoz.","Las calcificaciones y la atrofia son tardías.","La rigidez y la artrosis son secuelas tardías.","La inestabilidad recurrente es una secuela a largo plazo."]},{"s":"ORT","c":16,"t":"Anatomía de la columna","q":"¿Qué caracteriza a las vértebras torácicas frente a las lumbares?","o":["Carecen de agujero vertebral","Tienen carillas costales","Tienen espinosas bífidas","Tienen cuerpos más voluminosos"],"a":1,"e":"La columna tiene 32 a 35 vértebras: 7 cervicales, 12 torácicas, 5 lumbares, 5 sacras fusionadas y 3 a 5 coccígeas; las torácicas tienen carillas costales, que las diferencian de las lumbares. El disco consta de anillo fibroso, que evita el desplazamiento, y núcleo pulposo, que amortigua y es lo que se hernia.","w":["Todas las vértebras tienen agujero vertebral.","Correcta: las carillas costales son el rasgo distintivo torácico.","Las espinosas bífidas son cervicales.","Los cuerpos más voluminosos son los lumbares."]},{"s":"ORT","c":16,"t":"Disco intervertebral","q":"¿Qué componente del disco intervertebral se hernia?","o":["El anillo fibroso","El ligamento amarillo","El núcleo pulposo","La carilla articular"],"a":2,"e":"El disco intervertebral consta de anillo fibroso, que aporta fuerza y evita el desplazamiento, y núcleo pulposo, que amortigua y es la estructura que se hernia al romperse el anillo. En el plano sagital son normales la lordosis cervical de unos 9 grados, la cifosis torácica, la lordosis lumbar de 45 a 57 grados y la cifosis sacra.","w":["El anillo es la barrera que, al romperse, permite la salida del núcleo.","El ligamento amarillo es una estructura posterior distinta.","Correcta: el núcleo pulposo es lo que se hernia.","La carilla articular no forma parte del disco."]},{"s":"ORT","c":16,"t":"Definición de escoliosis","q":"¿A partir de cuántos grados y en qué plano se define la escoliosis?","o":["Más de 10 grados en el plano sagital","Más de 45 grados en el plano coronal","Más de 25 grados en el plano frontal","Más de 10 grados en el plano frontal"],"a":3,"e":"La escoliosis es una curvatura lateral en el plano frontal o coronal superior a 10 grados, con componente tridimensional que incluye rotación vertebral. En el plano coronal la columna debe verse recta, con la plomada de C7 al sacro; las curvaturas del plano sagital son fisiológicas.","w":["El plano sagital corresponde a las curvaturas fisiológicas.","Los 45 grados son el umbral quirúrgico.","Los 25 grados marcan el inicio de la escoliosis moderada.","Correcta: más de 10 grados en el plano frontal o coronal."]},{"s":"ORT","c":16,"t":"Test de Adams","q":"¿Para qué sirve el test de Adams?","o":["Diferenciar escoliosis estructural de postural","Medir el ángulo de Cobb clínicamente","Valorar el equilibrio del tronco","Evaluar la madurez esquelética"],"a":0,"e":"En el test de Adams el paciente flexiona hacia adelante con las rodillas extendidas y se observa la giba, prominencia unilateral producida porque la rotación vertebral arrastra las costillas. Su valor es diferenciar la escoliosis estructural, que no corrige con la hiperflexión, de la postural, que sí lo hace.","w":["Correcta: la giba persistente indica escoliosis estructural.","El ángulo de Cobb se mide en radiografía.","El equilibrio del tronco se valora con la plomada.","La madurez esquelética se evalúa con el signo de Risser."]},{"s":"ORT","c":16,"t":"Origen de la giba","q":"¿Por qué aparece la giba en el test de Adams?","o":["Porque las costillas se fracturan por estrés","La rotación vertebral arrastra las costillas","Porque el paravertebral se contractura","Porque el hemitórax se hipertrofia"],"a":1,"e":"La giba es una prominencia unilateral de las costillas o de la masa paravertebral producida porque la rotación vertebral arrastra las costillas. Otros signos son asimetría de hombros, prominencia escapular, desequilibrio del tronco y alteración del triángulo de Talle.","w":["No existen fracturas por estrés costales en la escoliosis.","Correcta: el componente rotacional desplaza las costillas hacia atrás.","La contractura muscular no explica la prominencia ósea.","No hay hipertrofia del hemitórax."]},{"s":"ORT","c":16,"t":"Ángulo de Cobb","q":"¿Qué vértebras se seleccionan para medir el ángulo de Cobb?","o":["Las dos vecinas al ápex","La primera y la última de la columna","La más alta y la más baja de la curvatura","Solo la vértebra del ápex"],"a":2,"e":"El ángulo de Cobb es el gold standard: se identifican la vértebra más alta y la más baja de la curvatura, se traza una línea por el borde superior de la más alta y otra por el inferior de la más baja, se levantan perpendiculares y el ángulo de intersección es el de Cobb.","w":["Las vecinas al ápex no delimitan la curvatura.","No se usan los extremos de toda la columna.","Correcta: se toman las vértebras extremas de la curva.","Medir solo el ápex no define la amplitud."]},{"s":"ORT","c":16,"t":"Graduación por Cobb","q":"Paciente con ángulo de Cobb de 32 grados. ¿Cómo se clasifica su escoliosis?","o":["No es escoliosis","Grave","Leve","Moderada"],"a":3,"e":"Por debajo de 10 grados no se clasifica como escoliosis; de 10 a 25 es leve, de 25 a 45 o 50 moderada y por encima de 40 a 45 grave o inminentemente quirúrgica. El ángulo de Cobb es el gold standard de medición.","w":["Por encima de 10 grados sí es escoliosis.","El rango grave empieza por encima de 40 a 45 grados.","El rango leve va de 10 a 25 grados.","Correcta: 32 grados cae en el rango moderado."]},{"s":"ORT","c":16,"t":"Signo de Risser","q":"¿Qué evalúa el signo de Risser y sobre qué estructura?","o":["Madurez esquelética; osificación de la cresta ilíaca","Rotación vertebral; apófisis espinosas","Equilibrio del tronco; línea de C7 al sacro","Amplitud de la curva; platillos vertebrales"],"a":0,"e":"El signo de Risser evalúa la madurez esquelética a partir de la osificación del cartílago epifisario de la cresta ilíaca: Risser 0 sin osificación y alta probabilidad de progresión; 1, 2 y 3 osificación parcial; 4 casi completa; y 5 cierre completo con crecimiento finalizado.","w":["Correcta: mide madurez esquelética sobre la cresta ilíaca.","La rotación se valora con la giba del test de Adams.","El equilibrio del tronco se valora con la plomada.","La amplitud se mide con el ángulo de Cobb."]},{"s":"ORT","c":16,"t":"Risser 0","q":"¿Qué implica un Risser 0?","o":["Osificación casi completa de la cresta","Esqueleto muy inmaduro con alta probabilidad de progresión","Ausencia de rotación vertebral asociada","Crecimiento finalizado sin riesgo de progresión"],"a":1,"e":"Risser 0 significa que no hay osificación del cartílago epifisario de la cresta ilíaca, es decir esqueleto muy inmaduro y alta probabilidad de progresión; Risser 5 corresponde al cierre completo con crecimiento finalizado. Con Risser bajo, de 0 a 2, la tasa de progresión es mayor.","w":["La osificación casi completa es el Risser 4.","Correcta: sin osificación el potencial de progresión es máximo.","El Risser no evalúa la rotación vertebral.","El crecimiento finalizado corresponde al Risser 5."]},{"s":"ORT","c":16,"t":"Tratamiento por Cobb y Risser","q":"Adolescente con Cobb de 32 grados y Risser 1. ¿Cuál es la conducta?","o":["Observación con control radiográfico","Fisioterapia exclusiva","Corsé","Artrodesis vertebral"],"a":2,"e":"La conducta combina Cobb con madurez esquelética. Por debajo de 20 grados se observa con control radiográfico. Entre 20 y 40 o 50 grados en paciente inmaduro con Risser bajo se indica corsé para frenar la progresión hasta completar la maduración. Por encima de 40 a 45 grados en paciente maduro, cirugía.","w":["La observación se reserva a curvas menores de 20 grados.","La fisioterapia sola no frena la progresión.","Correcta: rango intermedio con Risser bajo es indicación de corsé.","La artrodesis se indica por encima de 40 a 45 grados."]},{"s":"ORT","c":16,"t":"Objetivo del corsé","q":"¿Cuál es el objetivo real del corsé en la escoliosis?","o":["Corregir de forma permanente la curvatura","Reducir el dolor lumbar asociado","Mejorar la capacidad respiratoria","Frenar la progresión hasta completar la maduración"],"a":3,"e":"El corsé aplica fuerzas en tres puntos y su objetivo es frenar la evolución de la curva, no corregirla: su éxito es mantener el ángulo sin progresión hasta completar la maduración esquelética. Se apoya en las leyes del crecimiento óseo: el hueso comprimido frena su crecimiento y el que se alarga lo aumenta.","w":["No endereza la columna de forma permanente.","El dolor no es el objetivo principal.","La función respiratoria no es la diana del tratamiento.","Correcta: mantener el ángulo sin progresión es el éxito del corsé."]},{"s":"ORT","c":16,"t":"Principio del corsé","q":"¿En qué principio biomecánico se basa el corsé?","o":["Fuerzas aplicadas en tres puntos","Inmovilización rígida completa","Descarga del peso corporal","Tracción axial continua"],"a":0,"e":"El corsé aplica fuerzas en tres puntos y frena la evolución de la curva apoyándose en las leyes del crecimiento óseo. La corrección quirúrgica, en cambio, aborda el plano axial y las angulaciones coronal y sagital manteniendo el equilibrio del tronco.","w":["Correcta: el sistema de tres puntos es el principio del corsé.","No inmoviliza de forma rígida y completa.","No descarga el peso corporal.","No actúa por tracción axial continua."]},{"s":"ORT","c":16,"t":"Escoliosis congénita","q":"Relacione la hemivértebra con la barra unilateral:","o":["Hemivértebra fusión de varias vértebras; barra falla de formación vertebral","Hemivértebra falla de formación; barra fusión de varias vértebras","Hemivértebra rotación vertebral aislada; barra fusión de varias vértebras","Hemivértebra falla de segmentación; barra rotación vertebral aislada"],"a":1,"e":"La escoliosis congénita se debe a defectos embriológicos: la hemivértebra es una falla de formación con alto riesgo de progresión que suele requerir cirugía, y la barra unilateral es la fusión de varias vértebras de un lado que impide el crecimiento en ese sector. La idiopática es la más frecuente y la neuromuscular da curvas largas en C.","w":["Invierte ambos defectos.","Correcta: falla de formación frente a fusión unilateral.","La hemivértebra no es una rotación aislada.","La hemivértebra es defecto de formación, no de segmentación."]},{"s":"ORT","c":16,"t":"Clasificación de Moe-King","q":"¿Qué describe el tipo V de la clasificación de Moe-King?","o":["Curvaturas no centradas respecto de la línea media","Curvatura lumbar extendida que no cruza la línea media","Doble curvatura torácica","Curvatura lumbar compensada con torácica"],"a":2,"e":"Moe-King distingue cinco tipos: I lumbar compensada con una torácica en línea media; II lumbar y torácica ambas compensadas; III lumbar más extendida que no cruza la línea media; IV curvaturas no centradas respecto de la línea media; y V doble curvatura torácica. Lenke añade la evaluación del plano sagital.","w":["Esa corresponde al tipo IV.","Esa corresponde al tipo III.","Correcta: el tipo V es la doble curvatura torácica.","Esa es la descripción del tipo I."]},{"s":"ORT","c":16,"t":"Epidemiología de la escoliosis","q":"¿Qué proporción de escoliosis son idiopáticas?","o":["Alrededor del 20%","Alrededor del 50%","Menos del 10%","Alrededor del 80%"],"a":3,"e":"Alrededor del 80% de las escoliosis son idiopáticas, con claro predominio femenino sobre todo en curvas pronunciadas: la relación hombre-mujer es similar por debajo de 10 grados pero se inclina hacia las mujeres a medida que la curva crece, lo que sugiere un factor hormonal ligado a los picos de crecimiento.","w":["Subestima mucho la proporción descrita.","La proporción descrita es superior al 50%.","Las idiopáticas son la gran mayoría.","Correcta: cuatro de cada cinco son idiopáticas."]},{"s":"ORT","c":16,"t":"Formas idiopáticas por edad","q":"¿Qué forma de escoliosis idiopática es la más frecuente?","o":["La del adolescente, mayor de 10 años","La infantil, menor de 3 años","La del adulto, mayor de 40 años","La juvenil, de 3 a 10 años"],"a":0,"e":"La forma idiopática del adolescente, con más de 10 años, es la más frecuente, frente a las formas infantil, menor de 3 años, y juvenil, de 3 a 10 años. Cerca del 80% de las escoliosis son idiopáticas con predominio femenino.","w":["Correcta: la del adolescente es la forma más frecuente.","La infantil es poco frecuente.","La del adulto suele ser degenerativa.","La juvenil es menos frecuente que la del adolescente."]},{"s":"ORT","c":16,"t":"Test de la plomada","q":"¿Qué valora el test de la plomada y entre qué referencias?","o":["Rotación vertebral; del ápex a la línea media","Equilibrio del tronco; de C7 al sacro","Amplitud de la curva; entre vértebras extremas","Madurez esquelética; de la cresta ilíaca al sacro"],"a":1,"e":"El test de la plomada traza una línea recta desde C7 que debe coincidir con la línea del sacro, en radiografía o con el paciente de espaldas, y valora el equilibrio del tronco en el plano coronal. La madurez se evalúa con Risser y la rotación con la giba de Adams.","w":["La rotación se evidencia con la giba de Adams.","Correcta: de C7 al sacro, para el equilibrio del tronco.","La amplitud se mide con el ángulo de Cobb.","La madurez se evalúa con Risser sobre la cresta ilíaca."]},{"s":"ORT","c":16,"t":"Escoliosis estructural y postural","q":"Relacione la escoliosis estructural con la no estructural:","o":["Estructural por fusión congénita; no estructural por hemivértebra de formación","Estructural sin rotación vertebral; no estructural con alteración ósea propia","Estructural por alteración ósea propia; no estructural por causa postural","Estructural por causa postural del paciente; no estructural por alteración ósea"],"a":2,"e":"La escoliosis estructural implica alteración propia de las estructuras óseas y no corrige con la hiperflexión del test de Adams. La no estructural obedece a causas posturales, sin modificaciones óseas, y sí corrige con la maniobra: es la pseudoescoliosis. Esa es la primera bifurcación diagnóstica.","w":["Ambos ejemplos citados son causas estructurales congénitas.","La estructural cursa con rotación vertebral, que produce la giba.","Correcta: alteración ósea frente a causa postural.","Invierte ambos conceptos."]},{"s":"ORT","c":17,"t":"Definición de osteomielitis","q":"¿Qué estructuras inflama la osteomielitis?","o":["Periostio de forma aislada","Cartílago y cápsula articular","Membrana sinovial articular","Hueso y médula ósea"],"a":3,"e":"Osteomielitis viene de osteo, hueso, mielo, médula, e itis, inflamación: es el proceso inflamatorio que afecta al hueso y a la médula ósea y produce destrucción ósea local, necrosis y aposición de hueso nuevo patológico. Su incidencia es de 21,8 casos por cada 100.000 personas, con predominio masculino 2 a 1.","w":["El periostio participa, pero la definición incluye hueso y médula.","El cartílago se destruye en la artritis séptica.","La sinovial es la diana de la artritis séptica.","Correcta: hueso y médula ósea, con necrosis y hueso nuevo patológico."]},{"s":"ORT","c":17,"t":"Agente más frecuente","q":"¿Cuál es el agente más común de osteomielitis y en qué porcentaje?","o":["Staphylococcus aureus, 50 a 70%","Staphylococcus epidermidis, 50 a 70%","Pseudomonas aeruginosa, 50 a 70%","Streptococcus pyogenes, 50 a 70%"],"a":0,"e":"Staphylococcus aureus es el agente más común de osteomielitis, responsable del 50 al 70% de los casos, y el hueso más afectado es la tibia. El calcáneo y los maléolos aparecen sobre todo en la osteomielitis por contigüidad del pie diabético, que suele ser polimicrobiana.","w":["Correcta: S. aureus en más de la mitad de los casos.","S. epidermidis se asocia a material protésico.","Pseudomonas se asocia a trauma y drogas intravenosas.","S. pyogenes participa en pediatría sin encabezar la estadística."]},{"s":"ORT","c":17,"t":"Hueso más afectado","q":"¿Cuál es el hueso más frecuentemente afectado por osteomielitis?","o":["El fémur distal","La tibia","El calcáneo","El húmero proximal"],"a":1,"e":"El hueso más frecuentemente afectado por osteomielitis es la tibia, y el agente más común S. aureus con 50 a 70% de los casos. El calcáneo y los maléolos aparecen más bien en la osteomielitis por contigüidad, asociada a pie diabético, úlceras por presión e insuficiencia vascular.","w":["El fémur se afecta, sin ser el más frecuente.","Correcta: la tibia encabeza la lista.","El calcáneo se afecta en la osteomielitis por contigüidad.","El húmero es una localización menos habitual."]},{"s":"ORT","c":17,"t":"Vía hematógena","q":"Relacione la vía hematógena con la vía por contigüidad:","o":["Hematógena en niños, huesos planos; contigüidad en pies, calcáneo y maléolos","Hematógena en diabéticos, pies y calcáneo; contigüidad en metáfisis de huesos largos","Hematógena en niños, metáfisis de huesos largos; contigüidad en pies y calcáneo","Hematógena en niños, metáfisis; contigüidad en epífisis de huesos largos"],"a":2,"e":"La vía hematógena es la más frecuente en niños: la infección llega por el torrente desde un foco distante, con frecuencia respiratorio, y asienta en la metáfisis de huesos largos como fémur, tibia y húmero. La contigüidad se asocia a pie diabético, úlceras por presión e insuficiencia vascular, afecta pies, calcáneo y maléolos y suele ser polimicrobiana.","w":["La hematógena asienta en metáfisis de huesos largos.","Invierte ambas vías.","Correcta: hematógena en el niño y contigüidad en el pie del diabético.","La contigüidad afecta pies y tobillo, no la epífisis."]},{"s":"ORT","c":17,"t":"Kingella kingae","q":"¿En qué grupo de edad hay que pensar en Kingella kingae como agente de osteomielitis?","o":["En recién nacidos menores de 4 meses","En adultos jóvenes usuarios de drogas","En adultos mayores de 65 años","En menores de 4 años"],"a":3,"e":"En el recién nacido menor de 4 meses los gérmenes son S. aureus, Streptococcus agalactiae del grupo B y E. coli. En lactantes y niños pequeños aparecen S. aureus, S. pyogenes y Kingella kingae, esta última especialmente frecuente en menores de 4 años. En adultos jóvenes hay que considerar Pseudomonas por trauma y drogas intravenosas.","w":["En el neonato predominan agalactiae y E. coli.","En el adulto joven usuario de drogas se piensa en Pseudomonas.","En el adulto mayor predominan gramnegativos y anaerobios.","Correcta: Kingella kingae es propia del menor de 4 años."]},{"s":"ORT","c":17,"t":"Osteomielitis aguda","q":"Niño con dolor óseo intenso y fiebre de 5 días, con radiografía normal. ¿Cómo se explica?","o":["Los cambios radiográficos aparecen después de 3 semanas","El secuestro tarda 48 horas en verse","La radiografía carece de valor en esta entidad","No se trata de osteomielitis por la placa normal"],"a":0,"e":"La osteomielitis aguda dura menos de 2 semanas, con inicio rápido, dolor intenso, fiebre y signos inflamatorios marcados, sin necrosis ósea importante, y todavía no se ve en la radiografía: los hallazgos son tardíos, después de las 3 semanas. La resonancia es el método más sensible para la detección temprana.","w":["Correcta: la radiografía es negativa en las primeras semanas.","El secuestro es un hallazgo de la forma crónica.","La radiografía sí muestra cambios, pero de forma tardía.","La placa normal no descarta osteomielitis aguda."]},{"s":"ORT","c":17,"t":"Clasificación temporal","q":"Relacione la osteomielitis aguda con la crónica según su duración:","o":["Aguda menos de 48 horas; crónica más de 2 semanas","Aguda menos de 2 semanas; crónica más de 3 meses","Aguda menos de 2 semanas; crónica más de 2 semanas","Aguda menos de 3 meses; crónica más de 6 meses"],"a":1,"e":"La osteomielitis aguda dura menos de 2 semanas, la subaguda de 2 semanas a 3 meses, con posibilidad de absceso de Brodie, y la crónica supera los 3 meses, con necrosis, secuestro, involucro y trayectos fistulosos y alta tasa de recurrencia.","w":["La aguda se extiende hasta 2 semanas, no 48 horas.","Correcta: menos de 2 semanas y más de 3 meses respectivamente.","Entre 2 semanas y 3 meses está la forma subaguda.","Los 3 meses son el límite de la subaguda, no de la aguda."]},{"s":"ORT","c":17,"t":"Secuestro e involucro","q":"Relacione el secuestro con el involucro:","o":["Secuestro absceso intramuscular; involucro hueso nuevo alrededor del foco","Secuestro hueso muerto en el foco; involucro salida del líquido a la piel","Secuestro hueso muerto en el foco; involucro hueso nuevo alrededor","Secuestro hueso nuevo alrededor; involucro hueso muerto dentro del foco"],"a":2,"e":"En la osteomielitis crónica el secuestro es el hueso muerto que queda dentro del foco y el involucro el hueso nuevo que se forma a su alrededor. La cloaca es el absceso intraóseo que busca salida y queda intramuscular, y la fístula la salida del líquido infectado hacia la piel.","w":["El absceso intramuscular es la cloaca.","La salida hacia la piel es la fístula.","Correcta: hueso muerto el secuestro y hueso nuevo reactivo el involucro.","Invierte ambos términos."]},{"s":"ORT","c":17,"t":"Cloaca y fístula","q":"¿Qué es la cloaca en la osteomielitis crónica?","o":["La salida del líquido infectado a la piel","El hueso muerto dentro del foco","El hueso nuevo formado alrededor","El absceso intraóseo que queda intramuscular"],"a":3,"e":"La cloaca es el absceso intraóseo que busca salida y queda intramuscular, y la fístula o trayecto fistuloso es la salida del líquido infectado hacia la piel. El secuestro es el hueso muerto dentro del foco y el involucro el hueso nuevo que lo rodea: los cuatro términos definen el cuadro radiológico de la forma crónica.","w":["La salida a la piel es la fístula.","El hueso muerto es el secuestro.","El hueso nuevo reactivo es el involucro.","Correcta: absceso intraóseo con extensión intramuscular."]},{"s":"ORT","c":17,"t":"Cierny-Mader estadio 4","q":"¿Qué caracteriza al estadio 4 de Cierny-Mader?","o":["Difusa, con inestabilidad del segmento óseo","Medular, sin salir del canal","Superficial, con periostio afectado","Localizada, con secuestro pero estable"],"a":0,"e":"Cierny-Mader es una clasificación anatómica: estadio 1 medular, dentro de la médula; 2 superficial, afecta el periostio sin romper la cortical; 3 localizado, con secuestro e involucro manteniendo estabilidad; y 4 difuso, con inestabilidad del segmento, hueso inservible y riesgo de fractura patológica. Se complementa con la clasificación fisiológica del huésped.","w":["Correcta: el estadio 4 es difuso con pérdida de estabilidad.","El medular es el estadio 1.","El superficial es el estadio 2.","El localizado con estabilidad conservada es el estadio 3."]},{"s":"ORT","c":17,"t":"Huésped tipo C","q":"¿Qué implica un huésped tipo C en la clasificación fisiológica de la osteomielitis?","o":["Portador de material protésico infectado","Prohibitivo: el riesgo quirúrgico supera al beneficio","Comprometido por diabetes o inmunosupresión","Inmunocompetente capaz de erradicar la infección"],"a":1,"e":"La clasificación fisiológica describe al huésped: el tipo A es normal e inmunocompetente y su circulación puede erradicar la enfermedad; el tipo B está comprometido por factores locales o sistémicos como diabetes o inmunosupresión; y el tipo C es prohibitivo, sin capacidad inmunitaria mínima, de modo que en teoría se contraindica el procedimiento quirúrgico.","w":["El material protésico no define la clasificación fisiológica.","Correcta: sin inmunidad mínima el riesgo supera al beneficio.","El comprometido es el tipo B.","El inmunocompetente es el tipo A."]},{"s":"ORT","c":17,"t":"Gold standard diagnóstico","q":"¿Cuál es el gold standard diagnóstico de la osteomielitis?","o":["La proteína C reactiva","La radiografía en dos proyecciones","El cultivo óseo","La velocidad de sedimentación"],"a":2,"e":"El cultivo óseo es el gold standard diagnóstico de la osteomielitis: sin cultivo no hay diagnóstico definitivo. La biopsia es fundamental porque la osteomielitis es la gran simuladora y puede parecer un tumor. La leucocitosis supera el 60% con desviación izquierda, la proteína C reactiva se eleva de 8 horas a 2 días y la sedimentación a las 48 horas.","w":["La proteína C reactiva se eleva rápido pero es inespecífica.","La radiografía da hallazgos tardíos.","Correcta: sin cultivo no hay diagnóstico definitivo.","La sedimentación es inespecífica."]},{"s":"ORT","c":17,"t":"Papel de la biopsia","q":"¿Por qué la biopsia es fundamental en la osteomielitis?","o":["Para medir la respuesta al antibiótico","Para determinar el estadio de Cierny-Mader","Para localizar el secuestro con precisión","Porque la osteomielitis puede parecer un tumor"],"a":3,"e":"La biopsia es fundamental porque la osteomielitis es la gran simuladora: puede parecer un tumor y viceversa, y el diferencial incluye tumores óseos, fractura por estrés y osteonecrosis. El cultivo óseo, en cambio, es el gold standard diagnóstico para identificar el germen.","w":["La respuesta al tratamiento se mide clínicamente y por laboratorio.","El estadio de Cierny-Mader es anatómico y se valora por imagen.","El secuestro se localiza por tomografía.","Correcta: sirve para el diagnóstico diferencial con tumor."]},{"s":"ORT","c":17,"t":"Signo de la penumbra","q":"¿En qué estudio aparece el signo de la penumbra?","o":["En la resonancia magnética","En la radiografía simple","En la tomografía computarizada","En la gammagrafía ósea"],"a":0,"e":"El signo de la penumbra es un hallazgo de la resonancia: la zona de transición de señal de alta intensidad entre el absceso y la médula ósea esclerótica. La resonancia es además el método más sensible para la detección temprana; la tomografía muestra destrucción cortical y secuestro y la gammagrafía capta el trazador de forma focal.","w":["Correcta: es un hallazgo característico de la resonancia.","La radiografía detecta cambios de forma tardía.","La tomografía es superior para hueso cortical.","La gammagrafía muestra captación focal del trazador."]},{"s":"ORT","c":17,"t":"Absceso de Brodie","q":"Relacione el absceso de Brodie con la esclerosis de Garré:","o":["Brodie forma perióstica; Garré forma abscedada intraósea localizada","Brodie forma abscedada intraósea; Garré forma esclerosante","Brodie forma esclerosante; Garré forma abscedada intraósea localizada","Brodie forma abscedada intraósea; Ollier forma esclerosante del hueso"],"a":1,"e":"Las formas de osteomielitis crónica son el absceso de Brodie, forma abscedada intraósea; la esclerosis de Garré, forma esclerosante; y la osteomielitis perióstica de Ollier. El absceso de Brodie aparece sobre todo en niños mayores y adolescentes, que tienden a localizar la infección, y se ve en la forma subaguda.","w":["La forma perióstica es la de Ollier.","Correcta: Brodie es abscedada y Garré esclerosante.","Invierte ambos epónimos.","La de Ollier es la forma perióstica."]},{"s":"ORT","c":17,"t":"Duración del antibiótico","q":"¿Cuánto dura habitualmente el tratamiento antibiótico de la osteomielitis?","o":["De 10 a 14 días","De 6 a 12 meses","De 4 a 6 semanas","De 4 a 6 meses"],"a":2,"e":"El tratamiento antibiótico de la osteomielitis empieza empírico, se ajusta por cultivo, pasa de intravenoso a oral y dura habitualmente de 4 a 6 semanas. Lo quirúrgico incluye desbridamiento, lavado y retiro de implantes infectados, con injerto óseo solo después de que ceda el cuadro infeccioso.","w":["Diez a catorce días bastan para una celulitis, no para hueso.","Seis a doce meses corresponde a la tuberculosis osteoarticular.","Correcta: de 4 a 6 semanas es el esquema habitual.","Cuatro a seis meses excede el esquema descrito."]},{"s":"ORT","c":17,"t":"Momento del injerto","q":"¿Cuándo se coloca el injerto óseo en la osteomielitis?","o":["Antes de iniciar el antibiótico empírico","En el mismo desbridamiento inicial","Solo si el cultivo resulta negativo","Después de que ceda por completo el cuadro infeccioso"],"a":3,"e":"En la osteomielitis el injerto óseo se coloca después de que ceda completamente el cuadro infeccioso; mientras tanto se mantiene el espacio con cemento óseo, que puede mezclarse con antibiótico como la vancomicina. Las complicaciones son fractura patológica, sepsis, fístulas crónicas, amputación y recurrencia.","w":["El injerto nunca precede al control de la infección.","El desbridamiento inicial no es el momento del injerto.","El resultado del cultivo no determina el momento del injerto.","Correcta: injertar sobre foco activo condena el injerto a infectarse."]},{"s":"ORT","c":17,"t":"Artritis séptica: urgencia","q":"¿Por qué la artritis séptica es una emergencia y no una urgencia diferible?","o":["En un mes puede destruir la articulación","Porque produce necrosis avascular inmediata","Porque cursa con bacteriemia asociada","Porque el antibiótico no penetra la sinovial"],"a":0,"e":"La artritis séptica es una emergencia ortopédica, a diferencia de la osteomielitis: desde que se diagnostica hay que llevar al paciente a quirófano, porque en un mes puede destruir la articulación y condenar al paciente a perderla. La articulación más afectada es la rodilla y el germen más común S. aureus.","w":["Correcta: la destrucción articular es rápida e irreversible.","La necrosis avascular no es el mecanismo de la urgencia.","La bacteriemia no es constante.","El antibiótico penetra, pero no sustituye al drenaje."]},{"s":"ORT","c":17,"t":"Articulación más afectada","q":"¿Cuál es la articulación más afectada por artritis séptica?","o":["El hombro","La rodilla","El tobillo","La cadera"],"a":1,"e":"La articulación más afectada por artritis séptica es la rodilla. Su incidencia es de 2 a 10 casos por 100.000 habitantes al año, con relación hombre-mujer 2 a 1 y aumento en los extremos de la vida, y el germen más común es S. aureus. Los criterios de Kocher, en cambio, se aplican a la cadera.","w":["El hombro se asocia a peor pronóstico, sin ser el más frecuente.","Correcta: la rodilla es la localización más frecuente.","El tobillo no encabeza la lista.","La cadera es la articulación de los criterios de Kocher."]},{"s":"ORT","c":17,"t":"Artritis séptica y anemia falciforme","q":"Paciente con anemia falciforme y artritis séptica. ¿Qué germen hay que considerar?","o":["Eikenella corrodens","Kingella kingae","Salmonella","Neisseria gonorrhoeae"],"a":2,"e":"En adultos jóvenes y adolescentes hay que pensar en Neisseria gonorrhoeae y S. aureus, y en usuarios de drogas intravenosas también en Pseudomonas y Candida; el paciente con anemia falciforme orienta a Salmonella. La mordedura humana orienta a Eikenella corrodens, la de gato a Pasteurella multocida y la úlcera por decúbito a anaerobios.","w":["Eikenella se asocia a mordeduras humanas.","Kingella kingae es propia del menor de 4 años.","Correcta: Salmonella es el germen asociado a la anemia falciforme.","El gonococo se asocia al adulto joven sexualmente activo."]},{"s":"ORT","c":17,"t":"Criterios de Kocher","q":"¿Cuál de los siguientes NO es uno de los cuatro criterios clásicos de Kocher?","o":["Fiebre mayor de 38,5 grados","Incapacidad para soportar peso","Leucocitos por encima de 12.000","Proteína C reactiva positiva"],"a":3,"e":"Los cuatro criterios clásicos de Kocher son leucocitos por encima de 12.000 por microlitro, incapacidad para soportar peso, fiebre mayor de 38,5 grados y velocidad de sedimentación mayor de 40 mm por hora; la proteína C reactiva positiva se agregó posteriormente. Se enfocan en la cadera y no se usan en otras articulaciones.","w":["La fiebre mayor de 38,5 grados es criterio clásico.","La incapacidad de soportar peso es criterio clásico.","La leucocitosis por encima de 12.000 es uno de los cuatro.","Correcta: la proteína C reactiva se añadió después de los cuatro clásicos."]},{"s":"ORT","c":17,"t":"Probabilidad según Kocher","q":"Niño con tres criterios de Kocher. ¿Cuál es la probabilidad de artritis séptica?","o":["Cerca del 93%","Cerca del 40%","Cerca del 3%","Prácticamente el 100%"],"a":0,"e":"La probabilidad de artritis séptica según los criterios de Kocher es del 3% con uno, del 40% con dos, del 93% con tres y cercana al 100% con los cuatro. El salto entre dos y tres criterios es el que cambia la conducta: con tres ya se asume el diagnóstico y se lleva al paciente a quirófano.","w":["Correcta: tres criterios dan un 93% de probabilidad.","El 40% corresponde a dos criterios.","El 3% corresponde a un solo criterio.","El 100% corresponde a los cuatro criterios."]},{"s":"ORT","c":17,"t":"Gold standard de la artritis séptica","q":"¿Cuál es el gold standard diagnóstico de la artritis séptica?","o":["La resonancia magnética","La artrocentesis","La radiografía comparativa","La ecografía articular"],"a":1,"e":"La artrocentesis es el gold standard: se extrae líquido con catéter 18 o 20, se cultiva en medio aeróbico y anaeróbico, y el líquido purulento con más de 50.000 leucocitos y más del 75% de neutrófilos confirma la sospecha. La ecografía es de elección en fases iniciales, con alta sensibilidad y baja especificidad.","w":["La resonancia es sensible y de segunda línea.","Correcta: el análisis del líquido articular confirma el diagnóstico.","La radiografía da hallazgos tardíos, de 10 a 14 días.","La ecografía detecta derrame precoz, pero no confirma."]},{"s":"ORT","c":17,"t":"Ecografía en fases iniciales","q":"¿Cuál es el papel de la ecografía en la artritis séptica?","o":["Permite medir el espacio articular con precisión","Solo útil en la fase crónica tardía","Técnica de elección inicial, sensible y poco específica","Gold standard diagnóstico definitivo"],"a":2,"e":"La ecografía es la técnica de elección en fases iniciales de la artritis séptica, con alta sensibilidad y baja especificidad; detecta derrame precoz y su ausencia casi permite excluir el diagnóstico. El gold standard es la artrocentesis, la radiografía da hallazgos tardíos y la resonancia es la más sensible de segunda línea.","w":["La medición del espacio articular se hace por radiografía.","Es más útil precisamente en fases iniciales.","Correcta: muy sensible para derrame, poco específica.","El gold standard es la artrocentesis."]},{"s":"ORT","c":17,"t":"Espacio articular en la radiografía","q":"Relacione el cambio del espacio articular en el niño con el del adulto en la artritis séptica:","o":["Niño aumenta por derrame; adulto también aumenta por derrame masivo","Niño aumenta por osteofitos; adulto disminuye por daño del cartílago","Niño disminuye por daño condral; adulto aumenta por derrame articular","Niño aumenta por derrame; adulto disminuye por daño condral"],"a":3,"e":"Los hallazgos radiográficos de la artritis séptica son tardíos, de 10 a 14 días: edema periarticular, aumento del espacio articular por derrame en niños, disminución del espacio por compromiso del cartílago en adultos, desmineralización subcondral, quistes y destrucción progresiva.","w":["En el adulto el espacio disminuye por destrucción del cartílago.","Los osteofitos son propios de la artrosis.","Invierte ambos hallazgos.","Correcta: aumenta por derrame en el niño y disminuye por daño condral en el adulto."]},{"s":"ORT","c":17,"t":"Antibiótico en la artritis séptica","q":"¿Cuál es el antibiótico gold standard para cubrir S. aureus en la artritis séptica?","o":["Oxacilina","Vancomicina","Cefazolina","Ceftriaxona"],"a":0,"e":"El tratamiento médico de la artritis séptica son antibióticos intravenosos tempranos, con oxacilina como gold standard para cobertura de S. aureus, además de ceftriaxona y vancomicina según el caso, ajustados por cultivo y mantenidos de 2 a 6 semanas. Lo quirúrgico es lavado y desbridamiento, reentrando a las 72 horas para ver si sigue drenando.","w":["Correcta: la oxacilina es el gold standard antiestafilocócico.","La vancomicina se reserva a sospecha de resistencia a meticilina.","La cefazolina es el gold standard de la profilaxis quirúrgica.","La ceftriaxona se usa, sin ser el gold standard."]},{"s":"ORT","c":17,"t":"Reintervención en la artritis séptica","q":"¿Cuándo se reentra a quirófano tras el lavado articular?","o":["A las 2 semanas, con el cultivo definitivo","A las 72 horas, para verificar si sigue drenando","No se reentra: el lavado es definitivo","Solo si reaparece la fiebre después del mes"],"a":1,"e":"El tratamiento quirúrgico de la artritis séptica es lavado articular y desbridamiento por artroscopía o artrotomía, repitiendo el drenaje si es necesario: se reentra a las 72 horas para ver si sigue drenando. El antibiótico intravenoso temprano se mantiene de 2 a 6 semanas ajustado por cultivo.","w":["Dos semanas es demasiado tarde para reevaluar el drenaje.","Correcta: la reevaluación quirúrgica es a las 72 horas.","El lavado puede requerir repetición.","Esperar un mes permite la destrucción articular."]},{"s":"ORT","c":17,"t":"Pronóstico de la artritis séptica","q":"¿Cuál de los siguientes NO es factor de mal pronóstico en la artritis séptica?","o":["Compromiso de cadera u hombro","Osteomielitis concomitante","Tratamiento dentro de las 24 horas","Edad menor de 1 año"],"a":2,"e":"Son factores de mal pronóstico el tratamiento tardío después de 5 días, la edad menor de 1 año, el compromiso de cadera u hombro, la osteomielitis concomitante y la inmunosupresión. La forma poliarticular, con más de cuatro articulaciones, también empeora el pronóstico. Tratar dentro de las 24 horas es precisamente lo que lo mejora.","w":["La cadera y el hombro empeoran el pronóstico.","La osteomielitis concomitante figura entre los factores.","Correcta: el tratamiento precoz mejora el pronóstico.","La edad menor de 1 año es factor de mal pronóstico."]},{"s":"ORT","c":17,"t":"Mal de Pott","q":"¿Cuál es la localización más frecuente de la tuberculosis osteoarticular y su porcentaje?","o":["Columna vertebral, cerca del 15%","Rodilla, cerca del 50%","Cadera, cerca del 50%","Columna vertebral, cerca del 50%"],"a":3,"e":"La tuberculosis osteoarticular representa del 1 al 3% de la tuberculosis extrapulmonar y su localización más frecuente es la columna vertebral, el mal de Pott, con cerca del 50% de los casos, seguida de la cadera con 20% y la rodilla con 15%. Predomina en países endémicos e inmunosuprimidos, con curso crónico y fiebre con pérdida de peso.","w":["El 15% corresponde a la rodilla.","La rodilla es la tercera, con 15%.","La cadera es la segunda localización, con 20%.","Correcta: el mal de Pott concentra cerca de la mitad de los casos."]},{"s":"ORT","c":17,"t":"Tríada de Phemister","q":"¿Qué componentes forman la tríada de Phemister?","o":["Osteopenia yuxtaarticular, pinzamiento y erosiones","Secuestro, involucro y cloaca","Condrocalcinosis, erosiones y quistes","Esclerosis, osteofitos y quistes subcondrales"],"a":0,"e":"La tríada de Phemister es el hallazgo radiográfico patognomónico de la tuberculosis osteoarticular: osteopenia yuxtaarticular, disminución del espacio articular y erosiones óseas. La resonancia es el gold standard para buscar la enfermedad y puede mostrar destrucción vertebral, con frecuencia en T10 a T12, y absceso bilateral del psoas.","w":["Correcta: es la tríada radiográfica clásica de la tuberculosis osteoarticular.","Secuestro, involucro y cloaca son de la osteomielitis crónica.","La condrocalcinosis es el hallazgo de la pseudogota.","Esclerosis, osteofitos y quistes describen la artrosis."]},{"s":"ORT","c":17,"t":"Esquema HRZE","q":"¿Cuánto dura el tratamiento de la tuberculosis osteoarticular?","o":["De 2 a 3 meses","De 6 a 12 meses","De 4 a 6 semanas","De 18 a 24 meses"],"a":1,"e":"El tratamiento de la tuberculosis osteoarticular es el esquema HRZE, con isoniazida, rifampicina, pirazinamida y etambutol, prolongado de 6 a 12 meses, más largo que el de la tuberculosis pulmonar, con monitoreo clínico e inmovilización temporal. La cirugía incluye desbridamiento, sinovectomía y artrodesis solo en casos avanzados.","w":["Dos a tres meses es solo la fase intensiva inicial.","Correcta: de 6 a 12 meses, más que el esquema pulmonar.","Cuatro a seis semanas corresponde a la osteomielitis piógena.","Excede la duración descrita."]},{"s":"ORT","c":17,"t":"Profilaxis antibiótica","q":"¿Cuál es el antibiótico gold standard de la profilaxis en ortopedia y cuándo se administra?","o":["Cefazolina, al momento de cerrar la herida","Vancomicina, 30 a 60 minutos antes de la incisión","Cefazolina, 30 a 60 minutos antes de la incisión","Ceftriaxona, 30 a 60 minutos antes de la incisión"],"a":2,"e":"La cefazolina, cefalosporina de primera generación, es el gold standard de la profilaxis en ortopedia por su cobertura de grampositivos, penetración tisular, bajo costo y seguridad. Se administra intravenosa de 30 a 60 minutos antes de la incisión, se redosifica si la cirugía supera las 2 horas y no debe prolongarse más de 24 horas en cirugía cerrada.","w":["Administrarla al cerrar no alcanza niveles tisulares útiles.","La vancomicina se reserva a riesgo de resistencia a meticilina.","Correcta: cefazolina administrada antes de la incisión.","La ceftriaxona se usa mucho pero favorece la multirresistencia."]},{"s":"ORT","c":17,"t":"Redosificación de la profilaxis","q":"¿Cuándo hay que redosificar la profilaxis antibiótica intraoperatoria?","o":["No se redosifica: basta la dosis única","Solo si hay sangrado mayor de 1 litro","Cada 30 minutos de forma sistemática","Si la cirugía supera las 2 horas"],"a":3,"e":"La cefazolina se administra de 30 a 60 minutos antes de la incisión, se redosifica si la cirugía supera las 2 horas y no debe prolongarse más de 24 horas en cirugía cerrada. Es el gold standard de la profilaxis en ortopedia por su cobertura de grampositivos y su buena penetración tisular.","w":["Las cirugías prolongadas requieren redosificación.","El sangrado influye, pero el criterio descrito es el tiempo.","Cada 30 minutos es una frecuencia excesiva.","Correcta: más de 2 horas de cirugía exige nueva dosis."]},{"s":"ORT","c":17,"t":"Profilaxis según Gustilo","q":"Fractura abierta Gustilo III. ¿Cuál es la profilaxis indicada?","o":["Cefazolina más aminoglucósido","Clindamicina sola","Metronidazol más penicilina","Cefazolina sola"],"a":0,"e":"La profilaxis según Gustilo es cefazolina para los grados I y II y cefazolina más aminoglucósido para el grado III; si hay contaminación fecal se añade metronidazol o penicilina. La clindamicina es alternativa en alergia a betalactámicos y la vancomicina en riesgo de resistencia a meticilina.","w":["Correcta: el grado III añade cobertura de gramnegativos.","La clindamicina se usa por alergia a betalactámicos.","El metronidazol se añade ante contaminación fecal.","La cefazolina sola cubre los grados I y II."]},{"s":"ORT","c":17,"t":"Reclasificación de Gustilo","q":"Fractura tipo I por arma de fuego ocurrida en una granja. ¿Cómo se reclasifica?","o":["Como II por energía moderada","Como IIIA por alta contaminación","Permanece como tipo I","Como IIIC por riesgo vascular"],"a":1,"e":"Una fractura tipo I se reclasifica como IIIA si fue por arma de fuego o si ocurrió en granja, fosa séptica o lugar de alta contaminación. La profilaxis en el grado III es cefazolina más aminoglucósido, con metronidazol o penicilina añadidos si hay contaminación fecal.","w":["La reclasificación descrita es directamente a IIIA.","Correcta: el mecanismo y el entorno la elevan a IIIA.","El mecanismo de alta contaminación obliga a reclasificar.","El IIIC exige lesión vascular que precise reparación."]},{"s":"ORT","c":17,"t":"Sinovitis transitoria","q":"¿Qué caracteriza a la sinovitis transitoria frente a la artritis séptica?","o":["Requiere drenaje quirúrgico urgente","Cursa con más de 50.000 leucocitos","Es un cuadro autolimitado","Destruye la articulación en un mes"],"a":2,"e":"La sinovitis transitoria es un cuadro autolimitado que entra en el diferencial de la artritis séptica, junto con celulitis, bursitis y artritis por cristales. La artritis séptica, en cambio, es una emergencia que puede destruir la articulación en un mes, con líquido purulento de más de 50.000 leucocitos y más del 75% de neutrófilos.","w":["El drenaje urgente es el manejo de la artritis séptica.","Esa celularidad corresponde al líquido séptico.","Correcta: se resuelve sola, sin destrucción articular.","La destrucción rápida es propia de la artritis séptica."]},{"s":"ORT","c":18,"t":"Origen de los tumores óseos","q":"¿De qué tejido derivan los tumores óseos primarios y qué originan?","o":["Del neuroectodermo; originan sarcomas","Del epitelio; originan carcinomas óseos","Del tejido hematopoyético; originan sarcomas","Del mesénquima; originan sarcomas"],"a":3,"e":"Los tumores óseos se originan del mesodermo, es decir del tejido mesenquimal, que da lugar a sarcomas. El tejido epitelial origina carcinomas, el hematopoyético leucemias y linfomas, y el neuroectodérmico gliomas y neuroblastomas. Ante cualquier tumor hay que responder si es benigno o maligno, de qué tejido viene y qué tan agresivo es.","w":["El neuroectodermo origina gliomas y neuroblastomas.","El epitelio origina carcinomas, no tumores óseos primarios.","El hematopoyético origina leucemias y linfomas.","Correcta: origen mesenquimal y estirpe sarcomatosa."]},{"s":"ORT","c":18,"t":"Zona de transición","q":"Relacione la zona de transición del tumor benigno con la del maligno:","o":["Benigno bien definida con borde esclerótico; maligno mal definida y amplia","Benigno sin borde esclerótico; maligno bien definida y estrecha","Benigno mal definida y amplia; maligno bien definida con borde esclerótico","Benigno bien definida con esclerosis; maligno ausente por completo"],"a":0,"e":"El tumor benigno crece lento, está bien delimitado, sus células se parecen al tejido normal, no invade ni metastatiza, su zona de transición es bien definida con borde esclerótico y la reacción perióstica es mínima. El maligno crece rápido, está mal delimitado, tiene células anaplásicas, invade y metastatiza, con zona de transición amplia y reacción perióstica agresiva.","w":["Correcta: transición estrecha con esclerosis frente a amplia y difusa.","Una transición estrecha traduce crecimiento lento.","Invierte ambos patrones.","El maligno tiene zona de transición, pero amplia."]},{"s":"ORT","c":18,"t":"Primer estudio","q":"¿Cuál es el primer estudio ante la sospecha de tumor óseo?","o":["La tomografía computarizada","La radiografía simple","La biopsia percutánea","La resonancia magnética"],"a":1,"e":"Ante la sospecha de tumor óseo el primer estudio es la radiografía simple, no la resonancia: permite valorar zona de transición, patrón de destrucción, reacción perióstica y matriz. El diagnóstico definitivo lo da la biopsia, y la resonancia y la tomografía se usan después para estadificar y planificar.","w":["La tomografía complementa la evaluación inicial.","Correcta: la radiografía es la imagen inicial más útil.","La biopsia da el diagnóstico definitivo, no es el primer estudio.","La resonancia sirve para extensión, no como primer estudio."]},{"s":"ORT","c":18,"t":"Tumor más frecuente por edad","q":"¿Cuál es el tumor óseo más frecuente entre 5 y 20 años?","o":["El neuroblastoma metastásico","El mieloma múltiple","El osteosarcoma","El sarcoma de Ewing"],"a":2,"e":"El tumor óseo más frecuente cambia con la edad: de 0 a 5 años predominan los metastásicos como neuroblastoma y tumor de Wilms; de 5 a 20 años el osteosarcoma, seguido del sarcoma de Ewing; y en mayores de 40 las metástasis y el mieloma múltiple. El benigno más frecuente en general es el osteocondroma.","w":["Los metastásicos predominan de 0 a 5 años.","El mieloma predomina en mayores de 40 años.","Correcta: el osteosarcoma encabeza esa franja de edad.","El Ewing es el segundo en esa franja."]},{"s":"ORT","c":18,"t":"Tumor benigno más frecuente","q":"¿Cuál es el tumor óseo benigno más frecuente?","o":["El quiste óseo esencial","El osteoma osteoide","El tumor de células gigantes","El osteocondroma"],"a":3,"e":"El tumor óseo benigno más frecuente es el osteocondroma y el maligno primario más frecuente el osteosarcoma. El osteocondroma muestra continuidad de la cortical y del canal medular con el hueso madre, es formador de cartílago, tiene aspecto pediculado y crece en dirección contraria a la articulación más cercana.","w":["El quiste óseo esencial es una lesión pseudotumoral frecuente en niños.","El osteoma osteoide es menos frecuente.","El tumor de células gigantes aparece entre los 20 y 40 años.","Correcta: el osteocondroma es el benigno más frecuente."]},{"s":"ORT","c":18,"t":"Localización epifisaria","q":"¿Qué tumor asienta característicamente en la epífisis?","o":["El condroblastoma","El sarcoma de Ewing","La displasia fibrosa","El osteoma osteoide"],"a":0,"e":"La localización orienta el diagnóstico: en la epífisis asientan el condroblastoma y el encondroma articular; en la metáfisis el osteocondroma, el osteosarcoma y el tumor de células gigantes, que ocupa la región metafiso-epifisaria; y en la diáfisis el osteoma osteoide, el fibroma condromixoide, la displasia fibrosa y el sarcoma de Ewing.","w":["Correcta: el condroblastoma es epifisario.","El Ewing es diafisario.","La displasia fibrosa es diafisaria.","El osteoma osteoide es diafisario."]},{"s":"ORT","c":18,"t":"Reacción perióstica en piel de cebolla","q":"¿Qué tumor produce reacción perióstica laminada en piel de cebolla?","o":["El osteosarcoma","El sarcoma de Ewing","El encondroma","El osteocondroma"],"a":1,"e":"La reacción perióstica sólida indica crecimiento lento y sugiere benignidad; la laminada o en piel de cebolla traduce capas sucesivas por crecimiento intermitente y malignidad intermedia, típica del sarcoma de Ewing; la espiculada o en rayos de sol indica alta malignidad y caracteriza al osteosarcoma. Toda reacción perióstica es maligna hasta demostrar lo contrario.","w":["El osteosarcoma da la reacción espiculada en rayos de sol.","Correcta: la laminada en cebolla es del sarcoma de Ewing.","El encondroma tampoco produce reacción laminada.","El osteocondroma no produce reacción perióstica agresiva."]},{"s":"ORT","c":18,"t":"Signo radiográfico más agresivo","q":"¿Cuál es el signo radiográfico más sugerente de lesión ósea agresiva?","o":["El patrón geográfico bien delimitado","La zona de transición estrecha con esclerosis","La reacción perióstica espiculada en rayos de sol","La reacción perióstica sólida con periostio intacto"],"a":2,"e":"La reacción perióstica espiculada o en rayos de sol, con puntas perpendiculares al hueso, indica alta malignidad y es el signo radiográfico más sugerente de lesión agresiva, característico del osteosarcoma. El triángulo de Codman, con el periostio levantado en su totalidad, también traduce alta malignidad.","w":["El patrón geográfico es propio de lesiones benignas.","Esa transición traduce crecimiento lento y benignidad.","Correcta: la espiculación en sunburst es el signo más agresivo.","La reacción sólida sugiere benignidad."]},{"s":"ORT","c":18,"t":"Triángulo de Codman","q":"¿Qué representa el triángulo de Codman?","o":["Periostio engrosado en capas concéntricas","Periostio intacto sin penetración cortical","Calcificaciones en palomitas de maíz","Periostio levantado en su totalidad con paso libre de células"],"a":3,"e":"El triángulo de Codman corresponde a la reacción perióstica por elevación rápida del periostio: se levanta en su totalidad y queda paso libre de células, lo que traduce alta malignidad. Es uno de los signos del osteosarcoma junto con el signo de sol naciente, que combina lesión lítica con áreas blásticas.","w":["Las capas concéntricas son la reacción laminada del Ewing.","El periostio intacto corresponde a la reacción sólida benigna.","Las palomitas de maíz son matriz condroide.","Correcta: periostio totalmente desprendido, con alta malignidad."]},{"s":"ORT","c":18,"t":"Patrón permeativo","q":"¿Cuál es el patrón de destrucción ósea más agresivo?","o":["El permeativo","El geográfico","El apolillado","El esclerótico"],"a":0,"e":"El patrón geográfico muestra una lesión única bien delimitada y traduce crecimiento lento, probablemente benigno. El apolillado presenta múltiples áreas pequeñas de destrucción, es agresivo y puede confundirse con osteomielitis. El permeativo es una destrucción difusa que compromete médula, cortical y periostio y es el más agresivo de los tres.","w":["Correcta: el permeativo destruye las tres capas de forma difusa.","El geográfico es el más benigno.","El apolillado es agresivo pero menos que el permeativo.","El patrón esclerótico no figura entre los tres descritos."]},{"s":"ORT","c":18,"t":"Matriz condroide","q":"¿Cómo se ve radiográficamente la matriz condroide?","o":["En burbujas de jabón","Con calcificaciones en palomitas de maíz","Como densidad densa y esclerótica","Como lesión puramente lítica"],"a":1,"e":"La matriz condroide, propia de tumores cartilaginosos como el condrosarcoma y el encondroma, se ve puntiforme, con calcificaciones descritas como palomitas de maíz; la osteoide, de tumores formadores de hueso como el osteosarcoma, se ve como densidad densa y esclerótica. Las burbujas de jabón corresponden al tumor de células gigantes.","w":["Las burbujas de jabón son del tumor de células gigantes.","Correcta: las calcificaciones en palomitas de maíz son condroides.","La densidad esclerótica es matriz osteoide.","La matriz condroide no es puramente lítica."]},{"s":"ORT","c":18,"t":"Osteocondroma","q":"¿En qué dirección crece el osteocondroma?","o":["Hacia el interior del canal medular","Perpendicular a la cortical del hueso","Alejándose de la articulación más cercana","Hacia la articulación más cercana"],"a":2,"e":"El osteocondroma es el tumor benigno más frecuente. Su hallazgo típico es la continuidad de la cortical y del canal medular con el hueso madre, es formador de cartílago, tiene aspecto pediculado y crece en dirección contraria a la articulación más cercana, buscando la diáfisis. Cuando es múltiple configura la exostosis hereditaria múltiple.","w":["No crece hacia el interior del canal medular.","La espiculación perpendicular es signo de malignidad.","Correcta: crece alejándose de la articulación, hacia la diáfisis.","Crecer hacia la articulación no es su comportamiento."]},{"s":"ORT","c":18,"t":"Osteoma osteoide","q":"Paciente con dolor óseo progresivo de predominio nocturno que cede con antiinflamatorios. ¿Cuál es el diagnóstico?","o":["Fibroma no osificante","Osteosarcoma","Quiste óseo esencial","Osteoma osteoide"],"a":3,"e":"El osteoma osteoide es un tumor endomedular benigno que produce un nidus esclerótico rodeado de hueso esclerótico no reabsorbido. Su clave clínica es el dolor progresivo de predominio nocturno que mejora con antiinflamatorios no esteroideos. Se localiza en cuello femoral, tibia, metatarsianos y lámina de vértebras cervicales.","w":["El fibroma no osificante suele ser asintomático.","El osteosarcoma no responde así a los antiinflamatorios.","El quiste óseo esencial es indoloro y debuta como fractura.","Correcta: dolor nocturno que cede con antiinflamatorios es su firma clínica."]},{"s":"ORT","c":18,"t":"Nidus","q":"¿Qué es el nidus y de qué tumor es característico?","o":["Foco esclerótico rodeado de hueso reactivo; del osteoma osteoide","Zona de transición amplia; del osteosarcoma","Lesión lítica que insufla la cortical; del quiste óseo esencial","Defecto óseo mayor de 2 cm; del fibroma no osificante"],"a":0,"e":"El osteoma osteoide produce un nidus esclerótico rodeado de hueso esclerótico no reabsorbido, y su clave clínica es el dolor nocturno que mejora con antiinflamatorios. El quiste óseo esencial muestra lesión lítica que adelgaza e insufla las corticales y el fibroma no osificante es un defecto cortical mayor de 2 cm.","w":["Correcta: el nidus es la lesión central del osteoma osteoide.","La zona de transición amplia es un rasgo de malignidad.","La lesión que insufla la cortical es el quiste óseo esencial.","El defecto mayor de 2 cm es el fibroma no osificante."]},{"s":"ORT","c":18,"t":"Quiste óseo esencial","q":"¿Cuál es la localización más frecuente del quiste óseo esencial y cómo debuta?","o":["Fémur distal; como dolor nocturno intenso","Húmero proximal; como fractura patológica","Vértebra; como signo de la barra","Tibia proximal; como masa palpable"],"a":1,"e":"El quiste óseo esencial predomina en niños y adolescentes, es central y endomedular, a diferencia del aneurismático que es excéntrico, y su sitio más frecuente es el húmero proximal. Debuta como fractura patológica, aparece antes de los 7 años, se ve radiolúcido y bien delimitado, y produce fractura patológica en el 66% de los casos.","w":["El dolor nocturno es del osteoma osteoide.","Correcta: húmero proximal con debut como fractura patológica.","El signo de la barra es del hemangioma vertebral.","No debuta como masa palpable."]},{"s":"ORT","c":18,"t":"Quiste esencial y aneurismático","q":"Relacione la localización del quiste óseo esencial con la del aneurismático:","o":["Esencial central y endomedular; aneurismático estrictamente cortical","Esencial excéntrico; aneurismático central y endomedular del hueso","Esencial central y endomedular; aneurismático excéntrico","Esencial subperióstico; aneurismático excéntrico en el hueso afectado"],"a":2,"e":"El quiste óseo esencial es de localización central y endomedular, a diferencia del aneurismático, que es excéntrico. El esencial predomina en niños y adolescentes, su sitio más frecuente es el húmero proximal, debuta como fractura patológica y se trata con aspiración e inyección de corticoides o relleno con injerto.","w":["El aneurismático es excéntrico, no cortical puro.","Invierte ambas localizaciones.","Correcta: central el esencial y excéntrico el aneurismático.","El esencial es central, no subperióstico."]},{"s":"ORT","c":18,"t":"Tumor de células gigantes","q":"¿Cuál es la apariencia radiográfica clásica del tumor de células gigantes?","o":["Sacabocados","Sol naciente","Palomitas de maíz","Burbujas de jabón"],"a":3,"e":"El tumor de células gigantes aparece entre los 20 y 40 años, en la región metafiso-epifisaria, con dolor, tumoración, disminución del movimiento y fracturas patológicas. Su apariencia radiográfica clásica es la de burbujas de jabón y del 10 al 30% pueden recidivar, lo que obliga a seguimiento.","w":["Las lesiones en sacabocados son del mieloma múltiple.","El sol naciente es del osteosarcoma.","Las palomitas de maíz son matriz condroide.","Correcta: las burbujas de jabón definen su imagen."]},{"s":"ORT","c":18,"t":"Fibroma no osificante","q":"¿A partir de qué tamaño un defecto óseo cortical se denomina fibroma no osificante?","o":["Más de 2 cm","Más de 10 cm","Más de 5 cm","Más de 1 cm"],"a":0,"e":"Los defectos óseos corticales son comunes y no requieren tratamiento salvo que causen fractura; cuando superan los 2 cm se llaman fibroma no osificante. El hemangioma vertebral es un tumor vascular en el que los espacios vasculares desplazan el hueso y produce el signo de la barra en la radiografía.","w":["Correcta: 2 cm es el umbral descrito.","Diez centímetros excede con mucho el umbral.","Sobreestima el umbral descrito.","Un centímetro queda por debajo del umbral."]},{"s":"ORT","c":18,"t":"Hemangioma vertebral","q":"¿Qué signo radiográfico produce el hemangioma vertebral?","o":["Las burbujas de jabón","El signo de la barra","El triángulo de Codman","El signo de la penumbra"],"a":1,"e":"El hemangioma vertebral es un tumor vascular en el que los espacios vasculares desplazan el hueso y produce el signo de la barra en la radiografía; es muy raro de ver clínicamente. El signo de la penumbra corresponde a la osteomielitis en resonancia y las burbujas de jabón al tumor de células gigantes.","w":["Las burbujas de jabón son del tumor de células gigantes.","Correcta: el signo de la barra es del hemangioma vertebral.","El triángulo de Codman es del osteosarcoma.","El signo de la penumbra es de la osteomielitis en resonancia."]},{"s":"ORT","c":18,"t":"Osteosarcoma: localización","q":"¿Cuál es la localización más frecuente del osteosarcoma?","o":["En el húmero proximal","En la diáfisis tibial media","Alrededor de la rodilla","En la pelvis ósea"],"a":2,"e":"El osteosarcoma es el tumor primario maligno más frecuente, con pico bimodal entre los 10 y 20 años y hacia los 65, y su localización más frecuente es alrededor de la rodilla, en la metáfisis distal del fémur y proximal de la tibia. Casi siempre metastatiza a pulmón y se asocia a retinoblastoma.","w":["El húmero proximal es el sitio del quiste óseo esencial.","La diáfisis media no es su localización preferente.","Correcta: metáfisis distal del fémur y proximal de la tibia.","La pelvis es la localización de peor pronóstico del Ewing."]},{"s":"ORT","c":18,"t":"Marcadores del osteosarcoma","q":"¿Qué marcadores eleva el osteosarcoma?","o":["Anticuerpo anti-CCP","Fosfatasa ácida y LDH","Proteína de la Bence-Jones","Fosfatasa alcalina y LDH"],"a":3,"e":"El osteosarcoma eleva la fosfatasa alcalina, marcador de función osteoblástica, y la LDH, y casi siempre metastatiza a pulmón. La fosfatasa ácida se relaciona con actividad osteoclástica y hace sospechar tumores osteolíticos, y la proteína de Bence-Jones corresponde al mieloma múltiple.","w":["El anti-CCP es marcador de artritis reumatoide.","La fosfatasa ácida es osteoclástica.","Bence-Jones es marcador del mieloma múltiple.","Correcta: fosfatasa alcalina y LDH elevadas."]},{"s":"ORT","c":18,"t":"Tratamiento del osteosarcoma","q":"¿Cuál es el tratamiento del osteosarcoma?","o":["Resección con márgenes amplios más quimioterapia","Curetaje con relleno de injerto","Quimioterapia más radioterapia sin cirugía","Radioterapia local exclusiva"],"a":0,"e":"El tratamiento del osteosarcoma es resección quirúrgica con márgenes amplios más quimioterapia neoadyuvante y coadyuvante. El sarcoma de Ewing, en cambio, es radiosensible y se trata con quimioterapia más radioterapia local. Solo la biopsia diferencia definitivamente ambos tumores.","w":["Correcta: cirugía amplia con quimioterapia neoadyuvante y coadyuvante.","El curetaje se usa en lesiones benignas.","Ese esquema corresponde al sarcoma de Ewing.","El osteosarcoma no es especialmente radiosensible."]},{"s":"ORT","c":18,"t":"Sarcoma de Ewing: histología","q":"¿Qué células forman el sarcoma de Ewing y dónde asienta?","o":["Células fusiformes productoras de osteoide; en la metáfisis","Células pequeñas y redondas; en la diáfisis","Células gigantes multinucleadas; en la epífisis","Células plasmáticas monoclonales; en la vértebra"],"a":1,"e":"El sarcoma de Ewing está formado por células pequeñas y redondas y asienta generalmente en la diáfisis de huesos largos. Predomina en hombres, con media de 13 años, cursa con dolor y fiebre, metastatiza temprano y muestra patrón permeativo o apolillado con reacción perióstica en capas de cebolla. Es radiosensible y los de pelvis tienen peor pronóstico.","w":["Las productoras de osteoide son del osteosarcoma.","Correcta: células pequeñas redondas con localización diafisaria.","Las células gigantes son del tumor de células gigantes.","Las células plasmáticas son del mieloma múltiple."]},{"s":"ORT","c":18,"t":"Edad media del Ewing","q":"¿Cuál es la edad media de presentación del sarcoma de Ewing?","o":["45 años","25 años","13 años","60 años"],"a":2,"e":"El sarcoma de Ewing predomina en hombres, con media de 13 años, cursa con síntomas sistémicos como dolor y fiebre, metastatiza temprano y es radiosensible. Los de peor pronóstico son los de pelvis. Solo la biopsia lo diferencia definitivamente del osteosarcoma.","w":["Esa edad corresponde al mieloma múltiple.","Excede la media descrita para el Ewing.","Correcta: la media descrita es de 13 años.","A esa edad predominan metástasis y mieloma."]},{"s":"ORT","c":18,"t":"Radiosensibilidad","q":"¿Cuál de estos tumores óseos es radiosensible?","o":["El osteocondroma","El tumor de células gigantes","El osteosarcoma","El sarcoma de Ewing"],"a":3,"e":"El sarcoma de Ewing es un tumor radiosensible y se trata con quimioterapia más radioterapia local, mientras el osteosarcoma requiere resección con márgenes amplios más quimioterapia neoadyuvante y coadyuvante. Ambos son malignos primarios de población joven y se diferencian definitivamente por biopsia.","w":["El osteocondroma es benigno y se reseca si es sintomático.","El tumor de células gigantes se trata quirúrgicamente.","El osteosarcoma se trata con cirugía amplia y quimioterapia.","Correcta: el Ewing es radiosensible, lo que define su tratamiento."]},{"s":"ORT","c":18,"t":"Mieloma múltiple: CRAB","q":"¿Qué significa la C del acrónimo CRAB del mieloma múltiple?","o":["Hipercalcemia","Insuficiencia renal","Anemia","Lesiones óseas"],"a":0,"e":"El mieloma múltiple es más frecuente entre los 40 y 50 años y se origina en la proliferación clonal de células plasmáticas. Su clínica es el acrónimo CRAB: hipercalcemia, insuficiencia renal, anemia y lesiones óseas. La proteína de Bence-Jones es positiva, las lesiones son líticas en sacabocados en vértebras y costillas y el diagnóstico se hace con electroforesis de proteínas séricas.","w":["Correcta: la C corresponde a hipercalcemia.","La R corresponde a la insuficiencia renal.","La A corresponde a la anemia.","La B corresponde a las lesiones óseas."]},{"s":"ORT","c":18,"t":"Diagnóstico del mieloma","q":"¿Con qué estudio se hace el diagnóstico del mieloma múltiple?","o":["Gammagrafía ósea con trazador","Electroforesis de proteínas séricas","Fosfatasa alcalina y LDH","Radiografía de la esqueleto completo"],"a":1,"e":"El mieloma múltiple se diagnostica con electroforesis de proteínas séricas, con proteína de Bence-Jones positiva y lesiones líticas en sacabocados en vértebras y costillas. Su clínica es el acrónimo CRAB: hipercalcemia, insuficiencia renal, anemia y lesiones óseas, y es más frecuente entre los 40 y 50 años.","w":["La gammagrafía detecta lesiones pero no confirma.","Correcta: la electroforesis demuestra la gammapatía monoclonal.","Esos marcadores se elevan en el osteosarcoma.","La radiografía muestra las lesiones pero no da el diagnóstico."]},{"s":"ORT","c":18,"t":"Metástasis óseas","q":"¿Cuáles son los orígenes más frecuentes de metástasis ósea?","o":["Estómago y páncreas","Pulmón y colon","Mama y próstata","Vejiga y testículo"],"a":2,"e":"Los tumores malignos más frecuentes del hueso son las metástasis, provenientes sobre todo de mama y próstata según el sexo, y también de tiroides, pulmón y riñón. Afectan vértebras y zonas proximales de huesos largos, es decir epífisis y metáfisis de húmero y fémur.","w":["No figuran entre los orígenes principales descritos.","El pulmón metastatiza, pero mama y próstata encabezan.","Correcta: mama y próstata encabezan la lista.","Tampoco figuran entre los orígenes principales."]},{"s":"ORT","c":18,"t":"Localización de las metástasis","q":"¿Qué zonas del hueso afectan preferentemente las metástasis?","o":["Epífisis distales de los huesos largos","Huesos cortos del carpo y del tarso","Diáfisis media de los huesos largos","Vértebras y zonas proximales de huesos largos"],"a":3,"e":"Las metástasis óseas afectan preferentemente vértebras y zonas proximales de huesos largos, es decir epífisis y metáfisis de húmero y fémur. Provienen sobre todo de mama y próstata, y también de tiroides, pulmón y riñón, de modo que ante un adulto mayor con dolor óseo y lesiones múltiples hay que pensar en metástasis o mieloma.","w":["Las epífisis distales no son la localización descrita.","El carpo y el tarso son localizaciones excepcionales.","La diáfisis media no es la localización preferente.","Correcta: vértebras y regiones proximales son las localizaciones típicas."]},{"s":"ORT","c":18,"t":"Simuladores anatómicos","q":"¿Cuál de las siguientes estructuras normales puede simular un tumor en la radiografía?","o":["La cabeza humeral en rotación interna","El nidus esclerótico endomedular","El secuestro con involucro periférico","La lesión lítica que insufla la cortical"],"a":0,"e":"Algunas estructuras normales simulan tumores en la radiografía: la cabeza humeral en rotación interna, el cierre incompleto de la fisis y las inserciones musculares prominentes como las tuberosidades del radio y los trocánteres. En sentido inverso, la osteomielitis es la gran simuladora y puede parecer un tumor, de modo que la biopsia mantiene su papel central.","w":["Correcta: es una estructura normal que puede confundir.","El nidus es una lesión real, el osteoma osteoide.","El secuestro con involucro es osteomielitis crónica.","Esa lesión corresponde al quiste óseo esencial."]},{"s":"ORT","c":18,"t":"Signos de alarma","q":"¿Cuál de los siguientes es un signo de alarma de tumor óseo?","o":["La crepitación articular al movimiento","El dolor óseo nocturno","La rigidez matutina menor de 30 minutos","El dolor mecánico que cede en reposo"],"a":1,"e":"Los signos de alarma en tumores óseos son el dolor nocturno, las fracturas patológicas y los síntomas sistémicos asociados. El dolor mecánico que cede en reposo, la rigidez matutina breve y la crepitación son propios de la artrosis, una enfermedad degenerativa y no tumoral.","w":["La crepitación orienta a artrosis.","Correcta: el dolor nocturno obliga a descartar tumor.","La rigidez matutina breve es dato de artrosis.","El dolor mecánico que cede en reposo es artrósico."]},{"s":"ORT","c":18,"t":"Displasia fibrosa","q":"¿Dónde se localiza la displasia fibrosa?","o":["En la región metafiso-epifisaria","En el cuerpo vertebral solamente","En la diáfisis","En la epífisis"],"a":2,"e":"La displasia fibrosa se agrupa entre las lesiones de localización diafisaria, junto con el osteoma osteoide, el fibroma condromixoide y el sarcoma de Ewing. Es una lesión benigna que puede simular otras lesiones líticas, lo que refuerza la regla del tema: la radiografía orienta, pero el diagnóstico definitivo lo da la biopsia.","w":["La región metafiso-epifisaria es del tumor de células gigantes.","No es una lesión exclusivamente vertebral.","Correcta: es una lesión de localización diafisaria.","La epífisis alberga el condroblastoma y el encondroma articular."]},{"s":"ORT","c":18,"t":"Encondroma","q":"¿Qué matriz produce el encondroma y cuál es su comportamiento?","o":["Matriz osteoide; crecimiento permeativo de tres capas","Matriz osteoide; comportamiento benigno del tumor","Matriz condroide; comportamiento agresivo con metástasis","Matriz condroide; comportamiento benigno"],"a":3,"e":"El encondroma es un tumor de estirpe cartilaginosa: produce matriz condroide, que se ve puntiforme con calcificaciones en palomitas de maíz, y su comportamiento es habitualmente benigno; el encondroma articular se ubica en la epífisis. El condrosarcoma comparte la matriz condroide pero es maligno, lo que ilustra que la matriz orienta el tejido de origen pero no la agresividad.","w":["El patrón permeativo indica malignidad.","La matriz osteoide es de tumores formadores de hueso.","La metástasis precoz es del Ewing y del osteosarcoma.","Correcta: matriz condroide con comportamiento benigno."]},{"s":"ORT","c":18,"t":"Matriz y agresividad","q":"¿Por qué la matriz tumoral no basta para juzgar la agresividad de una lesión?","o":["Orienta el tejido de origen, no el comportamiento","Porque no se aprecia en la radiografía simple","Porque cambia con el tratamiento aplicado","Porque solo se ve en resonancia magnética"],"a":0,"e":"El encondroma y el condrosarcoma comparten matriz condroide y sin embargo uno es benigno y el otro maligno: la matriz orienta el tejido de origen pero no basta para definir agresividad, que se juzga con zona de transición, patrón de destrucción y reacción perióstica. El diagnóstico definitivo lo da la biopsia.","w":["Correcta: la matriz habla del tejido, no del comportamiento.","Sí se aprecia en la radiografía simple.","La matriz no cambia por el tratamiento.","La matriz se aprecia bien en radiografía simple."]},{"s":"ORT","c":19,"t":"Localización de la osteonecrosis","q":"¿Cuál es la localización más frecuente de la osteonecrosis y por qué?","o":["Cabeza femoral; tiene aporte vascular colateral","Cabeza femoral; es una articulación de carga","Semilunar; es la articulación de mayor movilidad","Cóndilo humeral; es una articulación de carga"],"a":1,"e":"La osteonecrosis es la muerte celular del tejido óseo, con 10.000 a 20.000 casos nuevos al año en Estados Unidos e incidencia entre la tercera y la quinta década. Las articulaciones más comprometidas son las que soportan mayor carga: la cabeza femoral, la localización más frecuente, y la rodilla.","w":["La cabeza femoral tiene aporte precario, no colateral.","Correcta: la carga y la vascularización precaria explican su predilección.","El semilunar corresponde a la enfermedad de Kienböck.","El cóndilo humeral corresponde a la enfermedad de Panner."]},{"s":"ORT","c":19,"t":"Clasifica

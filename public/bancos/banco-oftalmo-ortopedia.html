<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retina &amp; Fractura · Banco Oftalmología + Ortopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#150A12; --panel:#1F1019; --panel2:#2A1723;
  --line:#3A2331; --line2:#55374A;
  --ink:#F4EAF0; --muted:#A98C9C;
  --amber:#F2A03D; --bone:#E8D9C0;
  --ok:#58C08A; --bad:#FF6F8B;
  --oft:#F2A03D; --ort:#C8A2C8;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --text:'Figtree',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(242,160,61,.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(200,162,200,.07), transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 90px}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(21,10,18,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:940px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .seal{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line2)}
.brand b{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;display:block;margin-top:-2px}
.hud{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--muted);white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}
.chip.g b{color:var(--ok)} .chip.r b{color:var(--bad)} .chip.a b{color:var(--amber)}
.suture{display:flex;gap:2px;height:4px;background:var(--panel);padding:0 18px 0}
.suture i{flex:1;background:var(--line);border-radius:1px;transition:background .2s}
.suture i.ok{background:var(--ok)} .suture i.bad{background:var(--bad)}
.suture i.cur{background:var(--amber)}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:46px 0 26px}
.crest img{width:74px;height:74px;border-radius:50%;box-shadow:0 0 0 2px var(--line2),0 10px 34px rgba(0,0,0,.55)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,6vw,46px);margin:16px 0 4px;letter-spacing:-.5px}
.hero .sub{font-family:var(--mono);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--amber)}
.hero p{color:var(--muted);max-width:560px;margin:14px auto 0;font-size:15px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:26px 0}

/* ---------- CARDS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mode{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--ink);cursor:pointer;font-family:var(--text);font-size:14px;
  transition:border-color .15s,transform .15s,background .15s;
}
.mode:hover{border-color:var(--line2);transform:translateY(-1px)}
.mode.on{border-color:var(--amber);background:#33202b}
.mode b{display:block;font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:12.5px}
.mode:disabled{opacity:.38;cursor:not-allowed;transform:none}

.subj{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.subj:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--amber))}
.subj:first-child{margin-top:0}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:7px}
.cl{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13.5px;transition:border-color .15s;
}
.cl:hover{border-color:var(--line2)}
.cl.on{border-color:var(--amber);background:#33202b}
.cl .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);flex:none;position:relative}
.cl.on .box{background:var(--amber);border-color:var(--amber)}
.cl.on .box:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--void);border-width:0 2px 2px 0;transform:rotate(43deg)}
.cl .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.pill{
  font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);transition:all .15s;
}
.pill:hover{border-color:var(--line2)}
.pill.on{background:var(--bone);border-color:var(--bone);color:var(--void);font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

.launch{
  position:sticky;bottom:16px;width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;
  background:var(--amber);color:#1a0f06;font-family:var(--disp);font-weight:800;font-size:16px;
  letter-spacing:.3px;box-shadow:0 12px 34px rgba(0,0,0,.5);margin-top:6px;
}
.launch:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed;box-shadow:none}

/* ---------- PREGUNTA ---------- */
.field{padding-top:22px}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.tag.s{color:var(--void);font-weight:600}
.count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.stem{font-family:var(--disp);font-weight:600;font-size:clamp(18px,2.6vw,22px);line-height:1.42;margin:0 0 18px}
.answers{display:flex;flex-direction:column;gap:9px}
.ansrow{display:flex;flex-direction:column}
.ans{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;
  color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s;
}
.ans:hover:not(:disabled){border-color:var(--line2);transform:translateX(2px)}
.ans:disabled{cursor:default}
.ans .key{
  font-family:var(--mono);font-size:11px;width:21px;height:21px;flex:none;border-radius:6px;
  display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);margin-top:1px;
}
.ans.good{border-color:var(--ok);background:rgba(88,192,138,.10)}
.ans.good .key{background:var(--ok);color:#08130d;border-color:var(--ok);font-weight:600}
.ans.wrong{border-color:var(--bad);background:rgba(255,111,139,.08)}
.ans.wrong .key{background:var(--bad);color:#1c0409;border-color:var(--bad);font-weight:600}
.note{
  font-size:13.5px;color:var(--muted);padding:8px 14px 2px 46px;line-height:1.5;
  animation:fade .22s ease both;
}
.note.good{color:#9fe0bd} .note.wrong{color:#f0b6c2}
.concept{
  margin-top:18px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);
  border-radius:11px;padding:15px 16px;animation:fade .25s ease both;
}
.concept h3{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--amber);margin:0 0 7px}
.concept p{margin:0;font-size:14.5px;line-height:1.62;color:#e6d8e0}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.navrow{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:13px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--ink);font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a0f06;font-weight:800}
.hint{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--line2);margin-top:12px;letter-spacing:.5px}

/* ---------- RESULTADOS ---------- */
.big{font-family:var(--disp);font-weight:800;font-size:clamp(52px,13vw,86px);line-height:1;
  text-align:center;margin:8px 0 2px}
.big small{font-size:.32em;color:var(--muted);font-weight:600}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center}
.res b{display:block;font-family:var(--disp);font-weight:800;font-size:24px}
.res span{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:10px}
.bar .lab span{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
.bar .track{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--amber),var(--ok));transition:width .5s}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .ans:hover:not(:disabled),.mode:hover{transform:none}
}
@media(max-width:560px){
  .brand span{display:none}
  .hud .chip{font-size:10px;padding:3px 7px}
  .note{padding-left:16px}
}
</style>
</head>

<script>
const Q = [{"s":"OFT","c":1,"t":"Cámaras del globo ocular","q":"¿Cuál es la cámara ocular más pequeña?","o":["La posterior","La anterior","Las tres tienen igual volumen","La vítrea"],"a":0,"e":"El globo mide unos 24 mm de diámetro anteroposterior y aloja tres cámaras: anterior de unos 0,06 mL, entre córnea e iris; posterior de unos 0,2 mL, el espacio entre iris y cristalino; y vítrea de 4,5 a 5 mL, la mayor con diferencia, compuesta por 98-99% de agua más ácido hialurónico y colágeno. El error clásico de examen es tratar cámara posterior y cámara vítrea como sinónimos.","w":["Correcta: la posterior, entre iris y cristalino, es la de menor volumen.","La anterior tiene 0,06 mL, pero la posterior es la más pequeña de las tres.","Los volúmenes son muy distintos entre sí.","La vítrea es la mayor, con 4,5 a 5 mL."]},{"s":"OFT","c":1,"t":"Cámara posterior y vítrea","q":"¿Por qué no deben confundirse la cámara posterior y la cámara vítrea?","o":["Porque la vítrea es la más pequeña","La posterior está entre iris y cristalino","Porque ambas se comunican por la pupila","Porque la posterior contiene el vítreo"],"a":1,"e":"La cámara posterior es el espacio entre el iris y el cristalino, con unos 0,2 mL, mientras la cámara vítrea es el espacio por detrás del cristalino, con 4,5 a 5 mL de humor vítreo formado por 98-99% de agua más ácido hialurónico y colágeno. Tratarlas como sinónimos es el error clásico de examen. La comunicación por la pupila se da entre las cámaras posterior y anterior.","w":["La vítrea es la mayor de las tres cámaras.","Correcta: son espacios anatómicos distintos, separados por el cristalino.","La comunicación por la pupila es entre posterior y anterior.","El vítreo ocupa la cámara vítrea, no la posterior."]},{"s":"OFT","c":1,"t":"Grosor corneal","q":"¿Dónde es más delgada la córnea y cuánto mide ahí?","o":["En la periferia, unos 0,52 mm","En el limbo, unos 0,2 mm","En el centro, unos 0,52 mm","En el centro, unos 1 mm"],"a":2,"e":"La córnea es más delgada en el centro, unos 0,52 mm, y se engrosa hacia la periferia, unos 1 mm; es más ancha en el eje horizontal, 11,7 mm, que en el vertical, 10,2 mm, de ahí su forma ovalada vista de frente. El grosor central es el que mide la paquimetría para corregir la presión intraocular y para decidir si hay estroma suficiente para un LASIK.","w":["La periferia es la zona más gruesa, con unos 1 mm.","El limbo no es la referencia de grosor descrita.","Correcta: el centro es la zona más delgada, con unos 0,52 mm.","Un milímetro corresponde a la periferia."]},{"s":"OFT","c":1,"t":"Regeneración corneal","q":"Paciente con erosión corneal superficial que cura sin dejar cicatriz. ¿Qué capa se regeneró?","o":["El estroma profundo","La membrana de Descemet","El endotelio","El epitelio"],"a":3,"e":"El epitelio corneal se regenera con rapidez, por eso una erosión superficial cura sin dejar huella. El endotelio, en cambio, no se replica: cuando muere una célula las vecinas aumentan su diámetro para cubrir el defecto, y si el conteo cae demasiado, por cirugía de catarata laboriosa, edad o distrofia, la córnea pierde su bomba de deshidratación, se edematiza y pierde transparencia.","w":["Las lesiones del estroma dejan cicatriz o leucoma.","La Descemet no se regenera como el epitelio.","El endotelio no se replica: compensa aumentando el tamaño celular.","Correcta: el epitelio tiene alta capacidad regenerativa."]},{"s":"OFT","c":1,"t":"Descompensación endotelial","q":"¿Por qué la pérdida de células endoteliales produce edema corneal?","o":["Se pierde la bomba de deshidratación","Porque aumenta la presión intraocular","Porque el epitelio deja de regenerarse","Porque se engrosa la membrana de Bowman"],"a":0,"e":"El endotelio corneal funciona como bomba de deshidratación: cuando el conteo celular cae demasiado, tras una cirugía de catarata laboriosa, en el paciente mayor o en una distrofia, la córnea se hidrata, se edematiza y pierde transparencia. El endotelio no se replica, de modo que las células vecinas solo pueden aumentar su diámetro para cubrir el defecto, hasta que ya no alcanzan.","w":["Correcta: sin bomba endotelial la córnea se hidrata y se opacifica.","El edema es por fallo endotelial, no por presión elevada.","El epitelio conserva su capacidad regenerativa.","La membrana de Bowman no participa en este mecanismo."]},{"s":"OFT","c":1,"t":"Poder refractivo","q":"¿Cuál es la principal superficie refractiva del ojo y cuánto aporta?","o":["La córnea, 23 a 33 dioptrías","La córnea, 40 a 43 dioptrías","El humor vítreo, 23 a 33 dioptrías","El cristalino, 40 a 43 dioptrías"],"a":1,"e":"La córnea aporta 40 a 43 dioptrías y es la principal superficie refractiva del ojo; el cristalino aporta 23 a 33 dioptrías y es la segunda. Que la córnea pese más explica por qué la cirugía refractiva actúa sobre ella, con LASIK y PRK, y por qué un astigmatismo corneal mínimo degrada tanto la visión; el cristalino es la parte variable, la que acomoda y la que se sustituye por un lente intraocular.","w":["Ese rango corresponde al cristalino.","Correcta: la córnea aporta el mayor poder refractivo del ojo.","El vítreo no tiene un papel refractivo relevante.","El cristalino aporta de 23 a 33 dioptrías y es la segunda superficie."]},{"s":"OFT","c":1,"t":"Escleras azules","q":"¿Por qué la esclera se ve azulada cuando se adelgaza?","o":["Porque acumula depósitos de lípidos","Porque se deposita hemosiderina","Deja translucir la úvea pigmentada","Porque pierde su vascularización"],"a":2,"e":"La esclera normal es blanca y opaca; cuando se adelgaza deja translucir la úvea subyacente, que es pigmentada, y el ojo se ve azulado. Además de la artritis reumatoide se ve en osteogénesis imperfecta, Ehlers-Danlos, Marfan, uso prolongado de esteroides, y puede ser un hallazgo normal en el recién nacido, cuya esclera aún es fina.","w":["Los depósitos lipídicos corresponden al arco senil corneal.","La hemosiderina no participa en este mecanismo.","Correcta: es la úvea pigmentada la que se transparenta.","La vascularización no explica el tono azulado."]},{"s":"OFT","c":1,"t":"Causas de esclera azul","q":"Todas las siguientes cursan con escleras azules, EXCEPTO una. ¿Cuál?","o":["Uso prolongado de esteroides","Osteogénesis imperfecta","Síndrome de Marfan","Arco senil"],"a":3,"e":"Las escleras azules aparecen en artritis reumatoide, osteogénesis imperfecta, Ehlers-Danlos, Marfan, uso prolongado de esteroides, y pueden ser normales en el recién nacido. El arco senil es otra cosa: un anillo blanquecino perilímbico por infiltración corneal de lípidos, lipoproteínas y triglicéridos, habitual en mayores de 60 años.","w":["La corticoterapia prolongada adelgaza la esclera.","La osteogénesis imperfecta es causa clásica de escleras azules.","El Marfan figura entre las causas descritas.","Correcta: el arco senil es un hallazgo corneal, no escleral."]},{"s":"OFT","c":1,"t":"Pérdida visual monocular","q":"¿Qué localización lesional produce pérdida visual monocular?","o":["Por delante del quiasma","En la corteza occipital","Por detrás del quiasma","En ambos nervios ópticos a la vez"],"a":0,"e":"Todo lo que ocurre por delante del quiasma y en un solo ojo produce pérdida monocular: oclusión de arteria central de la retina, hemorragia vítrea, neuritis óptica, glaucoma agudo y desprendimiento de retina. Lo que ocurre por detrás del quiasma o afecta ambos nervios a la vez da pérdida binocular: trauma occipital, evento cerebrovascular, insuficiencia basilar, hipertensión maligna e intoxicación por metanol.","w":["Correcta: el compromiso prequiasmático unilateral afecta a un solo ojo.","La corteza occipital es retroquiasmática.","Lo retroquiasmático produce déficit binocular.","El compromiso bilateral simultáneo da pérdida binocular."]},{"s":"OFT","c":1,"t":"Intoxicación por metanol","q":"Paciente con pérdida visual binocular y nervios ópticos pálidos tras ingesta de alcohol adulterado. ¿Cuál es la causa?","o":["Oclusión de arteria central bilateral","Intoxicación por metanol","Glaucoma agudo bilateral","Hemorragia vítrea bilateral"],"a":1,"e":"La intoxicación por metanol produce pérdida visual binocular con nervios ópticos pálidos, y se agrupa con las causas retroquiasmáticas o de compromiso bilateral simultáneo, junto con el trauma occipital, el evento cerebrovascular, la insuficiencia basilar y la hipertensión maligna. Las causas prequiasmáticas unilaterales, en cambio, dan pérdida monocular.","w":["La oclusión arterial bilateral simultánea es excepcional.","Correcta: el metanol daña ambos nervios ópticos y los deja pálidos.","El glaucoma agudo suele ser monocular y muy doloroso.","La hemorragia vítrea bilateral simultánea no explica la palidez papilar."]},{"s":"OFT","c":1,"t":"Metamorfopsia","q":"Paciente que refiere que las líneas rectas se ven onduladas. ¿Qué significa y con qué se explora?","o":["Defecto del campo periférico; campimetría","Tracción vítrea sobre la retina; rejilla de Amsler","Desplazamiento de fotorreceptores maculares; rejilla de Amsler","Opacidad de medios; agujero estenopeico"],"a":2,"e":"La metamorfopsia es la distorsión de las imágenes y traduce que los fotorreceptores maculares han sido desplazados por edema, líquido o una membrana; se explora con rejilla de Amsler. La fotopsia es la percepción de destellos y traduce estimulación mecánica de la retina por tracción del vítreo, por eso puede preceder a un desprendimiento de vítreo posterior o de retina.","w":["El defecto periférico no altera la percepción de líneas centrales.","La tracción vítrea produce fotopsias, no metamorfopsia.","Correcta: fotorreceptores maculares desplazados, explorados con Amsler.","Las opacidades de medios no distorsionan las líneas de ese modo."]},{"s":"OFT","c":1,"t":"Fotopsias","q":"¿Qué traduce la percepción de destellos luminosos?","o":["Espasmo del músculo ciliar","Isquemia del nervio óptico","Opacidad del cristalino","Estimulación mecánica de la retina"],"a":3,"e":"La fotopsia es la percepción de destellos y traduce estimulación mecánica de la retina por tracción del vítreo, por eso puede preceder a un desprendimiento de vítreo posterior o de retina. Las miodesopsias son la percepción de moscas volantes por condensaciones del vítreo, y la metamorfopsia la distorsión de las imágenes por desplazamiento de los fotorreceptores maculares.","w":["El espasmo ciliar altera la acomodación, no genera destellos.","La isquemia del nervio da pérdida visual, no destellos.","La catarata produce halos y deslumbramiento, no fotopsias.","Correcta: la tracción vítrea estimula mecánicamente la retina."]},{"s":"OFT","c":1,"t":"Hemorragia subconjuntival","q":"Paciente con mancha roja en la conjuntiva, indolora y sin alteración visual. ¿Cuál es la conducta?","o":["Buscar la causa de fondo, sin tratamiento tópico","Referir urgente por riesgo de perforación","Iniciar corticoide tópico en el pauta descendente","Iniciar antibiótico tópico y ocluir"],"a":0,"e":"La hemorragia subconjuntival es la ruptura de un vaso conjuntival: es indolora, no altera la visión y se reabsorbe sola en una o dos semanas, por lo que no lleva tratamiento. Lo que sí obliga es a buscar la causa de fondo: hipertensión, Valsalva, vómitos, estreñimiento, discrasias sanguíneas, leucemia, linfoma, anticoagulantes, aspirina o vitamina E; de ahí el hemograma y los tiempos de coagulación.","w":["Correcta: se reabsorbe sola y lo relevante es investigar la causa.","No es un cuadro urgente ni implica riesgo de perforación.","El corticoide tópico no acelera la reabsorción.","No hay infección que justifique antibiótico."]},{"s":"OFT","c":1,"t":"Leucocoria","q":"Niño de 2 años con pupila blanca. ¿Qué hay que descartar con carácter urgente?","o":["Arco senil","Retinoblastoma","Pterigión avanzado","Catarata senil"],"a":1,"e":"La leucocoria es pupila blanca y en un niño obliga a descartar retinoblastoma con carácter urgente; su diagnóstico diferencial incluye catarata congénita, persistencia del vítreo primario hiperplásico y desprendimiento de retina. El arco senil, en cambio, es un anillo blanquecino perilímbico por infiltración corneal de lípidos, habitual en mayores de 60 años.","w":["El arco senil es un anillo perilímbico del adulto mayor.","Correcta: la leucocoria infantil obliga a descartar retinoblastoma.","El pterigión es una lesión conjuntival, no pupilar.","La catarata senil no aparece a los 2 años."]},{"s":"OFT","c":1,"t":"Agujero estenopeico","q":"La visión mejora de 20/200 a 20/25 con agujero estenopeico. ¿Qué indica?","o":["Hay lesión macular","Hay opacidad de medios","El problema es refractivo","Hay neuropatía óptica"],"a":2,"e":"El estenopeico deja pasar solo los rayos centrales y elimina las aberraciones periféricas, de modo que anula el efecto de cualquier ametropía. Si la visión mejora con el pinhole, el problema es refractivo y se corrige con lentes; si no mejora, hay una lesión orgánica en la vía visual, típicamente macular o del nervio óptico. Es la maniobra más barata para separar ambas posibilidades.","w":["Una lesión macular no mejoraría con el estenopeico.","Las opacidades de medios no se corrigen con el pinhole.","Correcta: la mejoría con estenopeico indica causa refractiva.","La neuropatía óptica tampoco mejora con esta maniobra."]},{"s":"OFT","c":1,"t":"Grados de visión","q":"Ordene los grados de visión de menor a mayor:","o":["Proyección, percepción de luz, cuenta dedos, movimiento de manos","Cuenta dedos, movimiento de manos, proyección, percepción de luz","Movimiento de manos, percepción de luz, cuenta dedos, proyección","Percepción de luz, proyección, movimiento de manos, cuenta dedos"],"a":3,"e":"La escala va de menos a más: percepción de luz, el grado mínimo posible; percepción y proyección de luz, cuando el paciente indica de dónde viene; movimiento de manos; cuenta dedos a medio metro, uno o dos metros; y a partir de ahí ya se puede usar optotipo y escala de Snellen. En Snellen, 20/200 con la mejor corrección define ceguera legal y 20/20 es la visión de referencia.","w":["La proyección requiere percepción de luz previa.","Invierte por completo la escala.","No corresponde al orden creciente descrito.","Correcta: de la percepción de luz al conteo de dedos, en ese orden."]},{"s":"OFT","c":1,"t":"Ceguera legal","q":"¿Qué agudeza visual con la mejor corrección define ceguera legal?","o":["20/200","20/400","20/40","20/70"],"a":0,"e":"En la escala de Snellen, 20/200 con la mejor corrección define ceguera legal y 20/20 es la visión de referencia. Por debajo del rango del optotipo se usan los grados de visión: cuenta dedos, movimiento de manos, percepción con proyección de luz y percepción de luz, que es el grado mínimo posible.","w":["Correcta: 20/200 con corrección óptima es el umbral de ceguera legal.","20/400 está por debajo del umbral, ya en ceguera establecida.","20/40 es el límite habitual para conducir en muchas jurisdicciones.","20/70 corresponde a baja visión, no a ceguera legal."]},{"s":"OFT","c":1,"t":"Vía pupilar parasimpática","q":"¿Qué porcentaje de las fibras parasimpáticas del III par se dedica al reflejo fotomotor?","o":["Un 30%","Un 3%","Un 50%","Un 97%"],"a":1,"e":"La luz estimula la retina, viaja por nervio óptico y quiasma hasta el núcleo pretectal, de ahí al núcleo de Edinger-Westphal, y las fibras parasimpáticas salen con el III par hasta el ganglio ciliar, desde donde los nervios ciliares cortos alcanzan el esfínter pupilar y producen miosis. Solo un 3% de esas fibras se dedica al reflejo fotomotor y el 97% a la acomodación.","w":["No es la proporción descrita en el tema.","Correcta: apenas un 3% se ocupa del reflejo a la luz.","La mitad no corresponde a ninguno de los dos porcentajes descritos.","El 97% se dedica a la acomodación."]},{"s":"OFT","c":1,"t":"Defecto pupilar aferente","q":"¿Cuál de las siguientes NO produce defecto pupilar aferente?","o":["La pupila amaurótica","El daño retiniano extenso","La catarata","La neuropatía óptica"],"a":2,"e":"El defecto pupilar aferente se busca con el swinging flashlight test y traduce asimetría en la conducción de la vía aferente. Lo producen la neuropatía óptica, el daño retiniano extenso y la pupila amaurótica. No lo producen las opacidades de medios, como catarata, leucoma o hemorragia vítrea, ni la maculopatía ni la ambliopía, porque en ellas la vía sigue conduciendo con simetría suficiente.","w":["La pupila amaurótica es la expresión máxima del defecto aferente.","El daño retiniano extenso sí lo produce.","Correcta: las opacidades de medios no alteran la conducción aferente.","La neuropatía óptica es causa clásica de defecto aferente."]},{"s":"OFT","c":1,"t":"Pupila de Adie","q":"Mujer de 30 años con una pupila dilatada, unilateral, que reacciona lentamente a la luz y bien de cerca. ¿Cuál es el diagnóstico?","o":["Parálisis completa del III par","Pupila de Argyll Robertson","Síndrome de Horner","Pupila tónica de Adie"],"a":3,"e":"La pupila tónica de Adie es idiopática, unilateral en el 80%, predomina en mujeres, un 70%, de 20 a 40 años, está dilatada, reacciona lentamente a la luz y muestra hipersensibilidad colinérgica con buena respuesta de cerca. La de Argyll Robertson suele ser bilateral, con pupilas mióticas e irregulares que no responden a la luz pero sí acomodan, y se asocia a neurosífilis, diabetes y esclerosis múltiple.","w":["La parálisis del III par añade ptosis y limitación de la motilidad.","La de Argyll Robertson es bilateral y miótica.","El Horner cursa con miosis y ptosis leve.","Correcta: unilateral, midriática, con respuesta lenta y buena de cerca."]},{"s":"OFT","c":1,"t":"Pupila de Argyll Robertson","q":"¿Con qué enfermedad se asocia clásicamente la pupila de Argyll Robertson?","o":["Neurosífilis","Retinoblastoma","Osteogénesis imperfecta","Síndrome de Marfan"],"a":0,"e":"La pupila de Argyll Robertson suele ser bilateral, con pupilas mióticas e irregulares que no responden a la luz pero sí acomodan, y se asocia a neurosífilis, diabetes, alcoholismo crónico, esclerosis múltiple y encefalitis. La de Adie, en cambio, es unilateral en el 80% de los casos, midriática y con hipersensibilidad colinérgica.","w":["Correcta: es el hallazgo pupilar clásico de la neurosífilis.","El retinoblastoma se manifiesta por leucocoria.","La osteogénesis imperfecta se asocia a escleras azules.","El Marfan se asocia a luxación superior del cristalino."]},{"s":"OFT","c":1,"t":"Síndrome de Horner","q":"¿Qué músculo explica la ptosis leve del síndrome de Horner?","o":["El elevador del párpado superior","El músculo de Müller","El recto superior","El orbicular de los párpados"],"a":1,"e":"La vía simpática nace en el hipotálamo, baja por la médula hasta el centro de Budge, en C8-T2, asciende por el mediastino junto al vértice pulmonar hasta el ganglio cervical superior y sigue la carótida interna hasta el músculo de Müller. Su lesión da ptosis leve por afectación del Müller, no del elevador, miosis por predominio parasimpático, enoftalmos aparente, anhidrosis ipsilateral y heterocromía con iris más claro.","w":["El elevador depende del III par y su fallo da ptosis marcada.","Correcta: el Müller es de inervación simpática y su fallo da ptosis leve.","El recto superior participa en la motilidad ocular, no en la ptosis.","El orbicular cierra el párpado y depende del VII par."]},{"s":"OFT","c":1,"t":"Centro de Budge","q":"¿A qué nivel medular se encuentra el centro de Budge de la vía simpática ocular?","o":["L1 a L2","C1 a C4","C8 a T2","T5 a T8"],"a":2,"e":"La vía simpática ocular nace en el hipotálamo, baja por la médula hasta el centro de Budge, en C8-T2, asciende por el mediastino junto al vértice pulmonar hasta el ganglio cervical superior y sigue la carótida interna hasta el músculo de Müller. Su recorrido junto al vértice pulmonar explica que un tumor de Pancoast pueda producir síndrome de Horner.","w":["El nivel lumbar no participa en la vía simpática ocular.","Ese nivel es demasiado alto para el centro descrito.","Correcta: C8 a T2 es la localización del centro de Budge.","T5 a T8 queda por debajo del centro simpático oculocefálico."]},{"s":"OFT","c":1,"t":"Fractura de piso orbitario","q":"Paciente con trauma contuso ocular que presenta enoftalmos, diplopía vertical y limitación de la elevación. ¿Qué ocurrió?","o":["Fractura de la pared medial con enfisema orbitario","Parálisis del III par por daño de vasa nervorum","Luxación traumática del cristalino","Fractura del piso orbitario con atrapamiento del recto inferior"],"a":3,"e":"El golpe contuso transmite la presión al piso orbitario, el hueso más delgado, que se fractura y hernia contenido hacia el seno maxilar: el resultado es enoftalmos, atrapamiento del recto inferior con limitación de la elevación y diplopía vertical, y puede haber anestesia del territorio infraorbitario. Como dato asociado, en el diabético los pares craneales se afectan por daño de vasa nervorum.","w":["El enfisema orbitario acompaña a la fractura medial, sin este patrón.","La parálisis del III par no cursa con enoftalmos.","La luxación del cristalino no produce limitación de la elevación.","Correcta: el piso es el hueso más delgado y atrapa el recto inferior."]},{"s":"OFT","c":1,"t":"Luz azul de cobalto","q":"¿Para qué sirve el filtro de luz azul de cobalto en la lámpara de hendidura?","o":["Excitar la fluoresceína y revelar defectos epiteliales","Medir la presión intraocular por aplanamiento","Ver la capa de fibras nerviosas y hemorragias en llama","Explorar el ángulo camerular"],"a":0,"e":"La luz azul de cobalto excita la fluoresceína, un colorante vital amarillo-naranja, y por eso revela erosiones, úlceras, el patrón dendrítico del herpes, cuerpos extraños y el signo de Seidel. La luz verde o aneritra, libre de rojo, se queda en la capa de fibras nerviosas y permite ver sus estriaciones, las hemorragias superficiales en llama y los defectos glaucomatosos.","w":["Correcta: es el filtro que hace fluorescer el colorante.","La presión se mide con el tonómetro de aplanación de Goldmann.","Esa es la función de la luz verde o aneritra.","El ángulo se explora con gonioscopía."]},{"s":"OFT","c":1,"t":"Papiledema y edema de papila","q":"Relacione el papiledema con el edema de papila según su lateralidad y su causa:","o":["Papiledema unilateral por LCR alto; edema bilateral por daño vascular directo","Papiledema bilateral por presión de LCR alta; edema uni o bilateral con LCR normal","Papiledema bilateral por daño vascular directo; edema unilateral por LCR alto","Papiledema unilateral por daño vascular; edema bilateral por presión de la LCR alta"],"a":1,"e":"El papiledema es bilateral por definición y se debe a aumento de la presión del líquido cefalorraquídeo, por tumor cerebral, hematoma subdural o hidrocefalia, por lo que se acompaña de cefalea intensa, rigidez de nuca y vómito en proyectil sin arcada. El edema de papila puede ser uni o bilateral, ocurre con presión de líquido cefalorraquídeo normal y se debe a daño vascular directo, típicamente hipertensión maligna.","w":["El papiledema es bilateral por definición.","Correcta: bilateral con hipertensión intracraneal frente a uni o bilateral con LCR normal.","El papiledema se debe a presión de LCR elevada, no a daño vascular.","Invierte ambos cuadros."]},{"s":"OFT","c":1,"t":"Paralelaje en oftalmoscopía directa","q":"Hay que pasar de 0 a +2 dioptrías para enfocar el disco respecto de la retina. ¿Qué sugiere?","o":["Que la excavación papilar está aumentada","Que la retina está desprendida","Que el disco está proyectado hacia adelante","Que hay opacidad del cristalino"],"a":2,"e":"El oftalmoscopio directo da una imagen monocular, en un solo plano y sin profundidad, y su ruedita de lentes esféricas permite enfocar a distintas profundidades: si hay que pasar de 0 a +2 dioptrías para enfocar el disco respecto de la retina, ese paralelaje sugiere que el disco está proyectado hacia adelante, es decir, papiledema. El indirecto es binocular, ofrece estereopsis y un campo mucho más amplio.","w":["La excavación aumentada proyecta el disco hacia atrás, no adelante.","El desprendimiento se explora mejor con oftalmoscopía indirecta.","Correcta: el disco elevado exige más dioptrías positivas para enfocarlo.","La opacidad del cristalino impide enfocar, no desplaza el plano."]},{"s":"OFT","c":1,"t":"Rango normal de presión intraocular","q":"¿Cuál es el rango normal de presión intraocular?","o":["20 a 35 mmHg","10 a 30 mmHg","5 a 15 mmHg","8 a 21 mmHg"],"a":3,"e":"La tonometría siempre es indirecta, a través de la córnea, y su rango normal es de 8 a 21 mmHg. El estándar de oro es el tonómetro de aplanación de Goldmann, montado en la lámpara con anestesia tópica y fluoresceína. La presión intraocular es el único parámetro modificable en el glaucoma.","w":["Ese rango ya corresponde a hipertensión ocular.","El límite superior descrito es 21 mmHg, no 30.","El límite inferior descrito es 8 mmHg.","Correcta: 8 a 21 mmHg es el rango normal aceptado."]},{"s":"OFT","c":1,"t":"Paquimetría y presión corregida","q":"¿Por qué una córnea gruesa hace que el tonómetro sobreestime la presión intraocular?","o":["Opone más resistencia al aplanamiento","Porque aumenta la producción de acuoso","Porque absorbe la fluoresceína","Porque desplaza el punto de fijación"],"a":0,"e":"Una córnea gruesa opone más resistencia al aplanamiento y hace que el tonómetro lea de más; una córnea fina lee de menos, y por eso hay que calcular la presión corregida con paquimetría, sobre todo en operados de LASIK, en quienes se ha adelgazado el estroma. El estándar de oro de la tonometría es el aplanador de Goldmann.","w":["Correcta: la resistencia mecánica de la córnea sesga la lectura.","La producción de acuoso no depende del grosor corneal.","La absorción de colorante no altera la lectura de presión.","El punto de fijación no interviene en la medición."]},{"s":"OFT","c":2,"t":"Terminología del cristalino","q":"Paciente operado de catarata con lente intraocular implantado. ¿Cómo se denomina?","o":["Afáquico","Pseudofáquico","Fáquico","Fáquico con LIO"],"a":1,"e":"Fáquico es el ojo que conserva su cristalino natural, afáquico el que quedó sin cristalino y sin lente implantado, típico de la vieja cirugía intracapsular que obligaba a lentes de +12 dioptrías con distorsión y aniseiconia, y pseudofáquico el que porta un lente intraocular. El cristalino aporta 23 a 33 dioptrías y está suspendido por las zónulas que van del ecuador al cuerpo ciliar.","w":["Afáquico es el que quedó sin cristalino y sin lente.","Correcta: el ojo con lente intraocular es pseudofáquico.","Fáquico es el que conserva su cristalino natural.","No es la nomenclatura empleada."]},{"s":"OFT","c":2,"t":"Cirugía intracapsular","q":"¿Por qué la antigua cirugía intracapsular obligaba a lentes de +12 dioptrías?","o":["Porque opacificaba la cápsula posterior","Porque el LIO no corregía el astigmatismo","Dejaba al paciente afáquico","Porque la incisión era de 3 mm"],"a":2,"e":"La intracapsular extraía el cristalino con su cápsula por una incisión de 8 a 10 mm y dejaba al paciente afáquico, sin cristalino y sin lente, lo que obligaba a lentes aéreos de unos +12 dioptrías con distorsión y aniseiconia; está en desuso. La extracapsular conserva el saco y coloca el lente intraocular, y la facoemulsificación fragmenta el núcleo por ultrasonido.","w":["La opacificación capsular es una complicación de la extracapsular.","El problema era la afaquia, no el astigmatismo residual.","Correcta: sin cristalino ni lente había que compensar con lentes muy potentes.","La incisión de la intracapsular era de 8 a 10 mm."]},{"s":"OFT","c":2,"t":"Catarata: epidemiología","q":"¿Por qué la catarata es la primera causa de ceguera reversible del mundo?","o":["Porque revierte al controlar la glucemia","Porque responde a tratamiento tópico","Porque solo afecta a un ojo","Porque se resuelve con cirugía"],"a":3,"e":"La catarata es la opacidad del cristalino y la primera causa de ceguera reversible del mundo, precisamente porque se resuelve con cirugía. Cursa con disminución progresiva e indolora de la visión, halos y deslumbramiento nocturno, porque las opacidades refractan la luz en distintas direcciones. Su etiología más frecuente es senil, seguida de diabetes y causas metabólicas como Wilson, galactosemia y homocistinuria.","w":["El control glucémico previene la progresión, pero no revierte la catarata.","No existe tratamiento tópico que revierta la opacidad.","Suele ser bilateral, aunque asimétrica.","Correcta: es reversible porque la cirugía restituye la visión."]},{"s":"OFT","c":2,"t":"Clínica de la catarata","q":"¿Por qué el paciente con catarata refiere halos y deslumbramiento nocturno?","o":["Las opacidades refractan la luz en distintas direcciones","Porque aumenta la presión intraocular de noche","Porque se edematiza la córnea al oscurecer","Porque el iris se dilata y pierde control"],"a":0,"e":"La catarata cursa con disminución progresiva e indolora de la visión, halos y deslumbramiento nocturno, porque las opacidades del cristalino refractan la luz en distintas direcciones en lugar de enfocarla en un punto. La etiología más frecuente es senil, y le siguen la diabetes, las metabólicas y las secundarias a fármacos o trauma.","w":["Correcta: la dispersión de la luz por las opacidades genera los halos.","La presión intraocular no explica los halos de la catarata.","No hay edema corneal en la catarata.","La midriasis nocturna expone más opacidades, pero el mecanismo es la dispersión."]},{"s":"OFT","c":2,"t":"Técnicas de cirugía de catarata","q":"¿Qué técnica de cirugía de catarata usa ultrasonido para fragmentar el núcleo?","o":["Extracapsular","Facoemulsificación","Capsulotomía con Nd:YAG","Intracapsular"],"a":1,"e":"La facoemulsificación usa piezoelectricidad y cavitación ultrasónica para fragmentar el núcleo y aspirarlo por una incisión pequeña. La extracapsular hace capsulorrexis, extrae el núcleo, aspira la corteza, deja el saco y coloca el lente, pero requiere sutura y puede inducir astigmatismo. La intracapsular extraía el cristalino con su cápsula por una incisión de 8 a 10 mm y está en desuso.","w":["La extracapsular extrae el núcleo entero, sin fragmentarlo.","Correcta: el ultrasonido fragmenta el núcleo por una incisión pequeña.","El Nd:YAG trata la opacificación capsular posterior, no la catarata.","La intracapsular extraía cristalino y cápsula en bloque."]},{"s":"OFT","c":2,"t":"Historia del lente intraocular","q":"¿Qué observación llevó a Sir Harold Ridley a desarrollar el primer lente intraocular?","o":["Que el vidrio de las gafas se toleraba en la cámara anterior","Que la cápsula posterior podía sostener un implante","Fragmentos de PMMA no inflamaban el ojo de pilotos de la RAF","Que el ultrasonido podía fragmentar el cristalino"],"a":2,"e":"Sir Harold Ridley observó que fragmentos de polimetilmetacrilato del cockpit de los aviones de la RAF quedaban dentro del ojo de los pilotos sin generar inflamación, dedujo que era un material inerte y desarrolló el primer lente intraocular. Charles Kelman ideó la facoemulsificación inspirado en la máquina Cavitron del dentista, que removía sarro por ultrasonido.","w":["El material observado fue el PMMA de las cabinas, no vidrio de gafas.","El aprovechamiento del saco capsular es posterior a Ridley.","Correcta: la tolerancia del PMMA en ojos de pilotos fue la clave.","Esa observación corresponde a Kelman y la facoemulsificación."]},{"s":"OFT","c":2,"t":"Opacificación de cápsula posterior","q":"Paciente operado de catarata hace tres años que refiere que la catarata volvió. ¿Qué ocurre y cómo se trata?","o":["Volvió a crecer el cristalino; nueva facoemulsificación","Se opacificó la córnea; trasplante endotelial","Se desplazó el lente intraocular; recambio quirúrgico","Se opacificó el saco capsular; capsulotomía con Nd:YAG"],"a":3,"e":"El cristalino extraído no vuelve a crecer: lo que se opacifica es el saco capsular que se dejó intencionalmente para alojar el lente intraocular, y el paciente lo vive como si la catarata hubiera regresado. El tratamiento es la capsulotomía posterior con láser Nd:YAG, un láser de fotodisrupción que rompe la cápsula con un pulso de energía en nanosegundos y restaura la visión en el acto.","w":["El cristalino extraído no se regenera.","No hay compromiso corneal en este escenario.","La descentración del lente da otro cuadro y no simula catarata.","Correcta: es opacificación capsular y se resuelve con Nd:YAG."]},{"s":"OFT","c":2,"t":"Ectopia lentis","q":"Relacione la dirección de la luxación del cristalino en Marfan con la de la homocistinuria:","o":["Marfan superior; homocistinuria inferior","Marfan superior; Weill-Marchesani inferior con microesferofaquia","Marfan inferior; homocistinuria superior y temporal","Marfan nasal inferior; homocistinuria superior y nasal"],"a":0,"e":"La ectopia lentis es la dislocación del cristalino por ruptura zonular. En el síndrome de Marfan la luxación es característicamente superior y en la homocistinuria inferior; también la producen el Weill-Marchesani y el trauma. El signo exploratorio es la iridodonesis, el temblor del iris al perder su soporte cristaliniano, junto con disminución de la agudeza visual.","w":["Correcta: superior en Marfan e inferior en homocistinuria.","El primer dato es correcto, pero el contraste descrito es con la homocistinuria.","Invierte ambas direcciones.","No corresponde a las direcciones descritas."]},{"s":"OFT","c":2,"t":"Iridodonesis","q":"¿Qué significa el temblor del iris a la exploración?","o":["Que el endotelio está descompensado","Que el cristalino perdió su soporte zonular","Que la presión intraocular está muy elevada","Que hay sinequias posteriores extensas"],"a":1,"e":"La iridodonesis es el temblor del iris al perder su soporte cristaliniano, y es el signo exploratorio de la ectopia lentis, la dislocación del cristalino por ruptura zonular. Se acompaña de disminución de la agudeza visual y su tratamiento depende del grado de luxación y de la repercusión visual. Las causas son Marfan, homocistinuria, Weill-Marchesani y trauma.","w":["La descompensación endotelial produce edema corneal.","Correcta: sin soporte zonular el iris pierde su apoyo posterior y tiembla.","La presión elevada no produce iridodonesis.","Las sinequias fijan el iris, no lo hacen temblar."]},{"s":"OFT","c":2,"t":"Excavación glaucomatosa","q":"¿Por qué el glaucoma produce pérdida periférica antes que central?","o":["Porque el campo central se compensa con el otro ojo","Porque la mácula tiene doble irrigación","Las fibras periféricas entran más cerca de la excavación","Porque la presión daña primero la retina temporal"],"a":2,"e":"La relación copa-disco normal es de 0,1 a 0,3 y en el glaucoma la excavación crece hasta 0,7, 0,8 o 0,9. Las fibras que entran más cerca de la excavación proceden de la retina periférica y son las primeras en destruirse, de ahí la pérdida periférica progresiva y la visión tubular; las fibras papilomaculares son las últimas en perderse, por eso el paciente puede conservar buena visión central hasta fases avanzadas.","w":["La compensación binocular retrasa la percepción, pero no explica el daño.","La irrigación macular no es el mecanismo descrito.","Correcta: la topografía de las fibras explica el orden de la pérdida.","El daño no sigue una distribución temporal preferente."]},{"s":"OFT","c":2,"t":"Relación copa-disco","q":"¿Cuál es la relación copa-disco normal?","o":["De 0,4 a 0,6","De 0,7 a 0,9","Menor de 0,05","De 0,1 a 0,3"],"a":3,"e":"La relación copa-disco normal es de 0,1 a 0,3 y en el glaucoma la excavación crece progresivamente hasta 0,7, 0,8 o 0,9. Las fibras que entran más cerca de la excavación proceden de la retina periférica y son las primeras en destruirse, mientras las papilomaculares son las últimas, lo que explica que la visión central se conserve hasta fases avanzadas.","w":["Ese rango ya es sospechoso y exige seguimiento.","Ese rango corresponde a excavación glaucomatosa avanzada.","No es el valor de referencia inferior descrito.","Correcta: hasta 0,3 se considera dentro de lo normal."]},{"s":"OFT","c":2,"t":"Dinámica del humor acuoso","q":"Ordene el recorrido del humor acuoso desde su producción:","o":["Pars plicata, cámara posterior, pupila, cámara anterior, malla trabecular","Pars plicata, cámara anterior, pupila, cámara posterior, venas epiesclerales","Cámara anterior, pupila, cámara posterior, malla trabecular, canal de Schlemm","Canal de Schlemm, malla trabecular, cámara anterior, pupila, cámara posterior"],"a":0,"e":"El humor acuoso se produce en la pars plicata del cuerpo ciliar, a nivel del epitelio no pigmentado, pasa a la cámara posterior, atraviesa la pupila hacia la cámara anterior y sale por la malla trabecular, el canal de Schlemm y las venas epiesclerales hacia la circulación venosa. Comprender el circuito es lo que permite entender cada fármaco: los que bajan producción actúan en el cuerpo ciliar y los que mejoran drenaje en la salida.","w":["Correcta: producción ciliar, paso por la pupila y salida trabecular.","La cámara posterior precede a la anterior en el recorrido.","Invierte el sentido del flujo.","El canal de Schlemm es la vía de salida, no el inicio."]},{"s":"OFT","c":2,"t":"Tratamiento médico del glaucoma","q":"¿Cuál es el mecanismo de los análogos de prostaglandinas?","o":["Aumentan la permeabilidad corneal","Facilitan el drenaje uveoescleral","Contraen el esfínter pupilar","Disminuyen la producción de acuoso"],"a":1,"e":"Los análogos de prostaglandinas son hoy los más usados y actúan facilitando el drenaje uveoescleral. La dorzolamida es un inhibidor de la anhidrasa carbónica y disminuye la producción de humor acuoso, igual que en buena medida los betabloqueantes, que además facilitan el paso por la malla trabecular; los alfa-agonistas completan el arsenal. La presión intraocular es el único parámetro modificable en el glaucoma.","w":["La permeabilidad corneal no es una diana terapéutica del glaucoma.","Correcta: aumentan la salida por la vía uveoescleral.","La contracción del esfínter es efecto de los mióticos.","La reducción de producción corresponde a dorzolamida y betabloqueantes."]},{"s":"OFT","c":2,"t":"Único parámetro modificable","q":"¿Cuál es el único parámetro modificable en el glaucoma?","o":["El campo visual periférico","El grosor corneal central","La presión intraocular","La relación copa-disco"],"a":2,"e":"La presión intraocular es el único parámetro modificable en el glaucoma, y por eso todo el tratamiento, médico, láser o quirúrgico, se dirige a bajarla: los fármacos que reducen producción actúan en el cuerpo ciliar y los que mejoran el drenaje actúan en la malla trabecular o en la vía uveoescleral. La excavación y el campo visual son marcadores de daño ya establecido.","w":["El defecto campimétrico establecido es irreversible.","El grosor corneal sirve para corregir la lectura de presión.","Correcta: bajar la presión es la única intervención que cambia el curso.","La excavación refleja daño acumulado y no se revierte."]},{"s":"OFT","c":2,"t":"Trabeculectomía","q":"¿En qué consiste la trabeculectomía?","o":["Destruir el epitelio ciliar con crioterapia","Quemar la retina periférica isquémica","Abrir un orificio en el iris periférico con láser","Crear una compuerta escleral para que el acuoso forme una ampolla"],"a":3,"e":"La trabeculectomía es la cirugía filtrante clásica y probablemente la más frecuente: se levanta un flap escleral, se perfora, se hace iridectomía y se sutura parcialmente, de modo que el acuoso sale por esa compuerta y forma una ampolla subconjuntival que se reabsorbe. La iridotomía láser abre un orificio en el iris periférico para que el acuoso pase de cámara posterior a anterior.","w":["La ciclodestrucción es otra técnica, no la trabeculectomía.","La panfotocoagulación se usa en retinopatía proliferativa.","Eso describe la iridotomía láser.","Correcta: es una cirugía filtrante que crea una vía de salida controlada."]},{"s":"OFT","c":2,"t":"Gonioscopía","q":"Ordene las estructuras del ángulo camerular de anterior a posterior:","o":["Línea de Schwalbe, malla trabecular, espolón escleral, banda ciliar","Malla trabecular, línea de Schwalbe, banda ciliar, espolón escleral","Espolón escleral, banda ciliar, línea de Schwalbe, malla trabecular","Banda ciliar, espolón escleral, malla trabecular, línea de Schwalbe"],"a":0,"e":"La gonioscopía usa lentes de contacto especiales, como el de Goldmann, con anestesia tópica y gel, y se rota para ver todos los meridianos. Las estructuras del ángulo, de anterior a posterior, son línea de Schwalbe, malla trabecular, espolón escleral y banda del cuerpo ciliar. Verlas las cuatro corresponde al grado IV de Shaffer y define un ángulo abierto.","w":["Correcta: Schwalbe, trabéculo, espolón y banda ciliar en ese orden.","La línea de Schwalbe es la estructura más anterior.","El espolón escleral no es la estructura más anterior.","Invierte la secuencia anteroposterior."]},{"s":"OFT","c":2,"t":"Clasificación de Shaffer","q":"En la gonioscopía se visualizan las cuatro estructuras del ángulo. ¿Cómo se clasifica?","o":["Grado 0 de Shaffer, ángulo cerrado","Grado IV de Shaffer, ángulo abierto","Grado II de Shaffer, riesgo de cierre","Grado I de Shaffer, ángulo estrecho"],"a":1,"e":"Ver las cuatro estructuras del ángulo, línea de Schwalbe, malla trabecular, espolón escleral y banda del cuerpo ciliar, corresponde al grado IV de Shaffer y define un ángulo abierto; ver solo una o ninguna indica un ángulo estrecho o cerrado, con riesgo de glaucoma agudo. La gonioscopía se hace con lente de Goldmann, anestesia tópica y gel, rotando para ver todos los meridianos.","w":["El grado 0 corresponde al ángulo cerrado.","Correcta: visualizar las cuatro estructuras define el ángulo abierto.","El grado II indica visualización parcial.","El grado I implica visualización mínima del ángulo."]},{"s":"OFT","c":2,"t":"Glaucoma neovascular","q":"Paciente con oclusión de vena central de la retina que a los tres meses desarrolla presión intraocular muy elevada y neovasos en el iris. ¿Qué ocurre?","o":["Glaucoma cortisónico por corticoides tópicos","Glaucoma agudo por cierre angular primario","Glaucoma neovascular por rubeosis iridis","Glaucoma pigmentario por dispersión"],"a":2,"e":"En la retinopatía diabética proliferativa y en la oclusión de vena central de la retina, la retina isquémica libera VEGF y aparecen neovasos en el iris, la rubeosis iridis, que cierran el ángulo y elevan la presión intraocular. Se le llama glaucoma de los 90 días o de los tres meses por el intervalo típico tras la oclusión venosa, y es el glaucoma más difícil de tratar; suele requerir panfotocoagulación y antiangiogénicos.","w":["El cortisónico requiere antecedente de corticoterapia.","El cierre angular primario no depende de neovasos.","Correcta: la isquemia retiniana genera neovasos que cierran el ángulo.","El glaucoma pigmentario obedece a dispersión de pigmento iridiano."]},{"s":"OFT","c":2,"t":"Patogenia de la retinopatía diabética","q":"¿Qué célula daña la hiperglucemia por la vía del sorbitol, iniciando la retinopatía diabética?","o":["El epitelio pigmentario","El fotorreceptor","La célula de Müller","El pericito"],"a":3,"e":"La hiperglucemia activa la vía del sorbitol y daña los pericitos, que son el soporte estructural del capilar; sin ellos la pared se debilita, aparecen microaneurismas, se rompe la barrera hematorretiniana y se extravasan lípidos, proteínas y líquido. Cuando un vaso se trombosa, la retina isquémica libera VEGF y se forman neovasos mal constituidos, sin pericitos y solo con endotelio, que sangran con facilidad.","w":["El epitelio pigmentario se implica en la degeneración macular.","El fotorreceptor se afecta después, por el edema y la isquemia.","La célula de Müller no es el blanco inicial descrito.","Correcta: la pérdida de pericitos debilita la pared capilar."]},{"s":"OFT","c":2,"t":"Regla del 4-2-1","q":"Paciente con hemorragias en los cuatro cuadrantes retinianos. ¿Cómo se clasifica su retinopatía?","o":["No proliferativa severa","No proliferativa moderada","No proliferativa leve","Proliferativa establecida"],"a":0,"e":"La regla del 4-2-1 define la retinopatía no proliferativa severa: microaneurismas y hemorragias en los cuatro cuadrantes, o arrosariamiento venoso en dos, o IRMA en uno. Cumplir dos o más de esos criterios la convierte en muy severa. Por debajo, la leve tiene solo microaneurismas o microhemorragias y la moderada hemorragias en menos de cuatro cuadrantes; la aparición de neovasos define la proliferativa.","w":["Correcta: hemorragias en los cuatro cuadrantes cumplen el criterio 4.","La moderada tiene hemorragias en menos de cuatro cuadrantes.","La leve solo presenta microaneurismas o microhemorragias.","La proliferativa se define por la presencia de neovasos."]},{"s":"OFT","c":2,"t":"Retinopatía muy severa","q":"¿Qué convierte una retinopatía no proliferativa severa en muy severa?","o":["El edema macular clínicamente significativo","Cumplir dos o más criterios de la regla 4-2-1","La aparición de neovasos en el disco","La hemorragia vítrea establecida"],"a":1,"e":"La regla del 4-2-1 define la retinopatía no proliferativa severa: hemorragias en cuatro cuadrantes, arrosariamiento venoso en dos o IRMA en uno. Cumplir dos o más de esos criterios la convierte en muy severa. La aparición de neovasos ya define la retinopatía proliferativa, que es un estadio distinto, y la hemorragia vítrea es una complicación de esta última.","w":["El edema macular se clasifica de forma independiente.","Correcta: dos o más criterios elevan la categoría a muy severa.","Los neovasos definen la forma proliferativa, no la muy severa.","La hemorragia vítrea complica a la proliferativa."]},{"s":"OFT","c":2,"t":"Exudados en diabetes e hipertensión","q":"Relacione el patrón de exudados de la diabetes con el de la hipertensión:","o":["Diabetes hemorragias en llama; hipertensión circinado macular","Diabetes circinado; hipertensión hemorragias profundas puntiformes","Diabetes circinado; hipertensión estrella macular","Diabetes estrella macular; hipertensión circinado perimicroaneurismático"],"a":2,"e":"En la diabetes los exudados duros se disponen en anillo alrededor del microaneurisma filtrante, el patrón circinado, y las hemorragias son profundas y puntiformes. En la hipertensión los exudados duros adoptan el patrón de estrella macular y las hemorragias son superficiales, en llama, porque están en la capa de fibras nerviosas y se ven mejor con filtro aneritra.","w":["Las hemorragias en llama corresponden a la hipertensión.","Las hemorragias profundas puntiformes son de la diabetes.","Correcta: circinado en diabetes y estrella macular en hipertensión.","Invierte ambos patrones."]},{"s":"OFT","c":2,"t":"Estudio ETDRS","q":"¿Qué demostró el estudio ETDRS?","o":["Que la panfotocoagulación reduce la pérdida visual severa","Que la vitrectomía precoz beneficia al diabético tipo 1","Que el control estricto de la glucemia revierte la retinopatía","Que el láser focal reduce la pérdida visual en más del 50%"],"a":3,"e":"El DRS demostró que la panfotocoagulación reduce el riesgo de pérdida visual severa en la retinopatía proliferativa. El ETDRS estableció el momento oportuno del láser, demostró que el láser focal reduce la pérdida visual en más del 50% y que la aspirina no modifica el curso de la retinopatía. El DVRS estudió la hemorragia vítrea: vitrectomía precoz en el diabético tipo 1 y espera en el tipo 2.","w":["Ese hallazgo corresponde al DRS.","Ese fue el aporte del DVRS.","Ninguno de los tres estudios demostró reversión de la retinopatía.","Correcta: el ETDRS validó el láser focal y descartó el efecto de la aspirina."]},{"s":"OFT","c":2,"t":"Panfotocoagulación","q":"¿Por qué la panfotocoagulación hace regresar los neovasos?","o":["La retina anóxica deja de producir VEGF","Porque reduce la presión intraocular","Porque restaura la barrera hematorretiniana","Porque coagula directamente los neovasos del iris"],"a":0,"e":"La panfotocoagulación quema áreas extensas de retina periférica y las lleva de isquémicas a anóxicas: al no requerir ya aporte sanguíneo dejan de producir VEGF y los neovasos regresan. El profesor lo compara con sacrificar parte del ganado para alimentar el resto. El precio es real: mala visión nocturna por destrucción de bastones periféricos, mala adaptación luz-oscuridad y contracción del campo periférico.","w":["Correcta: sin tejido isquémico demandante desaparece el estímulo angiogénico.","No es un procedimiento hipotensor ocular.","No restaura la barrera hematorretiniana ya dañada.","No actúa coagulando los neovasos uno por uno."]},{"s":"OFT","c":2,"t":"Precio de la panfotocoagulación","q":"¿Cuál de los siguientes es un efecto esperado de la panfotocoagulación?","o":["Aumento de la presión intraocular","Mala visión nocturna","Pérdida de la visión central","Opacificación del cristalino"],"a":1,"e":"La panfotocoagulación destruye bastones periféricos, de modo que produce mala visión nocturna, mala adaptación luz-oscuridad y contracción del campo periférico. Es el precio aceptado para que la retina deje de producir VEGF y los neovasos regresen. La visión central se preserva precisamente porque el tratamiento respeta el área macular.","w":["No eleva la presión intraocular como efecto propio.","Correcta: la destrucción de bastones periféricos deteriora la visión nocturna.","La visión central se respeta al no tratar la mácula.","No produce catarata como efecto esperado."]},{"s":"OFT","c":2,"t":"Causas de pérdida visual en el diabético","q":"Relacione la principal causa de disminución de visión en el diabético con la principal causa de pérdida de visión:","o":["Disminución por retinopatía proliferativa; pérdida por edema macular significativo","Disminución por edema macular; pérdida por glaucoma neovascular establecido","Disminución por edema macular; pérdida por retinopatía proliferativa","Disminución por catarata diabética; pérdida por retinopatía proliferativa"],"a":2,"e":"El edema macular clínicamente significativo es la principal causa de disminución de la visión en el diabético, mientras que la retinopatía proliferativa es la principal causa de pérdida de visión, sobre todo por hemorragia vítrea y desprendimiento traccional. El edema se trata con láser focal guiado por angiografía con fluoresceína, en patrón en C macular y nunca entre disco y mácula.","w":["Invierte ambas atribuciones.","El glaucoma neovascular es una complicación, no la causa principal.","Correcta: edema para la disminución y proliferativa para la pérdida.","La catarata contribuye, pero no es la causa principal descrita."]},{"s":"OFT","c":2,"t":"Retinopatía hipertensiva","q":"¿Por qué la arteria comprime a la vena en el cruce arteriovenoso?","o":["Porque el cruce es perpendicular","Porque la vena carece de músculo liso","Porque la vena tiene menor presión","Comparten la adventicia"],"a":3,"e":"Arteria y vena comparten adventicia en el cruce, así que cuando la arteria se endurece comprime a la vena. La graduación de la retinopatía hipertensiva va de 1, ligera constricción, a 2, más pronunciada, a 3, vena que parece enterrada, y a 4, con los extremos venosos totalmente separados, además de los signos de Salus, Gunn y Bonnet.","w":["La orientación del cruce es variable.","La composición de la pared no es el mecanismo descrito.","El gradiente de presión no explica la compresión mecánica.","Correcta: la adventicia compartida transmite la compresión."]},{"s":"OFT","c":2,"t":"Grado 4 de retinopatía hipertensiva","q":"¿Qué caracteriza al grado 4 de la retinopatía hipertensiva?","o":["Extremos venosos totalmente separados","Vena que parece enterrada en el cruce","Arrosariamiento venoso en dos cuadrantes","Ligera constricción arteriolar"],"a":0,"e":"La graduación de la retinopatía hipertensiva va de 1, ligera constricción arteriolar, a 2, más pronunciada, a 3, vena que parece enterrada, y a 4, con los extremos venosos totalmente separados. En la hipertensión maligna o grado IV se borran además los márgenes del disco. El arrosariamiento venoso, en cambio, es un criterio de la regla 4-2-1 de la retinopatía diabética.","w":["Correcta: la separación completa de los extremos venosos define el grado 4.","La vena enterrada corresponde al grado 3.","El arrosariamiento pertenece a la clasificación de la retinopatía diabética.","La constricción ligera es el grado 1."]},{"s":"OFT","c":2,"t":"Degeneración macular seca","q":"¿Qué son las drusas y en qué forma de degeneración macular predominan?","o":["Hemorragias subretinianas; en la forma húmeda exudativa","Depósitos hialinos subretinianos; en la forma seca","Exudados duros perimaculares; en la forma seca","Neovasos coroideos subretinianos; en la forma húmeda"],"a":1,"e":"La degeneración macular relacionada con la edad es la primera causa de ceguera legal en mayores de 60 años en Estados Unidos y predomina en raza blanca. La forma seca representa el 90% y se caracteriza por drusas, depósitos hialinos subretinianos por incapacidad del epitelio pigmentario de procesar los desechos de los fotorreceptores; se maneja con antioxidantes, vitamina A y betacaroteno.","w":["Las hemorragias acompañan a la forma húmeda, no son drusas.","Correcta: drusas hialinas subretinianas, propias de la forma seca.","Los exudados duros son de la retinopatía diabética o hipertensiva.","Los neovasos coroideos definen la forma húmeda."]},{"s":"OFT","c":2,"t":"Formas de degeneración macular","q":"Relacione la proporción de la forma seca con la de la húmeda y su hallazgo:","o":["Seca 50% con drusas confluentes; húmeda 50% con membrana neovascular","Seca 10% con drusas hialinas; húmeda 90% con membrana neovascular subretiniana","Seca 90% con drusas; húmeda 10% con membrana neovascular","Seca 90% con membrana neovascular; húmeda 10% con drusas hialinas subretinianas"],"a":2,"e":"La forma seca de la degeneración macular representa el 90% y se caracteriza por drusas, depósitos hialinos subretinianos por incapacidad del epitelio pigmentario de procesar los desechos de los fotorreceptores. La húmeda es el 10%: las drusas rompen la barrera y aparece una membrana neovascular subretiniana, con metamorfopsia y pérdida central rápida, tratada con antiangiogénicos.","w":["La distribución no es equitativa entre ambas formas.","Invierte ambas proporciones.","Correcta: 90% seca con drusas y 10% húmeda con membrana neovascular.","La membrana neovascular pertenece a la forma húmeda."]},{"s":"OFT","c":3,"t":"Longitud axial normal","q":"¿Cuál es la longitud axial normal del ojo?","o":["De 18 a 20 mm","De 26 a 28 mm","De 11,7 a 10,2 mm","De 22 a 24 mm"],"a":3,"e":"La longitud axial normal es de 22 a 24 mm y la emetropía significa que la imagen se forma exactamente sobre la retina, con visión 20/20 sin corrección. El ojo largo enfoca por delante de la retina y es miope; el ojo corto enfoca por detrás y es hipermétrope. Ametropía es el término general para cualquier defecto refractivo.","w":["Un ojo tan corto sería marcadamente hipermétrope.","Un ojo de ese largo corresponde a miopía alta.","Esas cifras son los diámetros corneales horizontal y vertical.","Correcta: 22 a 24 mm es el rango axial normal."]},{"s":"OFT","c":3,"t":"Miopía y longitud axial","q":"Paciente con longitud axial de 27 mm. ¿Dónde enfoca la imagen y qué defecto tiene?","o":["Por delante de la retina; es miope","Exactamente en la retina; es emétrope","Por detrás de la retina; es hipermétrope","En dos focos distintos; es astigmático"],"a":0,"e":"El ojo largo enfoca por delante de la retina y es miope; el ojo corto enfoca por detrás y es hipermétrope. La longitud axial normal es de 22 a 24 mm, así que 27 mm corresponde a un ojo estirado, es decir miope. El astigmatismo, en cambio, no depende de la longitud axial sino de que la córnea tenga un meridiano más curvo y otro más plano.","w":["Correcta: al alargarse el eje, el foco queda por delante de la retina.","La emetropía se da con longitud axial normal.","Enfocar por detrás corresponde al ojo corto, hipermétrope.","El astigmatismo depende de la curvatura corneal, no del eje."]},{"s":"OFT","c":3,"t":"Corrección del hipermétrope","q":"¿Qué tipo de lente corrige la hipermetropía?","o":["Cilíndrica con eje a 90 grados","Convergente, convexa y positiva","Divergente, cóncava y negativa","Prismática de base interna"],"a":1,"e":"El hipermétrope enfoca detrás de la retina y necesita una lente convergente, convexa y positiva, la misma con la que se concentra la luz del sol hasta quemar un papel. El miope enfoca delante y necesita una lente divergente, cóncava y negativa. El astigmatismo no se corrige con esferas sino con lentes cilíndricas.","w":["Las cilíndricas corrigen el astigmatismo.","Correcta: la lente positiva adelanta el foco hasta la retina.","La lente negativa corrige la miopía.","Los prismas corrigen desviaciones oculares, no ametropías."]},{"s":"OFT","c":3,"t":"Riesgo de la miopía alta","q":"¿Por qué el miope alto necesita exploración periódica de la periferia retiniana?","o":["Porque el cristalino se opacifica antes","Porque la presión intraocular sube con el eje","El eje alargado adelgaza y atrofia la retina periférica","Porque la mácula pierde xantófila con la edad"],"a":2,"e":"El ojo miope alto es un ojo estirado: al alargarse el eje, la retina periférica queda adelgazada y atrófica, lo que predispone a degeneraciones periféricas, agujeros, desgarros y desprendimiento regmatógeno. Por eso el miope alto necesita exploración periódica de la periferia con oftalmoscopio indirecto, que ofrece campo amplio y estereopsis.","w":["La catarata precoz no justifica la exploración periférica.","La presión intraocular no aumenta por la longitud axial.","Correcta: la retina periférica adelgazada favorece desgarros y desprendimiento.","La pérdida de xantófila no es el riesgo descrito."]},{"s":"OFT","c":3,"t":"Astigmatismo miópico compuesto","q":"Los dos focos del astigmatismo caen por delante de la retina. ¿Cómo se llama y cómo se receta?","o":["Mixto; esfera negativa y cilindro positivo","Miópico simple; solo cilindro negativo","Hipermetrópico compuesto; esfera y cilindro positivos","Miópico compuesto; esfera y cilindro negativos"],"a":3,"e":"En el astigmatismo compuesto los dos focos caen del mismo lado de la retina: si ambos están delante es miópico compuesto y se receta esfera y cilindro negativos; si ambos están detrás es hipermetrópico compuesto, con esfera y cilindro positivos. En los simples un foco está sobre la retina y basta el cilindro; en el mixto uno cae delante y otro detrás.","w":["En el mixto los focos caen a ambos lados de la retina.","En el simple uno de los focos ya cae sobre la retina.","Eso corresponde a los focos situados por detrás de la retina.","Correcta: ambos focos por delante exigen esfera y cilindro negativos."]},{"s":"OFT","c":3,"t":"Origen del astigmatismo","q":"¿Cuál es la causa más frecuente del astigmatismo?","o":["Que la córnea no sea perfectamente esférica","Una asimetría del cristalino","Una debilidad del músculo ciliar","Una longitud axial aumentada"],"a":0,"e":"El astigmatismo se debe a que la córnea no es perfectamente esférica: tiene un meridiano más curvo y otro más plano, de modo que la luz no forma un foco único sino dos focos separados. Con menos frecuencia el origen es una asimetría del cristalino. Se corrige con lentes cilíndricas y también puede corregirse quirúrgicamente.","w":["Correcta: la asfericidad corneal genera dos meridianos con distinta potencia.","El cristalino es causa menos frecuente.","La debilidad ciliar produce presbicia.","La longitud axial determina miopía o hipermetropía."]},{"s":"OFT","c":3,"t":"Presbicia","q":"¿Por qué aparece la presbicia?","o":["Porque disminuye el diámetro pupilar","El cristalino pierde elasticidad y el ciliar fuerza","Porque el eje anteroposterior se acorta","Porque la córnea se aplana con la edad"],"a":1,"e":"La presbicia es la pérdida progresiva de la acomodación por envejecimiento del cristalino, cuyas proteínas pierden elasticidad mientras el músculo ciliar pierde fuerza; empieza alrededor de los 40 años. La adición sube con la edad: +1,00 a los 40 años y va creciendo de forma escalonada hasta cerca de +2,00 a los 50.","w":["La miosis senil dificulta la iluminación, no la acomodación.","Correcta: envejecen tanto el cristalino como el músculo ciliar.","El eje no se acorta con la edad.","El aplanamiento corneal no explica la presbicia."]},{"s":"OFT","c":3,"t":"Adición según la edad","q":"¿A qué edad empieza la presbicia y con qué adición?","o":["A los 30 años, con +1,50","A los 45 años, con +2,00","A los 40 años, con +1,00","A los 50 años, con +1,00"],"a":2,"e":"La presbicia empieza alrededor de los 40 años y la adición sube con la edad: +1,00 a los 40, +1,25 a los 42-43, +1,50 a los 45, +1,75 a los 47 y cerca de +2,00 a los 50. Se debe a que las proteínas del cristalino pierden elasticidad mientras el músculo ciliar pierde fuerza.","w":["A los 30 años la reserva acomodativa aún es amplia.","A los 45 la adición descrita es +1,50.","Correcta: inicio hacia los 40 años con adición de +1,00.","A los 50 la adición ya se acerca a +2,00."]},{"s":"OFT","c":3,"t":"Tríada de acomodación","q":"¿Qué tres fenómenos se activan simultáneamente al mirar de cerca?","o":["Miosis, divergencia y relajación ciliar","Midriasis, divergencia y acomodación","Midriasis, convergencia y cicloplejia","Miosis, convergencia y acomodación"],"a":3,"e":"Al mirar de cerca se activan simultáneamente miosis, convergencia y acomodación. El músculo ciliar se contrae, con lo que relaja las zónulas y el cristalino se abomba: aumenta su diámetro anteroposterior y con ello su poder refractivo, que es lo que permite enfocar el objeto próximo. Cuando ese mecanismo falla por edad aparece la presbicia.","w":["La relajación ciliar ocurre al mirar de lejos.","La midriasis y la divergencia corresponden a la visión lejana.","La cicloplejia es farmacológica y abole la acomodación.","Correcta: es la tríada de la visión próxima."]},{"s":"OFT","c":3,"t":"Mecánica de la acomodación","q":"Al contraerse el músculo ciliar, ¿qué le ocurre al cristalino?","o":["Se abomba y aumenta su poder refractivo","Se desplaza hacia atrás sin cambiar de forma","Pierde transparencia de forma transitoria","Se aplana y reduce su poder refractivo"],"a":0,"e":"El músculo ciliar se contrae, con lo que relaja las zónulas y el cristalino se abomba: aumenta su diámetro anteroposterior y con ello su poder refractivo, que es lo que permite enfocar el objeto próximo. Al mirar de lejos el ciliar se relaja, las zónulas se tensan y el cristalino se aplana. La presbicia es el fallo progresivo de ese mecanismo.","w":["Correcta: la relajación zonular permite que el cristalino se abombe.","El cristalino cambia de forma, no solo de posición.","La transparencia no se modifica con la acomodación.","El aplanamiento ocurre al relajarse el ciliar, para ver de lejos."]},{"s":"OFT","c":3,"t":"Astenopia del hipermétrope joven","q":"Joven de 20 años con cefalea, ardor ocular y agotamiento al final del día, con visión 20/20. ¿Qué hay que sospechar?","o":["Miopía no corregida","Hipermetropía compensada con acomodación","Glaucoma de ángulo abierto","Presbicia precoz"],"a":1,"e":"El hipermétrope joven tiene tanta reserva acomodativa que compensa su defecto y ve bien, pero paga el esfuerzo con astenopia: cefalea, ardor y agotamiento al final del día. Como la acomodación enmascara el defecto real, se requiere cicloplejia con ciclopentolato, que es más ciclopléjico que midriático, para medir la refracción verdadera.","w":["El miope no corregido vería mal de lejos.","Correcta: la acomodación mantenida explica la astenopia con visión normal.","El glaucoma de ángulo abierto es asintomático en fases iniciales.","La presbicia no aparece a los 20 años."]},{"s":"OFT","c":3,"t":"Ciclopentolato","q":"¿Cuál es el efecto predominante del ciclopentolato y para qué se usa?","o":["Hipotensor ocular; glaucoma de ángulo abierto","Anestésico tópico; retirada de cuerpos extraños","Ciclopléjico; refracción del niño y del hipermétrope joven","Midriático; exploración del fondo de ojo"],"a":2,"e":"El ciclopentolato tiene efecto predominantemente ciclopléjico, es decir paraliza el músculo ciliar y con ello la acomodación, más que dilatar la pupila. Es imprescindible en la refracción del niño, que acomoda de forma constante y falsea la medición, y en el hipermétrope joven con sospecha de acomodación compensadora.","w":["No tiene efecto hipotensor ocular.","El anestésico tópico descrito en el temario es la proparacaína.","Correcta: es más ciclopléjico que midriático y sirve para refractar.","La midriasis diagnóstica se logra mejor con tropicamida o fenilefrina."]},{"s":"OFT","c":3,"t":"Anisometropía","q":"Niño con miopía de 4 dioptrías en un ojo y emetropía en el otro. ¿Qué riesgo corre?","o":["Desprendimiento de retina bilateral","Catarata congénita unilateral","Glaucoma congénito","Ambliopía del ojo peor"],"a":3,"e":"La anisometropía es una diferencia significativa del defecto refractivo entre ambos ojos, por ejemplo más de 2 dioptrías o un ojo miope y otro hipermétrope, y en el niño puede provocar ambliopía del ojo peor porque el cerebro privilegia la imagen nítida. La aniseiconia es la diferencia en el tamaño de la imagen percibida por cada ojo.","w":["La miopía alta unilateral no produce desprendimiento bilateral.","La catarata congénita es una causa, no una consecuencia.","El glaucoma congénito no deriva de la anisometropía.","Correcta: la supresión del ojo con imagen borrosa conduce a ambliopía."]},{"s":"OFT","c":3,"t":"Aniseiconia","q":"¿Qué es la aniseiconia?","o":["Diferencia en el tamaño de la imagen de cada ojo","Diferencia del defecto refractivo entre ambos ojos","Diferencia del tamaño pupilar entre ambos ojos","Diferencia en el color del iris entre ambos ojos"],"a":0,"e":"La aniseiconia es la diferencia en el tamaño de la imagen percibida por cada ojo, y era el gran problema de la afaquia unilateral corregida con gafas de +12 dioptrías. La anisometropía, en cambio, es la diferencia del defecto refractivo entre ambos ojos, que en el niño puede provocar ambliopía. La diferencia de color del iris es la heterocromía.","w":["Correcta: se refiere al tamaño de la imagen, no al defecto refractivo.","Esa es la definición de anisometropía.","La diferencia de tamaño pupilar es la anisocoria.","La diferencia de color del iris es la heterocromía."]},{"s":"OFT","c":3,"t":"Refracción subjetiva y objetiva","q":"Relacione la refracción subjetiva de Donders con la retinoscopía:","o":["Donders requiere cicloplejia previa; retinoscopía se hace sin dilatar la pupila","Donders depende de la respuesta del paciente; retinoscopía es objetiva","Donders es objetiva y no requiere colaboración; retinoscopía depende del paciente","Donders usa franja de luz neutralizada; retinoscopía prueba esferas y cilindros"],"a":1,"e":"La refracción subjetiva de Donders prueba esferas y cilindros con montura de prueba y depende por completo de que el paciente responda cuál ve mejor, primero esferas y luego el afinamiento con cilindro cruzado. La retinoscopía es objetiva: se proyecta una franja de luz en la retina y se neutraliza el movimiento de la sombra con lentes, sin necesidad de que el paciente colabore.","w":["La cicloplejia se usa sobre todo con la retinoscopía en el niño.","Correcta: una depende de la respuesta y la otra no.","Invierte ambos métodos.","La franja de luz corresponde a la retinoscopía."]},{"s":"OFT","c":3,"t":"Sombras en retinoscopía","q":"En retinoscopía la sombra se desplaza en sentido contrario al movimiento del instrumento. ¿Cómo se denomina?","o":["Sombra en tijera","Sombra positiva","Sombra negativa","Punto de neutralización"],"a":2,"e":"En retinoscopía se mueve el instrumento y se observa la sombra sobre la pupila: si se desplaza en el mismo sentido se llama sombra positiva y si lo hace en sentido contrario, negativa. Se van anteponiendo lentes hasta que la sombra deja de moverse, punto de neutralización que define la refracción objetiva del paciente.","w":["No es la denominación descrita en el temario.

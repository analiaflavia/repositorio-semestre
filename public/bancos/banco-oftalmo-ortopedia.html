ción de la osteonecrosis","q":"¿Qué caracteriza al infarto óseo dentro de la clasificación de la osteonecrosis?","o":["Requiere tres o más sitios comprometidos","Afecta a la vez hueso y cartílago","Asienta en zonas metadiafisarias de escasa vascularización","Produce colapso de la estructura articular"],"a":2,"e":"La osteonecrosis se clasifica en avascular o subcondral, que produce colapso de la estructura articular; infarto óseo, en zonas metadiafisarias de escasa vascularización; y osteocondral, que afecta hueso y cartílago. Se habla de osteonecrosis múltiple cuando hay tres o más sitios comprometidos.","w":["Tres o más sitios define la osteonecrosis múltiple.","Afectar hueso y cartílago define a la osteocondral.","Correcta: el infarto óseo asienta en zonas metadiafisarias poco vascularizadas.","El colapso articular define a la forma avascular o subcondral."]},{"s":"ORT","c":19,"t":"Corticoides y osteonecrosis","q":"¿Por encima de qué dosis diaria de corticoide aumenta el riesgo de osteonecrosis?","o":["De 5 mg al día","De 200 mg al día","De 1 mg al día","De 20 mg al día"],"a":3,"e":"La osteonecrosis no traumática se asocia a corticoesteroides en dosis altas, por encima de 20 mg al día, enfermedades autoinmunes como el lupus, alcoholismo, leucemia y drepanocitemia, además de causas metabólicas como la hiperlipidemia. Siempre hay que evaluar uso de esteroides, factores de coagulación buscando PAI-1 y patologías autoinmunes.","w":["Cinco mg diarios queda por debajo del umbral.","Doscientos mg no es la dosis de referencia.","Un miligramo diario es una dosis muy baja.","Correcta: 20 mg diarios es el umbral descrito."]},{"s":"ORT","c":19,"t":"Vía patogénica de los corticoides","q":"¿Qué apoptosis inducen los corticoides en el hueso?","o":["Dual, de osteoblastos y osteoclastos","Solo de osteocitos corticales","Solo de condrocitos articulares","Solo de osteoclastos maduros"],"a":0,"e":"La vía patogénica de los corticoides por encima de 20 mg al día incluye apoptosis dual programada de osteoblastos y osteoclastos, pérdida de función sensorial y aumento de lípidos circulantes, que forman microémbolos grasos y llevan a colapso vascular, isquemia y necrosis terminal.","w":["Correcta: la apoptosis compromete ambas estirpes celulares.","Los osteocitos mueren, pero la apoptosis descrita es dual.","Los condrocitos no son la diana descrita.","La apoptosis descrita no se limita al osteoclasto."]},{"s":"ORT","c":19,"t":"Microémbolos grasos","q":"¿Cómo contribuyen los lípidos al desarrollo de osteonecrosis por corticoides?","o":["Reducen la producción de osteoide","Forman microémbolos grasos que colapsan la circulación","Se depositan en el cartílago y lo endurecen","Aumentan la reabsorción osteoclástica"],"a":1,"e":"Los corticoides por encima de 20 mg al día producen apoptosis dual de osteoblastos y osteoclastos y aumento de lípidos circulantes, que forman microémbolos grasos y llevan a colapso vascular, isquemia y necrosis terminal. El modelo general es de estrés celular acumulado con alteración del metabolismo lipídico y elevación de la presión intramedular.","w":["La reducción de osteoide es consecuencia, no mecanismo lipídico.","Correcta: los microémbolos grasos ocluyen la microcirculación ósea.","No se depositan en el cartílago de ese modo.","La reabsorción osteoclástica también se ve reducida por apoptosis."]},{"s":"ORT","c":19,"t":"Fase silenciosa","q":"¿Qué se encuentra en la fase silenciosa de la osteonecrosis?","o":["Aplanamiento de la superficie articular","Reabsorción ósea por reparación frustrada","Lagunas vacías de osteocitos sin traducción radiológica","Signo de media luna incipiente"],"a":2,"e":"La osteonecrosis pasa por cuatro fases: silenciosa, con lagunas vacías de osteocitos y estructura trabecular intacta pero biología inerte, sin evidencia radiológica; reparación frustrada, con proliferación celular y reabsorción; fractura subcondral, el signo de media luna; y colapso con remodelación, con aplanamiento de la superficie articular.","w":["El aplanamiento corresponde al colapso y remodelación.","La reabsorción por reparación frustrada es la segunda fase.","Correcta: lagunas vacías con radiología normal.","La media luna aparece en la tercera fase."]},{"s":"ORT","c":19,"t":"Signo de media luna","q":"¿A qué corresponde el signo de media luna en la osteonecrosis?","o":["A las lagunas vacías de osteocitos","A la doble línea en resonancia","Al aplanamiento de la cabeza femoral","A la fractura subcondral"],"a":3,"e":"En la tercera fase de la osteonecrosis se produce la fractura subcondral, el signo de media luna, y si ya se ve en radiografía el diagnóstico suele ser tardío. En la cuarta hay colapso y remodelación con aplanamiento de la superficie articular. El signo de la doble línea es un hallazgo de resonancia.","w":["Las lagunas vacías corresponden a la fase silenciosa.","La doble línea es un hallazgo de resonancia.","El aplanamiento es la fase de colapso.","Correcta: la media luna es la fractura subcondral."]},{"s":"ORT","c":19,"t":"Gold standard de imagen","q":"¿Cuál es el gold standard de imagen en la osteonecrosis y su hallazgo?","o":["Resonancia; doble línea con T1 hipointenso","Radiografía; signo de media luna","Tomografía; esclerosis moteada difusa","Gammagrafía; áreas frías por menor recaptación"],"a":0,"e":"La resonancia es el gold standard de la osteonecrosis, con sensibilidad de hasta el 91%: detecta fases tempranas, muestra señal hipointensa en T1 y el signo de la doble línea. La gammagrafía muestra áreas frías con uso secundario y la radiografía da diagnóstico tardío, con esclerosis y signo de media luna.","w":["Correcta: resonancia con doble línea e hiposeñal en T1.","La radiografía llega tarde en esta enfermedad.","La tomografía no es el gold standard descrito.","Las áreas frías son el hallazgo de la gammagrafía."]},{"s":"ORT","c":19,"t":"Ficat y Arlet estadio 3","q":"¿Qué estadio de Ficat y Arlet marca el colapso inicial?","o":["El estadio 1","El estadio 3","El estadio 2","El estadio 5"],"a":1,"e":"Ficat y Arlet tiene seis estadios: 0 imágenes normales solo diagnosticables por biopsia; 1 resonancia o histología positiva con radiografía normal; 2 radiografía patológica con esclerosis pero sin colapso; 3 signo de media luna o fractura subcondral, que marca el colapso inicial; 4 aplanamiento evidente de la cabeza; y 5 a 6 pérdida del espacio articular con artrosis secundaria.","w":["El estadio 1 tiene radiografía normal.","Correcta: el estadio 3 introduce la fractura subcondral y el colapso.","El estadio 2 es todavía precolapso.","Los estadios 5 y 6 ya muestran artrosis secundaria."]},{"s":"ORT","c":19,"t":"Umbral de irreversibilidad","q":"¿Entre qué estadios de Ficat y Arlet se sitúa el umbral de irreversibilidad?","o":["Entre el 4 y el 5","Entre el 1 y el 2","Entre el 2 y el 3","Entre el 0 y el 1"],"a":2,"e":"El umbral de irreversibilidad de la osteonecrosis está entre el estadio 2 y el 3 de Ficat y Arlet: el 2 es radiografía patológica con esclerosis pero sin colapso, todavía precolapso, y el 3 es el signo de media luna o fractura subcondral, que marca el colapso inicial. A partir de ahí la indicación es artroplastia.","w":["Entre el 4 y el 5 la destrucción ya está establecida.","Entre el 1 y el 2 aún no hay colapso.","Correcta: el paso de precolapso a colapso marca la irreversibilidad.","Entre el 0 y el 1 la enfermedad sigue siendo reversible."]},{"s":"ORT","c":19,"t":"Tratamiento precoz","q":"¿Cuál es el tratamiento de la osteonecrosis antes del estadio 3?","o":["Solo observación sin intervención","Artroplastia total de cadera","Artrodesis de la articulación afectada","Descarga, bifosfonatos y descompresión del core"],"a":3,"e":"En fases tempranas, antes del estadio 3, el tratamiento es descarga articular, bifosfonatos para disminuir la actividad de remodelado y cirugías preservadoras como la descompresión del core. A partir del estadio 3, cuando el colapso es irreversible, la indicación es artroplastia.","w":["La observación pasiva deja progresar la enfermedad.","La artroplastia se reserva a partir del estadio 3.","La artrodesis no es el tratamiento descrito.","Correcta: medidas preservadoras mientras no haya colapso."]},{"s":"ORT","c":19,"t":"Bilateralidad","q":"¿Qué porcentaje de osteonecrosis se vuelve bilateral y en qué plazo?","o":["El 75% en 2 años","El 50% en 5 años","El 75% en 6 meses","El 25% en 2 años"],"a":0,"e":"El 75% de los casos de osteonecrosis pueden volverse bilaterales dentro de los 2 años, dato que obliga a anticipar la bilateralidad en pacientes con enfermedades sistémicas y a solicitar resonancia en trasplantados o en terapia con corticoesteroides para descartar necrosis del lado aparentemente sano.","w":["Correcta: tres de cada cuatro se bilateralizan en 2 años.","Ni el porcentaje ni el plazo coinciden con lo descrito.","El plazo descrito son 2 años.","El porcentaje descrito es mucho mayor."]},{"s":"ORT","c":19,"t":"Epónimo del semilunar","q":"¿Qué epónimo corresponde a la osteonecrosis del semilunar?","o":["Enfermedad de Freiberg","Enfermedad de Kienböck","Enfermedad de Preiser","Enfermedad de Köhler"],"a":1,"e":"Los epónimos se ordenan por localización: cabeza femoral, Legg-Calvé-Perthes; semilunar, Kienböck; escafoides tarsiano, Köhler; segundo metatarsiano, Freiberg; cóndilo humeral, Panner; escafoides carpiano, Preiser; cuerpo vertebral, Scheuermann; calcáneo, Sever; y rodilla, Koenig.","w":["Freiberg afecta el segundo metatarsiano.","Correcta: Kienböck es la del semilunar.","Preiser afecta el escafoides carpiano.","Köhler afecta el escafoides tarsiano."]},{"s":"ORT","c":19,"t":"Epónimo del segundo metatarsiano","q":"¿Qué epónimo corresponde a la osteonecrosis del segundo metatarsiano?","o":["Enfermedad de Sever","Enfermedad de la Panner","Enfermedad de Freiberg","Enfermedad de Köhler"],"a":2,"e":"El segundo metatarsiano corresponde a la enfermedad de Freiberg, el escafoides tarsiano a Köhler, el calcáneo a Sever, el cóndilo humeral a Panner, el semilunar a Kienböck, el escafoides carpiano a Preiser, el cuerpo vertebral a Scheuermann y la rodilla a Koenig. La cabeza femoral corresponde a Legg-Calvé-Perthes.","w":["Sever afecta el calcáneo.","Panner afecta el cóndilo humeral.","Correcta: Freiberg es la del segundo metatarsiano.","Köhler afecta el escafoides tarsiano."]},{"s":"ORT","c":19,"t":"Enfermedad de Perthes","q":"Niño de 7 años con dolor en cadera irradiado a rodilla, limitación de la abducción y cojera. ¿Cuál es la imagen de elección?","o":["La tomografía computarizada","La ecografía de cadera","La radiografía simple de pelvis","La gammagrafía ósea"],"a":3,"e":"La enfermedad de Legg-Calvé-Perthes es la osteocondrosis de la cabeza del fémur y la más frecuente de todas. Afecta a niños de 3 a 12 años, se asocia a obesidad, inmadurez esquelética, nivel socioeconómico bajo e hiperactividad, y cursa con dolor en cadera irradiado a rodilla y limitación de la abducción y la rotación interna. La imagen de elección es la gammagrafía, que muestra la disminución de perfusión.","w":["La tomografía no valora la perfusión.","La ecografía detecta derrame, no perfusión.","La radiografía se usa, pero la elección descrita es la gammagrafía.","Correcta: la gammagrafía muestra la caída de perfusión cefálica."]},{"s":"ORT","c":19,"t":"Clasificación de Herring","q":"En la clasificación de Herring, ¿qué significa el grupo C?","o":["Colapso mayor del 50% del pilar lateral","Colapso menor del 50% del pilar lateral","Colapso exclusivo del pilar medial","Ausencia de colapso del pilar lateral"],"a":0,"e":"La clasificación de Herring, o sistema del pilar lateral, se aplica a la enfermedad de Perthes: A significa que no hay colapso, B colapso menor del 50% y C colapso mayor del 50%. El tratamiento es reposo y tracción del fémur, y la secuela más frecuente es la coxa magna, es decir la artrosis entre cabeza femoral y acetábulo.","w":["Correcta: el grupo C implica colapso superior al 50%.","El colapso menor del 50% es el grupo B.","La clasificación se refiere al pilar lateral.","La ausencia de colapso es el grupo A."]},{"s":"ORT","c":19,"t":"Secuela del Perthes","q":"¿Cuál es la secuela más frecuente de la enfermedad de Perthes?","o":["La epifisiolisis femoral","La coxa magna","La escoliosis estructural","La necrosis del astrágalo"],"a":1,"e":"La secuela más frecuente de la enfermedad de Perthes es la coxa magna, es decir la artrosis entre la cabeza femoral y el acetábulo, que puede terminar requiriendo prótesis. El tratamiento de la fase activa es reposo y tracción del fémur, y la clasificación de Herring evalúa el colapso del pilar lateral.","w":["La epifisiolisis es una entidad distinta, no una secuela.","Correcta: la coxa magna con artrosis secundaria es la secuela típica.","La escoliosis no es secuela de esta enfermedad.","El astrágalo no se afecta en el Perthes."]},{"s":"ORT","c":19,"t":"Epifisiolisis femoral","q":"¿Qué línea se traza para diagnosticar la epifisiolisis femoral?","o":["La línea de Schwalbe","La línea de Tuffier","La línea de Klein-Trethowan","La línea de plomada de C7 al sacro"],"a":2,"e":"La epifisiolisis femoral es el desgarro de la cabeza del fémur en niños de 3 a 12 años, con obesidad, desmineralización ósea y asimetrías de extremidades como factores de riesgo. El diagnóstico radiográfico se hace trazando la línea de Klein-Trethowan, prolongación de la cortical superolateral del cuello, y comparando el segmento cefálico interceptado. El tratamiento es quirúrgico con epifisiodesis.","w":["La línea de Schwalbe es una estructura del ángulo camerular.","La línea de Tuffier es referencia de punción lumbar.","Correcta: la línea de Klein-Trethowan es la referencia diagnóstica.","La plomada se usa en la evaluación de la escoliosis."]},{"s":"ORT","c":19,"t":"Tratamiento de la epifisiolisis","q":"¿Cuál es el tratamiento de la epifisiolisis femoral?","o":["Descompresión del core femoral","Reposo con tracción del fémur","Corsé de tres puntos hasta la madurez","Quirúrgico, mediante epifisiodesis"],"a":3,"e":"El tratamiento de la epifisiolisis femoral es quirúrgico con epifisiodesis. Se clasifica en crónica cuando supera las 3 semanas y aguda, y en estable e inestable; es bilateral en el 50% de los casos. El reposo con tracción, en cambio, es el tratamiento de la enfermedad de Perthes.","w":["La descompresión del core es cirugía preservadora en osteonecrosis.","El reposo con tracción corresponde al Perthes.","El corsé es tratamiento de la escoliosis.","Correcta: la epifisiodesis estabiliza la fisis quirúrgicamente."]},{"s":"ORT","c":19,"t":"Bilateralidad de la epifisiolisis","q":"¿En qué porcentaje es bilateral la epifisiolisis femoral?","o":["En el 50%","En el 10%","En el 90%","En el 25%"],"a":0,"e":"La epifisiolisis femoral es bilateral en el 50% de los casos, se clasifica en crónica cuando supera las 3 semanas y aguda, y en estable e inestable. El diagnóstico se hace con la línea de Klein-Trethowan y el tratamiento es quirúrgico con epifisiodesis.","w":["Correcta: la mitad de los casos son bilaterales.","Subestima la bilateralidad descrita.","Sobreestima la bilateralidad descrita.","No es el porcentaje descrito."]},{"s":"ORT","c":19,"t":"Órgano diana de las artropatías","q":"Relacione el órgano diana de la artropatía degenerativa con el de la inflamatoria:","o":["Degenerativa cartílago articular; inflamatoria hueso subcondral","Degenerativa cartílago articular; inflamatoria membrana sinovial","Degenerativa membrana sinovial; inflamatoria cartílago articular","Degenerativa cápsula fibrosa; inflamatoria membrana sinovial"],"a":1,"e":"Las artropatías se clasifican según su órgano diana: la degenerativa ataca el cartílago articular, con la artrosis como ejemplo; la inflamatoria ataca la membrana sinovial e incluye artritis reumatoide, espondiloartritis y microcristalinas; y la neuropática es degenerativa y progresiva por déficit neurológico, con la artropatía de Charcot como ejemplo.","w":["La diana inflamatoria es la sinovial, no el hueso subcondral.","Correcta: cartílago en la degenerativa y sinovial en la inflamatoria.","Invierte ambos órganos diana.","La diana degenerativa es el cartílago, no la cápsula."]},{"s":"ORT","c":19,"t":"Clínica de la artrosis","q":"¿Cuánto dura la rigidez matutina en la artrosis?","o":["Más de la 60 minutos","Más de 2 horas","Menos de 30 minutos","Todo el día"],"a":2,"e":"La artrosis es una enfermedad degenerativa con erosión del cartílago, osteofitos y esclerosis subcondral. Su dolor es mecánico, empeora con la actividad, y la rigidez matutina dura menos de 30 minutos, a diferencia del patrón inflamatorio. Se acompaña de crepitación y en la rodilla hay que sospechar quiste de Baker ante tumefacción poplítea.","w":["La rigidez prolongada apunta a artropatía inflamatoria.","Más de 2 horas es claramente inflamatorio.","Correcta: la rigidez artrósica es breve, menos de 30 minutos.","La rigidez continua no es propia de la artrosis."]},{"s":"ORT","c":19,"t":"Quiste de Baker","q":"Paciente con artrosis de rodilla y tumefacción poplítea. ¿Qué hay que sospechar?","o":["Bursitis prerrotuliana","Trombosis venosa profunda exclusiva","Aneurisma de la arteria poplítea","Quiste de Baker"],"a":3,"e":"En la artrosis de rodilla, que es frecuentemente bilateral, hay que sospechar quiste de Baker ante dolor o tumefacción poplítea. En la cadera la artrosis da dolor inguinal con limitación de la rotación interna. El dolor artrósico es mecánico, empeora con la actividad y la rigidez matutina dura menos de 30 minutos.","w":["La bursitis prerrotuliana es anterior, no poplítea.","La trombosis entra en el diferencial, pero el contexto orienta al quiste.","El aneurisma poplíteo es mucho menos frecuente.","Correcta: el quiste de Baker es la sospecha en tumefacción poplítea."]},{"s":"ORT","c":19,"t":"Nódulos de la artrosis","q":"Relacione los nódulos de Heberden con los de Bouchard:","o":["Heberden en interfalángicas distales; Bouchard en proximales","Heberden en distales; Bouchard en metacarpofalángicas de la mano","Heberden en trapeciometacarpiana; Bouchard en interfalángicas proximales","Heberden en interfalángicas proximales; Bouchard en distales de la mano"],"a":0,"e":"En la artrosis de la mano los nódulos de Heberden asientan en las interfalángicas distales y los de Bouchard en las proximales; la afectación de la trapeciometacarpiana se llama rizartrosis. Ese patrón contrasta con la artritis reumatoide, poliartritis simétrica de pequeñas articulaciones con cuello de cisne, boutonnière y desviación cubital.","w":["Correcta: Heberden distales y Bouchard proximales.","Bouchard corresponde a las interfalángicas proximales.","La trapeciometacarpiana es la rizartrosis.","Invierte ambos nódulos."]},{"s":"ORT","c":19,"t":"Rizartrosis","q":"¿Cómo se llama la artrosis de la articulación trapeciometacarpiana?","o":["Nódulo de Bouchard","Rizartrosis","Nódulo de Heberden","Dactilitis"],"a":1,"e":"La afectación artrósica de la trapeciometacarpiana se llama rizartrosis. Los nódulos de Heberden asientan en las interfalángicas distales y los de Bouchard en las proximales. La dactilitis o dedo en salchicha, en cambio, es una pista fuerte de artritis psoriásica.","w":["Bouchard son nódulos de las interfalángicas proximales.","Correcta: rizartrosis es la artrosis trapeciometacarpiana.","Heberden son nódulos de las interfalángicas distales.","La dactilitis orienta a artritis psoriásica."]},{"s":"ORT","c":19,"t":"Artritis psoriásica","q":"¿Cuál es la pista clínica más fuerte de artritis psoriásica?","o":["La columna en caña de bambú","Los nódulos subcutáneos extensores","La dactilitis en dedo de salchicha","Los nódulos de Bouchard"],"a":2,"e":"La artritis psoriásica es inflamatoria, se asocia a psoriasis, tiene factor reumatoide típicamente negativo y pertenece al espectro de las espondiloartritis. Sus pistas más fuertes son la dactilitis o dedo en salchicha, la entesitis y la afectación ungueal, y para clasificarla se usan los criterios CASPAR.","w":["La caña de bambú es imagen tardía de espondilitis anquilosante.","Los nódulos subcutáneos se asocian a artritis reumatoide.","Correcta: la dactilitis es la pista clínica más fuerte.","Bouchard es un nódulo artrósico."]},{"s":"ORT","c":19,"t":"Criterios CASPAR","q":"¿Para qué enfermedad se usan los criterios CASPAR?","o":["Artritis séptica de cadera","Artritis reumatoide","Espondilitis anquilosante","Artritis psoriásica"],"a":3,"e":"Para clasificar la artritis psoriásica se usan los criterios CASPAR. Sus patrones clínicos son oligoartritis, poliartritis, axial, de interfalángicas distales y mutilante, y el tratamiento busca remisión con antiinflamatorios, luego fármacos modificadores como metotrexato, leflunomida o sulfasalazina, y biológicos anti-TNF si es refractaria.","w":["Los criterios de Kocher son los de la artritis séptica de cadera.","La artritis reumatoide usa otros criterios de clasificación.","La espondilitis se apoya en HLA-B27 y sacroileítis radiográfica.","Correcta: CASPAR clasifica la artritis psoriásica."]},{"s":"ORT","c":19,"t":"Espondilitis anquilosante","q":"¿Cuál es la imagen radiográfica tardía de la espondilitis anquilosante?","o":["La columna en caña de bambú","La condrocalcinosis articular","La osteopenia yuxtaarticular","Las lesiones en sacabocados"],"a":0,"e":"La espondilitis anquilosante cursa con dolor lumbar inflamatorio crónico y rigidez matutina que mejora con la actividad, con sacroileítis radiográfica frecuente y HLA-B27 positivo. Su imagen típica son los sindesmofitos y, en fase tardía, la columna en caña de bambú. El tratamiento son antiinflamatorios de primera línea y anti-TNF si falla.","w":["Correcta: la caña de bambú es la imagen tardía característica.","La condrocalcinosis es de la pseudogota.","La osteopenia yuxtaarticular es de la artritis reumatoide.","Los sacabocados corresponden al mieloma múltiple."]},{"s":"ORT","c":19,"t":"Patrón inflamatorio","q":"¿Qué caracteriza al dolor lumbar inflamatorio de la espondilitis anquilosante?","o":["Se acompaña de crepitación articular","Mejora con la actividad y responde a antiinflamatorios","Empeora con la actividad y cede en reposo","Cursa con rigidez matutina menor de 30 minutos"],"a":1,"e":"La espondilitis anquilosante cursa con dolor lumbar inflamatorio crónico y rigidez matutina que mejora con la actividad y responde a antiinflamatorios. Ese patrón contrasta con el de la artrosis, cuyo dolor es mecánico, empeora con la actividad y cuya rigidez matutina dura menos de 30 minutos, con crepitación acompañante.","w":["La crepitación es un dato artrósico.","Correcta: mejora con el movimiento, al contrario que la artrosis.","Empeorar con la actividad es el patrón mecánico artrósico.","La rigidez breve es propia de la artrosis."]},{"s":"ORT","c":19,"t":"Deformidades de la artritis reumatoide","q":"Relacione la deformidad en cuello de cisne con la deformidad en ojal:","o":["Cuello de cisne extensión de la distal; ojal desviación cubital del carpo","Cuello de cisne desviación cubital; ojal flexión de la interfalángica proximal","Cuello de cisne extensión de la distal; ojal flexión de la proximal","Cuello de cisne flexión de la proximal; ojal extensión de la distal"],"a":2,"e":"La artritis reumatoide es una poliartritis simétrica de pequeñas articulaciones de mano y pie. Sus deformidades tardías son el cuello de cisne, en extensión de la interfalángica distal; el ojal o boutonnière, en flexión de la interfalángica proximal; y la desviación cubital. El factor reumatoide es positivo en gran parte de los casos y el anti-CCP es útil de forma temprana.","w":["La desviación cubital es una tercera deformidad aparte.","El cuello de cisne no es la desviación cubital.","Correcta: extensión distal en cuello de cisne y flexión proximal en ojal.","Invierte ambas deformidades."]},{"s":"ORT","c":19,"t":"Radiografía en la artritis reumatoide","q":"¿Qué hallazgos radiográficos muestra la artritis reumatoide?","o":["Osteofitos y esclerosis subcondral","Lesiones líticas en sacabocados","Condrocalcinosis del cartílago","Osteopenia yuxtaarticular, pinzamiento y erosiones"],"a":3,"e":"La radiografía en la artritis reumatoide muestra osteopenia yuxtaarticular, disminución del espacio articular y erosiones. El factor reumatoide es positivo en gran parte de los casos, el anti-CCP es útil de forma temprana y la sedimentación y la proteína C reactiva suelen elevarse. Los osteofitos con esclerosis subcondral, en cambio, son de la artrosis.","w":["Los osteofitos y la esclerosis son artrósicos.","Los sacabocados son del mieloma múltiple.","La condrocalcinosis es de la pseudogota.","Correcta: osteopenia, pinzamiento y erosiones definen su patrón."]},{"s":"ORT","c":19,"t":"Tratamiento de la artritis reumatoide","q":"¿Cuál es el fármaco modificador de elección en la artritis reumatoide?","o":["El metotrexato","La colchicina","El alopurinol","La cefazolina"],"a":0,"e":"En la artritis reumatoide se controla el brote con antiinflamatorios o corticoide, pero la clave es iniciar de forma precoz un fármaco modificador de la enfermedad, siendo el metotrexato el de elección, y añadir biológicos si hay progresión. La enfermedad acorta la esperanza de vida entre 5 y 7 años por riesgo cardiovascular.","w":["Correcta: el metotrexato es el modificador de elección.","La colchicina se usa en gota y pseudogota.","El alopurinol es hipouricemiante para la gota.","La cefazolina es profilaxis antibiótica quirúrgica."]},{"s":"ORT","c":19,"t":"Impacto vital de la artritis reumatoide","q":"¿Cuánto acorta la esperanza de vida la artritis reumatoide?","o":["Menos de 1 año","De 5 a 7 años","No la acorta","De 15 a 20 años"],"a":1,"e":"La artritis reumatoide acorta la esperanza de vida entre 5 y 7 años por riesgo cardiovascular, lo que justifica tratarla temprano y de forma agresiva con un fármaco modificador precoz, siendo el metotrexato el de elección, y biológicos si hay progresión.","w":["Subestima el impacto descrito.","Correcta: de 5 a 7 años es el acortamiento descrito.","Sí acorta la esperanza de vida de forma significativa.","Sobreestima el impacto descrito."]},{"s":"ORT","c":19,"t":"Diagnóstico de la gota","q":"¿Cuál es el diagnóstico definitivo de la gota?","o":["Respuesta favorable a la colchicina","Condrocalcinosis en la radiografía","Identificación de cristales en líquido sinovial o tejido","Uricemia elevada durante la crisis aguda"],"a":2,"e":"En la gota, por urato monosódico, el diagnóstico definitivo es la identificación de cristales en líquido sinovial o tejido; la uricemia puede ser normal durante la crisis aguda, por lo que no sirve para descartarla. La crisis típica afecta la primera metatarsofalángica, la podagra, y la meta a largo plazo es urato por debajo de 6 mg por decilitro.","w":["La respuesta al tratamiento no es criterio diagnóstico.","La condrocalcinosis es hallazgo de la pseudogota.","Correcta: los cristales confirman el diagnóstico.","La uricemia puede ser normal en plena crisis."]},{"s":"ORT","c":19,"t":"Podagra","q":"¿Qué articulación afecta la crisis típica de gota?","o":["La interfalángica distal del índice","La rodilla de forma aislada","La articulación sacroilíaca","La primera metatarsofalángica"],"a":3,"e":"La crisis típica de gota afecta la primera metatarsofalángica, cuadro conocido como podagra. Se trata con antiinflamatorios, colchicina o corticoide, se hace profilaxis con colchicina al iniciar el hipouricemiante y a largo plazo se usa alopurinol o febuxostat con meta de urato por debajo de 6 mg por decilitro.","w":["Las interfalángicas distales corresponden a nódulos de Heberden.","La rodilla puede afectarse, pero la crisis típica es podagra.","La sacroilíaca se afecta en la espondilitis anquilosante.","Correcta: la podagra afecta la primera metatarsofalángica."]},{"s":"ORT","c":19,"t":"Meta terapéutica en la gota","q":"¿Cuál es la meta de urato sérico en el tratamiento a largo plazo de la gota?","o":["Por debajo de 6 mg por decilitro","Por debajo de 3 mg por decilitro","Por debajo de 10 mg por decilitro","Por debajo de 8 mg por decilitro"],"a":0,"e":"En la gota se trata la crisis con antiinflamatorios, colchicina o corticoide, se hace profilaxis con colchicina al iniciar el hipouricemiante y a largo plazo se usa alopurinol o febuxostat con meta de urato por debajo de 6 mg por decilitro. El diagnóstico definitivo es la identificación de cristales.","w":["Correcta: la meta descrita es menos de 6 mg por decilitro.","No es la meta descrita en el temario.","Diez mg por decilitro está por encima de la meta.","Ocho mg por decilitro queda por encima de la meta."]},{"s":"ORT","c":19,"t":"Pseudogota","q":"¿Qué cristal produce la pseudogota y cuál es su hallazgo radiográfico?","o":["Pirofosfato cálcico; lesiones en sacabocados","Pirofosfato cálcico; condrocalcinosis","Oxalato de calcio; osteopenia yuxtaarticular","Urato monosódico; condrocalcinosis articular"],"a":1,"e":"La pseudogota se debe a cristales de pirofosfato cálcico y su hallazgo radiográfico es la condrocalcinosis; puede simular artrosis o artritis reumatoide, lo que la vuelve un diferencial frecuente. Se trata con antiinflamatorios, colchicina o corticoide y la forma crónica no tiene terapia específica.","w":["Los sacabocados son del mieloma múltiple.","Correcta: pirofosfato cálcico con condrocalcinosis.","El oxalato no es el cristal descrito.","El urato monosódico es el cristal de la gota."]},{"s":"ORT","c":19,"t":"Artropatía de Charcot","q":"¿Cuál es la causa más frecuente de artropatía de Charcot y su mecanismo?","o":["Diabetes; isquemia arterial crónica sin neuropatía","Artritis reumatoide; neuropatía con trauma repetitivo","Diabetes; neuropatía con trauma repetitivo e hiperflujo","Diabetes; depósito de cristales de urato"],"a":2,"e":"La artropatía neuropática de Charcot tiene como causa más frecuente la diabetes mellitus y su mecanismo combina neuropatía, es decir falta de sensibilidad, trauma repetitivo e hiperflujo vascular. En fase aguda el pie está caliente, edematoso y eritematoso; en fase crónica hay deformidad severa, luxaciones y fragmentación ósea.","w":["El componente neuropático es esencial en el Charcot.","La artritis reumatoide es inflamatoria, no neuropática.","Correcta: diabetes con neuropatía, trauma repetido e hiperflujo.","El depósito de urato corresponde a la gota."]},{"s":"ORT","c":19,"t":"Tratamiento del pie de Charcot","q":"¿Cuál es el tratamiento del pie de Charcot en fase aguda?","o":["Amputación precoz del antepié","Artrodesis inmediata del tarso","Antibiótico intravenoso de 4 a 6 semanas","Descarga e inmovilización estricta"],"a":3,"e":"El tratamiento de la artropatía de Charcot en fase aguda es descarga e inmovilización estricta; la cirugía queda para casos seleccionados y la amputación como desenlace final en casos extremos. En fase aguda el pie está caliente, edematoso y eritematoso, lo que la hace confundible con infección, pero sin fiebre ni leucocitosis.","w":["La amputación es el desenlace en casos extremos.","La artrodesis no es el manejo inicial.","El antibiótico prolongado corresponde a la osteomielitis.","Correcta: descarga e inmovilización estricta en la fase aguda."]},{"s":"ORT","c":19,"t":"Líquido sinovial en artropatías","q":"Relacione el líquido sinovial de la artrosis con el de la artritis reumatoide:","o":["Artrosis normal o levemente inflamatorio; reumatoide exudado inflamatorio","Artrosis exudado inflamatorio; reumatoide normal o levemente inflamatorio","Artrosis hemático con grasa; reumatoide exudado inflamatorio marcado","Artrosis normal; reumatoide purulento con más del 75% de neutrófilos"],"a":0,"e":"En la artrosis el líquido sinovial es normal o levemente inflamatorio, mientras que en la artritis reumatoide es un exudado inflamatorio. El líquido purulento con más del 75% de neutrófilos corresponde a la artritis séptica y el hemático con gotas de grasa a la fractura intraarticular.","w":["Correcta: casi normal en la artrosis y exudado en la reumatoide.","Invierte ambos patrones.","El hemático con grasa indica fractura intraarticular.","El líquido purulento corresponde a la artritis séptica."]},{"s":"ORT","c":19,"t":"Marcadores serológicos","q":"¿Qué marcador se asocia a la espondilitis anquilosante?","o":["Fosfatasa alcalina","HLA-B27","Urato sérico","Anti-CCP"],"a":1,"e":"Los marcadores para llevar a casa son HLA-B27 para la espondilitis anquilosante, anti-CCP para la artritis reumatoide y urato para la gota. El anti-CCP es especialmente útil de forma temprana en la artritis reumatoide, junto con el factor reumatoide. La fosfatasa alcalina se eleva en tumores formadores de hueso.","w":["La fosfatasa alcalina se eleva en el osteosarcoma.","Correcta: HLA-B27 se asocia a la espondilitis anquilosante.","El urato corresponde a la gota.","El anti-CCP corresponde a la artritis reumatoide."]},{"s":"ORT","c":19,"t":"PAI-1","q":"¿Qué se busca con el PAI-1 en el estudio de la osteonecrosis?","o":["Un indicador de función renal","Un marcador de inflamación sinovial","Un factor protrombótico","Un marcador de remodelado óseo"],"a":2,"e":"En la osteonecrosis siempre hay que evaluar uso de esteroides o anabólicos, factores de coagulación buscando el PAI-1 como marcador protrombótico, y patologías autoinmunes. Además hay que anticipar la bilateralidad, ya que el 75% de los casos pueden volverse bilaterales en 2 años.","w":["La función renal no se evalúa con PAI-1.","La inflamación sinovial se valora por líquido articular.","Correcta: el PAI-1 se busca como factor protrombótico.","El remodelado se valora con fosfatasas y marcadores óseos."]},{"s":"ORT","c":20,"t":"Caso: niño con fiebre y dolor óseo","q":"Niño de 7 años con fiebre, dolor en tibia proximal y radiografía normal tras infección respiratoria. ¿Cuál es el diagnóstico?","o":["Artritis séptica de rodilla","Sarcoma de Ewing diafisario","Sinovitis transitoria de rodilla","Osteomielitis hematógena aguda"],"a":3,"e":"El niño con dolor óseo, fiebre y antecedente de infección respiratoria orienta a osteomielitis hematógena aguda, que asienta en la metáfisis de huesos largos. La radiografía es normal porque los hallazgos son tardíos, después de las 3 semanas; el estudio más sensible es la resonancia y el cultivo óseo el gold standard.","w":["La artritis séptica compromete la articulación y es emergencia quirúrgica.","El Ewing no cursa con este antecedente infeccioso.","La sinovitis transitoria es autolimitada y sin fiebre alta.","Correcta: cuadro hematógeno agudo con radiografía aún negativa."]},{"s":"ORT","c":20,"t":"Caso: cadera dolorosa del niño","q":"Niño de 6 años con fiebre de 39 grados, 15.000 leucocitos, sedimentación de 60 y sin poder apoyar el pie. ¿Cuál es la conducta?","o":["Artrocentesis y quirófano de inmediato","Antibiótico oral y control ambulatorio","Observación con antiinflamatorios","Resonancia antes de cualquier medida"],"a":0,"e":"El caso reúne los cuatro criterios de Kocher: leucocitos por encima de 12.000, incapacidad para soportar peso, fiebre mayor de 38,5 grados y sedimentación mayor de 40 mm por hora, lo que da probabilidad cercana al 100% de artritis séptica de cadera. La artrocentesis es el gold standard y, confirmada, hay que llevar al paciente a quirófano.","w":["Correcta: cuatro criterios de Kocher exigen artrocentesis y drenaje.","El antibiótico oral no drena la articulación.","La observación permite la destrucción articular.","La resonancia retrasa un drenaje que es urgente."]},{"s":"ORT","c":20,"t":"Caso: adolescente con masa ósea","q":"Adolescente de 15 años con masa dolorosa en fémur distal, imagen en sunburst y fosfatasa alcalina elevada. ¿A qué órgano metastatiza este tumor?","o":["Al riñón","Al pulmón","Al hígado","Al cerebro"],"a":1,"e":"La combinación de adolescente, masa ósea alrededor de la rodilla, reacción perióstica en sunburst y fosfatasa alcalina elevada define al osteosarcoma, el maligno primario más frecuente del hueso. Casi siempre metastatiza a pulmón, eleva también la LDH y se trata con resección de márgenes amplios más quimioterapia.","w":["El riñón tampoco es el destino habitual.","Correcta: la diseminación del osteosarcoma es pulmonar.","La diseminación hepática no es la característica.","El cerebro no es el destino habitual."]},{"s":"ORT","c":20,"t":"Caso: adulto mayor con lesiones líticas","q":"Hombre de 62 años con dolor óseo, lesiones líticas múltiples, hipercalcemia y anemia. ¿Cuál es el estudio confirmatorio?","o":["Gammagrafía ósea con trazador","Biopsia de médula ósea aislada","Electroforesis de proteínas séricas","Fosfatasa alcalina y LDH"],"a":2,"e":"Hipercalcemia, insuficiencia renal, anemia y lesiones óseas configuran el acrónimo CRAB del mieloma múltiple, más frecuente entre los 40 y 50 años. Las lesiones son líticas en sacabocados en vértebras y costillas, la proteína de Bence-Jones es positiva y el diagnóstico se hace con electroforesis de proteínas séricas.","w":["La gammagrafía detecta lesiones sin confirmar el diagnóstico.","La médula aporta datos, pero el estudio descrito es la electroforesis.","Correcta: la electroforesis demuestra la gammapatía monoclonal.","Esos marcadores se elevan en el osteosarcoma."]},{"s":"ORT","c":20,"t":"Caso: corticoterapia y dolor de cadera","q":"Paciente con lupus en corticoterapia crónica, dolor inguinal progresivo y radiografía normal. ¿Qué estudio corresponde?","o":["Tomografía de cadera","Gammagrafía ósea","Radiografía comparativa en dos proyecciones","Resonancia magnética"],"a":3,"e":"La corticoterapia crónica por encima de 20 mg al día en enfermedad autoinmune es un escenario clásico de osteonecrosis de cabeza femoral. La radiografía normal no descarta nada porque el diagnóstico radiográfico es tardío: hay que pedir resonancia, gold standard, que muestra T1 hipointenso con signo de doble línea, y anticipar la bilateralidad.","w":["La tomografía no es el gold standard en esta entidad.","La gammagrafía queda en segundo plano frente a la resonancia.","La radiografía ya resultó normal y llega tarde.","Correcta: la resonancia detecta la fase temprana que la placa no ve."]},{"s":"ORT","c":20,"t":"Caso: anciana con caída","q":"Mujer de 80 años tras caída, con miembro acortado, en aducción y rotación externa, Garden IV. ¿Qué corresponde?","o":["Hemiartroplastia","Artroplastia total","Tracción y reposo prolongado","Osteosíntesis con tornillos"],"a":0,"e":"La fractura de cuello femoral en la anciana con osteoporosis se presenta con acortamiento, aducción y rotación externa. En un Garden IV la decisión depende del paciente: baja demanda y esperanza de vida menor de 3 años, hemiartroplastia; paciente activo con esperanza mayor de 3 años, artroplastia total. La osteosíntesis se reserva a Garden I y II.","w":["Correcta: baja demanda funcional indica hemiartroplastia.","La artroplastia total es para el paciente activo.","La tracción prolongada no es tratamiento definitivo.","La osteosíntesis se reserva a las no desplazadas."]},{"s":"ORT","c":20,"t":"Caso: tobillo tras inversión","q":"Deportista con inversión forzada del tobillo, laxitud moderada y radiografía sin fractura. ¿Cómo se inmoviliza?","o":["Con bota de la yeso a las 24 horas","Con férula, no con yeso circular","Con yeso circular inmediato","Con vendaje elástico simple"],"a":1,"e":"El esguince lateral por inversión y supinación es el más común y el ligamento más lesionado es el peroneo astragalino anterior. Una laxitud moderada con radiografía sin fractura corresponde a un grado II, que se inmoviliza con férula elevando el miembro; no se usa yeso circular en las primeras 48 horas por riesgo de síndrome compartimental.","w":["El yeso se deja a partir del tercer día.","Correcta: férula, porque el edema aún está aumentando.","El yeso circular precoz puede desencadenar compartimental.","El vendaje elástico corresponde al grado I."]},{"s":"ORT","c":20,"t":"Caso: codo del niño tras tracción","q":"Niño de 2 años que tras un tirón del brazo mantiene el codo en semiflexión y pronación, con radiografía normal. ¿Cuál es el diagnóstico?","o":["Luxación posterior de codo","Fractura de epitróclea","Subluxación de la cabeza del radio","Fractura supracondílea"],"a":2,"e":"La subluxación de la cabeza del radio, codo de niñera o pronación dolorosa, aparece en niños de 1 a 4 años tras tracción severa del miembro con el codo en extensión y pronación: la cabeza radial sale de su ligamento anular. Cursa con dolor, impotencia y codo en semiflexión y pronación, sin deformidad y con radiografía normal.","w":["La luxación posterior de codo deforma y se ve en la radiografía.","La fractura de epitróclea también sería visible.","Correcta: cuadro clínico con radiografía normal, sin deformidad.","La supracondílea sería visible y comprometería la arteria braquial."]},{"s":"ORT","c":20,"t":"Caso: fractura de tibia con dolor creciente","q":"Paciente con fractura de tibia enyesada, dolor desproporcionado y dolor al estiramiento pasivo. ¿En qué plazo debe hacerse la fasciotomía?","o":["Solo si aparece ausencia de pulso","Tras 12 horas de observación","Dentro de las primeras 24 horas","Dentro de las primeras 4 horas"],"a":3,"e":"El dolor desproporcionado y el dolor al estiramiento pasivo son los signos precoces del síndrome compartimental, cuya localización más frecuente es la pierna, en el compartimento anterior. El diagnóstico es clínico y la fasciotomía debe hacerse idealmente dentro de las primeras 4 horas; pasadas las 6 aumentan la necrosis y la amputación.","w":["La ausencia de pulso es un signo tardío.","Observar 12 horas permite la necrosis muscular.","Veinticuatro horas supera con mucho la ventana útil.","Correcta: la ventana ideal son las primeras 4 horas."]},{"s":"ORT","c":20,"t":"Caso: fractura espiroidea de húmero","q":"Paciente con fractura espiroidea de diáfisis humeral que no puede extender la mano ni los dedos. ¿Cómo se llama esta fractura?","o":["Fractura de Holstein-Lewis","Fractura de Colles","Fractura de Monteggia","Fractura de Bennett"],"a":0,"e":"La complicación más común de la fractura de diáfisis humeral es la lesión del nervio radial, que limita la extensión de la mano y los dedos; las fracturas espiroideas y oblicuas de la diáfisis humeral con lesión radial se conocen como fractura de Holstein-Lewis. El manejo no complicado es yeso colgante de Caldwell con 3 a 4 kg.","w":["Correcta: espiroidea humeral con lesión radial es Holstein-Lewis.","Colles es una fractura distal de radio.","Monteggia es cúbito proximal con luxación radial.","Bennett afecta la base del primer metacarpiano."]},{"s":"ORT","c":20,"t":"Caso: caída sobre la mano","q":"Joven con caída sobre la mano en dorsiflexión, dolor en la tabaquera anatómica y radiografía sin fractura. ¿Cuál es la conducta?","o":["Solicitar gammagrafía de inmediato","Inmovilizar y repetir la radiografía a las 2 semanas","Alta con analgesia y control por consulta","Osteosíntesis con tornillo de Herbert"],"a":1,"e":"El escafoides es el hueso del carpo que más se fractura, por caída en dorsiflexión, y duele en la tabaquera anatómica. La radiografía es poco sensible los primeros días, así que ante clínica sugerente hay que inmovilizar con férula en guante incluyendo el pulgar y repetir el estudio a las 2 semanas; la tomografía sirve para diagnóstico precoz.","w":["La tomografía, no la gammagrafía, es la que aporta diagnóstico precoz.","Correcta: inmovilizar pese a la placa negativa y reevaluar.","Dar de alta sin inmovilizar expone a pseudoartrosis y necrosis.","El tornillo se indica en fracturas desplazadas."]},{"s":"ORT","c":20,"t":"Caso: rodilla con bloqueo","q":"Deportista con dolor en interlínea posterior, derrame seroso y bloqueo articular. ¿Qué maniobra explora la estructura lesionada?","o":["Bostezo en valgo forzado","Lachman con la rodilla semiflexionada","McMurray con rotación externa del talón","Cajón posterior con rodilla en el flexión"],"a":2,"e":"El bloqueo articular recurrente con derrame seroso y dolor en la interlínea posterior es el cuadro de la lesión meniscal, con el cuerno posterior del menisco interno como el más afectado y el asa de cubo como lesión más frecuente. La rotación externa del talón explora el menisco interno, junto con la prueba de McMurray.","w":["El bostezo evalúa los ligamentos colaterales.","Lachman explora el ligamento cruzado anterior.","Correcta: McMurray con rotación externa explora el menisco interno.","El cajón posterior explora el cruzado posterior."]},{"s":"ORT","c":20,"t":"Caso: rodilla luxada","q":"Paciente con luxación de rodilla reducida en urgencias. ¿Qué hay que vigilar y en qué plazo?","o":["La circulación distal, a partir de la segunda semana","La consolidación radiográfica, a los 3 meses","La movilidad activa, al mes de la reducción","La circulación distal, en las primeras 24 horas"],"a":3,"e":"La luxación de rodilla se asocia a lesión del paquete vasculonervioso ciático poplíteo y puede producir trombosis arterial aguda dentro de las primeras 24 horas, por lo que exige reducción inmediata, inmovilización y vigilancia estrecha de la circulación distal. Se acompaña del signo del hoyuelo.","w":["Esperar dos semanas significa perder el miembro.","No hay fractura que consolidar en una luxación pura.","La movilidad se evalúa después, no es la prioridad.","Correcta: la vigilancia vascular es en las primeras 24 horas."]},{"s":"ORT","c":20,"t":"Caso: adolescente con escoliosis","q":"Adolescente con Cobb de 32 grados y Risser 1 al que se indica corsé. ¿Qué se considera éxito del tratamiento?","o":["Mantener el ángulo sin progresión hasta la madurez","Acelerar el cierre de la fisis ilíaca","Eliminar por completo la giba costal","Reducir el ángulo por debajo de 10 grados"],"a":0,"e":"Una curva de 32 grados con Risser 1 entra en el rango de 20 a 40 o 50 grados que se trata con corsé. Su objetivo es frenar la evolución de la curva, no corregirla: el éxito es mantener el ángulo sin progresión hasta que se complete la maduración esquelética. Actúa por fuerzas en tres puntos y se apoya en las leyes del crecimiento óseo.","w":["Correcta: frenar la progresión es el criterio de éxito.","El corsé no acelera la maduración esquelética.","La giba depende de la rotación y no desaparece con corsé.","El corsé no endereza la columna de forma permanente."]},{"s":"ORT","c":20,"t":"Caso: diabético con pie deformado","q":"Diabético con pie caliente, edematoso y eritematoso, sin fiebre ni leucocitosis, con fragmentación ósea. ¿Cuál es el diagnóstico?","o":["Artritis séptica del tobillo","Artropatía de Charcot","Osteomielitis por contigüidad","Gota con tofos periarticulares"],"a":1,"e":"La artropatía neuropática de Charcot tiene a la diabetes como causa más frecuente y combina neuropatía, trauma repetitivo e hiperflujo vascular. En fase aguda el pie está caliente, edematoso y eritematoso, lo que la hace confundible con infección, pero la ausencia de fiebre y leucocitosis y la fragmentación ósea con luxaciones orientan al cuadro neuropático.","w":["La artritis séptica cursaría con fiebre y leucocitosis.","Correcta: ausencia de datos infecciosos con fragmentación ósea.","La osteomielitis por contigüidad cursaría con úlcera y signos infecciosos.","La gota da monoartritis aguda muy dolorosa."]},{"s":"ORT","c":20,"t":"Caso: politraumatizado con pelvis inestable","q":"Politraumatizado hipotenso con fractura de pelvis inestable. ¿Cuál es el objetivo de la fijación externa urgente?","o":["Permitir la deambulación precoz","Corregir la deformidad residual a largo plazo","Cerrar el anillo y frenar el sangrado","Facilitar la osteosíntesis definitiva en el acto"],"a":2,"e":"En el politraumatizado hipotenso sin foco en tórax, abdomen o extremidades hay que sospechar sangrado retroperitoneal por fractura de pelvis. La fractura inestable requiere fijación externa urgente para cerrar el anillo pélvico y frenar el sangrado; la tracción del miembro se reserva a la fractura de acetábulo.","w":["La deambulación no es el objetivo en fase aguda.","La corrección estética no es la prioridad en el inestable.","Correcta: el objetivo inmediato es hemodinámico.","La osteosíntesis definitiva se aplaza."]}];

async function saveProgressToDB(progressData) {
  if (!SB_USER_ID) return;
  try {
    await fetch(SB_URL + '/rest/v1/quiz_progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        user_id: SB_USER_ID,
        banco_id: BANCO_ID,
        question_index: progressData.index || 0,
        answer: JSON.stringify(progressData),
        is_correct: null
      })
    });
  } catch(e) {}
}

async function loadProgressFromDB() {
  if (!SB_USER_ID) return;
  try {
    const res = await fetch(
      SB_URL + '/rest/v1/quiz_progress?user_id=eq.' + SB_USER_ID + '&banco_id=eq.' + BANCO_ID + '&select=answer&limit=1',
      {
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY
        }
      }
    );
    const rows = await res.json();
    if (rows && rows.length > 0 && rows[0].answer) {
      const data = JSON.parse(rows[0].answer);
      applyProgress(data);
    }
  } catch(e) {}
}

function applyProgress(data) {
  if (data.ok)    S.ok    = data.ok;
  if (data.bad)   S.bad   = data.bad;
  if (data.seen)  S.seen  = data.seen;
  if (data.rondas) S.rondas = data.rondas;
  hud && hud();
}
function saveProgress() {
  const data = {
    ok: S.ok, bad: S.bad, seen: S.seen, rondas: S.rondas,
    index: S.i
  };
  saveProgressToDB(data);
}

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; };
const pct = (a,b) => b? Math.round(a/b*100) : 0;

/* ---------- selección de preguntas ---------- */
function base(){
  let ix = Q.map((q,i)=>i);
  if(S.mode==="unit") ix = ix.filter(i => S.sel.has(Q[i].s+"-"+Q[i].c));
  if(S.mode==="bad")  ix = ix.filter(i => S.bad[i]);
  if(S.mode==="good") ix = ix.filter(i => S.ok[i]);
  if(S.skip && S.mode!=="bad" && S.mode!=="good") ix = ix.filter(i => !S.seen[i]);
  return ix;
}
function updateGo(){
  const n = base().length, b = $("#go");
  if(!b) return;
  b.disabled = n===0;
  b.textContent = n===0 ? "No hay preguntas con estos filtros"
    : "Empezar · " + Math.min(n, S.size===0?n:S.size) + " preguntas";
}

/* ---------- HUD ---------- */
function hud(){
  const v = Object.keys(S.seen).length;
  const g = Object.values(S.ok).filter(Boolean).length;
  const m = Object.values(S.bad).filter(Boolean).length;
  const prom = S.rondas.length ? Math.round(S.rondas.reduce((a,b)=>a+b,0)/S.rondas.length) : pct(g,g+m);
  $("#hud").innerHTML =
    `<div class="chip">vistas <b>${v}</b>/${Q.length}</div>`+
    `<div class="chip g">buenas <b>${g}</b></div>`+
    `<div class="chip r">malas <b>${m}</b></div>`+
    `<div class="chip a">promedio <b>${prom}%</b></div>`;
}
function suture(){
  const s = $("#suture");
  if(S.view!=="quiz"){ s.innerHTML=""; return; }
  s.innerHTML="";
  S.pool.forEach((gi,k)=>{
    const i = el("i");
    if(k < S.i) i.className = S.lastRes[k] ? "ok":"bad";
    else if(k===S.i) i.className="cur";
    s.appendChild(i);
  });
}

/* ---------- RONDA ---------- */
function start(){
  let ix = base();
  for(let k=ix.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [ix[k],ix[j]]=[ix[j],ix[k]]; }
  if(S.size>0) ix = ix.slice(0,S.size);
  S.pool = ix; S.i = 0; S.rOk = 0; S.rBad = 0; S.lastRes = [];
  S.view="quiz"; render();
}

function render(){
  const gi = S.pool[S.i], q = Q[gi];
  S.answered=false;
  S.order = q.o.map((_,k)=>k);
  if(S.shuffle) for(let k=S.order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [S.order[k],S.order[j]]=[S.order[j],S.order[k]]; }

  const app = $("#app"); app.innerHTML="";
  const f = el("div","field");
  const meta = el("div","meta");
  const u = UNI.find(x=>x.s===q.s&&x.c===q.c);
  const st = el("span","tag s",SUBJ[q.s].n);
  st.style.background = SUBJ[q.s].c;
  meta.append(st, el("span","tag",u?u.n:""), el("span","count",
    `${S.i+1} / ${S.pool.length} · quedan ${S.pool.length-S.i-1}`));
  f.appendChild(meta);
  f.appendChild(el("h2","stem",q.q));

  const ans = el("div","answers"); ans.id="answers";
  S.order.forEach((orig,k)=>{
    const row = el("div","ansrow");
    const b = el("button","ans",
      `<span class="key">${k+1}</span><span>${q.o[orig]}</span>`);
    b.onclick=()=>pick(k);
    row.appendChild(b);
    ans.appendChild(row);
  });
  f.appendChild(ans);
  f.appendChild(el("div",null,'<div id="after"></div>'));
  app.appendChild(f);
  suture(); hud();
}

function pick(k){
  if(S.answered) return;
  S.answered=true;
  const gi = S.pool[S.i], q = Q[gi];
  const elegido = S.order[k];
  const bien = elegido === q.a;

  S.seen[gi]=true;
  if(bien){ S.ok[gi]=true; delete S.bad[gi]; S.rOk++; }
  else    { S.bad[gi]=true; delete S.ok[gi]; S.rBad++; }
  S.lastRes[S.i]=bien;

  const rows = document.querySelectorAll("#answers .ansrow");
  S.order.forEach((orig,pos)=>{
    const btn = rows[pos].querySelector(".ans");
    btn.disabled = true;
    const esOk = orig === q.a;
    btn.classList.add(esOk?"good":"wrong");
    const n = el("div","note "+(esOk?"good":"wrong"), q.w[orig]);
    rows[pos].appendChild(n);
  });

  const after = $("#after");
  const c = el("div","concept",
    `<h3>Concepto clave — ${q.t}</h3><p>${q.e}</p>`);
  after.appendChild(c);
  const nav = el("div","navrow");
  const b = el("button","btn primary",
    S.i+1 < S.pool.length ? "Siguiente" : "Ver resultados");
  b.onclick=next;
  const h = el("button","btn","Salir al inicio");
  h.onclick=()=>{ cerrarRonda(); home(); };
  nav.append(h,b); after.appendChild(nav);
  after.appendChild(el("div","hint","Enter para continuar"));
  b.focus();
  suture(); hud();
}

function next(){
  if(S.i+1 < S.pool.length){ S.i++; render(); }
  else results();
}
function cerrarRonda(){
  if(S.rOk+S.rBad>0) S.rondas.push(pct(S.rOk,S.rOk+S.rBad));
  S.rOk=S.rBad=0;
}

/* ---------- RESULTADOS ---------- */
function results(){
  cerrarRonda();
  S.view="res"; suture(); hud();
  const app = $("#app"); app.innerHTML="";
  const total = S.pool.length;
  const aciertos = S.lastRes.filter(Boolean).length;
  const p = pct(aciertos,total);
  const prom = S.rondas.length ? Math.round(S.rondas.reduce((a,b)=>a+b,0)/S.rondas.length) : p;
  const cob = pct(Object.keys(S.seen).length, Q.length);

  const hero = el("div","hero");
  hero.innerHTML = `<div class="sub">Ronda cerrada</div>
    <div class="big">${p}<small>%</small></div>
    <p>${aciertos} de ${total} correctas</p>`;
  app.appendChild(hero);

  const g = el("div","resgrid");
  [[p+"%","esta ronda"],[prom+"%","promedio global"],
   [cob+"%","banco cubierto"],[S.rondas.length,"rondas hechas"]]
  .forEach(([v,l])=> g.appendChild(el("div","res",`<b>${v}</b><span>${l}</span>`)));
  app.appendChild(g);

  const c = el("div","card"); c.appendChild(el("h2",null,"Dominio por unidad"));
  const bars = el("div","bars");
  let alguna=false;
  UNI.forEach(u=>{
    const ids = Q.map((q,i)=>[q,i]).filter(([q])=>q.s===u.s&&q.c===u.c).map(([,i])=>i);
    const vis = ids.filter(i=>S.seen[i]).length;
    if(!vis) return;
    alguna=true;
    const ok = ids.filter(i=>S.ok[i]).length;
    const v = pct(ok,vis);
    bars.appendChild(el("div","bar",
      `<div class="lab"><div>${u.n}</div><span>${ok}/${vis} · ${v}%</span></div>
       <div class="track"><div class="fill" style="width:${v}%"></div></div>`));
  });
  if(!alguna) bars.appendChild(el("div","empty","Aún no hay unidades respondidas."));
  c.appendChild(bars); app.appendChild(c);

  const nav = el("div","navrow");
  const a = el("button","btn primary","Otra ronda igual");
  a.onclick=start;
  const b = el("button","btn","Volver al inicio");
  b.onclick=home;
  const f = el("button","btn","Repasar falladas");
  f.onclick=()=>{ S.mode="bad"; start(); };
  nav.append(b,f,a); app.appendChild(nav);
}

/* ---------- teclado ---------- */
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz") return;
  if(["1","2","3","4"].includes(e.key)){ e.preventDefault(); pick(+e.key-1); }
  if(e.key==="Enter" && S.answered){ e.preventDefault(); next(); }
});


/* save hook */
const _origAnswer = answer;
window.answer = function(...args) { _origAnswer(...args); saveProgress(); };


home();
</script>
</body>
</html>

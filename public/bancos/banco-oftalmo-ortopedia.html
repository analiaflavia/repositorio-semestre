ilación que activa la vitamina.","La piel sintetiza el precursor por radiación ultravioleta.","El hígado realiza la 25-hidroxilación."]},{"s":"ORT","c":11,"t":"Clasificación de las articulaciones","q":"¿Qué tipo de articulación es la gonfosis y dónde se encuentra?","o":["Diartrosis sinovial; articulación de la rodilla","Sinartrosis fibrosa; sutura craneal frontoparietal","Sinartrosis fibrosa; unión alvéolo-dental","Anfiartrosis cartilaginosa; sínfisis púbica"],"a":2,"e":"Las sinartrosis son fibrosas e inmóviles e incluyen suturas craneales, sindesmosis como la tibioperonea distal y la gonfosis, que es la única unión alvéolo-dental. Las anfiartrosis son cartilaginosas y semimóviles, con sínfisis como la púbica y sincondrosis como el disco intervertebral, y las diartrosis son sinoviales y móviles.","w":["La rodilla es una diartrosis.","La sutura craneal es sinartrosis, pero no es la gonfosis.","Correcta: la gonfosis es la unión fibrosa del diente en su alvéolo.","La sínfisis púbica es una anfiartrosis, no una gonfosis."]},{"s":"ORT","c":11,"t":"Líquido sinovial","q":"Líquido articular turbio con 30.000 leucocitos y 60% de neutrófilos. ¿Cómo se clasifica?","o":["Traumático","Normal","Séptico","Inflamatorio"],"a":3,"e":"El líquido normal es transparente, con menos de 200 leucocitos, menos de 25% de neutrófilos, glucosa normal y proteínas bajas. El traumático es hemático con valores variables. El inflamatorio es turbio, con 2.000 a 50.000 leucocitos y más de 50% de neutrófilos, con glucosa baja. El séptico es purulento, con más de 50.000 leucocitos y más del 75% de neutrófilos.","w":["El traumático es hemático, no turbio.","El normal tiene menos de 200 leucocitos.","El séptico supera los 50.000 leucocitos y el 75% de neutrófilos.","Correcta: el rango de 2.000 a 50.000 con más del 50% de neutrófilos es inflamatorio."]},{"s":"ORT","c":11,"t":"Ley de Wolff","q":"¿Por qué la cortical medial del fémur es más gruesa que la lateral?","o":["Soporta compresión, mientras la lateral soporta tensión","Porque recibe la arteria nutricia principal","Porque tiene mayor densidad de osteoclastos","Porque su periostio es más grueso"],"a":0,"e":"La ley de Wolff establece que la formación y la estructura del hueso dependen de las cargas aplicadas: a mayor carga, mayor densidad. En el fémur la cortical medial soporta compresión y por eso es más gruesa que la lateral, sometida a tensión. El principio piezoeléctrico complementa la explicación: la deformación mecánica genera cambios eléctricos que estimulan al osteoblasto.","w":["Correcta: la compresión estimula mayor densidad ósea que la tensión.","La irrigación no determina el grosor cortical.","Más osteoclastos implicaría menos hueso, no más.","El grosor perióstico no explica la asimetría cortical."]},{"s":"ORT","c":11,"t":"Principio piezoeléctrico","q":"¿Cuál es la aplicación clínica del principio piezoeléctrico?","o":["Justificar la inmovilización prolongada con yeso","Indicar carga y apoyo tempranos en rehabilitación","Fundamentar el uso de injertos sintéticos","Explicar la necrosis avascular del escafoides"],"a":1,"e":"El principio piezoeléctrico describe que la deformación mecánica del hueso genera cambios eléctricos que estimulan la actividad osteoblástica. Es el fundamento biológico para indicar carga y apoyo tempranos en rehabilitación, coherente con la ley de Wolff, según la cual a mayor carga aplicada mayor densidad ósea.","w":["La inmovilización prolongada produce atrofia y osteopenia.","Correcta: la carga controlada estimula la formación de hueso.","Los injertos sintéticos actúan por osteoconducción.","La necrosis del escafoides se explica por su vascularización retrógrada."]},{"s":"ORT","c":11,"t":"Crecimiento en espesor","q":"¿De qué depende el crecimiento óseo en espesor?","o":["De la placa epifisaria o fisis","Del centro de osificación primario","Del cámbium, capa interna del periostio","Del canal medular diafisario"],"a":2,"e":"El crecimiento en longitud depende de la placa epifisaria o fisis, situada entre el centro primario diafisario y los secundarios epifisarios, mientras que el crecimiento en espesor depende del periostio, concretamente de su capa interna o cámbium, rica en células preosteoblásticas. Esa distinción explica por qué el daño de la fisis en el niño altera la longitud final.","w":["La fisis aporta el crecimiento en longitud.","El centro primario inicia la osificación diafisaria.","Correcta: el cámbium perióstico aporta el crecimiento en grosor.","El canal medular no participa en el crecimiento en espesor."]},{"s":"ORT","c":11,"t":"Matriz ósea","q":"¿Cuál es el componente orgánico principal de la matriz ósea?","o":["El colágeno tipo II","El carbonato de calcio","El fosfato tricálcico","El colágeno tipo I"],"a":3,"e":"El hueso es un tejido conectivo especializado formado por células, fibras y sustancia fundamental. Su matriz tiene un componente orgánico con osteocalcina, factores de crecimiento y colágeno tipo I, y uno inorgánico con sulfatos tricálcicos, carbonato de calcio y fosfatos. El colágeno tipo II, en cambio, es cartilaginoso y aparece en el callo blando.","w":["El tipo II es cartilaginoso, propio del callo blando.","El carbonato de calcio es inorgánico.","El fosfato pertenece al componente inorgánico.","Correcta: el colágeno tipo I es el componente orgánico dominante."]},{"s":"ORT","c":12,"t":"Fractura patológica","q":"Mujer posmenopáusica que se fractura la cadera al tropezar en casa. ¿Cómo se clasifica esa fractura y cuál es su causa más frecuente?","o":["Patológica; osteoporosis posmenopáusica","Patológica; metástasis ósea","Por estrés; sobrecarga repetitiva","Traumática; trauma de alta energía"],"a":0,"e":"La fractura normal o traumática ocurre en hueso sano con trauma de alta energía, típicamente el joven en accidente de tránsito. La patológica ocurre en hueso debilitado con trauma de baja energía, y su causa más frecuente es la osteoporosis de la mujer posmenopáusica; otras causas son tumores, metástasis, infección y enfermedades metabólicas.","w":["Correcta: hueso debilitado más trauma mínimo, con osteoporosis a la cabeza.","La metástasis es causa posible, pero no la más frecuente.","La fractura por estrés obedece a sobrecarga repetida, no a una caída.","El trauma descrito es de baja energía, no alta."]},{"s":"ORT","c":12,"t":"Fractura de Deutschlander","q":"¿Dónde asienta la fractura del soldado o recluta, llamada de Deutschlander?","o":["En la base del quinto metatarsiano","En cabeza o cuello del segundo o tercer metatarsiano","En la tibia proximal","En las apófisis espinosas cervicales"],"a":1,"e":"La fractura del soldado o recluta, llamada de Deutschlander, asienta en la cabeza o el cuello del segundo o tercer metatarsiano. La fractura del cargador afecta las apófisis espinosas de las vértebras cervicales y la lesión de Ollanquist se localiza en la tibia proximal. Todas son fracturas por estrés, por sobrecarga repetitiva sobre hueso sano.","w":["La base del quinto es la pseudo-Jones o lesión de la bailarina.","Correcta: segundo o tercer metatarsiano, típica de la marcha prolongada.","La tibia proximal es la localización de la lesión de Ollanquist.","Las apófisis espinosas cervicales corresponden a la fractura del cargador."]},{"s":"ORT","c":12,"t":"Fracturas del niño","q":"Relacione la fractura en tallo verde con la fractura en torus:","o":["Tallo verde con separación fisaria; torus por aplastamiento diafisario","Tallo verde completa desplazada; torus incompleta de radio y cúbito","Tallo verde incompleta en huesos largos; torus por aplastamiento metafisario","Tallo verde por aplastamiento metafisario; torus incompleta en huesos largos"],"a":2,"e":"El hueso del niño no está completamente osificado y es más plástico, por lo que se deforma antes de romperse del todo. La fractura en tallo verde es incompleta, afecta huesos largos y es típica de radio y cúbito; la fractura en torus o rodete resulta del aplastamiento de la metáfisis, con abombamiento de la cortical.","w":["La separación fisaria corresponde a las lesiones de Salter-Harris.","La de tallo verde es incompleta por definición.","Correcta: incompleta en tallo verde y aplastamiento metafisario en torus.","Invierte ambas lesiones."]},{"s":"ORT","c":12,"t":"Trazo más estable","q":"¿Cuál es el trazo de fractura más estable y por qué?","o":["Conminuta, porque los fragmentos se entrelazan","Espiroidea, porque distribuye la energía","Oblicua, porque aumenta la superficie de contacto","Transversa, porque los fragmentos se apoyan a compresión"],"a":3,"e":"Según la orientación del trazo respecto del eje horizontal, la transversa forma un ángulo menor de 30 grados y es la más estable de todas, porque los fragmentos se apoyan entre sí a compresión; la oblicua supera los 30 grados, la longitudinal corre paralela al eje, la espiroidea es helicoidal y la conminuta tiene más de dos fragmentos.","w":["La conminuta es la más inestable de todas.","La espiroidea es inestable por su geometría helicoidal.","La oblicua tiende a desplazarse por cizallamiento.","Correcta: el apoyo a compresión hace de la transversa la más estable."]},{"s":"ORT","c":12,"t":"Clasificación de Gustilo","q":"Fractura abierta con herida de 12 cm, daño perióstico y exposición ósea que requiere colgajo. ¿Qué grado de Gustilo es?","o":["IIIB","IIIA","II","IIIC"],"a":0,"e":"Gustilo I es una herida menor de 1 cm, limpia y de baja energía; II mide de 1 a 10 cm con energía moderada; IIIA supera los 10 cm pero conserva periostio y cobertura adecuada de partes blandas; IIIB tiene daño perióstico con exposición ósea y requiere colgajo; y IIIC agrega lesión vascular que precisa reparación.","w":["Correcta: daño perióstico con necesidad de colgajo define el IIIB.","El IIIA conserva periostio y cobertura adecuada.","El grado II mide de 1 a 10 cm sin ese daño perióstico.","El IIIC añade lesión vascular que requiere reparación."]},{"s":"ORT","c":12,"t":"Gustilo IIIC","q":"¿Qué añade el grado IIIC de Gustilo respecto al IIIB?","o":["Contaminación con material orgánico","Lesión vascular que precisa reparación","Herida mayor de 10 cm","Necesidad de colgajo de cobertura"],"a":1,"e":"El grado IIIB de Gustilo tiene daño perióstico con exposición ósea y requiere colgajo; el IIIC agrega lesión vascular que precisa reparación. Conviene recordar además que una fractura tipo I se reclasifica como IIIA si fue por arma de fuego o si ocurrió en granja, fosa séptica o lugar de alta contaminación.","w":["La contaminación alta reclasifica un tipo I como IIIA.","Correcta: el compromiso vascular reparable define el IIIC.","Superar los 10 cm ya ocurre en el IIIA.","El colgajo caracteriza al IIIB."]},{"s":"ORT","c":12,"t":"Síndrome compartimental: umbral","q":"¿A partir de qué presión intratisular se considera síndrome compartimental?","o":["Por encima de 8 mmHg","Por encima de 15 mmHg","Por encima de 30 mmHg","Por encima de 60 mmHg"],"a":2,"e":"La presión intratisular normal es de 0 a 8 mmHg. Se considera síndrome compartimental cuando supera los 30 mmHg, o cuando la diferencia entre presión diastólica y presión tisular es menor de 30 mmHg. El diagnóstico es fundamentalmente clínico y la medición con equipo de Stryker lo apoya.","w":["De 0 a 8 mmHg es el rango normal.","No es el valor de corte descrito en el tema.","Correcta: 30 mmHg es el umbral descrito.","Sesenta mmHg supera con mucho el umbral diagnóstico."]},{"s":"ORT","c":12,"t":"Signos precoces del compartimental","q":"Paciente con fractura de tibia enyesada, dolor desproporcionado y dolor al estiramiento pasivo. ¿Qué hay que sospechar?","o":["Trombosis venosa profunda","Infección del foco de fractura","Consolidación en mala posición","Síndrome compartimental"],"a":3,"e":"El dolor desproporcionado y el dolor al estiramiento pasivo son los signos precoces del síndrome compartimental, cuya localización más frecuente es la pierna, en el compartimento anterior, seguida del antebrazo. El diagnóstico es clínico y se apoya en la medición de presión intratisular, positiva por encima de 30 mmHg.","w":["La trombosis no cursa con dolor al estiramiento pasivo de ese modo.","La infección aparece más tarde y con signos inflamatorios.","La mala consolidación no produce dolor agudo desproporcionado.","Correcta: dolor desproporcionado y al estiramiento pasivo son los signos clave."]},{"s":"ORT","c":12,"t":"Ventana de la fasciotomía","q":"¿En qué plazo debe realizarse idealmente la fasciotomía?","o":["Dentro de las primeras 4 horas","Pasadas las 6 horas del inicio","Dentro de las primeras 24 horas","Dentro de las primeras 12 horas"],"a":0,"e":"La fasciotomía debe realizarse idealmente dentro de las primeras 4 horas desde el inicio de los síntomas; después de las 6 horas aumentan de forma marcada la necrosis muscular y el riesgo de amputación. Como medidas de soporte se eleva el miembro por debajo de 30 grados y se retira todo material compresivo.","w":["Correcta: la ventana ideal son las primeras 4 horas.","Pasadas las 6 horas el daño ya es marcado.","Veinticuatro horas supera con mucho la ventana útil.","Doce horas también excede el plazo ideal."]},{"s":"ORT","c":12,"t":"Embolia grasa","q":"¿Tras qué tipo de fractura aparece con más frecuencia la embolia grasa?","o":["Abiertas de huesos cortos del carpo","Cerradas de huesos largos del miembro inferior","Vertebrales por compresión","De costillas con tórax inestable"],"a":1,"e":"La embolia grasa es un síndrome de respuesta inflamatoria sistémica desencadenado por la lesión de la médula ósea, que libera émbolos grasos y citoquinas. Es secundaria a fracturas cerradas de huesos largos del miembro inferior, sobre todo del fémur. Los émbolos migran al pulmón y al sistema nervioso, con hipoxemia, confusión y petequias.","w":["Los huesos cortos del carpo carecen de médula suficiente.","Correcta: las diafisarias cerradas de fémur son el escenario típico.","Las vertebrales por compresión no son el escenario descrito.","Las costales no liberan el volumen medular necesario."]},{"s":"ORT","c":12,"t":"Síndrome de aplastamiento","q":"¿Cuál es el mecanismo del daño renal en el síndrome de Bywaters?","o":["El shock hipovolémico coagula el glomérulo","La hiperkalemia precipita en el túbulo","La rabdomiólisis libera mioglobina","La embolia grasa obstruye la arteria renal"],"a":2,"e":"El síndrome de aplastamiento o de Bywaters resulta de la lesión muscular severa: la rabdomiólisis libera mioglobina que daña el riñón, la pérdida hacia el tercer espacio produce shock hipovolémico y la hiperkalemia puede desencadenar arritmias. El manejo combina hidratación abundante, alcalinización y corrección del potasio.","w":["La hipovolemia agrava el daño, pero el mecanismo es la mioglobina.","La hiperkalemia da arritmias, no daño tubular directo.","Correcta: la mioglobina es nefrotóxica y produce el fallo renal.","La embolia grasa afecta pulmón y sistema nervioso."]},{"s":"ORT","c":12,"t":"Pseudoartrosis hipertrófica","q":"Relacione la pseudoartrosis hipertrófica con la atrófica según su causa:","o":["Hipertrófica por mala vascularización; atrófica por exceso de la movilidad interfragmentaria","Hipertrófica por déficit de vitamina D; atrófica por exceso de carga precoz","Hipertrófica por infección del foco; atrófica por inestabilidad mecánica persistente","Hipertrófica por inestabilidad con buena vascularización; atrófica por mala vascularización"],"a":3,"e":"La pseudoartrosis es la falsa articulación por ausencia de consolidación de larga evolución, con cavidad y membrana pseudosinovial; clínicamente hay movilidad anormal con escaso dolor. La hipertrófica, en pata de elefante, muestra extremos óseos ensanchados y se debe a inestabilidad con vascularización conservada; la atrófica muestra extremos afilados por mala vascularización.","w":["Invierte ambos mecanismos.","Ni la vitamina D ni la carga precoz definen esa distinción.","La infección es una causa aparte de ausencia de consolidación.","Correcta: inestabilidad con buen aporte frente a déficit vascular."]},{"s":"ORT","c":12,"t":"Retardo y ausencia de consolidación","q":"Relacione el retardo de consolidación con la ausencia de consolidación según su plazo:","o":["Retardo hacia los 3 meses; ausencia hacia los 6 meses","Retardo hacia el año; ausencia hacia los 2 años de evolución","Retardo hacia las 6 semanas; ausencia hacia los 3 meses de evolución","Retardo hacia los 6 meses; ausencia hacia los 3 meses de evolución"],"a":0,"e":"Se habla de retardo de consolidación cuando el foco consolida pero pasado más tiempo del habitual, en torno a los 3 meses, y de ausencia de consolidación cuando se anticipa que no consolidará sin intervención, hacia los 6 meses. La pseudoartrosis es la ausencia de consolidación de larga evolución, ya con cavidad y membrana pseudosinovial.","w":["Correcta: 3 meses para el retardo y 6 para la ausencia.","Los plazos descritos son bastante más cortos.","Seis semanas es un plazo normal de consolidación en muchos huesos.","Invierte ambos plazos."]},{"s":"ORT","c":12,"t":"Fractura de Holstein-Lewis","q":"¿Qué nervio se lesiona en la fractura de diáfisis humeral, conocida como de Holstein-Lewis?","o":["El cubital","El radial","El mediano","El axilar"],"a":1,"e":"Las asociaciones nervio-fractura son de las preguntas más repetidas: húmero proximal con nervio axilar o circunflejo, diáfisis humeral con nervio radial, que es la más importante y corresponde a la fractura de Holstein-Lewis, supracondílea con mediano e interóseo anterior, epitróclea con cubital y epicóndilo con radial.","w":["El cubital se lesiona en la fractura de epitróclea.","Correcta: el radial se lesiona en la diáfisis humeral.","El mediano se compromete en la supracondílea.","El axilar se compromete en el húmero proximal."]},{"s":"ORT","c":12,"t":"Preferencia de férula sobre yeso","q":"¿Por qué se prefieren férulas sobre yesos circulares en el manejo inicial?","o":["Porque el yeso retrasa la consolidación","Porque la férula inmoviliza mejor el foco","El yeso circular puede generar síndrome compartimental","Porque la férula permite la carga inmediata"],"a":2,"e":"La inmovilización es lo más importante del manejo inicial: evita daño de partes blandas, previene síndrome compartimental y pseudoartrosis, reduce el dolor y asegura consolidación y alineamiento. Se prefieren férulas sobre yesos porque el yeso circular puede generar síndrome compartimental cuando el edema aún está aumentando.","w":["El yeso no retrasa la consolidación por sí mismo.","El yeso circular inmoviliza más, no menos.","Correcta: el yeso circular precoz comprime un miembro que sigue edematizándose.","La férula no autoriza la carga inmediata."]},{"s":"ORT","c":12,"t":"Manejo inicial de la fractura abierta","q":"¿Cuál es la medida inicial en el lugar del accidente ante una fractura abierta?","o":["Reducción cerrada inmediata bajo tracción","Aplicación de la torniquete proximal sistemático","Cierre primario de la herida con puntos","Lavado e irrigación profusa más inmovilización"],"a":3,"e":"En la fractura cerrada el objetivo es evitar lesión de partes blandas y la medida inicial es la inmovilización o estabilización. En la abierta el objetivo es evitar contaminación y hemorragia: en el lugar del accidente, lavado e irrigación profusa más inmovilización, y después desbridamiento quirúrgico, antibióticos y estabilización definitiva.","w":["La reducción no precede al control de la contaminación.","El torniquete se reserva para hemorragia no controlable.","El cierre primario en el lugar del accidente sella la contaminación dentro.","Correcta: irrigar e inmovilizar antes de trasladar."]},{"s":"ORT","c":12,"t":"Indicación quirúrgica por desplazamiento","q":"Relacione el desplazamiento que indica cirugía en hueso largo con el de los huesos del tarso:","o":["Hueso largo más del 50%; tarso apenas 2 mm","Hueso largo más del 20%; tarso apenas 2 mm de desplazamiento","Hueso largo más del 50%; tarso más del 30% de desplazamiento","Hueso largo 2 mm; tarso más del 50% de desplazamiento"],"a":0,"e":"Se considera indicación quirúrgica frecuente el desplazamiento mayor del 50% en hueso largo, mientras que en huesos pequeños como los del tarso bastan 2 mm para requerir cirugía, porque el margen de tolerancia articular es mínimo. Otras indicaciones son la inestabilidad, el compromiso intraarticular y la lesión neurovascular asociada.","w":["Correcta: 50% en hueso largo y 2 mm en el tarso.","El umbral descrito para hueso largo es del 50%.","El umbral del tarso se mide en milímetros, no en porcentaje.","Invierte ambos umbrales."]},{"s":"ORT","c":12,"t":"Imágenes en fracturas","q":"¿Cuál es el estudio inicial ante la sospecha de fractura y con qué requisitos?","o":["Gammagrafía ósea con trazador radiactivo","Radiografía en dos proyecciones incluyendo ambas articulaciones","Tomografía con reconstrucción tridimensional","Resonancia magnética de la región afectada"],"a":1,"e":"La radiografía es el estudio diagnóstico inicial siempre, con un mínimo de dos proyecciones, anteroposterior y lateral, incluyendo la articulación proximal y la distal. La tomografía se reserva para huesos pequeños, apófisis y lesiones intraarticulares; la resonancia para partes blandas y la gammagrafía para fracturas por estrés.","w":["La gammagrafía es útil en fracturas por estrés, no como estudio inicial.","Correcta: dos proyecciones e inclusión de las articulaciones vecinas.","La tomografía es complementaria, no inicial.","La resonancia se reserva para partes blandas."]},{"s":"ORT","c":13,"t":"Luxación acromioclavicular tipo III","q":"¿Qué caracteriza al tipo III de la clasificación de la luxación acromioclavicular?","o":["Desplazamiento posterior de la clavícula","Desplazamiento inferior por debajo del acromion","Rotura de acromioclavicular y coracoclavicular con dislocación completa","Esguince aislado del ligamento acromioclavicular"],"a":2,"e":"La clasificación va del I al VI: I es esguince del ligamento acromioclavicular; II tiene el acromioclavicular desgarrado con el coracoclavicular intacto y la articulación subluxada; III rompe ambos con dislocación completa; IV luxa con desplazamiento posterior de la clavícula; V añade desplazamiento superior marcado; y VI desplazamiento inferior.","w":["El desplazamiento posterior corresponde al tipo IV.","El desplazamiento inferior corresponde al tipo VI.","Correcta: ambos ligamentos roto con dislocación completa define el III.","El esguince aislado es el tipo I."]},{"s":"ORT","c":13,"t":"Tratamiento de la lesión acromioclavicular","q":"¿Qué tipo de lesión acromioclavicular es el punto de controversia terapéutica?","o":["El tipo VI","El tipo V","El tipo I","El tipo III"],"a":3,"e":"Los tipos I y II se manejan de forma ortopédica con férula o cabestrillo; los tipos IV y V requieren cirugía. El tipo III es el punto de controversia: clásicamente se operaba, pero hoy la indicación se individualiza según demanda funcional. En todos los casos la rehabilitación es parte esencial del tratamiento.","w":["El tipo VI también se opera.","El tipo V tiene indicación quirúrgica establecida.","El tipo I se maneja de forma ortopédica sin discusión.","Correcta: el tipo III se individualiza según demanda funcional."]},{"s":"ORT","c":13,"t":"Clasificación de Allman","q":"¿Cuál es la localización más frecuente de la fractura de clavícula y qué porcentaje representa?","o":["Tercio medio, 69%","Tercio distal, 28%","Tercio proximal, 69%","Tercio distal, 69%"],"a":0,"e":"La clasificación de Allman divide la clavícula en tercio medio, que es el grupo I y el más frecuente con 69%; tercio distal como grupo II, segundo en frecuencia y asociado a lesión de los ligamentos coracoclaviculares; y tercio proximal como grupo III, infrecuente. El manejo es habitualmente ortopédico.","w":["Correcta: el tercio medio concentra el 69% de las fracturas de clavícula.","No es el porcentaje descrito para ese tercio.","El tercio proximal es el menos frecuente.","El tercio distal es el segundo en frecuencia."]},{"s":"ORT","c":13,"t":"Luxación de hombro y nervio","q":"¿Qué nervio se lesiona característicamente en la luxación anterior de hombro?","o":["El musculocutáneo","El axilar o circunflejo","El radial","El supraescapular"],"a":1,"e":"La luxación más frecuente del adulto es la anterior de hombro y su lesión nerviosa característica es la del nervio axilar o circunflejo. En el niño, en cambio, la luxación más frecuente es la posterior de codo. Las luxaciones posteriores de hombro son raras y se producen en convulsiones y electrocución.","w":["El musculocutáneo queda fuera de la vaina en el bloqueo axilar, pero no aquí.","Correcta: el axilar es el nervio en riesgo en la luxación anterior.","El radial se lesiona en la diáfisis humeral.","El supraescapular no es el nervio característico de esta lesión."]},{"s":"ORT","c":13,"t":"Luxación posterior de hombro","q":"¿En qué situaciones se produce la rara luxación posterior de hombro?","o":["Caída sobre la mano en dorsiflexión","Tracción del miembro en el niño","Convulsiones y electrocución","Trauma directo sobre el acromion"],"a":2,"e":"Las luxaciones posteriores de hombro son raras y se producen en convulsiones y electrocución, por contracción muscular masiva. La anterior es la más frecuente del adulto y se asocia a lesión del nervio axilar, a la lesión de Bankart del labrum glenoideo anteroinferior y a la de Hill-Sachs de la cabeza humeral.","w":["La caída en dorsiflexión produce fractura de escafoides o Colles.","La tracción del miembro en el niño da codo de niñera.","Correcta: la contracción muscular masiva explica el mecanismo.","El trauma sobre el acromion lesiona la articulación acromioclavicular."]},{"s":"ORT","c":13,"t":"Bankart y Hill-Sachs","q":"Relacione la lesión de Bankart con la de Hill-Sachs:","o":["Bankart defecto óseo de la cabeza humeral; Hill-Sachs avulsión del labrum glenoideo","Bankart avulsión del labrum posterior; Hill-Sachs fractura de la glenoides ósea","Bankart fractura del troquíter; Hill-Sachs avulsión del labrum glenoideo anterior","Bankart avulsión del labrum anteroinferior; Hill-Sachs defecto de la cabeza humeral"],"a":3,"e":"En la luxación anterior de hombro, la lesión de Bankart es la avulsión del labrum glenoideo anteroinferior y es la que genera inestabilidad recidivante, motivo por el que suele requerir tratamiento quirúrgico. La lesión de Hill-Sachs es un defecto óseo por impactación en la cabeza humeral posterolateral.","w":["Invierte ambas lesiones.","El labrum comprometido es el anteroinferior.","La fractura del troquíter es una lesión distinta.","Correcta: labrum glenoideo para Bankart y cabeza humeral para Hill-Sachs."]},{"s":"ORT","c":13,"t":"Manguito rotador","q":"¿Qué músculo del manguito rotador inicia la abducción y es el más lesionado?","o":["El supraespinoso","El infraespinoso","El subescapular","El redondo menor"],"a":0,"e":"El manguito rotador lo forman el supraespinoso, que inicia la abducción; el infraespinoso y el redondo menor, que rotan externamente; y el subescapular, que rota internamente. El más lesionado es el supraespinoso, y su compromiso limita la abducción inicial. El factor de riesgo principal es la actividad repetitiva por encima de la cabeza.","w":["Correcta: inicia la abducción y es el más frecuentemente lesionado.","El infraespinoso rota externamente.","El subescapular es el único rotador interno del manguito.","El redondo menor también es rotador externo."]},{"s":"ORT","c":13,"t":"Húmero proximal","q":"¿Qué localización de fractura de húmero proximal es la más frecuente y en quién?","o":["Tuberosidad mayor, en el anciano con osteoporosis","Cuello quirúrgico, en el anciano con osteoporosis","Cuello anatómico, en el anciano con osteoporosis","Cuello quirúrgico, en el joven deportista"],"a":1,"e":"La fractura de húmero proximal puede asentar en cuello anatómico o quirúrgico, siendo el quirúrgico el más frecuente y típico del anciano con osteoporosis. El cuello quirúrgico cursa con dolor, disfunción, deformidad y el hematoma o equimosis de Hennequin. El cuello anatómico tiene mayor riesgo de necrosis avascular por la vascularización precaria de la cabeza humeral.","w":["La tuberosidad mayor corresponde al tipo IV de Neer.","Correcta: cuello quirúrgico en el anciano osteoporótico.","El anatómico es menos frecuente pero de peor pronóstico vascular.","No es el perfil epidemiológico descrito."]},{"s":"ORT","c":13,"t":"Clasificación de Neer","q":"¿Según qué criterio ordena la clasificación de Neer la fractura de húmero proximal?","o":["Según el ángulo del trazo de fractura","Según el tamaño de la herida cutánea","Según el número de fragmentos desplazados","Según la presencia de lesión vascular"],"a":2,"e":"La clasificación de Neer ordena la fractura de húmero proximal según el número de fragmentos desplazados, del I al VI: I mínimo desplazamiento, II cuello anatómico, III cuello quirúrgico, IV tuberosidad mayor, V tuberosidad menor y VI luxación anteroposterior. El tamaño de la herida corresponde a Gustilo y el ángulo del trazo a la clasificación por orientación.","w":["El ángulo del trazo clasifica transversa, oblicua o longitudinal.","El tamaño de la herida es el criterio de Gustilo.","Correcta: el número de fragmentos desplazados es el criterio de Neer.","La lesión vascular define el Gustilo IIIC."]},{"s":"ORT","c":13,"t":"Equimosis de Hennequin","q":"¿Con qué fractura se asocia la equimosis de Hennequin?","o":["Escafoides carpiano","Diáfisis humeral espiroidea","Cuello femoral intracapsular","Cuello quirúrgico del húmero"],"a":3,"e":"La fractura del cuello quirúrgico del húmero cursa con dolor, disfunción, deformidad y el hematoma o equimosis de Hennequin, que desciende por la cara medial del brazo. Es la localización más frecuente del húmero proximal y típica del anciano con osteoporosis; el cuello anatómico tiene mayor riesgo de necrosis avascular.","w":["El escafoides duele en la tabaquera anatómica, sin equimosis típica.","La diafisaria humeral se asocia a lesión del nervio radial.","La equimosis lateral sobre el trocánter caracteriza a las trocantéricas.","Correcta: la equimosis de Hennequin acompaña al cuello quirúrgico humeral."]},{"s":"ORT","c":13,"t":"Yeso colgante de Caldwell","q":"¿En qué fractura se usa el yeso colgante de Caldwell y con qué tracción?","o":["Diáfisis humeral, con 3 a 4 kg","Escafoides carpiano, sin tracción alguna","Radio distal, con 8 a 10 kg de tracción","Cuello femoral, con el 10% del peso"],"a":0,"e":"El manejo no complicado de la fractura de diáfisis humeral es ortopédico con yeso colgante de Caldwell, con 3 a 4 kg de tracción, y las complicadas o desplazadas se tratan con clavo endomedular; la pseudoartrosis es una complicación frecuente. Su complicación más común es la lesión del nervio radial.","w":["Correcta: yeso colgante con 3 a 4 kg en la diáfisis humeral.","El escafoides se inmoviliza con férula en guante incluyendo el pulgar.","No es el manejo descrito para el radio distal.","El 10% del peso corporal corresponde a la tracción ósea del fémur."]},{"s":"ORT","c":13,"t":"Fractura supracondílea","q":"Niño con fractura supracondílea de húmero. ¿Qué estructuras están en riesgo y qué complicación temida existe?","o":["Arteria radial y nervio interóseo; síndrome del túnel del carpo","Arteria braquial y nervio mediano; contractura de Volkmann","Arteria braquial y nervio cubital; necrosis avascular de la cabeza humeral","Arteria axilar y nervio radial; contractura de Volkmann del antebrazo"],"a":1,"e":"La fractura supracondílea es la fractura distal de húmero más frecuente y aparece sobre todo en niños. Suele lesionar la arteria braquial y el nervio mediano, y en ocasiones radial y cubital. La compresión nerviosa y vascular lleva a contractura isquémica del antebrazo, la contractura de Volkmann, que es la complicación temida.","w":["El túnel del carpo es una compresión distal, no la complicación descrita.","Correcta: braquial y mediano, con la contractura de Volkmann como secuela.","El cubital se compromete sobre todo en la epitróclea.","La arteria axilar no transcurre a nivel supracondíleo."]},{"s":"ORT","c":13,"t":"Epitróclea y epicóndilo","q":"Relacione la fractura de epitróclea con la de epicóndilo según el nervio lesionado:","o":["Epitróclea nervio cubital; epicóndilo nervio mediano del antebrazo","Epitróclea nervio radial; epicóndilo nervio cubital con parestesias distales","Epitróclea nervio cubital; epicóndilo nervio radial","Epitróclea nervio mediano; epicóndilo nervio cubital del antebrazo"],"a":2,"e":"La fractura de epitróclea lesiona el nervio cubital, con parestesias en cuarto y quinto dedos y disfunción de los flexores de la mano; la de epicóndilo lesiona el radial, con disfunción de los extensores de mano y dedos. En clínica no traumática, la epicondilitis es el codo de tenista y la epitrocleítis el codo de golfista.","w":["El epicóndilo se asocia al radial, no al mediano.","Invierte ambos nervios.","Correcta: cubital en la epitróclea y radial en el epicóndilo.","El mediano se compromete en la supracondílea."]},{"s":"ORT","c":13,"t":"Luxación de codo","q":"¿Qué signos exploratorios acompañan a la luxación posterior de codo?","o":["Equimosis de Hennequin y abducción del brazo","Signo del hoyuelo y hemartros con grasa","Dorso de tenedor y signo de la tecla","Hachazo tricipital y deformación del triángulo de Nelaton"],"a":3,"e":"La luxación posterior de codo es la más frecuente, sobre todo en niños, y es la segunda luxación más frecuente del adulto después de la de hombro. Cursa con dolor, impotencia, rigidez, inestabilidad, deformidad en hachazo tricipital y deformación del triángulo de Nelaton, la referencia formada por epicóndilo, epitróclea y olécranon.","w":["La equimosis de Hennequin acompaña al cuello quirúrgico humeral.","El signo del hoyuelo corresponde a la luxación de rodilla.","El dorso de tenedor es propio de la fractura de Colles.","Correcta: hachazo tricipital y alteración del triángulo de Nelaton."]},{"s":"ORT","c":13,"t":"Codo de niñera","q":"Ordene los pasos de la reducción del codo de niñera:","o":["Extensión con tracción, supinación del antebrazo, flexión del codo","Supinación forzada, extensión sostenida, pronación final del antebrazo","Pronación con tracción, flexión del codo, extensión final del antebrazo","Flexión del codo, pronación, extensión con tracción del antebrazo"],"a":0,"e":"La subluxación de la cabeza del radio o codo de niñera aparece entre 1 y 4 años tras una tracción severa del miembro superior con el codo en extensión y pronación: la cabeza radial sale de su ligamento anular. El niño llega con dolor, impotencia funcional y el codo en semiflexión y pronación, con radiografía normal. La reducción es en tres pasos: extensión con tracción, supinación y flexión.","w":["Correcta: extensión con tracción, supinación y flexión, en ese orden.","No corresponde a la maniobra descrita.","La pronación es la posición de la lesión, no el primer paso de la reducción.","Invierte la secuencia de reducción."]},{"s":"ORT","c":13,"t":"Fractura de Colles","q":"Paciente que cae sobre la palma en dorsiflexión y presenta deformidad en dorso de tenedor. ¿Qué fractura tiene?","o":["Smith, con desviación ventral y pala de jardinero","Colles, extraarticular con desplazamiento dorsal","Barton, intraarticular con luxación del carpo","Bennett, en la base del primer metacarpiano"],"a":1,"e":"La fractura de Colles es extraarticular, de la metáfisis del radio, corresponde al tipo I de Frykman, es la más frecuente del miembro superior y resulta de la caída sobre la palma en dorsiflexión. Deja el dorso de tenedor por desplazamiento dorsal y radial. La de Smith es su inversa, por caída sobre el dorso de la mano en hiperflexión.","w":["La de Smith se produce por caída sobre el dorso de la mano.","Correcta: caída en dorsiflexión con desplazamiento dorsal del fragmento.","La de Barton es intraarticular con luxación del carpo.","La de Bennett afecta la base del primer metacarpiano."]},{"s":"ORT","c":13,"t":"Smith y Barton","q":"Relacione la fractura de Smith con la de Barton:","o":["Smith de la base del primer metacarpiano; Barton intraarticular con luxación carpiana","Smith desviación dorsal en tenedor; Barton desviación ventral en pala de jardinero","Smith desviación ventral extraarticular; Barton intraarticular con luxación del carpo","Smith intraarticular con luxación; Barton desviación ventral extraarticular del radio"],"a":2,"e":"La fractura de Smith o Goyrand es el Colles invertido: metáfisis del radio con desviación ventral, por caída sobre el dorso de la mano en hiperflexión, y deformidad en pala de jardinero; su tratamiento es quirúrgico. La de Barton es una fractura distal de radio intraarticular con luxación del carpo.","w":["La base del primer metacarpiano corresponde a Bennett y Rolando.","La desviación dorsal en tenedor corresponde al Colles.","Correcta: Smith extraarticular ventral y Barton intraarticular con luxación.","Invierte ambas fracturas."]},{"s":"ORT","c":13,"t":"Monteggia y Galeazzi","q":"Relacione la fractura de Monteggia con la de Galeazzi:","o":["Monteggia cúbito distal con luxación radial proximal; Galeazzi radio proximal con luxación distal","Monteggia ambos huesos del antebrazo; Galeazzi cúbito proximal con luxación de la cabeza radial","Monteggia radio distal con luxación radiocubital; Galeazzi cúbito proximal con luxación radial","Monteggia cúbito proximal con luxación radial; Galeazzi radio distal con luxación radiocubital"],"a":3,"e":"Monteggia es fractura del tercio proximal del cúbito con luxación de la cabeza del radio y se asocia a lesión del nervio interóseo posterior, rama del radial. Galeazzi es fractura del tercio distal del radio con luxación radiocubital distal. Essex-Lopresti combina fractura de la cabeza radial con luxación radiocubital distal.","w":["No corresponde a la descripción de ninguna de las dos.","La fractura de ambos huesos es otra entidad.","Invierte ambas lesiones.","Correcta: cúbito proximal en Monteggia y radio distal en Galeazzi."]},{"s":"ORT","c":13,"t":"Fractura de escafoides","q":"Paciente con dolor en la tabaquera anatómica y radiografía negativa tras caída en dorsiflexión. ¿Qué corresponde hacer?","o":["Inmovilizar y repetir la radiografía a las 2 semanas","Osteosíntesis con tornillo de Herbert de entrada","Dar de alta con analgesia y control ambulatorio","Solicitar gammagrafía ósea de inmediato"],"a":0,"e":"El escafoides es el hueso del carpo que más se fractura, por caída en dorsiflexión, con dolor en la tabaquera anatómica, formada por los tendones del extensor largo y el extensor corto del pulgar. La radiografía es poco sensible los primeros días, así que ante clínica sugerente se inmoviliza con férula en guante incluyendo el pulgar y se repite el estudio a las 2 semanas.","w":["Correcta: inmovilizar pese a la placa negativa y reevaluar en 2 semanas.","El tornillo se indica en fracturas desplazadas, no de entrada.","Dar de alta sin inmovilizar expone a pseudoartrosis y necrosis.","La tomografía es la que sirve para diagnóstico precoz."]},{"s":"ORT","c":13,"t":"Complicaciones del escafoides","q":"¿Cuáles son las complicaciones más frecuentes de la fractura de escafoides?","o":["Consolidación en mala posición con acortamiento","Necrosis avascular proximal y pseudoartrosis","Síndrome compartimental y embolia grasa","Contractura de Volkmann y rigidez del codo"],"a":1,"e":"El escafoides es el hueso del carpo que más se fractura y sus complicaciones más frecuentes son la necrosis avascular del polo proximal y la pseudoartrosis, precisamente porque su vascularización es retrógrada y precaria, igual que la de la cabeza femoral, la cabeza humeral y el astrágalo.","w":["La mala consolidación es propia de las extracapsulares de cadera.","Correcta: necrosis del polo proximal y pseudoartrosis por flujo retrógrado.","La embolia grasa se asocia a huesos largos del miembro inferior.","La contractura de Volkmann sigue a la supracondílea humeral."]},{"s":"ORT","c":13,"t":"Fractura de Bennett","q":"Relacione la fractura de Bennett con la de Rolando:","o":["Bennett extraarticular estable; Rolando intraarticular con luxación del carpo","Bennett del quinto metacarpiano; Rolando conminuta del primero","Bennett oblicua intraarticular inestable; Rolando conminuta de la misma base","Bennett conminuta sin desplazamiento; Rolando oblicua intraarticular inestable"],"a":2,"e":"La fractura de Bennett es oblicua e intraarticular en la base del primer metacarpiano, con desplazamiento por tracción del abductor largo del pulgar; es inestable y requiere osteosíntesis. La de Rolando es conminuta en la base del primer metacarpiano, sin el desplazamiento característico de Bennett pero de manejo también complejo.","w":["La de Bennett es intraarticular e inestable.","Ambas afectan el primer metacarpiano, no el quinto.","Correcta: oblicua inestable frente a conminuta, ambas en la base del primero.","Invierte ambas fracturas."]},{"s":"ORT","c":13,"t":"Luxación del semilunar","q":"¿Cuál es el hueso del carpo que más se luxa y qué nervio compromete?","o":["El escafoides; el nervio mediano por delante","El piramidal; el nervio cubital en el canal","El ganchoso; el nervio cubital en su gancho","El semilunar; el nervio mediano"],"a":3,"e":"El semilunar es el hueso del carpo que más se luxa, por caída sobre la palma con desviación ventral, y produce signo del dorso de tenedor y lesión del nervio mediano, que pasa por delante de él. El síndrome del túnel del carpo comprime el mismo nervio por inflamación de los tendones flexores.","w":["El escafoides se fractura más de lo que se luxa.","El piramidal no es el que más se luxa.","El ganchoso se relaciona con el cubital, pero no es el más luxado.","Correcta: el semilunar se luxa y comprime el mediano situado por delante."]},{"s":"ORT","c":13,"t":"Tabaquera anatómica","q":"¿Qué tendones delimitan la tabaquera anatómica?","o":["El extensor largo y el extensor corto del pulgar","El flexor largo del pulgar y el palmar mayor","El abductor largo del pulgar y el cubital anterior","El extensor común de los dedos y el cubital posterior"],"a":0,"e":"La tabaquera anatómica está formada por los tendones del extensor largo y el extensor corto del pulgar, y su dolor a la presión es el signo clave de la fractura de escafoides, el hueso del carpo que más se fractura. La radiografía es poco sensible los primeros días, de modo que la clínica manda sobre la imagen inicial.","w":["Correcta: los dos extensores del pulgar delimitan la tabaquera.","Esos tendones son flexores y no delimitan la tabaquera.","El abductor largo participa en el borde, pero el par descrito son los extensores.","No delimitan la tabaquera anatómica."]},{"s":"ORT","c":14,"t":"Politraumatizado hipotenso","q":"Politraumatizado hipotenso sin sangrado en tórax, abdomen ni extremidades. ¿Qué hay que descartar?","o":["Neumotórax a tensión no drenado","Sangrado retroperitoneal por fractura de pelvis","Taponamiento cardíaco por herida penetrante","Hemorragia intracraneal expansiva"],"a":1,"e":"En el politraumatizado hipotenso sin foco evidente en tórax, abdomen o extremidades hay que descartar sangrado retroperitoneal por fractura de pelvis, cuya causa más frecuente es el accidente de tránsito en jóvenes. El estudio inicial es la radiografía, parte de la trilogía con columna cervical y tórax, y la tomografía es de elección para confirmar.","w":["El neumotórax a tensión daría hallazgos torácicos evidentes.","Correcta: el retroperitoneo es el compartimento oculto a descartar.","El taponamiento cursa con ingurgitación yugular y tonos apagados.","La hemorragia intracraneal no produce shock hipovolémico en el adulto."]},{"s":"ORT","c":14,"t":"Localización más frecuente en pelvis","q":"¿Cuál es la localización más frecuente de la fractura de pelvis?","o":["El acetábulo","El sacro","El pubis","La sacroilíaca"],"a":2,"e":"La localización más frecuente de la fractura de pelvis es el pubis. Su causa más frecuente es el accidente de tránsito en jóvenes, y la tomografía es de elección para confirmar y evaluar lesiones asociadas, que son la principal causa de mortalidad.","w":["El acetábulo requiere tracción del miembro, sin ser el más frecuente.","El sacro se afecta con menor frecuencia.","Correcta: el pubis es la localización más frecuente.","La sacroilíaca aporta estabilidad posterior."]},{"s":"ORT","c":14,"t":"Manejo de la pelvis inestable","q":"Fractura pélvica inestable en paciente hemodinámicamente inestable. ¿Cuál es la conducta?","o":["Tracción del miembro inferior","Reposo en cama con analgesia","Osteosíntesis definitiva con placas","Fijación externa urgente"],"a":3,"e":"Las fracturas pélvicas son simples, con un punto sin inestabilidad; complejas, con más de dos puntos e inestabilidad; y parcelares, que afectan un hueso sin comprometer el anillo. Las inestables requieren fijación externa urgente para cerrar el anillo y frenar el sangrado; el estable se maneja de forma ortopédica.","w":["La tracción se reserva para la fractura de acetábulo.","El reposo no controla el sangrado de un anillo abierto.","La osteosíntesis definitiva no es prioridad en el inestable.","Correcta: cerrar el anillo con fijador externo controla el sangrado."]},{"s":"ORT","c":14,"t":"Estabilidad del anillo pélvico","q":"¿Cuál es el elemento más importante de estabilidad del anillo pélvico?","o":["Los ligamentos sacroilíacos posteriores","La cápsula acetabular","La sínfisis del pubis","El ligamento inguinal"],"a":0,"e":"Los ligamentos sacroilíacos posteriores son el elemento más importante de estabilidad del anillo pélvico. Las inestables requieren fijación externa urgente, mientras la fractura de acetábulo se inmoviliza y se tracciona el miembro inferior.","w":["Correcta: el complejo posterior sacroilíaco es el pilar de la estabilidad.","La cápsula acetabular estabiliza la cadera, no el anillo.","La sínfisis aporta estabilidad anterior, menos determinante.","El ligamento inguinal no participa en la estabilidad del anillo."]},{"s":"ORT","c":14,"t":"Luxación posterior de cadera","q":"Paciente de accidente de tránsito con miembro en rotación interna, aducción y acortamiento. ¿Qué tiene y qué nervio está en riesgo?","o":["Fractura de acetábulo; nervio ciático","Luxación posterior de cadera; nervio ciático","Fractura de cuello femoral; nervio obturador","Luxación anterior de cadera; nervio femoral"],"a":1,"e":"La luxación traumática más frecuente de la cadera es la posterior, por impacto longitudinal sobre el fémur, como el golpe contra el salpicadero. El miembro queda en rotación interna, semiflexión, aducción y acortamiento, y el nervio en riesgo es el ciático. La anterior deja el miembro en rotación externa, abducción y flexión.","w":["La fractura acetabular no da ese patrón posicional.","Correcta: rotación interna con aducción y acortamiento, con el ciático en riesgo.","La fractura de cuello femoral cursa con rotación externa.","La anterior deja el miembro en rotación externa y abducción."]},{"s":"ORT","c":14,"t":"Clasificación de Garden","q":"Fractura de cuello femoral incompleta e impactada en valgo. ¿Qué Garden es?","o":["Garden III","Garden IV","Garden I","Garden II"],"a":2,"e":"Garden I es incompleta e impactada en valgo, II completa no desplazada, III completa parcialmente desplazada y IV completa totalmente desplazada. Es frecuente en la anciana con osteoporosis tras una caída, con acortamiento, aducción y rotación externa.","w":["El III es completa parcialmente desplazada.","El IV es completa totalmente desplazada.","Correcta: incompleta e impactada en valgo define el Garden I.","El II es completa pero no desplazada."]},{"s":"ORT","c":14,"t":"Tratamiento del Garden I y II","q":"¿Cuál es el tratamiento de la fractura de cuello femoral Garden I o II?","o":["Tracción esquelética prolongada","Hemiartroplastia de cadera","Artroplastia total de cadera","Osteosíntesis con tornillos o sistema DHS"],"a":3,"e":"En la fractura de cuello femoral estable, Garden I y II, se hace osteosíntesis con tornillos transcervicales o sistema DHS. En las desplazadas, Garden III y IV, se decide según el paciente: hemiartroplastia si la demanda es baja y la esperanza de vida menor de 3 años, y artroplastia total si es activo.","w":["La tracción prolongada no es tratamiento definitivo.","La hemiartroplastia se reserva para desplazadas en baja demanda.","La artroplastia total es para desplazadas en paciente activo.","Correcta: las estables se fijan, no se sustituyen."]},{"s":"ORT","c":14,"t":"Elección de prótesis","q":"Anciana de 82 años con Garden IV, baja demanda y esperanza de vida menor de 3 años. ¿Qué corresponde?","o":["Hemiartroplastia","Osteosíntesis con tornillos","Tratamiento conservador","Artroplastia total"],"a":0,"e":"En Garden III y IV la decisión depende del paciente: baja demanda funcional y esperanza de vida menor de 3 años, hemiartroplastia, que reemplaza solo la cabeza femoral; paciente activo con esperanza mayor de 3 años, artroplastia total. Conviene valorar el índice de comorbilidad de Charlson.","w":["Correcta: baja demanda y esperanza limitada indican hemiartroplastia.","La osteosíntesis es para Garden I y II.","El manejo conservador condena a la inmovilidad.","La artroplastia total se reserva al paciente activo."]},{"s":"ORT","c":14,"t":"Intracapsular y extracapsular","q":"Relacione la complicación de la fractura intracapsular con la de la extracapsular:","o":["Intracapsular síndrome compartimental; extracapsular pseudoartrosis atrófica","Intracapsular necrosis y ausencia de consolidación; extracapsular mala posición","Intracapsular embolia grasa masiva; extracapsular necrosis avascular de la cabeza","Intracapsular consolidación en mala posición; extracapsular necrosis isquémica cefálica"],"a":1,"e":"Las fracturas intracapsulares del cuello femoral comprometen la vascularización retrógrada de la cabeza y su complicación característica es la necrosis isquémica con ausencia de consolidación. Las extracapsulares asientan en hueso metafisario de rica vascularización, consolidan casi siempre y su riesgo es hacerlo en mala posición.","w":["El síndrome compartimental no afecta la cadera.","Correcta: necrosis en la intracapsular y mala alineación en la extracapsular.","La embolia grasa se asocia a fracturas diafisarias.","Invierte ambas complicaciones."]},{"s":"ORT","c":14,"t":"Equimosis trocantérica","q":"Paciente con equimosis en la cara lateral de la cadera sobre el trocánter mayor, con abducción y rotación externa. ¿Qué fractura tiene?","o":["Fractura de acetábulo","Luxación posterior de cadera","Extracapsular o trocantérica","Intracapsular subcapital"],"a":2,"e":"La equimosis en la cara lateral de la cadera sobre el trocánter mayor caracteriza a las fracturas extracapsulares o trocantéricas, que se presentan con abducción, rotación externa y acortamiento. Las intracapsulares cursan con acortamiento, aducción y rotación externa, y su complicación es la necrosis cefálica.","w":["La fractura acetabular no da ese patrón de equimosis.","La luxación posterior deja el miembro en rotación interna.","Correcta: la equimosis lateral trocantérica es propia de la extracapsular.","La intracapsular no produce esa equimosis externa."]},{"s":"ORT","c":14,"t":"Diáfisis femoral","q":"¿Por qué se prefieren clavos no fresados en la fractura de diáfisis femoral del adulto?","o":["Para permitir la carga inmediata","Para acelerar la formación de callo","Para evitar la lesión del nervio ciático","Para reducir el riesgo de embolia grasa"],"a":3,"e":"La fractura de diáfisis femoral es frecuente en jóvenes por trauma de alta energía y puede comprometer la arteria femoral con shock hipovolémico, además de producir embolia grasa. En el adulto se usa tracción ósea o clavo endomedular, prefiriendo los no fresados para reducir la embolia grasa; en el niño, tracción cutánea y yeso pelvipedio.","w":["La carga precoz depende de la estabilidad, no del fresado.","El fresado no acelera la consolidación.","El ciático no está en riesgo con el clavo femoral.","Correcta: el fresado eleva la presión medular y libera émbolos grasos."]},{"s":"ORT","c":14,"t":"Tracción ósea","q":"¿Cuál es el peso máximo en tracción ósea del adulto?","o":["El 10% del peso corporal","El 25% del peso corporal","El 50% del peso corporal","Un máximo fijo de 3 a 4 kg"],"a":0,"e":"En tracción ósea el peso máximo es el 10% del peso corporal del adulto. En el niño la fractura de diáfisis femoral se maneja con tracción cutánea y yeso pelvipedio. Los 3 a 4 kg corresponden al yeso colgante de Caldwell en la diáfisis humeral.","w":["Correcta: el 10% del peso corporal es el límite descrito.","Excede el límite de tracción segura.","La mitad del peso corporal es inviable.","Esa cifra corresponde al yeso colgante humeral."]},{"s":"ORT","c":14,"t":"Ligamento cruzado anterior","q":"¿Cuál es la maniobra más sensible para explorar el ligamento cruzado anterior?","o":["El signo del bostezo","El signo de Lachman","El cajón posterior","La prueba de McMurray"],"a":1,"e":"El ligamento cruzado anterior es el que más se lesiona, por rotación externa con la rodilla en extensión, y puede asociarse a la fractura de Segond. Se explora con cajón anterior, pivot shift y sobre todo Lachman, la maniobra más sensible. La artrocentesis muestra hemartros sin grasa.","w":["El bostezo evalúa los ligamentos colaterales.","Correcta: Lachman es la más sensible para el cruzado anterior.","El cajón posterior explora el cruzado posterior.","McMurray explora los meniscos."]},{"s":"ORT","c":14,"t":"Hemartros con y sin grasa","q":"Artrocentesis de rodilla con hemartros sin gotas de grasa. ¿Qué indica?","o":["Artritis séptica en fase inicial","Artrosis con derrame reactivo","Lesión ligamentaria, como del cruzado anterior","Fractura intraarticular con apertura medular"],"a":2,"e":"En la lesión del cruzado anterior la artrocentesis muestra hemartros sin grasa, dato importante porque la presencia de grasa y médula amarilla indicaría fractura intraarticular. La lesión de colaterales da líquido claro sin sangre ni grasa y la meniscal derrame seroso.","w":["La artritis séptica da líquido purulento.","La artrosis da líquido normal o levemente inflamatorio.","Correcta: sangre sin grasa orienta a lesión ligamentaria pura.","La grasa y la médula indicarían fractura intraarticular."]},{"s":"ORT","c":14,"t":"Fractura de Segond","q":"¿Con qué lesión ligamentaria se asocia la fractura de Segond?","o":["Con el tendón de Aquiles","Con el menisco interno","Con el ligamento cruzado posterior","Con el ligamento cruzado anterior"],"a":3,"e":"El ligamento cruzado anterior puede asociarse a la avulsión del margen tibial anterolateral, conocida como fractura de Segond. Se lesiona por rotación externa con la rodilla en extensión y se explora con cajón anterior, pivot shift y Lachman.","w":["El Aquiles no guarda relación con esta avulsión.","La lesión meniscal cursa con bloqueo articular.","El cruzado posterior se asocia al mecanismo del salpicadero.","Correcta: la avulsión del margen tibial anterolateral acompaña al cruzado anterior."]},{"s":"ORT","c":14,"t":"Lesión del salpicadero","q":"¿Qué ligamento se lesiona con el trauma directo sobre la tibia con la rodilla flexionada?","o":["El cruzado posterior","El colateral lateral","El cruzado anterior","El colateral medial"],"a":0,"e":"La lesión del cruzado posterior se conoce como lesión del salpicadero: trauma directo sobre la tibia con la rodilla en flexión, típico de accidentes de tránsito. Da cajón posterior positivo y su manejo suele ser conservador con inmovilización de 4 a 6 semanas.","w":["Correcta: el mecanismo de salpicadero lesiona el cruzado posterior.","El colateral lateral se lesiona por varo forzado.","El cruzado anterior se lesiona por rotación externa en extensión.","El colateral medial se lesiona por valgo forzado."]},{"s":"ORT","c":14,"t":"Ligamentos colaterales","q":"Relacione el mecanismo de lesión del colateral interno con el del externo:","o":["Interno por varo forzado; externo por valgo forzado de la rodilla","Interno por valgo forzado; externo por varo forzado","Interno por rotación externa; externo por trauma directo tibial","Interno por hiperextensión; externo por valgo forzado de la rodilla"],"a":1,"e":"Los colaterales se lesionan por valgo forzado el interno y por varo forzado el externo, con líquido claro sin sangre ni grasa en la artrocentesis, y se manejan con inmovilización de 4 a 6 semanas.","w":["Invierte ambos mecanismos.","Correcta: valgo para el interno y varo para el externo.","La rotación externa lesiona el cruzado anterior.","La hiperextensión no es el mecanismo descrito."]},{"s":"ORT","c":14,"t":"Lesión meniscal","q":"Deportista con dolor en interlínea posterior, derrame seroso y bloqueo articular recurrente. ¿Qué estructura está lesionada?","o":["El ligamento cruzado anterior","La rótula por condromalacia","El cuerno posterior del menisco interno","El ligamento colateral lateral"],"a":2,"e":"El cuerno posterior del menisco interno es el más afectado y la lesión más frecuente es la de asa de cubo, típica de jóvenes y deportistas. Cursa con dolor difuso, derrame seroso, bloqueo articular y dolor en la interlínea posterior.","w":["El cruzado anterior da inestabilidad y hemartros, no bloqueo.","La condromalacia da dolor anterior sin bloqueo.","Correcta: el bloqueo con derrame seroso es el cuadro meniscal típico.","El colateral lateral no produce bloqueo articular."]},{"s":"ORT","c":14,"t":"Exploración meniscal","q":"¿Qué rotación del talón explora el menisco interno?","o":["La rotación interna","La flexión plantar máxima","La dorsiflexión forzada","La rotación externa"],"a":3,"e":"En la exploración meniscal el talón orienta: la rotación externa explora el menisco interno y la interna el externo, junto con la prueba de McMurray. El tratamiento depende de la irrigación: sutura si la zona está bien vascularizada y meniscectomía parcial si no.","w":["La rotación interna explora el menisco externo.","La flexión plantar no interviene en la exploración meniscal.","La dorsiflexión tampoco explora los meniscos.","Correcta: la rotación externa dirige la exploración al menisco interno."]},{"s":"ORT","c":14,"t":"Forma de los meniscos","q":"Relacione la forma del menisco interno con la del externo:","o":["Interno en forma de C; externo en forma de O","Interno en forma de O; externo en forma de C completa","Interno en forma de C; externo también en forma de C","Interno triangular; externo en forma de C abierta"],"a":0,"e":"El menisco interno tiene forma de C y el externo de O. El cuerno posterior del interno es el más afectado y la lesión más frecuente es la de asa de cubo, con tratamiento dependiente de la vascularización de la zona.","w":["Correcta: C para el interno y O para el externo.","Invierte ambas formas.","El externo tiene forma de O, más cerrada.","El interno no es triangular sino en C."]},{"s":"ORT","c":14,"t":"Luxación de rodilla","q":"Paciente con luxación de rodilla reducida y signo del hoyuelo previo. ¿Qué complicación hay que vigilar y en qué plazo?","o":["Necrosis avascular de la rótula, al mes","Trombosis arterial poplítea, en las primeras 24 horas","Pseudoartrosis del platillo tibial, a los 6 meses","Síndrome compartimental, a partir de los 14 días"],"a":1,"e":"La luxación de rodilla es una urgencia porque se asocia a lesión del paquete vasculonervioso ciático poplíteo, con riesgo de trombosis arterial aguda dentro de las primeras 24 horas. Se acompaña del signo del hoyuelo y exige reducción inmediata con vigilancia estrecha de la circulación distal.","w":["La rótula no sufre necrosis avascular en este contexto.","Correcta: la trombosis poplítea puede instalarse en 24 horas.","La pseudoartrosis no es la complicación temida de la luxación.","El compartimental es una complicación aguda, no de dos semanas."]},{"s":"ORT","c":14,"t":"Luxación de rótula","q":"¿Qué factor anatómico predispone a la luxación lateral de rótula?","o":["Retracción del cruzado posterior","Ángulo Q menor de 10 grados","Ángulo Q mayor de 15 a 16 grados","Hipoplasia del cóndilo medial"],"a":2,"e":"La luxación de rótula es lateral y predomina en mujeres jóvenes adolescentes; el mecanismo es un valgo excesivo, favorecido por un ángulo Q mayor de 15 a 16 grados. Presenta la triple D de dolor, deformidad y disfunción, y se reduce medializando la rótula con la rodilla en extensión.","w":["El cruzado posterior no interviene en la estabilidad rotuliana.","Un ángulo Q disminuido no favorece la luxación.","Correcta: un ángulo Q aumentado lateraliza el vector del cuádriceps.","La hipoplasia troclear influye, pero el factor descrito es el ángulo Q."]},{"s":"ORT","c":14,"t":"Fractura de rótula","q":"¿Cuál es el tratamiento habitual de la fractura de rótula con fragmentos separados?","o":["Clavo endomedular","Yeso muslopedio sin cirugía","Rotulectomía total","Cerclaje de alambre"],"a":3,"e":"La fractura de rótula ocurre por golpe directo en jóvenes, con fragmentos separados por tracción del cuádriceps, y se maneja con cerclaje de alambre. La luxación rotuliana, en cambio, es lateral y se favorece por un ángulo Q aumentado.","w":["El clavo endomedular no aplica a un hueso sesamoideo.","El yeso no controla la separación por tracción muscular.","La rotulectomía total no es el manejo habitual.","Correcta: el cerclaje neutraliza la tracción del cuádriceps."]},{"s":"ORT","c":14,"t":"Fractura de tibia","q":"¿Cuál es la localización más frecuente de fractura de tibia y su complicación característica?","o":["Diáfisis; síndrome compartimental anterior","Metáfisis distal; necrosis avascular","Espina tibial; inestabilidad crónica","Platillo tibial; artrosis postraumática"],"a":0,"e":"La diáfisis tibial es la localización más frecuente y su complicación característica es el síndrome compartimental del compartimento anterior; además suelen ser abiertas, con alto riesgo de osteomielitis. La estable se maneja con yeso muslopedio y la inestable con clavo endomedular.","w":["Correcta: diáfisis y compartimento anterior son la asociación clásica.","La metáfisis distal no es la localización más frecuente.","La espina tibial se avulsiona y simula lesión del cruzado anterior.","El platillo tibial es intraarticular pero no el más frecuente."]},{"s":"ORT","c":14,"t":"Fractura estable de tibia","q":"Fractura cerrada de tibia transversa, no desplazada y sin lesión del peroné. ¿Cuál es el manejo?","o":["Placa y tornillos","Yeso muslopedio","Clavo endomedular","Fijación externa"],"a":1,"e":"La fractura cerrada estable de tibia, simple, transversa, no desplazada y sin lesión del peroné, se maneja con yeso muslopedio; la inestable requiere clavo endomedular. En las abiertas, el grado I se maneja como cerrada más antibióticos y los grados II y III con antibióticos, osteotaxis y colgajo.","w":["La placa no es el manejo descrito para la tibia estable.","Correcta: la fractura estable no requiere osteosíntesis.","El clavo se reserva para las inestables.","La fijación externa es para abiertas de grado II y III."]},{"s":"ORT","c":14,"t":"Fractura de cabeza de peroné","q":"Paciente con fractura de cabeza de peroné que no puede dorsiflexionar el pie. ¿Qué nervio se lesionó?","o":["El tibial posterior","El ciático poplíteo interno","El peroneo común","El safeno interno"],"a":2,"e":"La fractura de la cabeza del peroné compromete el nervio peroneo común o ciático poplíteo externo, que inerva el compartimento anterior: el resultado es la imposibilidad de dorsiflexión, es decir pie caído o equino.","w":["El tibial posterior inerva los flexores plantares.","El ciático poplíteo interno corresponde al tibial.","Correcta: el peroneo común rodea el cuello del peroné y da la dorsiflexión.","El safeno interno es sensitivo puro."]},{"s":"ORT","c":14,"t":"Osgood-Schlatter","q":"¿Qué lesión corresponde a la avulsión de la tuberosidad anterior de la tibia en el niño?","o":["Enfermedad de Sever","Fractura de Segond","Lesión de Ollanquist","Enfermedad de Osgood-Schlatter"],"a":3,"e":"La avulsión de la tuberosidad anterior de la tibia por tracción del cuádriceps corresponde en el niño a la enfermedad de Osgood-Schlatter. La avulsión de la espina tibial anterior simula ruptura de cruzado anterior, Segond es la avulsión del margen tibial anterolateral y Sever la osteocondrosis del calcáneo.","w":["Sever es la osteocondrosis del calcáneo.","Segond es la avulsión del margen tibial anterolateral.","Ollanquist es una fractura por estrés de la tibia proximal.","Correcta: es la apofisitis por tracción del cuádriceps en el niño."]},{"s":"ORT","c":14,"t":"Epónimos de tobillo","q":"Relacione la fractura de Dupuytren con la de Maisonneuve:","o":["Dupuytren bimaleolar; Maisonneuve peroné con membrana interósea","Dupuytren avulsión de tuberosidad tibial; Maisonneuve bimaleolar del tobillo","Dupuytren peroné con membrana interósea; Maisonneuve bimaleolar tibial y peronea","Dupuytren peroné distal con sindesmosis; Maisonneuve bimaleolar tibioperonea"],"a":0,"e":"La fractura de Dupuytren es bimaleolar, del maléolo tibial y del peroné. La de Maisonneuve combina fractura del peroné, ruptura de la membrana interósea y lesión del ligamento peroneotibial. Pott es distal del peroné con lesión de la sindesmosis, Tillaux-Chaput la avulsión de la tuberosidad tibial anterior y Wagstaffe la peronea anterior.","w":["Correcta: bimaleolar en Dupuytren y membrana interósea en Maisonneuve.","La avulsión de la tuberosidad tibial es Tillaux-Chaput.","Invierte ambos epónimos.","La lesión de sindesmosis con peroné distal es la de Pott."]},{"s":"ORT","c":14,"t":"Fractura más frecuente de tobillo","q":"¿Cuál es la fractura más frecuente del tobillo?","o":["Bimaleolar","Del maléolo peroneo","Del maléolo tibial","Del pilón tibial"],"a":1,"e":"La fractura más frecuente del tobillo es la del maléolo peroneo. Los epónimos de la región son Dupuytren para la bimaleolar, Maisonneuve para la del peroné con membrana interósea, Pott para la distal del peroné con lesión de la sindesmosis y Tillaux-Chaput y Wagstaffe para las avulsiones anteriores.","w":["La bimaleolar es la de Dupuytren, menos frecuente.","Correcta: el maléolo peroneo es la localización más frecuente.","El maléolo tibial se fractura con menor frecuencia.","El pilón tibial es de alta energía y poco frecuente."]},{"s":"ORT","c":14,"t":"Ruptura del tendón de Aquiles","q":"Atleta con dolor descrito como pedrada, deformidad en hachazo e imposibilidad de flexión plantar. ¿Qué maniobra confirma el diagnóstico?","o":["Maniobra de Lachman","Signo del cajón anterior","Maniobra de Thompson","Prueba de McMurray"],"a":2,"e":"La ruptura del tendón de Aquiles es la lesión tendinosa más frecuente, por cambios bruscos de dirección en saltadores y atletas. El dolor es el signo de pedrada, la deformidad el signo del hachazo y la disfunción la imposibilidad de flexión plantar, con maniobra de Thompson positiva.","w":["Lachman explora el cruzado anterior.","El cajón anterior de tobillo evalúa el peroneo astragalino anterior.","Correcta: Thompson es la maniobra específica del tendón de Aquiles.","McMurray explora los meniscos."]},{"s":"ORT","c":14,"t":"Fractura de calcáneo","q":"Paciente que cae de altura y se fractura el calcáneo. ¿Qué hay que explorar obligatoriamente?","o":["El manguito rotador","El tendón rotuliano","La articulación de la cadera","La columna vertebral"],"a":3,"e":"El calcáneo es el hueso más grande del tarso y el que más se fractura, típicamente por caída de altura, y por eso se asocia a fracturas vertebrales por transmisión axial de la fuerza: hay que explorar la columna. El astrágalo es el segundo en frecuencia y tiene alto riesgo de necrosis avascular.","w":["El manguito rotador no participa en este mecanismo.","El tendón rotuliano no se relaciona con la caída de altura.","La cadera puede lesionarse, pero la asociación descrita es vertebral.","Correcta: la transmisión axial de la energía compromete la columna."]},{"s":"ORT","c":14,"t":"Astrágalo","q":"¿Cuál es la complicación característica de la fractura de astrágalo?","o":["Necrosis avascular","Pseudoartrosis hipertrófica","Síndrome compartimental","Embolia grasa"],"a":0,"e":"El astrágalo es el segundo hueso del tarso en frecuencia de fractura y tiene alto riesgo de necrosis avascular por su vascularización precaria, igual que la cabeza femoral, el escafoides carpiano y la cabeza humeral.","w":["Correcta: su vascularización precaria explica el riesgo de necrosis.","La pseudoartrosis hipertrófica obedece a inestabilidad mecánica.","El compartimental es propio de la pierna y el antebrazo.","La embolia grasa se asocia a huesos largos."]},{"s":"ORT","c":14,"t":"Fractura de Jones","q":"Relacione la fractura de Jones con la de la base del quinto metatarsiano:","o":["Jones en la diáfisis del segundo; base por avulsión del peroneo lateral largo","Jones en la diáfisis del quinto; base por avulsión del peroneo lateral corto","Jones por avulsión del peroneo lateral corto; base en la diáfisis del quinto","Jones en la base del primero; base del quinto por avulsión del peroneo largo"],"a":1,"e":"La fractura de Jones asienta en la diáfisis del quinto metatarsiano, cerca de la base. La de la base del quinto es la más frecuente, también llamada pseudo-Jones o lesión de la bailarina, por avulsión del peroneo lateral corto tras inversión del pie. La fractura por fatiga del segundo metatarsiano es la del recluta.","w":["La de Jones es del quinto, no del segundo metatarsiano.","Correcta: diáfisis del quinto para Jones y avulsión para la de la base.","Invierte ambas lesiones.","La base del primero se relaciona con el peroneo lateral largo."]},{"s":"ORT","c":14,"t":"Pie zambo","q":"¿Cuáles son los componentes del pie zambo?","o":["Equino, valgo, abducto, pronado y plano","Plano, valgo, abducto, pronado y cavo","Equino, varo, aducto, supinado y cavo","Talo, varo, aducto, pronado y plano"],"a":2,"e":"El pie zambo o equinovaro combina equino, varo, aducción, supinación y cavo, y se asocia a síndrome de Edwards, oligohidramnios y bridas amnióticas. El tratamiento es progresivo con yesos seriados por el método de Ponseti más tenotomía del tendón de Aquiles.","w":["La combinación de valgo y abducción es la contraria.","Esa combinación describe un pie plano valgo.","Correcta: equino, varo, aducto, supinado y cavo.","No corresponde a los componentes descritos."]},{"s":"ORT","c":14,"t":"Método de Ponseti","q":"¿En qué consiste el tratamiento del pie zambo por el método de Ponseti?","o":["Artrodesis triple precoz","Férula nocturna solamente","Corsé de tres puntos hasta la madurez","Yesos seriados más tenotomía del Aquiles"],"a":3,"e":"El tratamiento del pie zambo es progresivo con yesos seriados por el método de Ponseti más tenotomía del tendón de Aquiles, y solo si la desviación es muy severa se corrige quirúrgicamente. El pie plano es el aplanamiento del arco longitudinal interno con hiperlaxitud y el cavo por hipertonicidad plantar.","w":["La artrodesis triple no es tratamiento inicial.","La férula sola no corrige la deformidad.","El corsé de tres puntos trata la escoliosis.","Correcta: corrección progresiva con yesos seriados y tenotomía."]},{"s":"ORT","c":15,"t":"Contusión articular","q":"¿Qué mediadores se liberan en la contusión articular?","o":["TNF e IL-1","Interferón gamma exclusivo","Histamina y bradicinina","VEGF y PDGF"],"a":0,"e":"La contusión articular es una lesión traumática cerrada por golpe directo, sin penetración de la piel, que lesiona vasos periarticulares y daña partes blandas y cartílago. El impacto afecta el hueso subcondral y el fibrocartílago, con liberación de TNF e IL-1; las perspectivas terapéuticas apuntan a bloquear esos mediadores.","w":["Correcta: TNF e IL-1 son los mediadores descritos.","El interferón gamma no es el mediador señalado.","La histamina no es el mediador central de la contusión.","El VEGF se relaciona con angiogénesis tumoral."]},{"s":"ORT","c":15,"t":"Estudio más sensible en la contusión","q":"¿Cuál es el estudio más sensible en la contusión articular y qué muestra?","o":["Ecografía; lesión del cartílago hialino","Resonancia magnética; edema óseo en T2 y STIR","Gammagrafía; captación focal del trazador","Radiografía simple; trazo de la fractura oculto"],"a":1,"e":"La resonancia es la prueba más sensible en la contusión articular: muestra edema óseo en secuencias T2 y STIR y detecta lesión condral, además de biomarcadores de riesgo de artrosis. El tratamiento incluye artrocentesis para drenar hematomas.","w":["La ecografía no valora el hueso subcondral.","Correcta: la resonancia detecta el edema óseo y la lesión condral.","La gammagrafía es útil en fracturas por estrés.","La radiografía no muestra edema óseo."]},{"s":"ORT","c":15,"t":"Grados de contusión","q":"Contusión con zona central necrótica y escara. ¿Qué grado es?","o":["Segundo grado","Primer grado","Tercer grado","No se clasifica por grados"],"a":2,"e":"El primer grado de contusión es muy localizado, con rotura de vasos pequeños que produce petequias sin secuelas; el segundo rompe vasos y linfáticos de mayor calibre y produce edema, equimosis y hematoma; el tercero implica lesión vascular con isquemia, necrosis tisular y zona central necrótica con escara.","w":["El segundo grado produce equimosis y hematoma.","El primer grado solo produce petequias.","Correcta: la necrosis con escara define el tercer grado.","Sí existe una clasificación en tres grados."]},{"s":"ORT","c":15,"t":"Esguince de tobillo","q":"¿Cuál es el ligamento más frecuentemente lesionado en el esguince de tobillo?","o":["El deltoideo profundo","El peroneo calcáneo","El peroneotibial posterior","El peroneo astragalino anterior"],"a":3,"e":"Los esguinces laterales de tobillo por inversión o supinación son los más comunes y el ligamento más lesionado es el peroneo astragalino anterior, sobre todo en mujeres. Los deltoideos, mediales, se lesionan por eversión o pronación.","w":["El deltoideo se lesiona por eversión y con menor frecuencia.","El peroneo calcáneo participa, sin ser el más lesionado.","El peroneotibial posterior se lesiona en esguinces sindesmóticos.","Correcta: el peroneo astragalino anterior es el más lesionado."]},{"s":"ORT","c":15,"t":"Esguince sindesmótico","q":"¿Qué caracteriza al esguince sindesmótico y cuál es su manejo?","o":["Rotación con eversión; la mayoría requiere cirugía","Hiperflexión plantar; inmovilización de 7 a 10 días","Trauma directo tibial; manejo con vendaje elástico","Inversión con supinación; manejo conservador de rutina"],"a":0,"e":"Los esguinces sindesmóticos combinan rotación y eversión, son complejos, se asocian a fracturas de tobillo y la mayoría requiere corrección quirúrgica. Los laterales por inversión y supinación son los más comunes y afectan al peroneo astragalino anterior.","w":["Correcta: rotación con eversión y necesidad frecuente de cirugía.","La hiperflexión plantar no es el mecanismo descrito.","El trauma directo tibial lesiona el cruzado posterior.","La inversión con supinación produce el esguince lateral común."]},{"s":"ORT","c":15,"t":"Grados de esguince","q":"Esguince con ruptura parcial menor del 50% y laxitud moderada. ¿Qué grado es y cómo se maneja?","o":["Grado I; vendaje elástico y hielo local","Grado II; férula y elevación del miembro","Grado III; cirugía reparadora","Grado II; yeso circular inmediato"],"a":1,"e":"El grado I es microrruptura con estabilidad conservada, manejada con vendaje elástico y hielo. El grado II es ruptura parcial menor del 50% con laxitud leve a moderada, y se inmoviliza con férula elevando el miembro. El grado III es ruptura total mayor del 50% con inestabilidad franca y puede requerir cirugía.","w":["El grado I no produce laxitud moderada.","Correcta: grado II con férula, no con yeso circular.","El grado III implica ruptura total mayor del 50%.","El yeso circular precoz puede desencadenar compartimental."]},{"s":"ORT","c":15,"t":"Por qué férula y no yeso","q":"¿Por qué no se coloca yeso circular en las primeras 48 horas de un esguince?","o":["Porque el yeso impide la consolidación ligamentaria","Porque el yeso favorece la pseudoartrosis","El edema en aumento puede generar síndrome compartimental","Porque el yeso produce necrosis avascular"],"a":2,"e":"La inmovilización del esguince grado II se hace con férula y no con yeso circular, porque colocar un yeso dentro de las primeras 48 horas, cuando el edema todavía aumenta, puede generar síndrome compartimental. Es el principio general del manejo de fracturas: preferir férulas y dejar el yeso a partir del tercer día.","w":["El yeso no impide la cicatrización del ligamento.","Los ligamentos no desarrollan pseudoartrosis.","Correcta: el yeso circular comprime un miembro que sigue edematizándose.","La necrosis avascular no depende del tipo de inmovilización."]},{"s":"ORT","c":15,"t":"Reparación ligamentosa","q":"¿Qué célula lidera la fase inflamatoria de la reparación ligamentosa?","o":["El condrocito","El osteoclasto","El neutrófilo","El macrófago"],"a":3,"e":"La reparación ligamentosa tiene tres fases: degeneración con liberación de proteasas; inflamación, donde los macrófagos lideran la actividad inflamatoria y secretan factores de crecimiento; y remodelación, donde el tejido se hace menos celular y aumenta el colágeno tipo I.","w":["El condrocito interviene en el cartílago, no en el ligamento.","El osteoclasto reabsorbe hueso, no participa aquí.","El neutrófilo participa, pero el protagonista es el macrófago.","Correcta: el macrófago lidera la inflamación y secreta factores de crecimiento."]},{"s":"ORT","c":15,"t":"Colágeno de la remodelación","q":"¿Qué colágeno aumenta en la fase de remodelación ligamentosa?","o":["El tipo I","El tipo IV","El tipo III","El tipo II"],"a":0,"e":"En la remodelación ligamentosa el tejido cicatricial se hace menos celular, aumenta la proporción de colágeno tipo I y con ello la resistencia. El tipo II es cartilaginoso y aparece en el callo blando de la consolidación ósea.","w":["Correcta: el tipo I aporta la resistencia final.","El tipo IV es de membranas basales.","El tipo III predomina en fases precoces.","El tipo II es cartilaginoso, propio del callo blando."]},{"s":"ORT","c":15,"t":"Esguince y luxación","q":"Relacione la tríada del esguince con la de la luxación:","o":["Esguince dolor, deformidad y disfunción; luxación dolor, inestabilidad y crepitación","Esguince dolor, inestabilidad y disfunción; luxación dolor, deformidad y disfunción","Esguince dolor, crepitación y equimosis; luxación dolor, deformidad y disfunción","Esguince dolor, deformidad y crepitación; luxación dolor, inestabilidad y disfunción"],"a":1,"e":"El esguince genera dolor, inestabilidad y disfunción; no deforma la articulación porque no pierde la congruencia. Las luxaciones, fracturas y rupturas tendinosas generan las tres D: dolor, deformidad y disfunción. La luxación es intraarticular y el esguince extraarticular.","w":["Invierte ambas tríadas.","Correcta: inestabilidad en el esguince y deformidad en la luxación.","El esguince no cursa característicamente con crepitación.","El esguince no deforma la articulación."]},{"s":"ORT","c":15,"t":"Nomenclatura de la luxación","q":"¿Qué hueso determina el nombre de una luxación?","o":["El de mayor tamaño","El proximal","El distal","El que conserva la cápsula"],"a":2,"e":"En una luxación el hueso distal determina la denominación. En la glenohumeral se habla de luxación anterior porque es la cabeza humeral, el segmento distal, la que se desplaza hacia adelante. La luxación es una pérdida permanente de la relación articular con disrupción capsuloligamentosa.","w":["El tamaño no es el criterio de denominación.","El proximal permanece fijo y no da el nombre.","Correcta: manda el segmento distal de la articulación.","La integridad capsular no determina el nombre."]},{"s":"ORT","c":15,"t":"Luxación más frecuente por edad","q":"Relacione la luxación más frecuente del adulto con la del niño:","o":["Adulto codo posterior; niño hombro anterior glenohumeral","Adulto hombro anterior; niño cadera posterior traumática","Adulto cadera posterior; niño codo posterior por caída","Adulto hombro anterior; niño codo posterior"],"a":3,"e":

","La sombra positiva se mueve en el mismo sentido.","Correcta: el movimiento inverso define la sombra negativa.","El punto de neutralización es cuando la sombra deja de moverse."]},{"s":"OFT","c":3,"t":"Escritura de la receta óptica","q":"Ordene correctamente los elementos de una receta óptica:","o":["Esfera, eje y cilindro","Cilindro, esfera y eje","Eje, esfera y cilindro","Esfera, cilindro y eje"],"a":3,"e":"En la receta se escribe siempre primero la esfera, después el cilindro y a continuación su eje, porque el eje define la orientación del meridiano corregido por el cilindro y no tiene sentido aplicado a una esfera, que actúa igual en todos los meridianos. Un ejemplo del propio documento es −1,00 de esfera con −1,00 de cilindro a un eje determinado.","w":["El eje acompaña al cilindro, no puede precederlo.","La esfera precede al cilindro en la notación.","El eje se escribe al final, ligado al cilindro.","Correcta: esfera, cilindro y por último el eje que corresponde al cilindro."]},{"s":"OFT","c":3,"t":"Afaquia y aniseiconia","q":"¿Por qué la afaquia unilateral corregida con gafas producía aniseiconia?","o":["Las gafas de +12 D magnificaban la imagen de ese ojo","Porque el ojo afáquico desarrollaba astigmatismo alto","Porque el ojo afáquico perdía la visión de color","Porque la córnea se aplanaba tras la cirugía"],"a":0,"e":"El paciente afáquico quedaba sin cristalino, es decir sin las 23 a 33 dioptrías que aportaba, y necesitaba gafas de alrededor de +12 dioptrías, muy gruesas y pesadas, que distorsionaban las imágenes y producían aniseiconia cuando la afaquia era unilateral, porque el tamaño de la imagen de ese ojo no coincidía con el del otro. El lente intraocular resolvió el problema.","w":["Correcta: la potencia elevada de la gafa cambia el tamaño de la imagen.","El problema es el tamaño de la imagen, no el astigmatismo.","La visión de color no se altera por la afaquia.","El aplanamiento corneal no explica la aniseiconia."]},{"s":"OFT","c":4,"t":"Trauma químico: ácido y álcali","q":"¿Por qué el álcali produce un daño ocular peor que el ácido?","o":["Porque precipita en la cámara anterior","No coagula proteínas y penetra en profundidad","Porque destruye solo el endotelio corneal","Porque eleva la presión intraocular de inmediato"],"a":1,"e":"El trauma químico es una emergencia oftalmológica. El ácido coagula las proteínas superficiales y esa barrera limita su propia penetración; el álcali, en cambio, no coagula, penetra en profundidad y produce destrucción extensa, por eso es el peor. El tratamiento inmediato es irrigación copiosa y prolongada, antes de cualquier otra medida.","w":["No se trata de un precipitado camerular.","Correcta: sin barrera de coagulación el álcali sigue penetrando.","El daño es extenso y transmural, no solo endotelial.","La presión intraocular no es el mecanismo del daño inicial."]},{"s":"OFT","c":4,"t":"Primera medida en la quemadura ocular","q":"Paciente que recibió salpicadura de hidróxido de sodio en el ojo. ¿Cuál es la primera medida?","o":["Corticoide tópico inmediato","Referencia urgente sin tratar","Irrigación copiosa y prolongada","Anestésico tópico y oclusión"],"a":2,"e":"En el trauma químico el tratamiento inmediato es irrigación copiosa y prolongada, antes de cualquier otra medida, porque cada minuto de contacto aumenta la penetración, sobre todo con álcalis, que no coagulan proteínas. Después se usa anestésico tópico como la proparacaína para poder irrigar y explorar, se dilata la pupila y se dan esteroides tópicos y lubricantes.","w":["El corticoide viene después, en las primeras una o dos semanas.","Referir sin irrigar permite que el álcali siga penetrando.","Correcta: la irrigación precede a cualquier otra intervención.","El anestésico facilita la irrigación, pero no es la primera medida."]},{"s":"OFT","c":4,"t":"Midriáticos en la quemadura ocular","q":"¿Para qué se dilata la pupila en la quemadura ocular?","o":["Para facilitar la exploración del fondo de ojo","Para prevenir la opacificación corneal","Para bajar la presión intraocular","Para relajar el cuerpo ciliar y aliviar dolor y fotofobia"],"a":3,"e":"En la quemadura ocular se usa anestésico tópico como la proparacaína para poder irrigar y explorar, se dilata la pupila para relajar el cuerpo ciliar y quitar fotofobia y dolor, se dan esteroides tópicos durante las primeras una o dos semanas y lubricantes abundantes, vigilando la presión intraocular por el uso de corticoide.","w":["La exploración del fondo no es la prioridad en este cuadro.","La opacificación depende de la profundidad del daño, no de la midriasis.","La midriasis no baja la presión intraocular.","Correcta: la cicloplejia relaja el ciliar y con ello el dolor y la fotofobia."]},{"s":"OFT","c":4,"t":"Cuerpo extraño corneal","q":"Trabajador de metalmecánica con cuerpo extraño corneal que solo comprometió el epitelio. ¿Cuál es el pronóstico?","o":["El epitelio se regenera y la córnea queda transparente","Queda un leucoma cicatricial permanente","Se produce descompensación endotelial","Se desarrolla astigmatismo irregular severo"],"a":0,"e":"El cuerpo extraño corneal es típico del trabajador de metalmecánica o de la pulidora, y se retira con aguja de insulina bajo anestesia tópica y lámpara de hendidura. Si solo comprometió el epitelio, este se regenera y la córnea queda transparente; si penetró el estroma, cambia la arquitectura de las fibras y queda una cicatriz o leucoma.","w":["Correcta: la lesión epitelial pura cura sin dejar huella.","El leucoma aparece cuando se compromete el estroma.","El endotelio no se afecta en una lesión epitelial superficial.","El astigmatismo irregular se asocia a cicatrices estromales."]},{"s":"OFT","c":4,"t":"Signo de Seidel","q":"Al instilar fluoresceína se observa el colorante lavándose en un chorro. ¿Qué significa?","o":["Erosión epitelial simple; oclusión y lubricación","Perforación corneal; es emergencia quirúrgica","Queratitis herpética; antivirales tópicos","Ojo seco severo; lubricación intensiva"],"a":1,"e":"El signo de Seidel se busca instilando fluoresceína y observando con luz azul de cobalto: si el humor acuoso está saliendo por una herida corneal, arrastra y diluye el colorante, que se ve lavarse en un chorro. Un Seidel positivo significa perforación y es emergencia quirúrgica, con sutura de nylon fino en quirófano.","w":["La erosión simple tiñe pero no lava el colorante.","Correcta: el lavado del colorante indica fuga de humor acuoso.","El herpes da patrón dendrítico, no lavado en chorro.","El ojo seco acorta el tiempo de ruptura lagrimal, sin fuga."]},{"s":"OFT","c":4,"t":"Fractura de pared medial","q":"Paciente con trauma orbitario que presenta enfisema orbitario al sonarse la nariz. ¿Qué fractura tiene?","o":["Del piso orbitario, con atrapamiento del recto inferior","Del techo orbitario, con fístula de líquido cefalorraquídeo","De la pared medial, con rotura de celdillas etmoidales","Del reborde lateral, con desplazamiento cigomático"],"a":2,"e":"La fractura de la pared medial rompe las celdillas etmoidales y deja pasar aire a la órbita, con enfisema orbitario que aumenta al sonarse la nariz. La fractura blow-out del piso hernia contenido orbitario hacia el seno maxilar y atrapa el recto inferior: enoftalmos, limitación de la elevación, diplopía vertical y a veces anestesia infraorbitaria.","w":["La fractura del piso da diplopía vertical y enoftalmos, no enfisema.","La fractura de techo se asocia a compromiso intracraneal.","Correcta: el etmoides es la vía de entrada del aire a la órbita.","La fractura del reborde lateral no comunica con senos aéreos."]},{"s":"OFT","c":4,"t":"Hipema traumático","q":"¿Por qué se coloca al paciente con hipema a 45 grados?","o":["Para facilitar la reabsorción por la malla trabecular","Para reducir la presión intraocular por gravedad","Para evitar la formación de sinequias posteriores","Para que la sangre decante y no cubra el eje visual"],"a":3,"e":"El hipema es sangre en cámara anterior y se clasifica según ocupe un tercio, dos tercios o la totalidad. Se coloca al paciente a 45 grados para que la sangre decante y no cubra el eje visual, y se trata con hipotensores oculares, midriáticos, corticoides y reposo. Las complicaciones son el aumento de presión intraocular y el resangrado.","w":["La reabsorción trabecular no depende de la postura.","La posición no modifica la presión intraocular de forma relevante.","Las sinequias se previenen con midriáticos, no con la posición.","Correcta: la posición permite que la sangre sedimente por debajo del eje visual."]},{"s":"OFT","c":4,"t":"Vía lagrimal","q":"Ordene el recorrido de la lágrima desde el punto lagrimal:","o":["Puntos, canalículos, canalículo común, saco, conducto lacrimonasal","Saco lagrimal, puntos, canalículos, conducto lacrimonasal, meato","Conducto lacrimonasal, saco, canalículos, puntos lagrimales","Canalículo común, puntos lagrimales, saco, conducto, meato inferior"],"a":0,"e":"La lágrima entra por los puntos lagrimales superior e inferior del canto interno, pasa a los canalículos superior e inferior, al canalículo común, al saco lagrimal y al conducto lacrimonasal, y desemboca en el meato nasal inferior. Esa continuidad explica por qué al llorar mucho se tapa la nariz.","w":["Correcta: de los puntos al meato nasal inferior en ese orden.","El saco es una estación intermedia, no el inicio.","Invierte por completo el sentido del drenaje.","Los puntos lagrimales son el punto de entrada."]},{"s":"OFT","c":4,"t":"Lesión de canalículos","q":"Trauma del canto interno con laceración canalicular. ¿Por qué no basta suturar la piel?","o":["Porque se infecta el saco lagrimal","El canalículo cicatriza cerrado y queda epífora","Porque la piel del canto no cicatriza sin injerto","Porque se pierde la película lipídica de la lágrima"],"a":1,"e":"Cuando el trauma del canto interno lacera los canalículos, un cirujano oculoplástico debe recanalizarlos con tubos de silicón, uno por el canalículo superior y otro por el inferior, llevándolos hasta el meato nasal inferior donde se anudan. Si solo se sutura la piel, el canalículo cicatriza cerrado y el paciente queda con epífora permanente.","w":["La dacriocistitis es una complicación posible, no la regla.","Correcta: sin tutor de silicón la vía se estenosa y aparece epífora.","La piel del canto cicatriza bien; el problema es la vía lagrimal.","La capa lipídica depende de las glándulas de Meibomio."]},{"s":"OFT","c":4,"t":"Película lagrimal","q":"¿Cuál es la función de la capa lipídica de la película lagrimal?","o":["Nutrir el endotelio corneal","Aportar el volumen acuoso","Evitar la evaporación","Adherir la lágrima al epitelio"],"a":2,"e":"La película lagrimal tiene tres capas: lipídica superficial, que evita la evaporación; acuosa media; y mucínica interna, que permite que la lágrima se adhiera al epitelio. El tiempo de ruptura lagrimal se mide con fluoresceína y luz azul, y lo normal es de 12 segundos o más; por debajo de 12 segundos indica ojo seco.","w":["El endotelio se nutre del humor acuoso, no de la lágrima.","El volumen lo aporta la capa acuosa media.","Correcta: la capa lipídica sella la superficie y frena la evaporación.","La adherencia al epitelio corresponde a la capa mucínica."]},{"s":"OFT","c":4,"t":"Tiempo de ruptura lagrimal","q":"Tiempo de ruptura lagrimal de 6 segundos. ¿Cómo se interpreta?","o":["Exceso de producción lagrimal","Normal","Obstrucción de la vía lagrimal","Ojo seco"],"a":3,"e":"El tiempo de ruptura lagrimal se mide con fluoresceína y luz azul, y lo normal es de 12 segundos o más; por debajo de 12 segundos indica ojo seco. La película lagrimal tiene tres capas: lipídica superficial que evita la evaporación, acuosa media y mucínica interna que permite la adherencia al epitelio.","w":["El exceso de lágrima daría epífora, no ruptura precoz.","El valor normal es de 12 segundos o más.","La obstrucción de la vía produce epífora, no ojo seco.","Correcta: por debajo de 12 segundos la película es inestable."]},{"s":"OFT","c":4,"t":"Cerclaje escleral","q":"¿Qué efecto refractivo tiene el cerclaje escleral?","o":["Alarga el eje y deja el ojo más miope","No modifica la refracción del ojo","Induce astigmatismo irregular sin cambio esférico","Acorta el eje y deja el ojo más hipermétrope"],"a":0,"e":"El cerclaje escleral es un cinturón alrededor del globo que indenta la esclera y acerca la pared al epitelio pigmentario, con lo que reaplica la retina; el precio es que alarga el eje anteroposterior y deja al ojo más miope. La otra vía es la vitrectomía por pars plana, a unos 4 mm del limbo, con corte y aspiración del vítreo.","w":["Correcta: al indentar el globo se alarga el eje y aumenta la miopía.","Sí modifica la refracción de forma previsible.","El cambio principal es esférico, por alargamiento axial.","El efecto es el opuesto: el ojo queda más miope."]},{"s":"OFT","c":4,"t":"Oftalmología y láser","q":"¿Por qué la oftalmología fue la primera especialidad en usar láser?","o":["Porque el ojo tolera cualquier longitud de onda","Los medios del ojo son transparentes","Porque la retina carece de inervación sensitiva","Porque no requiere anestesia de ningún tipo"],"a":1,"e":"La oftalmología fue la primera especialidad médica en usar láser, precisamente porque los medios del ojo son transparentes y permiten depositar energía en el fondo sin abrir nada. LASER es el acrónimo de Light Amplification by Stimulated Emission of Radiation, y el primer láser funcional lo construyó Maiman a partir del rubí.","w":["No todas las longitudes de onda son inocuas para el ojo.","Correcta: la transparencia permite tratar el fondo sin cirugía abierta.","La ausencia de inervación retiniana no explica el acceso óptico.","Muchos procedimientos láser requieren anestesia tópica."]},{"s":"OFT","c":4,"t":"Fotocoagulación en el albino","q":"¿Por qué la fotocoagulación no funciona en un paciente albino?","o":["Porque su retina es más delgada","Porque su córnea dispersa el láser","Carece del pigmento que absorbe la energía","Porque su presión intraocular es más alta"],"a":2,"e":"La fotocoagulación es un láser térmico y necesita un pigmento que absorba la energía, típicamente la melanina del epitelio pigmentario de la retina; en el albino, que carece de pigmento, sencillamente no funciona. Es el láser más usado en oftalmología, con la panfotocoagulación de la retinopatía diabética como aplicación principal.","w":["El grosor retiniano no es el factor limitante.","La dispersión corneal no explica el fracaso.","Correcta: sin melanina no hay absorción y no se genera el efecto térmico.","La presión intraocular no interviene en la absorción del láser."]},{"s":"OFT","c":4,"t":"Tipos de láser","q":"Relacione el láser Nd:YAG con el excímer según su efecto y su uso:","o":["Nd:YAG fotocoagulación térmica de retina; excímer fotodisrupción de la cápsula","Nd:YAG fotodescomposición para córnea; excímer fotodisrupción para capsulotomía","Nd:YAG fotodisrupción de retina periférica; excímer fotocoagulación macular focal","Nd:YAG fotodisrupción para capsulotomía; excímer fotodescomposición para córnea"],"a":3,"e":"El Nd:YAG produce fotodisrupción, un pulso gigantesco de energía en nanosegundos, y su uso principal es la capsulotomía posterior tras la cirugía de catarata. El excímer produce fotodescomposición con luz ultravioleta de onda muy corta, no necesita pigmento porque la córnea no lo tiene, y es el láser de la cirugía refractiva.","w":["La fotocoagulación térmica corresponde al láser de argón o similar.","Invierte ambos láseres.","Ninguno de los dos se usa como describe la opción.","Correcta: fotodisrupción capsular frente a fotodescomposición corneal."]},{"s":"OFT","c":4,"t":"LASIK","q":"¿Cómo corrige el LASIK la miopía?","o":["Ablaciona estroma para aplanar la córnea","Acorta el eje anteroposterior del ojo","Sustituye el cristalino por un lente","Engrosa la córnea central con injerto"],"a":0,"e":"En el LASIK se levanta un flap corneal, se ablaciona estroma con excímer para aplanar la córnea y desplazar así la imagen hacia atrás, hasta la retina, y se repone el flap sin sutura. La PRK es la variante sin flap, sobre superficie. La queratotomía radial, que hacía incisiones radiales con bisturí, está superada.","w":["Correcta: aplanar la córnea reduce su poder y lleva el foco a la retina.","El eje axial no se modifica con cirugía refractiva corneal.","La sustitución del cristalino es la cirugía de catarata.","No se añade tejido: se retira estroma."]},{"s":"OFT","c":4,"t":"PRK y LASIK","q":"¿Qué diferencia a la PRK del LASIK?","o":["La PRK trata solo hipermetropía","La PRK no levanta flap corneal","La PRK requiere sutura corneal","La PRK no usa láser excímer"],"a":1,"e":"En el LASIK se levanta un flap corneal, se ablaciona estroma con excímer y se repone el flap sin sutura. La PRK es la variante sin flap, actuando sobre la superficie. Ambas usan excímer, que produce fotodescomposición con luz ultravioleta de onda muy corta y no necesita pigmento porque la córnea no lo tiene.","w":["Ambas pueden tratar miopía, hipermetropía y astigmatismo.","Correcta: la PRK trabaja sobre superficie, sin crear flap.","Ninguna de las dos requiere sutura corneal.","Ambas técnicas emplean láser excímer."]},{"s":"OFT","c":4,"t":"Cirugía macroscópica","q":"¿Cuál de los siguientes procedimientos NO pertenece a la cirugía ocular macroscópica?","o":["Cirugía de estrabismo","Pterigión","Vitrectomía","Corrección de ptosis"],"a":2,"e":"La cirugía ocular se divide en macroscópica, que se hace sin microscopio e incluye estrabismo y oculoplástica, con ptosis, entropión, ectropión, chalazión, orzuelo, vías lagrimales, tumores palpebrales, pterigión, botox, evisceración, enucleación y exenteración; y microscópica, que sí requiere microscopio, con la cirugía de segmento anterior y posterior, incluida la vitrectomía.","w":["El estrabismo se opera sin microscopio.","El pterigión figura entre los procedimientos macroscópicos.","Correcta: la vitrectomía es cirugía microscópica de segmento posterior.","La ptosis es cirugía oculoplástica macroscópica."]},{"s":"OFT","c":4,"t":"Queratitis fotoeléctrica","q":"Soldador que a las pocas horas de trabajar sin protección despierta de noche con dolor ocular intenso. ¿Qué se verá al teñir con fluoresceína?","o":["Una úlcera geográfica única","Un anillo perilímbico blanquecino","Un patrón dendrítico ramificado","Múltiples puntitos epiteliales dispersos"],"a":3,"e":"La queratitis fotoeléctrica es el daño del epitelio corneal por radiación ultravioleta en soldadores sin protección; el dolor aparece horas después, típicamente en la noche, y al teñir con fluoresceína se ven múltiples puntitos epiteliales dispersos. El patrón dendrítico, en cambio, es el del herpes simple.","w":["La úlcera geográfica es una forma evolucionada de queratitis herpética.","El anillo perilímbico blanquecino es el arco senil.","El patrón dendrítico corresponde al herpes simple.","Correcta: la queratitis punteada difusa es el hallazgo típico."]},{"s":"OFT","c":5,"t":"Signos de afección conjuntival","q":"¿Qué es la quemosis?","o":["Edema conjuntival","Hemorragia subconjuntival","Formación de folículos","Secreción purulenta abundante"],"a":0,"e":"La conjuntiva es una membrana mucosa con una porción palpebral o tarsal, que recubre la cara interna de los párpados, y una bulbar, que cubre el globo hasta el limbo. Sus signos de afección son hiperemia, quemosis, que es el edema, papilas, folículos, membranas y pseudomembranas y hemorragia subconjuntival.","w":["Correcta: quemosis es el término para el edema conjuntival.","La hemorragia subconjuntival es otro de los signos descritos.","Los folículos son agregados linfoides, no edema.","La secreción no forma parte de la definición de quemosis."]},{"s":"OFT","c":5,"t":"Papilas y folículos","q":"Relacione las papilas con los folículos según su morfología y su causa:","o":["Papilas con vaso central solo en tracoma; folículos sin vaso solo en conjuntivitis alérgica","Papilas con vaso central en alergia y bacterias; folículos sin vaso en virus y Chlamydia","Papilas con vaso central en virus y Chlamydia; folículos sin vaso en alergia y bacterias","Papilas sin vaso central en virus; folículos con vaso central en cuadros alérgicos"],"a":1,"e":"Papilas y folículos son las dos respuestas de la conjuntiva tarsal. Las papilas, con un vaso central, predominan en cuadros alérgicos y bacterianos; los folículos, agregados linfoides sin vaso central, predominan en las conjuntivitis virales y por Chlamydia, incluidos el tracoma y la fiebre faringoconjuntival.","w":["Ninguna de las dos respuestas es exclusiva de una sola entidad.","Correcta: vaso central en papilas, alérgico-bacteriano; folículos en viral y Chlamydia.","Los folículos son los que predominan en cuadros virales.","Invierte ambas respuestas conjuntivales."]},{"s":"OFT","c":5,"t":"Oftalmía neonatorum: agente más precoz","q":"Recién nacido de 2 días con conjuntivitis purulenta severa. ¿Cuál es el agente más probable?","o":["Herpes simple","Staphylococcus aureus","Neisseria gonorrhoeae","Chlamydia trachomatis"],"a":2,"e":"La oftalmía neonatorum aparece en el primer mes de vida. Neisseria gonorrhoeae es la más severa y la más precoz, con incubación de 1 a 4 días; Chlamydia trachomatis es la más frecuente, con 5 a 14 días, y el herpes incuba entre 5 y 7 días. La profilaxis clásica es la maniobra de Credé.","w":["El herpes incuba entre 5 y 7 días.","No es el agente descrito para este cuadro neonatal.","Correcta: el gonococo es el más precoz y el más severo.","Chlamydia es el más frecuente, pero incuba de 5 a 14 días."]},{"s":"OFT","c":5,"t":"Oftalmía neonatorum: agente más frecuente","q":"¿Cuál es el agente más frecuente de la oftalmía neonatorum?","o":["Neisseria gonorrhoeae","Herpes simple","Haemophilus influenzae","Chlamydia trachomatis"],"a":3,"e":"En la oftalmía neonatorum, Neisseria gonorrhoeae es la más severa y la más precoz, con incubación de 1 a 4 días; Chlamydia trachomatis es la más frecuente, con incubación de 5 a 14 días, y el herpes incuba entre 5 y 7 días. La profilaxis clásica es la maniobra de Credé, y el gonococo puede perforar la córnea, lo que obliga a tratamiento sistémico.","w":["El gonococo es el más severo y precoz, no el más frecuente.","El herpes es menos frecuente que Chlamydia.","No figura como agente principal de la oftalmía neonatorum.","Correcta: Chlamydia es el agente más frecuente."]},{"s":"OFT","c":5,"t":"Fiebre faringoconjuntival","q":"¿Qué serotipos de adenovirus producen la fiebre faringoconjuntival?","o":["3, 4 y 7","70","1 y 2","8"],"a":0,"e":"Los adenovirus 3, 4 y 7 producen la fiebre faringoconjuntival: fiebre, faringitis, adenopatía cervical y preauricular, conjuntivitis folicular y pseudomembranas. El serotipo 8 causa la queratoconjuntivitis epidémica, típicamente unilateral y sin síntomas sistémicos. La conjuntivitis hemorrágica aguda la produce el enterovirus serotipo 70.","w":["Correcta: los serotipos 3, 4 y 7 dan el cuadro faringoconjuntival.","El 70 es un enterovirus y causa la conjuntivitis hemorrágica.","No son los serotipos descritos para este cuadro.","El serotipo 8 produce la queratoconjuntivitis epidémica."]},{"s":"OFT","c":5,"t":"Queratoconjuntivitis epidémica","q":"Paciente con conjuntivitis folicular unilateral, sin fiebre ni faringitis. ¿Qué serotipo hay que sospechar?","o":["Adenovirus 7","Adenovirus 8","Adenovirus 3","Enterovirus 70"],"a":1,"e":"El serotipo 8 de adenovirus causa la queratoconjuntivitis epidémica, típicamente unilateral y sin síntomas sistémicos, a diferencia de la fiebre faringoconjuntival por serotipos 3, 4 y 7, que asocia fiebre, faringitis y adenopatía cervical y preauricular. La conjuntivitis hemorrágica aguda la produce el enterovirus serotipo 70.","w":["El 7 también pertenece al grupo faringoconjuntival.","Correcta: el 8 da el cuadro unilateral sin manifestaciones sistémicas.","El 3 forma parte del grupo de la fiebre faringoconjuntival.","El enterovirus 70 causa la forma hemorrágica aguda."]},{"s":"OFT","c":5,"t":"Conjuntivitis hemorrágica aguda","q":"¿Qué agente produce la conjuntivitis hemorrágica aguda, conocida por la epidemia del Apolo 11?","o":["Adenovirus serotipo 8","Neisseria gonorrhoeae","Enterovirus serotipo 70","Chlamydia trachomatis"],"a":2,"e":"La conjuntivitis hemorrágica aguda es producida por picornavirus o enterovirus serotipo 70 y se caracteriza por hemorragias subconjuntivales difusas de instalación muy rápida y alta contagiosidad. Se recuerda por la epidemia coincidente con el Apolo 11 en 1969, que le dio el apodo popular. No debe confundirse con la hemorragia subconjuntival simple.","w":["El adenovirus 8 causa la queratoconjuntivitis epidémica.","El gonococo produce conjuntivitis purulenta severa.","Correcta: el enterovirus 70 es el agente de esta forma hemorrágica.","Chlamydia produce tracoma y conjuntivitis de inclusión."]},{"s":"OFT","c":5,"t":"Síndrome de Parinaud","q":"Paciente con lesión conjuntival granulomatosa monocular y adenopatía preauricular supurativa. ¿Cuál es la causa más frecuente?","o":["Tularemia","Mononucleosis infecciosa","Tuberculosis conjuntival","Enfermedad por arañazo de gato"],"a":3,"e":"El síndrome oculoglandular de Parinaud combina una lesión conjuntival granulomatosa monocular con una adenopatía preauricular supurativa. Su causa más frecuente es la enfermedad por arañazo de gato, y entre las demás figuran tuberculosis, linfogranuloma venéreo, tularemia, mononucleosis y hongos.","w":["La tularemia es una causa infrecuente.","La mononucleosis también es causa posible, no la más frecuente.","La tuberculosis figura entre las causas, pero no es la principal.","Correcta: el arañazo de gato es la causa más frecuente del síndrome."]},{"s":"OFT","c":5,"t":"Epiescleritis y escleritis","q":"Relacione la epiescleritis con la escleritis según el dolor y la evolución:","o":["Epiescleritis dolor leve y autolimitada; escleritis dolor intenso y grave","Epiescleritis dolor intenso y progresiva; escleritis dolor leve y autolimitada","Epiescleritis con úvea expuesta; escleritis autolimitada en 7 a 10 días","Epiescleritis bilateral e indolora; escleritis unilateral con dolor leve"],"a":0,"e":"La epiescleritis es una inflamación benigna, recurrente, en su mayoría no infecciosa, unilateral, con predominio en mujeres del 75%, de dolor leve, simple o nodular y autolimitada en 7 a 10 días; se maneja con observación, compresas frías, lubricantes, corticoide tópico o antiinflamatorios orales. La escleritis compromete la esclera, duele intensamente y puede llevar a pérdida visual.","w":["Correcta: dolor leve y autolimitado frente a dolor intenso y potencialmente grave.","Invierte ambos cuadros.","La úvea expuesta corresponde a la escleromalacia perforante.","La epiescleritis es unilateral y sí produce dolor leve."]},{"s":"OFT","c":5,"t":"Prueba de la fenilefrina","q":"Tras instilar fenilefrina al 10% el ojo blanquea por completo. ¿Cuál es el diagnóstico?","o":["Escleromalacia perforante","Epiescleritis","Uveítis anterior","Escleritis"],"a":1,"e":"En la epiescleritis los vasos son superficiales y se contraen con fenilefrina al 10%, de modo que el ojo blanquea y la inflamación parece desaparecer. En la escleritis los vasos comprometidos son profundos y no responden a la fenilefrina, por lo que la congestión rojo-azulada persiste. Es la prueba que separa ambos cuadros a pie de lámpara.","w":["La escleromalacia cursa con placas necróticas y úvea expuesta.","Correcta: el blanqueamiento indica compromiso vascular superficial.","La uveítis anterior da inyección ciliar que no blanquea así.","En la escleritis la congestión persiste tras la fenilefrina."]},{"s":"OFT","c":5,"t":"Escleritis y enfermedad sistémica","q":"¿Qué proporción de las escleritis se asocia a enfermedad sistémica?","o":["Menos del 10%","Una proporción despreciable","Más de la mitad","Alrededor del 25%"],"a":2,"e":"Más de la mitad de las escleritis se asocian a enfermedad sistémica: artritis reumatoide, lupus, sarcoidosis, tuberculosis, sífilis y gota. El tratamiento incluye antiinflamatorios por vía oral, prednisolona oral de 40 a 80 mg al día, inmunosupresores y en casos seleccionados inyección subconjuntival de corticoide.","w":["Subestima ampliamente la asociación descrita.","La asociación sistémica es la regla, no la excepción.","Correcta: más del 50% tiene enfermedad sistémica asociada.","La proporción descrita es superior a la mitad."]},{"s":"OFT","c":5,"t":"Escleromalacia perforante","q":"Paciente con artritis reumatoide de larga evolución, placas esclerales necróticas amarillas con úvea expuesta y llamativamente sin dolor. ¿Cuál es el diagnóstico?","o":["Epiescleritis nodular","Queratopatía en banda","Escleritis nodular anterior","Escleromalacia perforante"],"a":3,"e":"La escleromalacia perforante aparece en la artritis reumatoide de larga evolución, es bilateral y llamativamente asintomática pese al aspecto: placas necróticas amarillas con áreas de úvea expuesta por adelgazamiento escleral. No tiene tratamiento efectivo y su pronóstico es malo, lo que contrasta con la escleritis, que duele intensamente.","w":["La epiescleritis es benigna y autolimitada.","La queratopatía en banda es un depósito corneal de calcio.","La escleritis nodular es intensamente dolorosa.","Correcta: bilateral, indolora y con úvea expuesta en artritis reumatoide."]},{"s":"OFT","c":5,"t":"Conjuntivitis bacteriana","q":"¿Cuáles son los gérmenes habituales de la conjuntivitis bacteriana aguda?","o":["Staphylococcus, Streptococcus y Haemophilus","Acanthamoeba y Pseudomonas","Adenovirus y enterovirus","Neisseria y Chlamydia solamente"],"a":0,"e":"La conjuntivitis bacteriana aguda es típicamente bilateral, con párpados pegados al despertar, sensación de cuerpo extraño, exudado purulento o mucoso y edema; los gérmenes habituales son Staphylococcus, Streptococcus y Haemophilus. La forma purulenta severa corresponde a Neisseria gonorrhoeae y meningitidis, que puede perforar la córnea.","w":["Correcta: son los tres gérmenes habituales descritos.","Acanthamoeba se asocia a queratitis por lentes de contacto.","Los virus producen conjuntivitis folicular, no bacteriana.","Esos dos causan cuadros específicos, no la conjuntivitis bacteriana común."]},{"s":"OFT","c":5,"t":"Tracoma","q":"¿Cómo produce ceguera el tracoma?","o":["Genera neovasos en el iris que cierran el ángulo","Cicatriza la conjuntiva tarsal, invierte el párpado y las pestañas rozan la córnea","Deposita calcio en la banda interpalpebral","Produce necrosis escleral con exposición de la úvea"],"a":1,"e":"El tracoma es la infección crónica por Chlamydia trachomatis que va cicatrizando la conjuntiva tarsal, invierte el párpado y hace que las pestañas rocen la córnea, hasta producir opacidad y ceguera; es una de las principales causas de ceguera prevenible del mundo. Comparte con el cuerpo extraño crónico el mecanismo de roce corneal sostenido.","w":["La rubeosis con cierre angular es el glaucoma neovascular.","Correcta: la cicatrización tarsal produce entropión y roce corneal.","El depósito de calcio es la queratopatía en banda.","La necrosis escleral corresponde a la escleromalacia perforante."]},{"s":"OFT","c":6,"t":"Componentes de la úvea","q":"¿Qué estructuras forman la úvea?","o":["Retina, coroides y esclera","Córnea, esclera y limbo","Iris, cuerpo ciliar y coroides","Iris, cristalino y zónulas"],"a":2,"e":"El ojo tiene tres capas: externa, con córnea y esclera; media o úvea, formada por iris, cuerpo ciliar y coroides; e interna, que es la retina. Esa organización explica la clasificación de las uveítis según qué porción se inflame, y explica también por qué al adelgazarse la esclera se transparenta la úvea pigmentada y el ojo se ve azulado.","w":["La retina es la capa interna, no parte de la úvea.","Córnea y esclera forman la capa externa.","Correcta: iris, cuerpo ciliar y coroides componen la capa media.","El cristalino no pertenece a la úvea."]},{"s":"OFT","c":6,"t":"Capas de la coroides","q":"Ordene las capas de la coroides de externa a interna:","o":["Coriocapilaris, lámina fusca, Haller, Sattler, membrana de Bruch","Haller, lámina fusca, Bruch, Sattler, coriocapilaris","Membrana de Bruch, coriocapilaris, Sattler, Haller, lámina fusca","Lámina fusca, Haller, Sattler, coriocapilaris, membrana de Bruch"],"a":3,"e":"La coroides se ordena de externa a interna en lámina fusca, capa de Haller con las grandes venas que drenan a las vorticosas, capa de Sattler con venas medianas, coriocapilaris con capilares fenestrados que se extiende desde el disco hasta la ora serrata, y membrana de Bruch, que es su lámina basal.","w":["La coriocapilaris es una capa interna, no la más externa.","No corresponde al orden anatómico descrito.","Invierte la secuencia de fuera hacia dentro.","Correcta: de la lámina fusca a la membrana de Bruch en ese orden."]},{"s":"OFT","c":6,"t":"Pars plana","q":"¿Por qué la pars plana es la vía de abordaje para vitrectomía e inyecciones intravítreas?","o":["Tiene pocos vasos y no hay retina sensorial","Porque carece de inervación sensitiva","Porque está a 8 mm del limbo","Porque es la zona más gruesa de la la esclera"],"a":0,"e":"El cuerpo ciliar tiene una porción uveal, con el músculo ciliar y sus fibras longitudinales de Brücke, radiales y circulares de Müller, y una porción epitelial. La pars plana es la vía de abordaje para vitrectomía e inyecciones intravítreas, a unos 4 mm del limbo, porque tiene pocos vasos y allí no hay retina sensorial que perforar: la ora serrata queda a unos 6 mm del limbo.","w":["Correcta: escasa vascularización y ausencia de retina sensorial.","La ausencia de inervación no es el motivo del abordaje.","La distancia descrita es de unos 4 mm del limbo.","El grosor escleral no es el criterio de elección."]},{"s":"OFT","c":6,"t":"Musculatura del iris","q":"Relacione la inervación del esfínter pupilar con la del dilatador:","o":["Esfínter simpático del III par; dilatador simpático cervical superior","Esfínter parasimpático del III par; dilatador simpático","Esfínter parasimpático del III par; dilatador parasimpático del VII par","Esfínter simpático cervical; dilatador parasimpático del III par craneal"],"a":1,"e":"El iris actúa como diafragma y separa la cámara anterior de la posterior, insertándose en el espolón escleral. El esfínter pupilar recibe fibras parasimpáticas del III par y produce miosis; el dilatador recibe fibras simpáticas y produce midriasis. El color del iris depende del pigmento de su estroma.","w":["El esfínter es de inervación parasimpática.","Correcta: parasimpático para la miosis y simpático para la midriasis.","El dilatador es simpático, no parasimpático.","Invierte ambas inervaciones."]},{"s":"OFT","c":6,"t":"Uveítis anterior y posterior","q":"¿Por qué la uveítis posterior no duele?","o":["Porque la presión intraocular se mantiene baja","Porque no se acompaña de inflamación real","Retina y coroides carecen de inervación sensitiva","Porque no compromete el eje visual"],"a":2,"e":"La uveítis anterior, iritis o iridociclitis, duele, produce fotofobia e inyección ciliar y suele cursar con presión intraocular baja. La intermedia es la pars planitis. La posterior, coroiditis o retinitis, no duele, porque la retina y la coroides carecen de inervación sensitiva, y se manifiesta por visión borrosa y flotadores.","w":["La presión baja se describe en la uveítis anterior.","La inflamación es real, aunque indolora.","Correcta: sin inervación sensitiva no hay dolor pese a la inflamación.","El compromiso del eje visual causa visión borrosa, no dolor."]},{"s":"OFT","c":6,"t":"Nódulos del iris","q":"Relacione los nódulos de Koeppe con los de Busaca según su localización:","o":["Koeppe en el endotelio corneal; Busaca en el borde pupilar del iris","Koeppe alejados del esfínter; Busaca en el borde pupilar sobre el esfínter","Koeppe en el ángulo camerular; Busaca en la cápsula anterior del cristalino","Koeppe en el borde pupilar; Busaca alejados del esfínter"],"a":3,"e":"En la uveítis anterior aparecen precipitados en el endotelio corneal, granulomatosos o no, el fenómeno de Tyndall con células flotando en cámara anterior, y nódulos en el iris: los de Koeppe en el borde pupilar, sobre el esfínter, y los de Busaca alejados del esfínter, sobre la superficie anterior del iris.","w":["Los precipitados endoteliales son otra lesión distinta.","Invierte ambas localizaciones.","Ninguno de los dos asienta en el ángulo ni en el cristalino.","Correcta: Koeppe pupilares y Busaca sobre la superficie anterior."]},{"s":"OFT","c":6,"t":"Fenómeno de Tyndall","q":"¿Qué indica el fenómeno de Tyndall?","o":["Células flotando en cámara anterior","Neovasos en el la superficie del iris","Depósito de calcio en la córnea","Adherencia del iris al cristalino"],"a":0,"e":"El fenómeno de Tyndall es la visualización de células flotando en la cámara anterior con el haz de la lámpara de hendidura, y es uno de los signos de la uveítis anterior, junto con los precipitados en el endotelio corneal y los nódulos de Koeppe y Busaca en el iris. El depósito de calcio corneal es la queratopatía en banda y los neovasos iridianos la rubeosis.","w":["Correcta: es la celularidad visible en el humor acuoso inflamado.","Los neovasos del iris son la rubeosis iridis.","El calcio corneal corresponde a la queratopatía en banda.","La adherencia al cristalino es la sinequia posterior."]},{"s":"OFT","c":6,"t":"Sinequias posteriores","q":"Paciente con uveítis y pupila fija e irregular. ¿Cuál es el mecanismo?","o":["Atrofia del esfínter pupilar por isquemia","Adherencia mecánica del iris al cristalino","Lesión del III par craneal","Bloqueo farmacológico del receptor muscarínico"],"a":1,"e":"La sinequia posterior es la adherencia del iris inflamado a la cápsula anterior del cristalino: la pupila queda fija e irregular, pero por un mecanismo mecánico, no neurológico, distinción que importa cuando se evalúa una pupila arrefléctica en un paciente con uveítis. Se rompen con midriáticos y ciclopléjicos.","w":["No se trata de atrofia isquémica del esfínter.","Correcta: es una adherencia mecánica, no un problema de inervación.","No hay lesión del III par en la uveítis.","El bloqueo farmacológico daría midriasis regular, no pupila irregular."]},{"s":"OFT","c":6,"t":"Uveítis posterior por toxoplasma","q":"¿Cuál es la causa más frecuente de uveítis posterior y cómo se describe su imagen?","o":["Tuberculosis; tubérculos coroideos","Sífilis; retinitis en sal y pimienta","Toxoplasmosis; faro en la niebla","Citomegalovirus; queso y tomate"],"a":2,"e":"La toxoplasmosis es la causa más frecuente de uveítis posterior y produce vitreítis intensa sobre un foco activo, imagen descrita como faro en la niebla; se trata con trimetoprim-sulfametoxazol, pirimetamina y clindamicina. La retinitis por citomegalovirus, propia del inmunosuprimido, muestra el aspecto de queso y tomate.","w":["La tuberculosis es causa infrecuente de uveítis posterior.","La sífilis puede dar retinitis, pero no es la causa más frecuente.","Correcta: el toxoplasma encabeza la lista y da el foco en niebla.","El citomegalovirus da el patrón de queso y tomate."]},{"s":"OFT","c":6,"t":"Retinitis por citomegalovirus","q":"Paciente inmunosuprimido con retinitis descrita como queso y tomate. ¿Cuál es el agente?","o":["Treponema pallidum","Candida albicans","Toxoplasma gondii","Citomegalovirus"],"a":3,"e":"La retinitis por citomegalovirus es propia del paciente inmunosuprimido y muestra el aspecto de queso y tomate, por la mezcla de exudados blanquecinos y hemorragias. La toxoplasmosis, en cambio, es la causa más frecuente de uveítis posterior y produce vitreítis intensa sobre un foco activo, la imagen de faro en la niebla.","w":["La sífilis no produce ese patrón característico.","La candidiasis ocular tiene otro aspecto clínico.","El toxoplasma da la imagen de faro en la niebla.","Correcta: la retinitis en queso y tomate es característica del citomegalovirus."]},{"s":"OFT","c":6,"t":"Queratopatía en banda","q":"¿Cuál de las siguientes NO es causa de queratopatía en banda?","o":["Retinopatía diabética proliferativa","Hipercalcemia","Sarcoidosis","Uveítis crónica"],"a":0,"e":"La queratopatía en banda es un depósito de calcio en la córnea superficial, en la banda interpalpebral. Aparece como complicación de la uveítis crónica y también en la intoxicación por vitamina D, la hipercalcemia, la sarcoidosis y el hiperparatiroidismo. La retinopatía diabética proliferativa se relaciona con neovasos y glaucoma neovascular, no con este depósito.","w":["Correcta: la retinopatía proliferativa no produce depósito corneal de calcio.","La hipercalcemia favorece el depósito de calcio corneal.","La sarcoidosis figura entre las causas descritas.","La uveítis crónica es la causa oftalmológica clásica."]},{"s":"OFT","c":6,"t":"Coloma del iris","q":"Se detecta un coloboma de iris inferior y nasal, con forma de cerradura. ¿Qué obliga a explorar?","o":["La motilidad ocular, por parálisis del III par","El fondo de ojo, por posible coloboma coriorretiniano","La vía lagrimal, por obstrucción congénita","La presión intraocular, por riesgo de la glaucoma agudo"],"a":1,"e":"El coloboma del iris es un fallo del cierre de la fisura embrionaria y deja un defecto inferior y nasal, con la clásica forma de cerradura. Como retina, coroides y nervio óptico comparten el mismo origen neuroectodérmico y la misma fisura, encontrar un coloboma de iris obliga a explorar el fondo en busca de colobomas coriorretinianos o del disco.","w":["La motilidad no se ve afectada por el coloboma iridiano.","Correcta: el mismo defecto embrionario puede afectar retina, coroides y disco.","La vía lagrimal no comparte el defecto embriológico descrito.","El coloboma no predispone a glaucoma agudo."]},{"s":"OFT","c":6,"t":"Heterocromía en el Horner","q":"¿Por qué el ojo afectado se ve más claro en el síndrome de Horner congénito?","o":["Porque la pupila permanece midriática","Porque la córnea se opacifica levemente","La pérdida del tono simpático reduce la pigmentación","Porque el iris se atrofia por isquemia"],"a":2,"e":"En el síndrome de Horner la pérdida del tono simpático se acompaña de menor pigmentación del iris, de modo que el ojo afectado se ve más claro, sobre todo en casos congénitos. La heterocromía también puede ser congénita o adquirida por uveítis con despigmentación, herpes simple y retinoblastoma.","w":["El Horner cursa con miosis, no midriasis.","La córnea no se afecta en este síndrome.","Correcta: el simpático influye en la pigmentación del estroma iridiano.","No hay atrofia isquémica del iris en el Horner."]},{"s":"OFT","c":6,"t":"Rubeosis iridis","q":"La presencia de neovasos en la superficie del iris indica que en el polo posterior hay:","o":["Desprendimiento seroso de la mácula","Atrofia del epitelio pigmentario","Depósito de drusas subretinianas","Isquemia retiniana severa liberando VEGF"],"a":3,"e":"La rubeosis iridis son neovasos en la superficie del iris y traduce que en el polo posterior hay isquemia retiniana severa liberando VEGF, típicamente retinopatía diabética proliferativa u oclusión de vena central. Esos neovasos y su membrana fibrovascular cierran el ángulo y, cuando la presión intraocular sube, configuran el glaucoma neovascular.","w":["El desprendimiento seroso macular no genera rubeosis.","La atrofia del epitelio pigmentario no libera VEGF de ese modo.","Las drusas caracterizan la degeneración macular seca.","Correcta: la rubeosis es el reflejo anterior de una isquemia retiniana grave."]},{"s":"OFT","c":7,"t":"Hojas de la retina","q":"Relacione el epitelio pigmentario con la retina sensorial según su estructura:","o":["Epitelio pigmentario de una capa con melanina; sensorial con fotorreceptores","Epitelio pigmentario de varias capas sin melanina; sensorial de una sola capa celular","Epitelio pigmentario con fotorreceptores; sensorial de una capa con melanina apoyada","Epitelio pigmentario apoyado en la coriocapilaris; sensorial apoyada en la esclera"],"a":0,"e":"La retina se forma por invaginación de la vesícula óptica primitiva en dos hojas: el epitelio pigmentario, de una sola capa celular, con melanina, apoyado en la membrana de Bruch y encargado del soporte metabólico de la retina externa, y la retina sensorial, que va del nervio óptico a la ora serrata y contiene los fotorreceptores.","w":["Correcta: una capa pigmentada de soporte frente a la capa sensorial.","El epitelio pigmentario es monocapa y sí contiene melanina.","Invierte ambas hojas.","El epitelio pigmentario se apoya en la membrana de Bruch."]},{"s":"OFT","c":7,"t":"Fóvea central","q":"¿Por qué la fóvea central se nutre exclusivamente de la coriocapilaris?","o":["Porque tiene doble capa de epitelio pigmentario","Carece de capilares retinianos","Porque está fuera del área macular","Porque contiene solo bastones"],"a":1,"e":"La mácula lútea mide 4,5 mm y debe su nombre al pigmento carotenoide amarillo, la xantófila. La fóvea central es una depresión de 1,5 mm situada a unos 3 mm temporal al disco y 0,8 mm por debajo del meridiano horizontal, contiene solo conos y carece de capilares retinianos: se nutre exclusivamente de la coriocapilaris.","w":["El epitelio pigmentario es monocapa también en la fóvea.","Correcta: al no tener capilares retinianos depende de la coroides.","La fóvea es el centro del área macular.","La fóvea contiene solo conos, no bastones."]},{"s":"OFT","c":7,"t":"Mancha rojo cereza","q":"¿Por qué en la oclusión de arteria central la fóvea contrasta como una mancha rojo cereza?","o":["Porque el epitelio pigmentario se atrofia","Porque acumula sangre extravasada","Sigue nutriéndose de la coriocapilaris","Porque el edema es máximo en ese punto"],"a":2,"e":"La retina externa, donde están los fotorreceptores, se nutre por difusión desde la coriocapilaris, y la retina interna depende de la arteria central de la retina. Esa doble irrigación explica el signo de la mancha rojo cereza: en la oclusión de la arteria central toda la retina interna se palidece por isquemia salvo la fóvea, que sigue recibiendo aporte coroideo y contrasta.","w":["El epitelio pigmentario no se atrofia de forma aguda.","No es sangre extravasada sino contraste de coloración.","Correcta: la fóvea conserva su aporte coroideo y no se palidece.","El edema no explica el contraste rojo cereza."]},{"s":"OFT","c":7,"t":"Oclusión de arteria central","q":"Paciente con pérdida visual abrupta, indolora y monocular, precedida de amaurosis fugax. ¿Cuál es el diagnóstico?","o":["Oclusión de vena central de la retina","Desprendimiento de retina regmatógeno","Neuritis retrobulbar","Oclusión de arteria central de la retina"],"a":3,"e":"En la oclusión de la arteria central de la retina la pérdida visual es abrupta, indolora y monocular, a veces precedida de amaurosis fugax. Toda la retina interna se torna pálida por isquemia salvo la fóvea, que sigue nutriéndose de la coriocapilaris y contrasta como una mancha rojo cereza. La oclusión venosa, en cambio, da pérdida gradual e indolora.","w":["La oclusión venosa produce pérdida gradual, no abrupta.","El desprendimiento se anuncia con fotopsias y cortina progresiva.","La neuritis retrobulbar duele al movilizar el ojo.","Correcta: instalación abrupta con amaurosis fugax previa."]},{"s":"OFT","c":7,"t":"Paracentesis en la oclusión arterial","q":"¿Cómo puede ayudar la paracentesis en la oclusión de arteria central?","o":["Al bajar la presión, el émbolo puede desplazarse distalmente","Aumenta el aporte de oxígeno a la retina interna","Reduce el edema macular por drenaje del vítreo","Disuelve el émbolo por acción mecánica directa"],"a":0,"e":"La paracentesis retira humor acuoso con una jeringa y hace caer bruscamente la presión intraocular; al disminuir la presión que rodea a los vasos, la arteria tiende a dilatarse y el émbolo puede desplazarse hacia una rama más distal, dejando isquémico un territorio menor. Se combina con masaje ocular y otras medidas de urgencia.","w":["Correcta: la caída de presión favorece el desplazamiento distal del émbolo.","No modifica el aporte de oxígeno de forma directa.","No drena vítreo ni trata el edema macular.","No tiene acción trombolítica ni disuelve el émbolo."]},{"s":"OFT","c":7,"t":"Oclusión de vena central","q":"Fondo de ojo con hemorragias extensas en cuatro cuadrantes, venas dilatadas y tortuosas, exudados blandos y edema del disco. ¿Qué imagen se describe y de qué cuadro es?","o":["Faro en la niebla; toxoplasmosis ocular","Pizza de tomate; oclusión de vena central","Mancha rojo cereza; oclusión de arteria central","Queso y tomate; retinitis por citomegalovirus"],"a":1,"e":"La oclusión de vena central bloquea el retorno a nivel de la lámina cribosa y deja el fondo como una pizza de tomate: hemorragias extensas en los cuatro cuadrantes, venas dilatadas y tortuosas, exudados blandos y edema del disco, con pérdida visual gradual e indolora. Sus factores de riesgo son hipertensión, ateroesclerosis, diabetes y glaucoma.","w":["El faro en la niebla es la toxoplasmosis.","Correcta: la pizza de tomate describe la oclusión venosa central.","La mancha rojo cereza corresponde a la oclusión arterial.","El queso y tomate es la retinitis por citomegalovirus."]},{"s":"OFT","c":7,"t":"Desprendimiento de retina","q":"¿Cuál de los siguientes NO es un síntoma del desprendimiento de retina?","o":["Flotadores","Fotopsias","Dolor ocular intenso","Sombra o cortina que avanza"],"a":2,"e":"El desprendimiento es la separación de la retina sensorial del epitelio pigmentario y no duele: se manifiesta con fotopsias, flotadores y una sombra o cortina que avanza. El regmatógeno empieza con un agujero o desgarro por el que pasa líquido al espacio subretiniano, y la miopía alta predispone por adelgazamiento de la retina periférica.","w":["Los flotadores acompañan al desprendimiento de vítreo asociado.","Las fotopsias reflejan tracción vítrea sobre la retina.","Correcta: el desprendimiento es indoloro.","La cortina progresiva es el síntoma más característico."]},{"s":"OFT","c":7,"t":"Manejo del desgarro sin desprendimiento","q":"Se detecta un desgarro retiniano sin líquido subretiniano significativo. ¿Cuál es el tratamiento?","o":["Vitrectomía por pars plana","Observación sin intervención","Cerclaje escleral inmediato","Sellarlo con láser o crioterapia"],"a":3,"e":"Cuando solo hay un agujero o desgarro, sin líquido subretiniano significativo, basta con sellarlo mediante láser o crioterapia, creando una cicatriz adherente alrededor que impide el paso de líquido. Si el desprendimiento ya está establecido, la conducta cambia: bucle o cerclaje escleral, o vitrectomía por pars plana.","w":["La vitrectomía es para desprendimientos ya constituidos.","Dejarlo sin sellar permite que evolucione a desprendimiento.","El cerclaje se reserva para el desprendimiento establecido.","Correcta: el sellado perilesional evita que progrese a desprendimiento."]},{"s":"OFT","c":7,"t":"Coroidopatía serosa central","q":"Hombre de 35 años, personalidad tipo A, con metamorfopsia y disminución de visión central, con desprendimiento seroso macular. ¿Cuál es el diagnóstico?","o":["Coroidopatía serosa central","Edema macular diabético","Neuritis óptica anterior","Degeneración macular húmeda"],"a":0,"e":"La coroidopatía serosa central afecta a personalidades tipo A entre los 30 y 40 años: el estrés hace que los capilares de la coriocapilaris extravasen líquido, que eleva la mácula y produce metamorfopsia y disminución de la visión central, con rejilla de Amsler positiva y desprendimiento seroso visible. Suele ser autolimitada.","w":["Correcta: perfil, edad y desprendimiento seroso definen el cuadro.","El edema macular diabético requiere retinopatía de base.","La neuritis óptica cursa con dolor al movilizar el ojo.","La degeneración macular húmeda aparece en mayores de 60 años."]},{"s":"OFT","c":7,"t":"Retinoblastoma","q":"¿Cuál es el signo más importante del retinoblastoma?","o":["La proptosis","La leucocoria","El estrabismo","La heterocromía"],"a":1,"e":"El retinoblastoma es el tumor maligno primario de retina más frecuente en el niño y su signo más importante es la leucocoria, aunque también puede debutar con estrabismo, heterocromía y, en casos avanzados, proptosis. El diagnóstico diferencial de leucocoria incluye catarata congénita, desprendimiento de retina y persistencia del vítreo primario hiperplásico.","w":["La proptosis aparece en casos avanzados.","Correcta: la pupila blanca es el signo cardinal.","El estrabismo puede ser la forma de debut, pero no es el signo principal.","La heterocromía es una presentación posible, no la principal."]},{"s":"OFT","c":7,"t":"Porciones del nervio óptico","q":"¿Cuál es la porción más larga del nervio óptico?","o":["La intraocular, de 1 mm","La intracraneal, de la unos 10 mm","La intraorbitaria, de unos 40 mm","La intracanalicular"],"a":2,"e":"El nervio óptico mide 1,5 a 2 mm de diámetro a nivel del disco y se divide en porción intraocular de 1 mm, intraorbitaria de unos 40 mm, que es la más larga y explica su trayecto sinuoso, intracanalicular dentro del canal óptico e intracraneal de unos 10 mm. Es una prolongación del sistema nervioso central.","w":["La intraocular mide apenas 1 mm.","La intracraneal mide unos 10 mm.","Correcta: unos 40 mm, con trayecto sinuoso que permite la motilidad ocular.","La intracanalicular es la más corta."]},{"s":"OFT","c":7,"t":"Lesión quiasmática","q":"Paciente con hemianopsia bitemporal. ¿Dónde está la lesión y qué causa hay que sospechar?","o":["En un nervio óptico; neuritis retrobulbar","En la retina periférica; desprendimiento","Por detrás del quiasma; infarto occipital","En el quiasma; tumor de hipófisis"],"a":3,"e":"En el quiasma, situado en la silla turca, se decusan las fibras nasales de cada retina, que son las que reciben la información del campo temporal. Por eso una lesión central del quiasma, típicamente un tumor de hipófisis, produce hemianopsia bitemporal y obliga a pedir campo visual. Detrás del quiasma las lesiones dan hemianopsias homónimas.","w":["La lesión de un nervio óptico afecta a un solo ojo.","Una lesión retiniana no produce hemianopsia bitemporal.","Las lesiones retroquiasmáticas dan defectos homónimos.","Correcta: la decusación de fibras nasales explica el defecto bitemporal."]},{"s":"OFT","c":7,"t":"Neuritis retrobulbar","q":"¿Por qué la neuritis retrobulbar duele al mover el ojo, especialmente en aducción?","o":["El recto medio comprime el nervio inflamado en su origen","Porque la esclera se distiende con el movimiento","Porque el nervio pierde su vaina de mielina","Porque aumenta la presión intraocular al mover el ojo"],"a":0,"e":"La neuritis retrobulbar es la inflamación del nervio por detrás del globo y duele al movilizar el ojo, en especial en aducción, porque el recto medio comprime el nervio inflamado en su origen. Se asocia clásicamente a esclerosis múltiple y suele cursar con defecto pupilar aferente, mientras el fondo de ojo puede ser normal.","w":["Correcta: la contracción del recto medio comprime el nervio inflamado.","La distensión escleral no explica el dolor.","La desmielinización explica el déficit, no el dolor al movimiento.","La presión intraocular no cambia con la motilidad."]},{"s":"OFT","c":7,"t":"Atrofia óptica","q":"¿Qué traduce la palidez del disco óptico?","o":["Aumento de la presión del líquido cefalorraquídeo","Pérdida axonal y de su vascularización","Edema de la capa de fibras nerviosas","Depósito de xantófila en el disco"],"a":1,"e":"La atrofia óptica se reconoce por la palidez del disco, que traduce pérdida axonal y de su vascularización. Si es total, el ojo queda sin visión; si es parcial, conserva algún grado de función. Es el punto final común de neuropatías compresivas, tóxicas como el metanol, isquémicas o inflamatorias.","w":["La presión de LCR elevada produce papiledema, no palidez.","Correcta: la palidez refleja pérdida de axones y de aporte vascular.","El edema borra los márgenes, no palidece el disco.","La xantófila es el pigmento macular, no papilar."]},{"s":"OFT","c":7,"t":"Ora serrata","q":"¿A qué distancia del limbo se encuentra la ora serrata?","o":["A unos 4 mm","A unos 2 mm","A unos 6 mm","A unos 12 mm"],"a":2,"e":"La ora serrata es la terminación anterior de la retina sensorial y queda adyacente a la pars plana, a unos 6 mm del limbo. Ese detalle anatómico es el que hace segura la entrada por pars plana a unos 4 mm del limbo para vitrectomía e inyecciones intravítreas: allí no hay retina sensorial que perforar.","w":["Cuatro mm es el punto de entrada por pars plana.","Dos mm queda por delante de la pars plana.","Correcta: unos 6 mm del limbo, por detrás del punto de entrada seguro.","Doce mm queda muy posterior a la ora serrata."]},{"s":"OFT","c":8,"t":"Huesos de la órbita","q":"¿Cuántos huesos forman la órbita?","o":["Nueve","Cinco","Cuatro","Siete"],"a":3,"e":"La órbita es una cavidad ósea piramidal de base anterior formada por siete huesos: maxilar superior, palatino, frontal, etmoides, esfenoides, cigomático y lagrimal, con techo, piso y paredes lateral y medial. El anillo de Zinn rodea el agujero óptico y es el origen común de los cuatro músculos rectos.","w":["Sobreestima el número de huesos orbitarios.","Subestima el número de huesos descritos.","Son bastante más de cuatro.","Correcta: son siete los huesos que participan en la órbita."]},{"s":"OFT","c":8,"t":"Anillo de Zinn","q":"¿Qué estructuras se originan en el anillo de Zinn?","o":["Los cuatro músculos rectos","El elevador del párpado superior","El músculo de Müller","Los dos músculos oblicuos"],"a":0,"e":"El anillo de Zinn rodea el agujero óptico y es el origen común de los cuatro músculos rectos. De los seis músculos extraoculares, el oblicuo superior está inervado por el IV par o troclear y el recto lateral por el VI o abducens; todos los demás, incluido el oblicuo inferior, dependen del III par.","w":["Correcta: los rectos comparten su origen en el anillo de Zinn.","El elevador se origina por encima del anillo.","El Müller es un músculo liso palpebral.","Los oblicuos tienen orígenes distintos."]},{"s":"OFT","c":8,"t":"Celulitis preseptal y orbitaria","q":"Paciente con edema palpebral, fiebre, proptosis y limitación de la motilidad ocular. ¿Qué cuadro tiene?","o":["Celulitis preseptal","Celulitis orbitaria","Dacriocistitis aguda","Chalazión infectado"],"a":1,"e":"El septum orbitario es la barrera que separa ambos cuadros. La celulitis preseptal queda limitada a la fascia palpebral: hay induración, enrojecimiento, fiebre e inicio súbito, pero el globo se mueve bien y no protruye; en menores de cinco años se asocia a Haemophilus y en adultos a Staphylococcus. La orbitaria compromete el contenido orbitario y añade proptosis y limitación motora.","w":["En la preseptal el globo se mueve bien y no protruye.","Correcta: proptosis y limitación motora indican compromiso orbitario.","La dacriocistitis se localiza en el saco lagrimal.","El chalazión es una lesión nodular localizada."]},{"s":"OFT","c":8,"t":"Mucormicosis orbitaria","q":"Diabético descompensado con progresión rápida de infección desde senos hacia órbita. ¿Cuál es el tratamiento?","o":["Aciclovir intravenoso y oclusión","Corticoide sistémico en dosis altas","Anfotericina B y desbridamiento agresivo precoz","Antibiótico oral y observación"],"a":2,"e":"La mucormicosis es una infección fúngica invasora y potencialmente fatal que afecta a diabéticos descompensados, leucémicos, pacientes con fallo renal y trasplantados. Progresa por contigüidad desde senos hacia órbita y sistema nervioso, y el tratamiento debe ser agresivo y precoz: anfotericina B intravenosa y desbridamiento quirúrgico.","w":["El aciclovir cubre virus, no hongos.","El corticoide agravaría la infección fúngica.","Correcta: antifúngico sistémico más desbridamiento, sin demora.","El antibiótico oral no cubre hongos invasores."]},{"s":"OFT","c":8,"t":"Inervación palpebral","q":"Relacione el músculo que cierra el párpado con el que lo abre y su inervación:","o":["Orbicular cierra por III par; elevador abre por VII par craneal","Orbicular cierra por VII par; Müller abre por III par craneal","Elevador cierra por VII par; orbicular abre por III par craneal","Orbicular cierra por VII par; elevador abre por III par"],"a":3,"e":"El párpado recibe inervación sensitiva de V1 y V2, motora del VII par para el orbicular, que cierra, y del III par para el elevador, que abre; el músculo de Müller, liso, depende del simpático y aporta el último par de milímetros de apertura. De ahí que la parálisis del VII impida cerrar, con lagoftalmos, y la del III produzca ptosis.","w":["Invierte ambas inervaciones.","El Müller depende del simpático, no del III par.","Invierte las funciones de ambos músculos.","Correcta: VII para el cierre y III para la apertura."]},{"s":"OFT","c":8,"t":"Entropión y ectropión","q":"Relacione el entropión con el ectropión según la dirección del borde palpebral:","o":["Entropión hacia dentro con roce corneal; ectropión hacia fuera con epífora","Entropión con pestañas mal dirigidas; ectropión hacia dentro con roce corneal","Entropión hacia fuera con epífora; ectropión hacia dentro con roce de pestañas","Entropión hacia dentro con epífora; ectropión con pestañas mal dirigidas"],"a":0,"e":"El entropión invierte el borde palpebral hacia dentro y hace que las pestañas rocen la córnea; el ectropión lo evierte hacia fuera y expone la conjuntiva, con epífora por mala posición del punto lagrimal. La triquiasis es distinta: el párpado está bien posicionado pero las pestañas crecen mal dirigidas hacia el globo.","w":["Correcta: entropión hacia dentro y ectropión hacia fuera.","Las pestañas mal dirigidas con párpado normal definen la triquiasis.","Invierte ambas direcciones.","La epífora es propia del ectropión."]},{"s":"OFT","c":8,"t":"Tumor palpebral más frecuente","q":"¿Cuál es el tumor maligno palpebral más frecuente y dónde asienta?","o":["Carcinoma escamoso, en párpado superior","Carcinoma basocelular, en párpado inferior y canto interno","Sarcoma de Kaposi, en la conjuntiva tarsal","Melanoma maligno, en el canto externo"],"a":1,"e":"Entre los tumores palpebrales figuran verrugas, xantelasma, cuerno cutáneo, carcinoma basocelular, adenocarcinoma, carcinoma escamoso, melanoma maligno y sarcoma de Kaposi. El basocelular es el maligno más frecuente y asienta sobre todo en el párpado inferior y el canto interno, zonas de máxima exposición solar acumulada.","w":["El escamoso es menos frecuente que el basocelular.","Correcta: basocelular en párpado inferior y canto interno.","El Kaposi se asocia a inmunosupresión y es infrecuente.","El melanoma palpebral es poco frecuente."]},{"s":"OFT","c":8,"t":"Queratitis por Acanthamoeba","q":"¿Con qué factor se asocia clásicamente la queratitis por Acanthamoeba?","o":["Reactivación del herpes zóster","Soldadura sin protección","Uso de lentes de contacto","Déficit crónico de vitamina A"],"a":2,"e":"Las queratitis se dividen en infecciosas y no infecciosas, estas últimas por déficit de lágrima, denervación, reacción inmune, isquemia, trauma químico, exposición o daño fótico. Entre las infecciosas, la bacteriana es la más común, el herpes da el patrón dendrítico y la Acanthamoeba se asocia al uso de lentes de contacto, sobre todo con higiene o agua inadecuadas.","w":["El zóster produce queratitis con otro patrón.","La soldadura sin protección produce queratitis fotoeléctrica.","Correcta: el uso de lentes de contacto es el factor de riesgo clásico.","El déficit de vitamina A produce xeroftalmía."]},{"s":"OFT","c":8,"t":"Líneas corneales de hierro","q":"Relacione la línea de Stocker con el anillo de Fleischer:","o":["Stocker en la periferia por cobre; Fleischer en la base del cono por calcio","Stocker en la base del cono del queratocono; Fleischer en el borde del pterigión","Stocker vertical en el endotelio; Fleischer en el borde de avance del pterigión","Stocker en el borde del pterigión; Fleischer en la base del cono"],"a":3,"e":"Las líneas corneales son depósitos que orientan al diagnóstico: la línea de Stocker es hierro depositado en el borde de avance del pterigión, el anillo de Fleischer es hierro en la base del cono del queratocono, y el huso de Krukenberg es pigmento dispuesto verticalmente en el endotelio del síndrome de dispersión pigmentaria.","w":["Ambos son depósitos de hierro, no de cobre ni calcio.","Invierte ambos depósitos.","El depósito vertical endotelial es el huso de Krukenberg.","Correcta: Stocker en el pterigión y Fleischer en el queratocono."]},{"s":"OFT","c":8,"t":"Anillo de Kayser-Fleischer","q":"Paciente joven con anillo corneal periférico de cobre y catarata en girasol. ¿Qué enfermedad tiene?","o":["Enfermedad de Wilson","Queratocono avanzado","Hemocromatosis","Hiperparatiroidismo primario"],"a":0,"e":"El anillo de Kayser-Fleischer es un depósito de cobre a nivel de la membrana de Descemet en la periferia corneal y es un signo característico de la enfermedad de Wilson, que además puede producir catarata en girasol. Conviene distinguirlo de los depósitos de hierro, como Stocker y Fleischer, y del calcio de la queratopatía en banda.","w":["Correcta: cobre en Descemet y catarata en girasol definen el Wilson.","El queratocono da el anillo de Fleischer, de hierro.","La hemocromatosis acumula hierro, no cobre.","El hiperparatiroidismo se asocia a queratopatía en banda por calcio."]},{"s":"OFT","c":8,"t":"Septum orbitario","q":"¿Cuál es la función del septum orbitario?","o":["Sostener el globo como una hamaca inferior","Limitar la difusión de infecciones y evitar la herniación de grasa","Aportar el origen común de los músculos rectos","Envolver el globo desde el limbo hasta el nervio óptico"],"a":1,"e":"Los tejidos blandos de la órbita incluyen la periórbita, que es el periostio; el septum orbital, que limita la difusión de infecciones y evita la herniación de grasa; y la cápsula de Tenon o fascia bulbar, que envuelve el globo y se condensa inferiormente en el ligamento de Lockwood, una hamaca que lo sostiene.","w":["La hamaca de sostén es el ligamento de Lockwood.","Correcta: es la barrera que separa la celulitis preseptal de la orbitaria.","El origen común de los rectos es el anillo de Zinn.","Envolver el globo es función de la cápsula de Tenon."]},{"s":"OFT","c":8,"t":"Inervación de los oblicuos","q":"¿Qué par craneal inerva el oblicuo inferior?","o":["El VI","El VII","El III","El IV"],"a":2,"e":"De los seis músculos extraoculares, el oblicuo superior está inervado por el IV par o troclear y el recto lateral por el VI o abducens; todos los demás, incluido el oblicuo inferior, dependen del III par. En el diabético los pares craneales se afectan por daño de vasa nervorum, con un orden de frecuencia característico.","w":["El VI par inerva el recto lateral.","El VII par inerva el orbicular de los párpados.","Correcta: el oblicuo inferior depende del III par.","El IV par inerva el oblicuo superior."]},{"s":"OFT","c":8,"t":"Rabdomiosarcoma orbitario","q":"Niño con proptosis de instalación rápida y edema palpebral. ¿Cuál es la neoplasia maligna orbitaria más probable?","o":["Retinoblastoma","Carcinoma basocelular","Sarcoma de Kaposi","Rabdomiosarcoma"],"a":3,"e":"El rabdomiosarcoma es la neoplasia maligna orbitaria más frecuente de la infancia y se manifiesta por proptosis de instalación rápida, a veces con desplazamiento del globo y edema palpebral. La proptosis, en general, obliga a pensar en enfermedad tiroidea de Graves, tumores orbitarios y celulitis orbitaria.","w":["El retinoblastoma es intraocular y se manifiesta por leucocoria.","El basocelular es un tumor palpebral del adulto.","El Kaposi se asocia a inmunosupresión y no es el más frecuente.","Correcta: es la neoplasia orbitaria maligna más frecuente en el niño."]},{"s":"OFT","c":8,"t":"Causas de proptosis","q":"Todas las siguientes producen proptosis, EXCEPTO una. ¿Cuál?","o":["Celulitis preseptal","Tumor orbitario","Celulitis orbitaria","Enfermedad de Graves"],"a":0,"e":"La proptosis obliga a pensar en enfermedad tiroidea de Graves, tumores orbitarios y celulitis orbitaria. La celulitis preseptal, en cambio, queda limitada a la fascia palpebral por el septum orbitario: hay induración, enrojecimiento y fiebre, pero el globo se mueve bien y no protruye, y esa es precisamente la clave que la distingue de la orbitaria.","w":["Correcta: la preseptal no produce proptosis, y eso la define.","Los tumores orbitarios desplazan el globo hacia adelante.","La celulitis orbitaria sí produce proptosis y limitación motora.","El Graves es causa clásica de proptosis, con frecuencia bilateral."]},{"s":"ORT","c":11,"t":"Tipos de osificación","q":"Relacione la osificación endocondral con la intramembranosa según el molde sobre el que ocurren:","o":["Endocondral sobre membrana pericondral; intramembranosa sobre cartílago hialino","Endocondral sobre molde cartilaginoso; intramembranosa sobre tejido conectivo","Endocondral sobre periostio ya formado; intramembranosa sobre molde cartilaginoso","Endocondral sobre tejido conectivo fibroso; intramembranosa sobre molde cartilaginoso"],"a":1,"e":"El tejido óseo deriva del mesodermo. Hasta la sexta semana existe una amalgama de células condrales con membrana pericondral; a la sexta semana la angiogénesis inaugura el centro de osificación primario en la diáfisis. La osificación endocondral se hace sobre un molde cartilaginoso, propia de huesos largos, y la intramembranosa sobre tejido conectivo, propia de huesos planos del cráneo.","w":["La membrana pericondral no es el molde de la osificación endocondral.","Correcta: cartílago para la endocondral y tejido conectivo para la intramembranosa.","El periostio aporta crecimiento en espesor, no es molde de osificación.","Invierte ambos moldes."]},{"s":"ORT","c":11,"t":"Centro de osificación primario","q":"¿A qué semana y dónde aparece el centro de osificación primario?","o":["A la sexta semana, en la epífisis","A la duodécima semana, en la diáfisis","A la sexta semana, en la diáfisis","Al nacimiento, en la metáfisis"],"a":2,"e":"Hasta la sexta semana existe una amalgama de células condrales con membrana pericondral; a la sexta semana la angiogénesis inaugura el centro de osificación primario en la diáfisis. Los centros secundarios son epifisarios y aparecen después. El crecimiento en longitud depende de la placa epifisaria y el crecimiento en espesor del periostio.","w":["Los centros epifisarios son los secundarios.","El centro primario aparece antes, hacia la sexta semana.","Correcta: sexta semana y localización diafisaria.","Los centros epifisarios pueden aparecer al nacimiento, no el primario."]},{"s":"ORT","c":11,"t":"Fases de consolidación","q":"Ordene las cuatro fases de la consolidación ósea:","o":["Inflamatoria, callo duro, callo blando, remodelación","Callo blando, inflamatoria, remodelación, callo duro","Remodelación, inflamatoria, callo duro, callo blando","Inflamatoria, callo blando, callo duro, remodelación"],"a":3,"e":"La consolidación tiene cuatro fases: inflamatoria, de 48 horas a 2 semanas, con el hematoma como fuente de IL-1, IL-6 y TNF; callo blando, de 2 a 6 semanas, donde la zona central hipóxica forma cartílago con colágeno tipo II; callo duro, hasta unos 3 meses, con colágeno tipo I; y remodelación, que puede durar años y restituye la arquitectura.","w":["El callo blando precede al duro.","La inflamación es la primera fase, no la segunda.","La remodelación es la última fase, no la primera.","Correcta: inflamación, callo blando, callo duro y remodelación."]},{"s":"ORT","c":11,"t":"Colágeno del callo","q":"Relacione el colágeno del callo blando con el del callo duro:","o":["Callo blando colágeno tipo II; callo duro colágeno tipo I","Callo blando colágeno tipo I; callo duro colágeno tipo II cartilaginoso","Callo blando colágeno tipo I; callo duro colágeno tipo IV de membrana","Callo blando colágeno tipo III; callo duro colágeno tipo II"],"a":0,"e":"En la fase de callo blando, de 2 a 6 semanas, la zona central hipóxica forma cartílago con colágeno tipo II; en la fase de callo duro, hasta unos 3 meses, predomina el colágeno tipo I, que es el del hueso maduro. Esa transición de colágeno cartilaginoso a óseo es la que confiere resistencia mecánica progresiva al foco.","w":["Correcta: tipo II cartilaginoso primero y tipo I óseo después.","Invierte ambos tipos de colágeno.","El tipo IV es de membranas basales.","El tipo III no es el descrito para estas fases."]},{"s":"ORT","c":11,"t":"Consolidación directa","q":"¿Qué exige la consolidación directa o per primam?","o":["Ausencia de vascularización en el foco de fractura","Reducción anatómica y estabilización rígida, sin callo","Cierta movilidad interfragmentaria con formación de callo","Inmovilización con yeso circular durante seis semanas"],"a":1,"e":"La consolidación directa o per primam exige reducción anatómica y estabilización rígida, típicamente placa con tornillos: no se forma callo y son los conos perforantes los que depositan hueso nuevo a través del foco. La indirecta o secundaria ocurre cuando queda cierta movilidad y sí forma callo, con clavo endomedular o fijador externo.","w":["La vascularización es imprescindible para consolidar.","Correcta: sin movilidad no hay callo y actúan los conos perforantes.","Esa es la consolidación indirecta o secundaria.","El yeso permite cierta movilidad y produce consolidación indirecta."]},{"s":"ORT","c":11,"t":"Factores que promueven la consolidación","q":"¿Cuál de los siguientes NO promueve la consolidación ósea?","o":["La vitamina D","La carga controlada","El tabaquismo","La hormona de crecimiento"],"a":2,"e":"Promueven la consolidación las hormonas de crecimiento, insulina, esteroides anabolizantes, tiroideas y calcitonina, las vitaminas A y D, los factores de crecimiento IL-1, IL-6, BMP, TGF-beta, FGF, IGF y PDGF, y factores físicos como el ejercicio y la carga controlada. La retrasan el tabaquismo, los corticoides, los antiinflamatorios, la desnutrición y la infección.","w":["Las vitaminas A y D favorecen la consolidación.","La carga controlada estimula la actividad osteoblástica.","Correcta: el tabaquismo es uno de los factores que retrasan la consolidación.","La hormona de crecimiento figura entre los promotores."]},{"s":"ORT","c":11,"t":"Propiedades de los injertos","q":"¿Qué significa que un injerto sea osteoinductor?","o":["Ofrece un andamio para que el hueso lo penetre","Aporta células capaces de la formar hueso por sí mismo","Se reabsorbe sin dejar sustrato mineral","Estimula a las células del receptor para formar hueso"],"a":3,"e":"Osteogénico significa que aporta células y factores capaces de formar hueso por sí mismo, osteoinductor que estimula a las células del receptor para que lo formen, y osteoconductor que ofrece un andamio para que el hueso lo penetre y lo sustituya. El autoinjerto reúne las tres propiedades y es el patrón de referencia.","w":["Ofrecer andamio es ser osteoconductor.","Aportar células propias es ser osteogénico.","La reabsorción sin sustrato no define ninguna de las tres propiedades.","Correcta: la inducción actúa sobre las células del huésped."]},{"s":"ORT","c":11,"t":"Autoinjerto","q":"¿Por qué el autoinjerto es el patrón de referencia?","o":["Reúne las tres propiedades: osteogénico, inductor y conductor","Porque es solo osteoconductor","Porque no requiere segunda incisión quirúrgica","Porque tiene disponibilidad ilimitada"],"a":0,"e":"El autoinjerto reúne las tres propiedades, osteogénico, osteoinductor y osteoconductor, y por eso es el patrón de referencia frente al aloinjerto y los sustitutos sintéticos. Osteogénico es aportar células capaces de formar hueso, osteoinductor estimular a las células del receptor y osteoconductor ofrecer un andamio que el hueso penetra y sustituye.","w":["Correcta: es el único que combina las tres propiedades.","Es osteogénico, inductor y conductor a la vez.","Precisamente su desventaja es requerir una zona donante.","Su disponibilidad es limitada por la zona donante."]},{"s":"ORT","c":11,"t":"Células óseas","q":"Relacione el osteoblasto con el osteoclasto según la enzima que elevan:","o":["Osteoblasto eleva la LDH; osteoclasto eleva la fosfatasa alcalina sérica","Osteoblasto eleva fosfatasa alcalina; osteoclasto eleva fosfatasa ácida","Osteoblasto eleva la creatincinasa; osteoclasto eleva la fosfatasa ácida","Osteoblasto eleva fosfatasa ácida; osteoclasto eleva fosfatasa alcalina en suero"],"a":1,"e":"El osteoblasto forma hueso, produce osteoide y mineral, y eleva la fosfatasa alcalina, que se dispara en los tumores formadores de hueso como el osteosarcoma. El osteoclasto es multinucleado, deriva de la línea monocito-macrófago, reabsorbe hueso liberando calcio y fosfato, y eleva la fosfatasa ácida, que hace sospechar tumores osteolíticos.","w":["La LDH se eleva en el osteosarcoma, pero no es enzima osteoblástica específica.","Correcta: alcalina para el osteoblasto y ácida para el osteoclasto.","La creatincinasa es marcador de daño muscular.","Invierte ambas enzimas."]},{"s":"ORT","c":11,"t":"Origen del osteoclasto","q":"¿De qué línea celular deriva el osteoclasto?","o":["Del condrocito hipertrófico","Del fibroblasto perióstico","De la línea monocito-macrófago","De la célula mesenquimal estromal"],"a":2,"e":"El osteoclasto es multinucleado, deriva de la línea monocito-macrófago, reabsorbe hueso liberando calcio y fosfato, y eleva la fosfatasa ácida. El osteoblasto, en cambio, procede de la línea mesenquimal, forma hueso y eleva la fosfatasa alcalina; el osteocito es el osteoblasto maduro atrapado en la matriz.","w":["El condrocito participa en la osificación endocondral, no origina osteoclastos.","El fibroblasto perióstico no es precursor del osteoclasto.","Correcta: es de origen hematopoyético, línea monocito-macrófago.","La línea mesenquimal origina al osteoblasto."]},{"s":"ORT","c":11,"t":"Unidad estructural del hueso compacto","q":"¿Cuál es la unidad estructural del hueso compacto diafisario?","o":["La laguna de Howship","El canal de Volkmann","La trabécula","La osteona o sistema de Havers"],"a":3,"e":"La diáfisis es hueso compacto y su unidad es la osteona o sistema de Havers: un conducto central con vasos, laminillas concéntricas alrededor y canales de Volkmann que conectan osteonas entre sí. La epífisis es hueso esponjoso y su unidad es la trabécula, una red arquitectónica orientada según las líneas de carga.","w":["La laguna de Howship es el sitio de reabsorción osteoclástica.","El canal de Volkmann conecta osteonas, no es la unidad.","La trabécula es la unidad del hueso esponjoso.","Correcta: la osteona es la unidad del hueso compacto."]},{"s":"ORT","c":11,"t":"Huesos de vascularización precaria","q":"Todos los siguientes tienen aporte vascular precario y flujo retrógrado, EXCEPTO uno. ¿Cuál?","o":["La diáfisis tibial","El escafoides carpiano","La cabeza femoral","El astrágalo"],"a":0,"e":"El hueso recibe irrigación por arteria nutricia diafisaria, vasos metafisarios y epifisarios y capilares periósticos. Los huesos con aporte precario y de flujo retrógrado son la cabeza femoral, el escafoides carpiano, la cabeza humeral y el astrágalo, y en ellos la fractura amenaza la vitalidad del fragmento proximal con necrosis avascular.","w":["Correcta: la diáfisis tibial tiene aporte nutricio directo, no retrógrado.","El escafoides tiene alto riesgo de necrosis del polo proximal.","La cabeza femoral es el ejemplo clásico de flujo retrógrado.","El astrágalo figura entre los de vascularización precaria."]},{"s":"ORT","c":11,"t":"Metabolismo de la vitamina D","q":"¿Dónde se produce la 1-alfa-hidroxilación de la vitamina D?","o":["En el intestino","En el riñón","En la piel","En el hígado"],"a":1,"e":"La vitamina D procede de la dieta y de la síntesis cutánea por radiación ultravioleta. En el hígado la 25-hidroxilasa produce 25-OH-vitamina D y en el riñón la 1-alfa-hidroxilasa la convierte en 1,25-dihidroxivitamina D, la forma activa, que aumenta la absorción intestinal de calcio y fosfato.","w":["El intestino es el órgano diana, no el sitio de activación.","Correcta: el riñón realiza la hidrox

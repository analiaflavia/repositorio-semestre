atoria en el pulmón; constipación, hipertrofia del esfínter de Oddi y menor motilidad en el aparato digestivo; retención urinaria en el genitourinario; y prurito con rubor por liberación local de histamina en la piel.","w":["La histamina se libera localmente y produce prurito y rubor cutáneo.","La depresión miocárdica directa es un rasgo del tiopental.","No bloquean el nodo sinusal de forma directa.","Correcta: la caída del tono simpático explica ambos efectos."]},{"c":3,"t":"Depresión respiratoria por opioides","q":"¿A qué pierde sensibilidad el centro respiratorio bajo efecto de opioides?","o":["Al CO2 y a la hipoxia","Solo a la hipoxia periférica","A la distensión pulmonar","Solo al pH del líquido cefalorraquídeo"],"a":0,"e":"La depresión respiratoria por opioides se debe a la menor sensibilidad del centro respiratorio al CO2 y a la hipoxia, es dependiente de la dosis y de la vía, y conduce a acidosis respiratoria. En la morfina, la depresión respiratoria es la causa de muerte más común. La acidosis respiratoria implica aumento de la PaCO2, ascenso de los hidrogenionesy descenso del pH arterial.","w":["Correcta: se pierde la respuesta tanto al CO2 como a la hipoxia.","La pérdida no se limita al estímulo hipóxico.","El reflejo de distensión pulmonar no es el mecanismo descrito.","El pH participa, pero el estímulo descrito es el CO2 y la hipoxia."]},{"c":3,"t":"Fases de la abstinencia","q":"Ordene las fases de la abstinencia de opioides según su cronología:","o":["8 h ansiedad y craving; 8-24 h vómito y fiebre; 3 días rinorrea con midriasis","8 h ansiedad y craving; 8-24 h rinorrea y midriasis; 3 días vómito y fiebre","8 h vómito y fiebre; 8-24 h ansiedad y craving; 3 días rinorrea con midriasis","8 h rinorrea y midriasis; 8-24 h vómito y fiebre; 3 días ansiedad con craving"],"a":1,"e":"La abstinencia evoluciona en tres fases: fase 1 a las 8 horas, con ansiedad y craving; fase 2 de 8 a 24 horas, con ansiedad, insomnio, síntomas gastrointestinales, rinorrea, midriasis y diaforesis; y fase 3 a los 3 días, con taquicardia, vómito, hipertensión, diarrea, fiebre, temblor, piloerección y espasmos. Si el paciente no usa opioides de forma crónica no pasa nada al suspenderlos; si es dependiente, nunca de forma abrupta.","w":["El orden de las dos últimas fases está invertido.","Correcta: primero lo psíquico, después lo autonómico y al final el cuadro florido.","El vómito y la fiebre pertenecen a la fase tardía, a los 3 días.","La rinorrea y la midriasis aparecen en la segunda fase, no en la primera."]},{"c":3,"t":"Intoxicación por opioides","q":"Paciente inconsciente con pupilas puntiformes y frecuencia respiratoria de 6 por minuto. ¿Cuál es el antídoto?","o":["Pralidoxima","Flumazenilo","Naloxona","Fisostigmina"],"a":2,"e":"La intoxicación por opioides se reconoce por miosis puntiforme, depresión central y depresión respiratoria, y sus antídotos son la naloxona y la naltrexona. La naloxona se usa por vía intravenosa para revertir la depresión respiratoria, pero su pico máximo es a los 5 minutos y puede agotarse antes que el opioide, de modo que el paciente puede recaer en depresión respiratoria y hay que vigilarlo.","w":["La pralidoxima regenera la acetilcolinesterasa en la intoxicación por organofosforados.","El flumazenilo revierte benzodiacepinas.","Correcta: la naloxona revierte la depresión respiratoria por opioides.","La fisostigmina trata la intoxicación anticolinérgica central."]},{"c":3,"t":"Riesgo tras revertir con naloxona","q":"¿Por qué hay que vigilar al paciente después de revertir un opioide con naloxona?","o":["Porque puede precipitar una crisis adrenal","Porque produce depresión respiratoria de rebote","Porque su efecto dura más que cualquier opioide","Su pico es a los 5 minutos y puede agotarse antes que el opioide"],"a":3,"e":"La naloxona alcanza su pico máximo a los 5 minutos y puede acabarse antes que el opioide, de modo que el paciente puede recaer en depresión respiratoria: por eso hay que vigilarlo después de revertir. La naltrexona es oral, disminuye el deseo de alcohol y ayuda en la adicción a opioides, y la metilnaltrexona trata la constipación por opioides.","w":["La crisis adrenal se asocia al etomidato.","La naloxona no produce depresión respiratoria: la revierte.","Su duración es más corta que la de muchos opioides.","Correcta: su acción es breve y el opioide puede seguir actuando después."]},{"c":3,"t":"Tolerancia a los efectos adversos","q":"¿Cuál de estos efectos adversos de los opioides NO desaparece con el tiempo?","o":["El estreñimiento","La somnolencia","La náusea","El vómito"],"a":0,"e":"Los efectos dependientes de dosis desarrollan tolerancia y desaparecen con el tiempo o al bajar la dosis: náuseas, vómito y somnolencia. Los independientes de dosis no generan tolerancia y no desaparecen: estreñimiento, alucinaciones y miosis. Esa distinción permite anticiparle al paciente qué molestias mejorarán y cuáles habrá que manejar de forma indefinida, como el estreñimiento, que se trata con metilnaltrexona.","w":["Correcta: el estreñimiento no desarrolla tolerancia.","La somnolencia disminuye a medida que aparece tolerancia.","La náusea cede con el tiempo por tolerancia.","El vómito también es dependiente de dosis y remite."]},{"c":3,"t":"Mnemotecnia MORPHINE","q":"En la mnemotecnia MORPHINE de efectos adversos de la morfina, ¿qué representa la P?","o":["Parálisis intestinal","Neumonía por aspiración","Pupilas puntiformes","Prurito por histamina"],"a":1,"e":"La mnemotecnia MORPHINE resume los efectos adversos de la morfina: M de miosis, O de out of it por sedación, R de depresión respiratoria, P de neumonía por aspiración, H de hipotensión, I de infrequency por constipación y retención urinaria, N de náusea y E de emesis. Es una forma compacta de recordar que los opioides deprimen, estrechan la pupila, bajan la tensión y frenan el tránsito digestivo y urinario.","w":["La constipación corresponde a la I de infrequency.","Correcta: la P corresponde a pneumonia por aspiración.","La miosis es la M inicial.","El prurito existe, pero no es la letra P de la mnemotecnia."]},{"c":3,"t":"Identificación del opioide","q":"Opioide 80 a 100 veces más potente que la morfina, muy liposoluble, con inicio en 10 minutos y rigidez muscular como efecto adverso. ¿Cuál es?","o":["Metadona","Tramadol","Fentanilo","Meperidina"],"a":2,"e":"El fentanilo es de 80 a 100 veces más potente que la morfina, lo que lo convierte en primera línea en anestesia. Es muy liposoluble, con inicio rápido en unos 10 minutos y duración corta de unos 90 minutos, y se metaboliza por CYP450. Sus efectos adversos son hipotensión, depresión respiratoria y rigidez muscular, el llamado tórax leñoso, que puede dificultar la ventilación.","w":["La metadona destaca por su larga acción y el control de la abstinencia.","El tramadol tiene escasa unión a proteínas y eliminación renal del 80%.","Correcta: potencia, liposolubilidad y tórax leñoso identifican al fentanilo.","La meperidina destaca por la normeperidina y por no producir miosis."]},{"c":3,"t":"Meperidina","q":"¿Por qué la meperidina NO produce miosis?","o":["Porque no actúa en receptores mu","Porque se elimina antes de alcanzar el sistema nervioso","Porque su metabolito bloquea el nervio óptico","Por su efecto antimuscarínico"],"a":3,"e":"La meperidina tiene efecto antimuscarínico, de modo que no produce miosis ni estimulación gastrointestinal, a diferencia del resto de los opioides. Además se metaboliza a normeperidina, un inhibidor de la recaptación de serotonina que produce ansiedad, temblor y convulsiones, y por la toxicidad de ese metabolito su analgesia es de uso corto.","w":["Sí actúa en receptores opioides y produce analgesia.","Su efecto central es evidente: puede producir convulsiones.","La normeperidina es neuroexcitatoria, no un bloqueante óptico.","Correcta: el componente antimuscarínico contrarresta la miosis opioide."]},{"c":3,"t":"Metabolito de la meperidina","q":"¿Qué efecto tiene la normeperidina?","o":["Ansiedad, temblor y convulsiones","Sedación profunda y apnea","Retención urinaria aislada","Broncoespasmo por histamina"],"a":0,"e":"La meperidina se metaboliza a normeperidina, un inhibidor de la recaptación de serotonina que produce ansiedad, temblor y convulsiones; por la toxicidad de ese metabolito su analgesia se limita a usos cortos. Es una excepción dentro del grupo, donde lo habitual es la glucuronidación inactiva; la morfina, la hidromorfona y la oximorfona sufren además metabolismo de primer paso.","w":["Correcta: es un metabolito neuroexcitatorio con riesgo de convulsión.","El perfil del metabolito es excitatorio, no depresor.","La retención urinaria es un efecto del propio opioide.","La liberación de histamina no procede de este metabolito."]},{"c":3,"t":"Tramadol y metadona","q":"Relacione la utilidad de la metadona con un dato farmacocinético del tramadol:","o":["Metadona revierte la depresión respiratoria aguda; tramadol se une un 4% a proteínas","Metadona controla la abstinencia por su larga acción; tramadol se une un 4% a proteínas","Metadona controla la abstinencia por acción ultracorta; tramadol se elimina por vía biliar","Metadona es el antagonista de elección; tramadol tiene biodisponibilidad oral del 4%"],"a":1,"e":"La metadona se usa para dolor y tiene larga acción, por lo que controla la abstinencia; esa misma vida media larga explica su potencial de dependencia. El tramadol tiene escasa unión a proteínas, del 4%, biodisponibilidad oral del 70%, eliminación renal del 80% y metabolismo hepático. La oxicodona se metaboliza por CYP450 2D6 y la heroína a 6-monoacetilmorfina.","w":["Revertir la depresión respiratoria es función de la naloxona.","Correcta: metadona de larga acción y tramadol con 4% de unión proteica.","La utilidad de la metadona depende de que su acción sea prolongada.","La metadona es agonista completo y la biodisponibilidad del tramadol es del 70%."]},{"c":3,"t":"Suspensión perioperatoria de opioides","q":"Paciente dependiente de opioides que ingresa para cirugía programada. ¿Qué NO debe hacerse?","o":["Mantener su dosis habitual","Añadir analgesia multimodal","Suspender el opioide de forma abrupta","Vigilar signos de abstinencia"],"a":2,"e":"Si el paciente no usa opioides de forma crónica, no pasa nada al suspenderlos en el perioperatorio. Si sí es dependiente, nunca se suspenden abruptamente, para evitar el síndrome de abstinencia, cuyas fases van desde la ansiedad y el craving de las primeras 8 horas hasta el cuadro florido de los 3 días con taquicardia, vómito, hipertensión, diarrea y fiebre.","w":["Mantener la dosis basal es precisamente la conducta correcta.","La analgesia multimodal es deseable en este paciente.","Correcta: la retirada brusca precipita el síndrome de abstinencia.","Vigilar la abstinencia forma parte del manejo adecuado."]},{"c":3,"t":"Mecanismo de las benzodiacepinas","q":"¿Qué hacen las benzodiacepinas en el canal de cloro?","o":["Bloquean el canal de forma competitiva","Aumentan la duración de la apertura","Aumentan la conductancia unitaria","Aumentan la frecuencia de apertura"],"a":3,"e":"Las benzodiacepinas forman parte del complejo GABA-A y aumentan la frecuencia de apertura de los canales de cloro, a diferencia de los barbitúricos que aumentan la duración. Además inhiben el GABA disminuyendo puntos de unión y afinidad, y cruzan la placenta y la leche materna. Su gran ventaja es que producen depresión cardiorrespiratoria pero siempre reversible con flumazenilo.","w":["No bloquean el canal: potencian la acción del GABA.","La duración de apertura es lo que prolongan los barbitúricos.","La conductancia unitaria no es el parámetro que modifican.","Correcta: aumentan la frecuencia con que se abre el canal."]},{"c":3,"t":"Subtipos BZ1 y BZ2","q":"Relacione los efectos del receptor BZ1 con los del BZ2:","o":["BZ1: sedación, amnesia y anticonvulsivante; BZ2: ansiolítico y miorrelajante","BZ1: ansiolítico y miorrelajante; BZ2: sedación con amnesia y efecto anticonvulsivante","BZ1: sedación, amnesia y anticonvulsivante; BZ2: analgesia con efecto antitusivo","BZ1: analgesia con sedación profunda; BZ2: ansiolítico y miorrelajante del paciente"],"a":0,"e":"El receptor BZ1, subunidad alfa 1, produce sedación, amnesia y efecto anticonvulsivante; el BZ2, subunidad alfa 2, produce ansiólisis, efectos sobre la función cognitiva y miorrelajación. Las benzodiacepinas se distribuyen en bulbo olfatorio, corteza, cerebelo, hipocampo, sustancia negra, colículo inferior, médula espinal y núcleo estriado, y no producen analgesia.","w":["Correcta: BZ1 sedación y amnesia; BZ2 ansiólisis y miorrelajación.","Invierte los dos subtipos de receptor.","El efecto antitusivo pertenece a los opioides.","Las benzodiacepinas no tienen efecto analgésico."]},{"c":3,"t":"Ocupación de receptores","q":"¿A partir de qué porcentaje de ocupación de receptores aparece la amnesia por benzodiacepinas?","o":["Entre el 30 y el 50%","Por encima del 20%","Por encima del 60%","Por debajo del 20%"],"a":1,"e":"El porcentaje de ocupación de receptores explica la progresión de efectos: por debajo del 20% el efecto es ansiolítico, que es el más común; por encima del 20% aparece la amnesia; entre el 30 y el 50% hay sedación; y por encima del 60% se produce pérdida de conciencia. Es la traducción cuantitativa de que el efecto depende de la dosis.","w":["Ese rango corresponde a la sedación.","Correcta: superado el 20% de ocupación aparece el efecto amnésico.","Por encima del 60% ya hay pérdida de conciencia.","Por debajo del 20% el efecto es solo ansiolítico."]},{"c":3,"t":"Benzodiacepinas en la hepatopatía","q":"¿Qué benzodiacepinas pueden usarse con más seguridad en el paciente con hepatopatía avanzada?","o":["Diazepam y temazepam","Midazolam y alprazolam","Oxazepam, lorazepam y temazepam","Diazepam, midazolam y clonazepam"],"a":2,"e":"El oxazepam, el lorazepam y el temazepam no dependen del metabolismo hepático, dato de alto rendimiento que las convierte en opciones seguras cuando la función hepática está comprometida; el resto se metaboliza en el hígado. Por duración, el midazolam es de acción corta y produce la mayor amnesia anterógrada, el lorazepam es intermedio y el diazepam de acción larga.","w":["El diazepam es de metabolismo hepático.","El midazolam se metaboliza en el hígado.","Correcta: esas tres eluden el metabolismo hepático.","El diazepam y el midazolam dependen del hígado."]},{"c":3,"t":"Duración de las benzodiacepinas","q":"¿Cuál es la benzodiacepina de acción corta con mayor amnesia anterógrada?","o":["Diazepam","Lorazepam","Oxazepam","Midazolam"],"a":3,"e":"Por duración, el midazolam es de acción corta y produce la mayor amnesia anterógrada, con aclaramiento de 6 a 11 mg/kg/min; el lorazepam es de acción intermedia y el diazepam de acción larga. Las vías también difieren: el diazepam se usa poco por vía intravenosa porque es irritante y no da buena amnesia, y el midazolam es el único que se administra por vía intranasal.","w":["El diazepam es de acción larga y da mala amnesia.","El lorazepam es de acción intermedia.","El oxazepam destaca por no depender del hígado, no por su amnesia.","Correcta: midazolam, corto y con la mayor amnesia anterógrada."]},{"c":3,"t":"Dolor a la inyección de diazepam","q":"¿A qué se debe el dolor a la inyección del diazepam?","o":["Al solvente de la preparación","A la liberación de histamina","A la propia molécula de benzodiacepina","A su pH muy alcalino"],"a":0,"e":"El dolor a la inyección del diazepam se debe al solvente, no al hecho de ser una benzodiacepina, y se acompaña de flebitis y tromboflebitis; además es teratogénico. Sus efectos adversos generales son dependencia y depresión del sistema nervioso central, con confusión, ansiedad, agitación, insomnio en ancianos y convulsión de rebote.","w":["Correcta: el vehículo, no la molécula, es el responsable del dolor.","La liberación de histamina caracteriza al atracurio y al mivacurio.","La molécula en sí no explica el dolor a la inyección.","El pH muy alcalino con quemadura al extravasarse es rasgo del tiopental."]},{"c":3,"t":"Ventaja de seguridad de las benzodiacepinas","q":"¿Cuál es la gran ventaja de seguridad de las benzodiacepinas frente a otros depresores?","o":["No producen depresión cardiorrespiratoria","Su depresión cardiorrespiratoria es reversible","Carecen de potencial de dependencia","No cruzan la barrera placentaria"],"a":1,"e":"Las benzodiacepinas producen depresión cardiorrespiratoria, pero siempre reversible con flumazenilo, y esa es su gran ventaja. Mantienen la frecuencia cardiaca y producen inotropismo negativo, que queda enmascarado por la liberación de catecolaminas. Cruzan la placenta y la leche materna, y entre sus efectos adversos figura la dependencia.","w":["Sí producen depresión cardiorrespiratoria, aunque reversible.","Correcta: existe un antagonista específico, el flumazenilo.","La dependencia es uno de sus efectos adversos descritos.","Cruzan la placenta y la leche materna."]},{"c":3,"t":"Dosis de midazolam","q":"¿Cuál es la dosis de midazolam para inducción intravenosa?","o":["0,02 mg/kg","0,6 mg/kg","0,15 mg/kg","1,5 mg/kg"],"a":2,"e":"El midazolam se usa a 0,15 mg/kg para inducción y de 0,02 a 0,1 mg/kg para sedación intravenosa. El diazepam se emplea a 0,3-0,6 mg/kg para inducción y 0,04-0,2 mg/kg para sedación, y el lorazepam a 0,03-0,04 mg/kg para sedación intravenosa. La taquifilaxia se describe con diazepam a 900 microgramos por mililitro y midazolam a 100.","w":["Ese valor está en el rango de sedación, no de inducción.","El rango de 0,3 a 0,6 mg/kg corresponde al diazepam.","Correcta: 0,15 mg/kg es la dosis de inducción del midazolam.","Esa es la dosis de inducción de la ketamina."]},{"c":3,"t":"Perla del profesor sobre la alergia","q":"Un paciente refiere alergia a las benzodiacepinas por una mala experiencia previa. Según la perla del profesor, ¿qué explica más probablemente ese episodio?","o":["La ausencia de premedicación previa","Una reacción del hipersensibilidad tipo I","Un déficit de colinesterasa plasmática","La dosis y la velocidad de administración"],"a":3,"e":"La perla del profesor es que las dos variables que determinan el efecto adverso son la dosis y la velocidad de administración, no la alergia que a veces reporta el paciente. Es la aplicación de la regla general de los anestésicos endovenosos, y también el motivo por el que en la evaluación preanestésica hay que distinguir la alergia verdadera de la simple intolerancia a fármacos.","w":["La falta de premedicación no explica un efecto adverso atribuido al fármaco.","La hipersensibilidad verdadera es mucho menos frecuente que la intolerancia.","El déficit de colinesterasa prolonga el efecto de la succinilcolina.","Correcta: casi siempre es un efecto por dosis o velocidad, no una alergia."]},{"c":4,"t":"Lo que no hacen los relajantes","q":"¿Cuál de los siguientes efectos NO producen los relajantes musculares?","o":["Analgesia","Bloqueo de la placa motora","Parálisis de los intercostales","Parálisis del diafragma"],"a":0,"e":"Los relajantes musculares no producen analgesia ni suprimen la conciencia: paralizan sin dormir ni quitar el dolor, y de ahí que se administren siempre junto a un hipnótico y un analgésico. La otra advertencia general es el cuidado con la deficiencia de colinesterasa plasmática, que prolonga el bloqueo, y la regla de que siempre se deben revertir.","w":["Correcta: no aportan analgesia, y ese es su límite fundamental.","Actúan precisamente sobre la placa neuromuscular.","La parálisis intercostal forma parte de su efecto.","Sí paralizan el diafragma, de ahí la necesidad de ventilar."]},{"c":4,"t":"Estructura de la succinilcolina","q":"¿Qué explica que la succinilcolina se adhiera a los receptores nicotínicos de la placa motora?","o":["Es una bencilisoquinolina cuaternaria","Está formada por dos moléculas de acetilcolina","Contiene un anillo imidazólico cargado","Es un derivado esteroideo del colesterol"],"a":1,"e":"La succinilcolina o suxametonio es el único relajante despolarizante: un compuesto de amonio cuaternario formado por dos moléculas de acetilcolina unidas espalda con espalda, con fórmula C14H30N2O4. Esa estructura le permite ocupar los receptores nicotínicos de la unión neuromuscular y estimularlos de forma constante, impidiendo la repolarización.","w":["Las bencilisoquinolinas son el atracurio, el cisatracurio y el mivacurio.","Correcta: es un dímero de acetilcolina y por eso ocupa su receptor.","El anillo imidazólico corresponde al etomidato.","Los aminoesteroides son el rocuronio, el vecuronio y el pancuronio."]},{"c":4,"t":"Indicación de la succinilcolina","q":"Paciente con estómago lleno que requiere intubación urgente. ¿Por qué se elige succinilcolina?","o":["Por su efecto analgésico añadido","Por su estabilidad hemodinámica absoluta","Por su inicio rápido y acción ultracorta","Por no requerir reversión farmacológica"],"a":2,"e":"La succinilcolina se usa en la inducción de secuencia rápida en el paciente con estómago lleno, para asegurar la vía aérea cuanto antes y evitar que vomite y broncoaspire, y también en terapia electroconvulsiva y en obstetricia por el retardo del vaciamiento gástrico. Su perfil es de inicio rápido y acción ultracorta: 1 mg produce supresión completa de la respuesta neuromuscular durante 60 segundos.","w":["No produce analgesia, como ningún relajante muscular.","Produce bradicardia, arritmias e hiperpotasemia: no es hemodinámicamente neutra.","Correcta: el inicio rápido con acción ultracorta es lo que la hace idónea.","No requerir reversión es cierto, pero no es la razón de elegirla aquí."]},{"c":4,"t":"Metabolismo de la succinilcolina","q":"¿Qué enzima hidroliza la succinilcolina?","o":["La monoaminooxidasa","El citocromo P450 3A4","La acetilcolinesterasa","La butirilcolinesterasa"],"a":3,"e":"La succinilcolina se hidroliza por butirilcolinesterasa, también llamada pseudocolinesterasa o colinesterasa plasmática. En el paciente con colinesterasa plasmática deficiente el bloqueo se prolonga de forma marcada, y ese es uno de los efectos adversos descritos, junto con el aumento de mioglobina, la hipertermia maligna, el edema pulmonar y el bloqueo de fase II.","w":["La monoaminooxidasa metaboliza catecolaminas y aminas biógenas.","El citocromo P450 metaboliza las amidas y el fentanilo, no este fármaco.","La acetilcolinesterasa actúa sobre la acetilcolina en la hendidura sináptica.","Correcta: la hidroliza la butirilcolinesterasa o colinesterasa plasmática."]},{"c":4,"t":"Efecto cronotrópico según la dosis","q":"Relacione el efecto cronotrópico de la dosis baja de succinilcolina con el de la dosis alta:","o":["Dosis baja bradicardia; dosis alta taquicardia","Dosis baja taquicardia sostenida; dosis alta bradicardia con ritmo de unión","Dosis baja bradicardia sinusal; dosis alta bloqueo auriculoventricular completo","Dosis baja sin efecto alguno; dosis alta taquicardia con hipertensión sostenida"],"a":0,"e":"La succinilcolina estimula receptores autónomos de acetilcolina, nicotínicos en ganglios simpáticos y parasimpáticos y muscarínicos en el nódulo sinusal, y produce bradicardia sinusal, ritmo de unión y arritmias ventriculares. La regla de dosis es que la baja es cronotrópica e inotrópica negativa, con bradicardia, y la alta cronotrópica e inotrópica positiva, con taquicardia.","w":["Correcta: bradicardia con dosis baja y taquicardia con dosis alta.","Invierte la respuesta según la dosis.","El bloqueo auriculoventricular completo no es el efecto descrito.","Sí hay efecto con dosis baja: bradicardia por estímulo muscarínico sinusal."]},{"c":4,"t":"Riesgo de hiperpotasemia","q":"Paciente con enfermedad neuromuscular denervante que recibe succinilcolina y hace paro cardíaco. ¿Cuál es el mecanismo?","o":["Acidosis metabólica por rabdomiólisis","Hiperpotasemia por receptores extrasinápticos","Hipocalcemia por quelación del calcio","Hipopotasemia por entrada masiva de potasio"],"a":1,"e":"En el paciente con receptores de acetilcolina extrasinápticos por denervación, propio de las enfermedades neuromusculares, la succinilcolina puede provocar hiperpotasemia y paro cardíaco. También hay que tener cuidado en acidosis e hipovolemia, y no se usa en niños. El tratamiento es hiperventilación, 1 a 2 mg de cloruro de calcio intravenoso, 1 meq/kg de bicarbonato y 10 unidades de insulina regular en 50 ml de glucosada al 50%.","w":["La rabdomiólisis existe, pero el mecanismo del paro es la hiperpotasemia.","Correcta: la denervación multiplica receptores y libera potasio masivamente.","La hipocalcemia por citrato aparece en la transfusión masiva.","El potasio sale de la célula: el problema es el exceso, no el déficit."]},{"c":4,"t":"Tratamiento de la hiperpotasemia","q":"¿Cuál de las siguientes medidas NO forma parte del tratamiento de la hiperpotasemia por succinilcolina?","o":["Dar cloruro de calcio intravenoso","Administrar insulina con glucosa","Administrar potasio para estabilizar la membrana","Hiperventilar al paciente"],"a":2,"e":"El tratamiento de la hiperpotasemia por succinilcolina es hiperventilación, 1 a 2 mg de cloruro de calcio intravenoso, 1 meq/kg de bicarbonato de sodio y 10 unidades de insulina regular en 50 ml de solución glucosada al 50%. La hiperventilación alcaliniza y desplaza potasio al interior celular, el calcio estabiliza la membrana miocárdica y la insulina con glucosa introduce potasio en la célula.","w":["El cloruro de calcio estabiliza la membrana miocárdica.","La insulina con glucosa desplaza potasio al interior celular.","Correcta: administrar potasio agravaría el trastorno que se quiere corregir.","La hiperventilación es parte del esquema descrito."]},{"c":4,"t":"Prevención de las fasciculaciones","q":"¿Cómo se previenen las fasciculaciones por succinilcolina?","o":["Con un anticolinérgico previo","Con neostigmina antes de la inducción","Con hiperventilación previa","Con precurarización y diazepam"],"a":3,"e":"Las fasciculaciones son el efecto adverso más común en adultos, se relacionan con la despolarización de receptores colinérgicos presinápticos y correlacionan con las mialgias postoperatorias. Se previenen con precurarización, es decir una dosis baja de un relajante no despolarizante, más diazepam a 0,05 mg/kg. El paciente con mialgias postoperatorias tras opioide, hipnótico, relajante y gas orienta a succinilcolina.","w":["El anticolinérgico controla secreciones y bradicardia, no las fasciculaciones.","La neostigmina revierte el bloqueo no despolarizante; no previene nada aquí.","La hiperventilación trata la hiperpotasemia, no las fasciculaciones.","Correcta: dosis baja de no despolarizante más diazepam a 0,05 mg/kg."]},{"c":4,"t":"Mialgias por succinilcolina","q":"¿En qué población son más frecuentes las mialgias por succinilcolina?","o":["Mujeres en cirugía ambulatoria","Niños en cirugía de urgencia","Ancianos en cirugía mayor","Varones en cirugía prolongada"],"a":0,"e":"Las mialgias por succinilcolina tienen frecuencia muy variable, del 0,2 al 89%, y son más comunes en mujeres y en procedimientos cortos o ambulatorios. El mecanismo son las fasciculaciones que lesionan las fibras musculares, con aumento de mioglobina y creatincinasa; el tratamiento preventivo es administrar antes un bloqueador no despolarizante.","w":["Correcta: predominan en mujeres y en procedimientos cortos.","En niños no se usa de rutina por el riesgo de hiperpotasemia.","La población descrita no es la anciana.","El predominio descrito es femenino, no masculino."]},{"c":4,"t":"Presión intraocular y succinilcolina","q":"Paciente con herida perforante ocular que requiere intubación. ¿Qué relajante conviene evitar y por qué?","o":["Vecuronio, porque se acumula en el vítreo","Succinilcolina, porque eleva la presión intraocular","Rocuronio, porque su inicio es demasiado lento","Cisatracurio, porque libera histamina"],"a":1,"e":"La succinilcolina eleva la presión intraocular, con máximo a los 2 a 4 minutos y desaparición a los 6 minutos, y está contraindicada en procesos oftalmológicos a menos que se abra la cámara anterior; el tratamiento descrito es nifedipina. Las heridas perforantes oculares figuran entre sus contraindicaciones parciales, junto con la hipertensión intracraneal y la miastenia gravis.","w":["El vecuronio no tiene ese comportamiento descrito.","Correcta: el ascenso de la presión intraocular puede extruir contenido ocular.","El rocuronio da condiciones de intubación en 30 a 90 segundos.","El cisatracurio no libera histamina: es su ventaja frente al atracurio."]},{"c":4,"t":"Presión intragástrica","q":"¿Con qué presión intragástrica se pierde la competencia de la unión gastroesofágica en la embarazada?","o":["Con 28 cmH2O","Con 5 cmH2O","Con 15 cmH2O","Con 40 cmH2O"],"a":2,"e":"La succinilcolina aumenta la presión intragástrica, y la competencia de la unión gastroesofágica se pierde por encima de 28 cmH2O en el paciente normal; en el embarazo, la obstrucción intestinal y la hernia hiatal la incompetencia ocurre ya con 15 cmH2O. Es coherente con que todo embarazo se considere estómago lleno por el enlentecimiento mecánico del vaciamiento gástrico.","w":["Los 28 cmH2O corresponden al paciente sin factores de riesgo.","Cinco cmH2O es una presión insuficiente para vencer el esfínter.","Correcta: en la embarazada el umbral baja a 15 cmH2O.","Cuarenta cmH2O supera ambos umbrales descritos."]},{"c":4,"t":"Contraindicaciones de la succinilcolina","q":"Todas las siguientes son contraindicaciones de la succinilcolina, EXCEPTO una. ¿Cuál?","o":["Lesión medular","Guillain-Barré","Quemaduras extensas","Estómago lleno"],"a":3,"e":"Las contraindicaciones de la succinilcolina incluyen quemaduras, traumatismos, lesiones medulares, Guillain-Barré, infecciones severas, encefalitis, alergia al fármaco, antecedente familiar de hipertermia maligna y denervación según el tiempo. Las parciales son las heridas perforantes oculares, la hipertensión intracraneal y la miastenia gravis. El estómago lleno, en cambio, es su indicación principal.","w":["La lesión medular contraindica su uso por receptores extrasinápticos.","El Guillain-Barré figura expresamente entre las contraindicaciones.","Las quemaduras extensas son contraindicación por riesgo de hiperpotasemia.","Correcta: el estómago lleno es la indicación, no una contraindicación."]},{"c":4,"t":"Identificación del relajante","q":"Relajante no despolarizante que produce condiciones satisfactorias de intubación en 30 a 90 segundos y es el más usado actualmente. ¿Cuál es?","o":["Rocuronio","Atracurio","Mivacurio","Pancuronio"],"a":0,"e":"El rocuronio produce condiciones satisfactorias de intubación en 30 a 90 segundos y es el relajante no despolarizante más usado actualmente, en buena medida porque ese inicio rápido lo acerca a la succinilcolina sin sus efectos adversos y porque cuenta con antídoto específico, el sugammadex. En pediatría se usa a 0,45-0,46 mg/kg habitual y 1,0 mg/kg para secuencia rápida.","w":["Correcta: el rocuronio es el de inicio más rápido del grupo.","El atracurio destaca por la eliminación de Hoffman en el fallo renal.","El mivacurio tiene inicio en 2 a 3 minutos y acción corta.","El pancuronio destaca por su efecto vagolítico y de acción prolongada."]},{"c":4,"t":"Relajante en el fallo renal","q":"Paciente en insuficiencia renal terminal que requiere relajación prolongada. ¿Qué relajante es excelente por su vía de eliminación?","o":["Succinilcolina, por su hidrólisis rápida","Atracurio, por la reacción de Hoffman","Rocuronio, por su metabolismo hepático","Pancuronio, por su eliminación biliar"],"a":1,"e":"El atracurio se elimina por reacción de Hoffman e hidrólisis de ésteres, es decir de forma independiente del riñón, lo que lo hace excelente para el paciente en fallo renal. Sus inconvenientes son que libera histamina, con precaución en asmáticos, y que produce laudanosina, metabolito que puede causar convulsiones; la acidosis y la hipotermia prolongan su acción y es incompatible con el tiopental.","w":["La succinilcolina es de acción ultracorta, no sirve para relajación prolongada.","Correcta: la reacción de Hoffman no depende de la función renal.","El vecuronio, no el rocuronio, es el descrito como útil en insuficiencia renal.","El pancuronio es de eliminación renal y prolonga su efecto."]},{"c":4,"t":"Metabolito del atracurio","q":"¿Qué metabolito compartido por atracurio y cisatracurio puede causar convulsiones?","o":["Normeperidina","Monoacetilmorfina","Laudanosina","Norketamina"],"a":2,"e":"Tanto el atracurio como el cisatracurio producen laudanosina, un metabolito que puede causar convulsiones. Se diferencian en que el atracurio libera histamina y el cisatracurio no, y que este último no altera la frecuencia cardiaca ni la tensión arterial, lo que le da un perfil hemodinámico muy estable y lo hace útil en cirugías de trasplante.","w":["La normeperidina procede de la meperidina.","La 6-monoacetilmorfina procede de la heroína.","Correcta: la laudanosina es el metabolito convulsivante común a ambos.","La norketamina es metabolito de la ketamina."]},{"c":4,"t":"Cisatracurio frente a atracurio","q":"¿Qué ventaja tiene el cisatracurio sobre el atracurio?","o":["No produce metabolitos activos","Se puede revertir con sugammadex","Su inicio de acción es más rápido","No libera histamina ni altera la hemodinámica"],"a":3,"e":"El cisatracurio se elimina también por reacción de Hoffman, pero a diferencia del atracurio no libera histamina y no altera la frecuencia cardiaca ni la tensión arterial, lo que le da un perfil hemodinámico muy estable; se usa en cirugías de trasplante. También produce laudanosina, es sensible al pH y la temperatura y es incompatible con soluciones alcalinas.","w":["También produce laudanosina, igual que el atracurio.","El sugammadex encapsula aminoesteroides, no bencilisoquinolinas.","El de inicio más rápido del grupo es el rocuronio.","Correcta: sin liberación de histamina y sin cambios hemodinámicos."]},{"c":4,"t":"Pancuronio","q":"¿Qué efecto hemodinámico produce el pancuronio y por qué?","o":["Taquicardia e hipertensión por bloqueo vagal","Ningún cambio hemodinámico apreciable","Hipotensión por liberación de histamina","Bradicardia e hipotensión por estímulo vagal"],"a":0,"e":"El pancuronio produce bloqueo vagal y estimulación simpática, con taquicardia e hipertensión, y tiene acción antimuscarínica. Puede dar arritmias ventriculares combinado con halotano o con antidepresivos tricíclicos, y hay que tener cuidado en pacientes con alergia a los bromuros. Su duración es prolongada y en pediatría se dosifica a 0,1 mg/kg.","w":["Correcta: es vagolítico y simpaticomimético, de ahí la taquicardia.","El perfil hemodinámicamente neutro es el del cisatracurio.","La liberación de histamina caracteriza al atracurio y al mivacurio.","Ese perfil corresponde más a la succinilcolina a dosis baja."]},{"c":4,"t":"Pancuronio y halotano","q":"¿Por qué la combinación de pancuronio con halotano puede producir arritmias ventriculares?","o":["El halotano prolonga el intervalo QT","El halotano sensibiliza el miocardio a catecolaminas","El pancuronio libera potasio muscular","El pancuronio bloquea el nodo sinusal"],"a":1,"e":"El halotano sensibiliza el miocardio a las catecolaminas, y el pancuronio produce estimulación simpática por bloqueo vagal: la suma de ambos favorece arritmias ventriculares, igual que ocurre con los antidepresivos tricíclicos. Es el mismo mecanismo por el que un paciente anestesiado con halotano que recibe epinefrina desarrolla una arritmia ventricular.","w":["La prolongación del QT se describe con el sevoflurano.","Correcta: miocardio sensibilizado más descarga simpática igual a arritmia.","La liberación de potasio corresponde a la succinilcolina.","El pancuronio bloquea el vago, lo que acelera el nodo sinusal."]},{"c":4,"t":"Vecuronio y mivacurio","q":"Relacione la utilidad del vecuronio con el metabolismo del mivacurio:","o":["Vecuronio útil en insuficiencia renal; mivacurio por reacción de Hoffman exclusiva","Vecuronio metabolizado por pseudocolinesterasa; mivacurio útil en insuficiencia renal","Vecuronio útil en insuficiencia renal; mivacurio por pseudocolinesterasa","Vecuronio útil solo en el cirrótico; mivacurio por pseudocolinesterasa plasmática"],"a":2,"e":"El vecuronio es útil en la insuficiencia renal, donde su duración se prolonga solo de forma moderada, y en la cirrosis no suele prolongarse si la dosis es menor de 0,15 mg/kg. El mivacurio se metaboliza por pseudocolinesterasa, libera histamina y tiene acción corta, con inicio en 2 a 3 minutos. La reacción de Hoffman es la vía del atracurio y el cisatracurio.","w":["La reacción de Hoffman corresponde a atracurio y cisatracurio.","Invierte ambos perfiles farmacocinéticos.","Correcta: vecuronio en insuficiencia renal y mivacurio por pseudocolinesterasa.","El vecuronio es útil en insuficiencia renal, no solo en la cirrosis."]},{"c":4,"t":"Indicaciones de reversión","q":"¿Cuál de las siguientes situaciones obliga a revertir el bloqueo neuromuscular?","o":["Que ingrese a UCI tras cirugía cardiovascular","Que el TOF confirme recuperación espontánea","Que el paciente quede en ventilación mecánica","No haber monitorizado el bloqueo"],"a":3,"e":"Hay que revertir siempre que no se monitorice el bloqueo, siempre que haya alteración del DBS o del TOF, aunque la relación T4 sobre T1 sea normal, y siempre que exista duda. No se revierte cuando hay recuperación espontánea confirmada por TOF, cuando el paciente permanecerá en ventilación mecánica, o en cirugía cardiovascular e ingreso a UCI, donde se necesita mantener la relajación.","w":["En UCI tras cirugía cardiovascular interesa mantener la relajación.","La recuperación confirmada por TOF es motivo para no revertir.","Ese paciente no se revierte: seguirá ventilado.","Correcta: sin monitorización no se puede asumir recuperación y se revierte."]},{"c":4,"t":"Dosis de neostigmina","q":"¿Cuál es la dosis habitual de neostigmina para revertir un bloqueo no despolarizante?","o":["0,05 mg/kg","0,005 mg/kg","5 mg/kg","0,5 mg/kg"],"a":0,"e":"La neostigmina se administra a 0,05 mg/kg por vía intravenosa, con límites de 0,04 a 0,08 mg/kg, repitiendo la dosis inicial hasta observar respuesta clínica o hasta un máximo de 5 mg. Su inicio de acción es a los 2 minutos y la latencia de 7 a 15 minutos. Produce efectos nicotínicos y muscarínicos con respuesta vagal por inhibición de la acetilcolinesterasa.","w":["Correcta: 0,05 mg/kg, con rango de 0,04 a 0,08.","Esa dosis es diez veces menor que la indicada.","El máximo total es 5 mg, no 5 mg por kilo.","Medio miligramo por kilo es diez veces la dosis descrita."]},{"c":4,"t":"Neostigmina y bradicardia","q":"¿Por qué la neostigmina se administra junto con atropina o glicopirrolato?","o":["Para evitar la liberación de histamina","Para contrarrestar su efecto muscarínico","Para acortar su latencia de acción","Para potenciar su efecto nicotínico"],"a":1,"e":"La neostigmina inhibe la acetilcolinesterasa y produce efectos muscarínicos con respuesta vagal: bradicardia, depresión del nodo sinusal, bloqueo auriculoventricular e incluso paro cardíaco. La perla del profesor es estar pendiente de ese efecto, que aparece a los 3 a 5 minutos, y dar el anticolinérgico de una vez, sin esperar a que la bradicardia se instale.","w":["La histamina no interviene en la reversión con neostigmina.","Correcta: el anticolinérgico bloquea la bradicardia y la hipersecreción.","El anticolinérgico no modifica la latencia de la neostigmina.","El efecto nicotínico es el deseado y no lo potencia el anticolinérgico."]},{"c":4,"t":"Mecanismo del sugammadex","q":"¿Cómo revierte el sugammadex el bloqueo neuromuscular?","o":["Bloquea el receptor nicotínico presináptico","Inhibe la acetilcolinesterasa de la placa","Encapsula el relajante aminoesteroide","Acelera la hidrólisis por pseudocolinesterasa"],"a":2,"e":"El sugammadex es una ciclodextrina oligosacárida, un anillo D-glucosil alfa 1,4 con 6, 7 u 8 anillos, que actúa como encapsulador específico de los relajantes aminoesteroides, principalmente rocuronio y también vecuronio, en dosis de 2 a 16 mg/kg. Es hidrosoluble, biológicamente estable y no se fija a proteínas plasmáticas: no inhibe ninguna enzima, secuestra el fármaco.","w":["No actúa sobre el receptor nicotínico.","Ese es el mecanismo de la neostigmina, no del sugammadex.","Correcta: lo secuestra físicamente, sin actuar sobre ninguna enzima.","No modifica la hidrólisis enzimática de ningún relajante."]},{"c":4,"t":"Limitación del sugammadex","q":"Se revirtió con sugammadex y a las 6 horas el paciente requiere reintubación. ¿Qué limitación hay?","o":["No se puede revertir de nuevo con neostigmina","No se puede usar ningún anestésico inhalado","No se puede administrar succinilcolina en 24 horas","No se puede usar rocuronio ni vecuronio en 24 horas"],"a":3,"e":"El sugammadex mantiene su efecto durante 24 horas, y en ese periodo bloquea la posibilidad de volver a usar rocuronio o vecuronio, porque los encapsularía de inmediato. Hay que anticipar esa limitación si existe posibilidad de reintervención el mismo día. La succinilcolina, que no es aminoesteroide, no se ve afectada.","w":["La restricción es sobre los relajantes, no sobre la neostigmina.","No interfiere con los anestésicos inhalados.","La succinilcolina no es aminoesteroide y sigue siendo utilizable.","Correcta: los aminoesteroides quedan inutilizables durante 24 horas."]},{"c":4,"t":"Train of four","q":"¿Con qué porcentaje de receptores desocupados puede el paciente iniciar ventilación espontánea normal?","o":["Del 25 al 30%","Del 50 al 60%","Del 5 al 10%","Del 75 al 80%"],"a":0,"e":"Con el 25 al 30% de los receptores desocupados el paciente puede iniciar ventilación espontánea normal, y eso se confirma con el train of four, la monitorización estándar del bloqueo neuromuscular; también se emplea el DBS o doble ráfaga. La regla práctica es que si no se monitoriza, si el TOF o el DBS están alterados o si hay cualquier duda, se revierte.","w":["Correcta: basta con un cuarto de receptores libres para ventilar.","Sobreestima el umbral necesario para la ventilación espontánea.","Con esa proporción el paciente aún no ventila adecuadamente.","Con ese porcentaje la recuperación es prácticamente completa."]},{"c":4,"t":"Mecanismo de los no despolarizantes","q":"Relacione el mecanismo de los no despolarizantes con el de la succinilcolina:","o":["No despolarizantes compiten con la acetilcolina; succinilcolina inhibe la acetilcolinesterasa","No despolarizantes compiten con la acetilcolina; succinilcolina despolariza de forma persistente","No despolarizantes despolarizan de forma persistente; succinilcolina compite con la acetilcolina","No despolarizantes bloquean el canal de cloro; succinilcolina despolariza de forma persistente"],"a":1,"e":"Los no despolarizantes compiten con la acetilcolina por el receptor nicotínico sin activarlo, y por eso su bloqueo es reversible con anticolinesterásicos, que aumentan la acetilcolina disponible. La succinilcolina se adhiere al receptor y lo estimula de forma constante, impidiendo la repolarización, de modo que un anticolinesterásico no la revierte: ese contraste explica toda la lógica de la reversión.","w":["La inhibición de la acetilcolinesterasa es el mecanismo de la neostigmina.","Correcta: competición reversible frente a despolarización persistente.","Invierte ambos mecanismos.","El canal de cloro corresponde al GABA, no a la placa neuromuscular."]},{"c":5,"t":"Mecanismo de los inhalados","q":"¿Cuáles son las dos excepciones al mecanismo GABAérgico de los anestésicos inhalados?","o":["Isoflurano y desflurano","Enflurano y metoxiflurano","Óxido nitroso y ketamina","Halotano y sevoflurano"],"a":2,"e":"Los anestésicos inhalados aumentan la sensibilidad de los receptores GABA-A. Las excepciones son el óxido nitroso y la ketamina, que inhiben receptores de glutamato o NMDA y estimulan receptores de glicina y nicotina. La anestesia general es la pérdida reversible del estado de conciencia, y el mantenimiento se hace con el agente inhalado, que produce vasodilatación cerebral y pulmonar.","w":["También actúan potenciando el GABA-A.","Ninguno de los dos es excepción al mecanismo general.","Correcta: ambos actúan por antagonismo NMDA, no por GABA.","Ambos siguen el mecanismo GABAérgico general."]},{"c":5,"t":"Significado de la MAC","q":"¿Qué representa la concentración alveolar mínima?","o":["La presión de vapor a 20 grados","La solubilidad sangre-gas","La dosis letal 50 del agente","La dosis efectiva 50 del agente"],"a":3,"e":"La concentración alveolar mínima, MAC, equivale a la dosis efectiva 50 y mide la potencia del agente: a mayor potencia, menor cantidad requerida. El óxido nitroso tiene MAC de 105, altísima, lo que refleja su escasa potencia; el halotano 0,75, el isoflurano 1,2, el enflurano 1,7 y el metoxiflurano 0,2. La razón sangre-gas, en cambio, se relaciona con la solubilidad y la velocidad de inducción.","w":["La presión de vapor es un dato físico independiente de la potencia.","La solubilidad se expresa con el coeficiente sangre-gas.","No es una dosis letal sino la concentración eficaz en la mitad de los pacientes.","Correcta: la MAC es la ED50 y por tanto una medida de potencia."]},{"c":5,"t":"Orden de solubilidad","q":"Ordene de mayor a menor solubilidad según la regla HISOD:","o":["Halotano, isoflurano, sevoflurano, óxido nitroso, desflurano","Halotano, sevoflurano, isoflurano, desflurano, óxido nitroso","Sevoflurano, halotano, isoflurano, óxido nitroso, desflurano","Desflurano, óxido nitroso, sevoflurano, isoflurano, halotano"],"a":0,"e":"El orden de solubilidad de mayor a menor se recuerda con HISOD: halotano, isoflurano, sevoflurano, óxido nitroso y desflurano. Un coeficiente sangre-gas alto significa mayor solubilidad, mayor captación e inducción más lenta: el óxido nitroso, con lambda 0,47, tiene baja solubilidad e inducción rápida, y el halotano, con lambda 2,4, alta solubilidad e inducción lenta.","w":["Correcta: es exactamente la secuencia que codifica el acrónimo HISOD.","Intercambia las posiciones de sevoflurano e isoflurano.","El halotano encabeza la lista, no el sevoflurano.","Invierte el orden completo de la secuencia."]},{"c":5,"t":"Interpretación del coeficiente sangre-gas","q":"Un agente tiene coeficiente sangre-gas de 2,4. ¿Qué implica?","o":["Escasa potencia con MAC muy alta","Alta solubilidad, mayor captación e inducción lenta","Alta potencia con MAC muy baja","Baja solubilidad, menor captación e inducción rápida"],"a":1,"e":"Un coeficiente sangre-gas alto significa mayor solubilidad, mayor captación e inducción más lenta. El halotano tiene lambda de 2,4, con alta solubilidad e inducción lenta; el óxido nitroso tiene 0,47, con baja solubilidad e inducción rápida. La solubilidad y la potencia son parámetros independientes: la potencia se mide con la MAC.","w":["La potencia y la solubilidad son parámetros independientes.","Correcta: coeficiente alto equivale a captación alta e inducción lenta.","La potencia se mide con la MAC, no con el coeficiente sangre-gas.","Ese es el significado de un coeficiente bajo."]},{"c":5,"t":"Óxido nitroso: perfil","q":"¿Cuál de las siguientes afirmaciones sobre el óxido nitroso es correcta?","o":["Se usa como agente único en cirugía mayor","Produce excelente relajación muscular","Es una anestesia pobre y no relaja el músculo","Es el inhalado más potente disponible"],"a":2,"e":"El óxido nitroso es una anestesia pobre, que se usa combinada, y no produce relajación muscular. Su mecanismo es el antagonismo del receptor NMDA, igual que la ketamina. Sus efectos adversos son la disminución del flujo hepático y las náuseas y vómitos por activación de la zona quimiorreceptora gatillo. Su MAC es de 105, con presión de vapor de 39.000 mmHg y punto de ebullición de menos 88 grados.","w":["Por su escasa potencia nunca se usa como agente único.","La relajación muscular es justamente lo que no aporta.","Correcta: potencia escasa y sin efecto relajante muscular.","Su MAC de 105 lo sitúa entre los menos potentes."]},{"c":5,"t":"Óxido nitroso y cavidades aéreas","q":"Paciente con neumotórax no drenado. ¿Por qué está contraindicado el óxido nitroso?","o":["Deprime el centro respiratorio","Produce hipertermia maligna","Sensibiliza el miocardio a catecolaminas","Difunde a la cavidad y la expande"],"a":3,"e":"El óxido nitroso está contraindicado en patologías con aire en cavidades porque difunde hacia esos espacios y los expande: embolia gaseosa, neumotórax, obstrucción intestinal, neumoencéfalo, quistes aéreos, burbujas intraoculares e injertos de membrana timpánica. Su toxicidad crónica produce depresión de la médula ósea con anemia megaloblástica y neuropatías.","w":["La depresión respiratoria no es el mecanismo de esta contraindicación.","La hipertermia maligna se asocia a halogenados y succinilcolina.","La sensibilización a catecolaminas es del halotano.","Correcta: la difusión al espacio aéreo cerrado lo expande peligrosamente."]},{"c":5,"t":"Toxicidad crónica del óxido nitroso","q":"La exposición ocupacional prolongada a óxido nitroso produce depresión medular. ¿Qué anemia genera?","o":["Megaloblástica","Ferropénica","Hemolítica autoinmune","Sideroblástica"],"a":0,"e":"La exposición prolongada al óxido nitroso produce depresión de la médula ósea con anemia megaloblástica y neuropatías, efecto ligado a la interferencia con el metabolismo de la vitamina B12. Es la razón de las precauciones de exposición ocupacional en quirófano. La necrosis centrolobulillar hepática, en cambio, corresponde a la hepatitis por halotano.","w":["Correcta: la interferencia con la vitamina B12 produce anemia megaloblástica.","La ferropenia obedece a pérdida o déficit de hierro.","No se describe un mecanismo hemolítico inmune.","La anemia sideroblástica se asocia a otros tóxicos como el plomo."]},{"c":5,"t":"Identificación del halogenado","q":"Agente con convulsiones como efecto adverso característico, contraindicado en masas intracraneales, con MAC de 1,7%. ¿Cuál es?","o":["Halotano","Enflurano","Desflurano","Isoflurano"],"a":1,"e":"El efecto adverso característico del enflurano son las convulsiones, y está contraindicado en masas intracraneales porque aumenta el flujo sanguíneo cerebral, la presión intracraneal y la producción de líquido cefalorraquídeo con resistencia a su absorción. Es vasodilatador uterino y broncodilatador, da náuseas y vómitos postoperatorios en el 3 al 15% y su MAC es 1,7%.","w":["El halotano tiene MAC de 0,75% y produce hepatitis e hipertermia maligna.","Correcta: convulsiones y MAC de 1,7% identifican al enflurano.","El desflurano destaca por la descarga simpática al subir la concentración.","El isoflurano tiene MAC de 1,2% y es el mejor cardiovascular."]},{"c":5,"t":"Efectos adversos del halotano","q":"¿Cuáles son los dos efectos adversos característicos del halotano?","o":["Convulsiones y necrosis centrolobulillar hepática","Hipertermia maligna y anemia megaloblástica","Hipertermia maligna y necrosis centrolobulillar hepática","Supresión suprarrenal y hepatitis fulminante"],"a":2,"e":"El halotano es un alcano halogenado cuyos efectos adversos característicos son la hipertermia maligna y la necrosis centrolobulillar hepática, la hepatitis por halotano, que obliga a no administrarlo en pacientes hepáticos, además de arritmias e hipertensión intracraneal. Reduce la tensión arterial por depresión miocárdica directa y sensibiliza el miocardio a las catecolaminas.","w":["Las convulsiones son el efecto adverso propio del enflurano.","La anemia megaloblástica es toxicidad crónica del óxido nitroso.","Correcta: hipertermia maligna y hepatitis por necrosis centrolobulillar.","La supresión suprarrenal corresponde al etomidato."]},{"c":5,"t":"Halotano y epinefrina","q":"Paciente anestesiado con halotano que recibe epinefrina y desarrolla una arritmia ventricular. ¿Cuál es el mecanismo?","o":["Prolongación del intervalo QT","Hiperpotasemia inducida por el halogenado","Bloqueo del la conducción auriculoventricular","Sensibilización del miocardio a catecolaminas"],"a":3,"e":"El halotano sensibiliza el miocardio a las catecolaminas, y ese es el mecanismo por el que un paciente anestesiado con halotano que recibe epinefrina desarrolla una arritmia ventricular: es una pregunta literal del apartado de repaso del documento. El mismo fenómeno explica que el pancuronio, que estimula el simpático, dé arritmias combinado con halotano o con tricíclicos.","w":["La prolongación del QT se describe con el sevoflurano.","La hiperpotasemia se asocia a la succinilcolina.","El halotano no produce bloqueo de la conducción como mecanismo principal.","Correcta: el miocardio sensibilizado responde a la catecolamina con arritmia."]},{"c":5,"t":"Mejor broncodilatador","q":"¿Qué anestésico inhalado es el mejor broncodilatador?","o":["Halotano","Isoflurano","Óxido nitroso","Desflurano"],"a":0,"e":"El halotano es el mejor broncodilatador, mejor incluso que el isoflurano, y produce relajación muscular con potenciación de los relajantes. Aumenta el flujo sanguíneo cerebral y amortigua la autorregulación, aunque el ascenso de la presión intracraneal se puede prevenir hiperventilando. El mejor a nivel cardiovascular es el isoflurano y el de inducción más agradable en niños, el sevoflurano.","w":["Correcta: supera al isoflurano como broncodilatador.","El isoflurano es el mejor cardiovascular, no el mejor broncodilatador.","El óxido nitroso no aporta relajación muscular ni broncodilatación.","El desflurano irrita la vía aérea y no relaja el músculo."]},{"c":5,"t":"Isoflurano","q":"¿Por qué el isoflurano no se usa en la inducción anestésica?","o":["Por sensibilizar el miocardio","Por su olor etéreo punzante","Por su alta solubilidad sangre-gas","Por producir convulsiones"],"a":1,"e":"El isoflurano es isómero químico del enflurano, no inflamable, con olor etéreo punzante, y por eso no se usa en inducción, solo en mantenimiento. Su ventaja es la depresión cardíaca mínima: es el mejor a nivel cardiovascular de todos los inhalados. Hay que tener precaución en el hipovolémico porque tolera mal su vasodilatación, potencia los relajantes no despolarizantes y puede desencadenar hipertermia maligna. Su MAC es 1,2%.","w":["La sensibilización a catecolaminas es del halotano.","Correcta: su olor punzante lo hace inadecuado para inducción inhalatoria.","Su solubilidad es intermedia y no es el motivo descrito.","Las convulsiones son el efecto adverso del enflurano."]},{"c":5,"t":"Identificación del agente más usado","q":"Agente inhalado de olor agradable, inducción rápida, que produce relajación muscular y tiene código de color amarillo. ¿Cuál es?","o":["Halotano","Desflurano","Sevoflurano","Enflurano"],"a":2,"e":"El sevoflurano es el más usado en la actualidad: olor agradable, inducción rápida y por eso excelente en niños, en quienes se hace la inducción con este agente. Se metaboliza menos que el halotano pero más que el isoflurano, su código de color es amarillo y produce relajación muscular, una de sus ventajas añadidas frente a otros agentes.","w":["El halotano relaja el músculo pero su inducción es lenta por su solubilidad.","El desflurano tiene olor desagradable y no produce relajación muscular.","Correcta: olor agradable, inducción rápida, relajación muscular y color amarillo.","El enflurano tiene el riesgo de convulsiones y no es el más usado."]},{"c":5,"t":"Sevoflurano y el intervalo QT","q":"¿Hasta cuándo puede manifestarse la prolongación del QT por sevoflurano?","o":["Solo mientras se administra el agente","Hasta 24 horas después","Solo durante la inducción","Hasta 60 minutos tras la emergencia"],"a":3,"e":"El sevoflurano prolonga el intervalo QT, efecto que puede manifestarse incluso 60 minutos después de la emergencia anestésica, y a diferencia del halotano no sensibiliza el miocardio a las catecolaminas. Produce relajación muscular y aumenta el flujo sanguíneo renal; por encima de 1,5 MAC altera la autorregulación del flujo cerebral, permitiendo caídas de flujo en hipotensión hemorrágica.","w":["Persiste después de suspender el agente.","El plazo descrito es de 60 minutos, no de un día.","No se limita a la inducción: persiste tras la emergencia.","Correcta: el efecto puede persistir una hora tras despertar al paciente."]},{"c":5,"t":"Contraindicaciones del sevoflurano","q":"Todas las siguientes son contraindicaciones del sevoflurano, EXCEPTO una. ¿Cuál?","o":["Inducción inhalatoria en el niño","Hipertermia maligna","Hipertensión intracraneal","Hipovolemia intensa"],"a":0,"e":"Las contraindicaciones del sevoflurano son la hipovolemia intensa, la hipertermia maligna y la hipertensión intracraneal. La inducción inhalatoria en el niño es precisamente su indicación estrella: se inicia a dosis crecientes o al 8% en niños combativos, mientras el desflurano y el isoflurano no se usan por irritantes.","w":["Correcta: es su indicación de elección, no una contraindicación.","La hipertermia maligna contraindica todos los halogenados.","La hipertensión intracraneal es contraindicación descrita.","La hipovolemia intensa figura entre sus contraindicaciones."]},{"c":5,"t":"Descarga simpática por desflurano","q":"El aumento rápido de la concentración de desflurano produce respuesta simpática. ¿Con qué se atenúa?","o":["Atropina o glicopirrolato","Fentanilo, esmolol o clonidina","Efedrina o fenilefrina","Neostigmina o edrofonio"],"a":1,"e":"El aumento rápido de la concentración de desflurano causa respuesta simpática, que se atenúa con fentanilo, esmolol o clonidina. Tiene olor desagradable, no provoca relajación muscular y su baja solubilidad hace que alcance el equilibrio cerebral más rápido. Reduce la respuesta al train of four y a la estimulación tetánica de forma dependiente de dosis, y disminuye diuresis y filtración glomerular.","w":["Los anticolinérgicos aumentarían la frecuencia cardiaca.","Correcta: opioide, betabloqueante o alfa 2 agonista frenan la descarga.","Los vasopresores agravarían la respuesta hipertensiva.","Los anticolinesterásicos no modulan la respuesta simpática."]},{"c":5,"t":"Agentes irritantes en pediatría","q":"¿Qué agentes inhalados NO se usan para inducción en el niño por irritar la vía aérea?","o":["Sevoflurano y halotano","Halotano y enflurano","Desflurano e isoflurano","Óxido nitroso y sevoflurano"],"a":2,"e":"En la inducción inhalatoria del niño menor de 8 años, que permite evitar la punción venosa hasta que esté dormido, el desflurano y el isoflurano son irritantes de la vía aérea y no se usan; el sevoflurano sí, iniciando a dosis crecientes o al 8% en niños combativos. Durante la inducción aparece una fase de excitación con obstrucción de la vía aérea, rigidez, taquipnea y taquicardia, que cede al profundizar la anestesia.","w":["El sevoflurano es el agente de elección para inducir al niño.","El halotano no figura entre los irritantes descritos.","Correcta: ambos irritan la vía aérea y quedan para mantenimiento.","El sevoflurano no irrita: es el preferido en pediatría."]},{"c":5,"t":"Componentes de la inducción","q":"¿Para qué se añade lidocaína en la inducción anestésica?","o":["Para producir relajación muscular","Para prevenir la náusea postoperatoria","Para dar amnesia del procedimiento","Para atenuar la respuesta a la laringoscopia"],"a":3,"e":"En la inducción se combinan una benzodiacepina para la amnesia, un opioide para la analgesia, lidocaína como anestésico local para atenuar la respuesta a la laringoscopia, un inductor y un relajante neuromuscular. Cada componente cubre un objetivo distinto, y por eso ningún fármaco por sí solo basta: los relajantes no dan analgesia ni hipnosis y las benzodiacepinas no dan analgesia.","w":["La relajación muscular corresponde al bloqueador neuromuscular.","El efecto antiemético lo aporta el propofol.","La amnesia la aporta la benzodiacepina.","Correcta: amortigua la respuesta refleja a la instrumentación de la vía aérea."]},{"c":5,"t":"Mecanismo de los anticolinérgicos","q":"¿Qué tipo de antagonismo ejercen los anticolinérgicos?","o":["Competitivo con la acetilcolina","No competitivo irreversible","Alostérico sobre el canal de cloro","Competitivo con la noradrenalina"],"a":0,"e":"Los anticolinérgicos actúan en receptores muscarínicos de músculo liso, glándulas y corazón compitiendo con la acetilcolina: el antagonismo es competitivo. Químicamente son ésteres de un ácido aromático combinado con una base orgánica, y la ligadura del éster es necesaria para el enlace eficaz. Sus usos son como antisialogogo y en condiciones de bradicardia.","w":["Correcta: compiten de forma reversible con la acetilcolina.","El antagonismo no es irreversible: los organofosforados sí lo son, pero son otra cosa.","El canal de cloro corresponde al receptor GABA-A.","Compiten con la acetilcolina, no con la noradrenalina."]},{"c":5,"t":"Subtipos muscarínicos","q":"¿Dónde se localizan los receptores muscarínicos M2?","o":["En las neuronas centrales","En el corazón","En las glándulas","En el músculo esquelético"],"a":1,"e":"Los subtipos de receptor muscarínico son M1 neuronales, M2 cardíacos y M3 glandulares. Ese mapa explica los efectos clínicos: por bloqueo M2 en el nodo sinusal los anticolinérgicos producen taquicardia, útil frente a estímulos vagales como la insuflación de gas en laparoscopia, y por bloqueo M3 reducen las secreciones salivales, inhiben las glándulas sudoríparas y a dosis altas reducen la secreción gástrica.","w":["Los neuronales son los M1.","Correcta: M2 son los receptores muscarínicos cardíacos.","Los glandulares son los M3.","El músculo esquelético tiene receptores nicotínicos, no muscarínicos."]},{"c":5,"t":"Anticolinérgicos en laparoscopia","q":"Durante la insuflación de gas en una laparoscopia el paciente hace bradicardia intensa. ¿Cuál es el fundamento de dar un anticolinérgico?","o":["Reduce la presión intraabdominal","Relaja el músculo liso del diafragma","Bloquea el reflejo vagal en el nodo sinusal","Disminuye la absorción de dióxido de carbono"],"a":2,"e":"Los anticolinérgicos bloquean receptores muscarínicos en el nodo sinusal y producen taquicardia por bloqueo vagal, lo que resulta útil cuando se necesita aumentar la frecuencia cardiaca frente a estímulos vagales, como precisamente la insuflación de gas en laparoscopia. Además inhiben las secreciones respiratorias, relajan el músculo liso bronquial y reducen mucho la salivación.","w":["No modifican la presión intraabdominal del neumoperitoneo.","La relajación diafragmática no corrige la bradicardia refleja.","Correcta: bloquean el brazo vagal del reflejo y suben la frecuencia.","No alteran la absorción peritoneal de dióxido de carbono."]},{"c":5,"t":"Efectos oculares de los anticolinérgicos","q":"¿Cuál es el efecto adverso ocular de los anticolinérgicos?","o":["Catarata subcapsular","Neuritis óptica tóxica","Desprendimiento del retina","Glaucoma de ángulo cerrado"],"a":3,"e":"Los anticolinérgicos producen midriasis y cicloplejia, es decir el paciente no acomoda la visión cercana, y su efecto adverso ocular es el glaucoma de ángulo cerrado. La perla del tema es que la midriasis puede confundir al examinador, porque el paciente parece muerto por la pupila dilatada, cuando en realidad es un efecto farmacológico. El nistagmo con ascenso de la presión intraocular corresponde a la ketamina.","w":["La catarata subcapsular se asocia a corticoides.","La neuritis óptica no es efecto de este grupo.","El desprendimiento de retina no se relaciona con anticolinérgicos.","Correcta: la midriasis puede cerrar un ángulo estrecho y desencadenar glaucoma."]},{"c":5,"t":"Antídoto de la intoxicación por atropina","q":"Paciente con delirio, midriasis, sequedad de boca y taquicardia tras recibir atropina. ¿Cuál es el tratamiento?","o":["Fisostigmina","Pralidoxima","Flumazenilo","Neostigmina"],"a":0,"e":"La atropina es una amina terciaria que cruza la barrera hematoencefálica y puede dar alucinaciones y excitación, además de descenso de secreciones, midriasis con cicloplejia, hipertermia por vasodilatación, taquicardia, sedación y retención urinaria. El tratamiento de su intoxicación es la fisostigmina, que también es amina terciaria y por eso entra al sistema nervioso central.","w":["Correcta: es el único anticolinesterásico que alcanza el sistema nervioso central.","La pralidoxima regenera la acetilcolinesterasa en la intoxicación por organofosforados.","El flumazenilo revierte benzodiacepinas.","La neostigmina es cuaternaria y no cruza la barrera hematoencefálica."]},{"c":5,"t":"Escopolamina","q":"¿Qué anticolinérgico destaca por producir somnolencia y amnesia, y se usa en la cinetosis?","o":["Glicopirrolato","Escopolamina","Oxibutinina","Ipratropio"],"a":1,"e":"La escopolamina es muy potente a nivel central: produce somnolencia y amnesia por bloqueo de la memoria a corto plazo, y se usa en la cinetosis; es la sustancia conocida popularmente como burundanga por ese efecto amnésico. El glicopirrolato es cuaternario y no cruza la barrera, el ipratropio y el tiotropio se usan inhalados en asma y EPOC, y la oxibutinina en la vejiga hiperactiva.","w":["El glicopirrolato no tiene efectos centrales por ser cuaternario.","Correcta: somnolencia con amnesia anterógrada y uso en cinetosis.","La oxibutinina trata la incontinencia de urgencia.","El ipratropio se usa por vía inhalatoria en asma y EPOC."]},{"c":5,"t":"Glicopirrolato","q":"¿Por qué el glicopirrolato no produce efectos centrales?","o":["Actúa solo sobre receptores nicotínicos","Se metaboliza antes de llegar al cerebro","Es una amina cuaternaria y no cruza la barrera","Es una amina terciaria de baja potencia"],"a":2,"e":"El glicopirrolato es una amina cuaternaria y por eso no cruza la barrera hematoencefálica, lo que lo hace preferible cuando se busca efecto antimuscarínico periférico sin efectos centrales, por ejemplo acompañando a la neostigmina en la reversión del bloqueo. La atropina, en cambio, es amina terciaria y sí entra al sistema nervioso central, con posibilidad de alucinaciones y excitación.","w":["Actúa sobre receptores muscarínicos, como todo anticolinérgico.","No es un problema de metabolismo sino de paso de barrera.","Correcta: la carga permanente del amonio cuaternario le impide el paso.","La amina terciaria es la atropina, que sí entra al cerebro."]},{"c":5,"t":"Usos de otros anticolinérgicos","q":"Relacione el uso del ipratropio con el de la benztropina:","o":["Ipratropio en parkinsonismo; benztropina en asma y EPOC por vía inhalatoria","Ipratropio en asma y EPOC; benztropina en la vejiga hiperactiva del anciano","Ipratropio en cinetosis; benztropina en parkinsonismo y extrapiramidalismo agudo","Ipratropio en asma y EPOC; benztropina en parkinsonismo"],"a":3,"e":"El ipratropio y el tiotropio se usan en asma y EPOC por vía inhalatoria, sin entrada al sistema nervioso central; la benztropina y el trihexifenidilo son liposolubles, entran al sistema nervioso central y se emplean en parkinsonismo y en los síntomas extrapiramidales agudos por antipsicóticos. La tropicamida es tópica oftalmológica y la oxibutinina se usa en la vejiga hiperactiva.","w":["Invierte ambos usos clínicos.","La vejiga hiperactiva se trata con oxibutinina.","La cinetosis es indicación de la escopolamina.","Correcta: ipratropio inhalado para vía aérea y benztropina para el parkinsonismo."]},{"c":5,"t":"MAC de los halogenados","q":"¿Cuál es la MAC del halotano?","o":["0,75%","0,2%","1,2%","1,7%"],"a":0,"e":"La MAC del halotano es 0,75%, con presión de vapor de 243 mmHg y punto de ebullición de 50,2 grados; la del isoflurano es 1,2%, con vapor de 240 mmHg y ebullición a 48,5 grados. El enflurano tiene MAC de 1,7%, el metoxiflurano 0,2% y el óxido nitroso 105. Como la MAC es la dosis efectiva 50, cuanto menor es el número mayor es la potencia.","w":["Correcta: 0,75% es la MAC del halotano.","El 0,2% es la MAC del metoxiflurano.","Ese valor corresponde al isoflurano.","El 1,7% corresponde al enflurano."]},{"c":5,"t":"Metoxiflurano","q":"¿Cuál es la situación actual del metoxiflurano?","o":["Es el agente de elección en pediatría","En desuso total por su perfil desfavorable","Es el más usado en mantenimiento","Se usa solo en anestesia obstétrica"],"a":1,"e":"El metoxiflurano es un líquido claro, incoloro y de olor afrutado que hoy está en desuso total. Su inducción es lenta, por lo que resulta esencial dar 2 a 3% de vapor minutos antes de la pérdida de conciencia, la relajación muscular que produce es incompleta y la recuperación es lenta, con amnesia, analgesia y vértigo. Da náuseas y vómitos y su MAC es de 0,2%.","w":["El de elección en pediatría es el sevoflurano.","Correcta: está completamente abandonado en la práctica actual.","El más usado en la actualidad es el sevoflurano.","No tiene indicación obstétrica vigente."]},{"c":6,"t":"Objetivo de la reversión","q":"¿Cuál es el objetivo principal al revertir un bloqueo neuromuscular?","o":["Aumentar la acetilcolinesterasa disponible","Bloquear los receptores muscarínicos cardíacos","Llevar al máximo la transmisión nicotínica","Estimular los receptores muscarínicos glandulares"],"a":2,"e":"El objetivo principal de la reversión del bloqueo neuromuscular es llevar al máximo la transmisión nicotínica, porque los relajantes no despolarizantes actúan compitiendo con la acetilcolina por el receptor nicotínico. Los receptores colinérgicos son de dos tipos: el nicotínico estimula cambios autónomos y el músculo esquelético, y el muscarínico activa células efectoras terminales como el músculo liso bronquial, las glándulas salivales y el nodo sinusal.","w":["Se inhibe la enzima para que haya más acetilcolina, no más enzima.","El bloqueo muscarínico es el efecto colateral que hay que prevenir con atropina.","Correcta: se busca saturar de acetilcolina la placa para desplazar al relajante.","El estímulo glandular es un efecto adverso, no el objetivo."]},{"c":6,"t":"Identificación del anticolinesterásico","q":"Anticolinesterásico de acción corta usado en el diagnóstico de la miastenia gravis. ¿Cuál es?","o":["Donepezilo","Neostigmina","Fisostigmina","Edrofonio"],"a":3,"e":"El edrofonio es de acción corta y se usa en el diagnóstico de la miastenia gravis; es un amonio cuaternario de inicio rápido, con efecto máximo a los 2 minutos y dosis de 0,5 mg/kg, cuya unión reversible al nitrógeno cuaternario de la enzima termina por difusión y no por destrucción. La neostigmina se usa para revertir el bloqueo, la fisostigmina como antídoto de la atropina y el donepezilo en el Alzheimer.","w":["El donepezilo es liposoluble y se emplea en el Alzheimer.","La neostigmina se usa para íleo, retención urinaria y reversión del bloqueo.","La fisostigmina trata la intoxicación anticolinérgica central.","Correcta: el edrofonio es el de acción más breve y uso diagnóstico."]},{"c":6,"t":"Fisostigmina y su antídoto","q":"¿Por qué la fisostigmina sirve como antídoto de la sobredosis de atropina?","o":["Es amina terciaria y cruza la barrera hematoencefálica","Es amina cuaternaria y actúa solo en la periferia","Bloquea directamente los receptores muscarínicos","Regenera la acetilcolinesterasa destruida"],"a":0,"e":"La fisostigmina es una amina terciaria con grupo carbamato, sin amonio cuaternario, soluble en lípidos, que cruza la barrera hematoencefálica, con dosis de 0,01 a 0,03 mg/kg. Por eso puede tratar la intoxicación anticolinérgica central por sobredosis de atropina o escopolamina, algo que la neostigmina, al ser cuaternaria, no puede hacer.","w":["Correcta: su liposolubilidad le permite actuar sobre el sistema nervioso central.","La cuaternaria y periférica es la neostigmina.","No bloquea receptores: inhibe la enzima y aumenta la acetilcolina.","La regeneración enzimática es el mecanismo de la pralidoxima."]},{"c":6,"t":"Anticolinesterásicos y sistema nervioso central","q":"¿Cuál de los siguientes anticolinesterásicos NO entra al sistema nervioso central?","o":["Fisostigmina","Neostigmina","Rivastigmina","Donepezilo"],"a":1,"e":"La neostigmina y la piridostigmina son aminas cuaternarias que no entran al sistema nervioso central, y se usan en el íleo, la retención urinaria, la miastenia y la reversión de los bloqueadores no despolarizantes. La fisostigmina, el donepezilo y la rivastigmina son liposolubles y sí entran: la primera como antídoto de la atropina y las otras dos en el Alzheimer. Los organofosforados son liposolubles e irreversibles.","w":["La fisostigmina cruza la barrera y trata la intoxicación central.","Correcta: al ser cuaternaria queda confinada a la periferia.","La rivastigmina también es liposoluble y de acción central.","El donepezilo debe entrar al cerebro para tratar el Alzheimer."]},{"c":6,"t":"Intoxicación colinérgica","q":"¿Qué significa el acrónimo DUMBBELLS en la intoxicación colinérgica?","o":["Los signos de la intoxicación anticolinérgica","Las causas de bloqueo neuromuscular residual","Los efectos muscarínicos del exceso colinérgico","Los efectos nicotínicos del exceso colinérgico"],"a":2,"e":"La toxicidad aguda colinérgica es una estimulación excesiva nicotínica y muscarínica. Los efectos muscarínicos se recuerdan con DUMBBELLS: diarrea, urinación, miosis, bradicardia, broncoconstricción, lacrimación, salivación y sudor. Los nicotínicos son excitación de la médula espinal seguida de parálisis. El tratamiento es atropina para los efectos muscarínicos más pralidoxima, que regenera la acetilcolinesterasa.","w":["El cuadro anticolinérgico es el opuesto: seco, midriático y taquicárdico.","No guarda relación con el bloqueo neuromuscular residual.","Correcta: agrupa el cuadro muscarínico del exceso de acetilcolina.","Los nicotínicos son excitación medular seguida de parálisis."]},{"c":6,"t":"Tratamiento de la intoxicación por organofosforados","q":"Paciente agricultor con miosis, salivación, broncoconstricción y bradicardia tras exposición a insecticida. ¿Cuál es el tratamiento?","o":["Fisostigmina más atropina","Neostigmina más glicopirrolato","Flumazenilo más oxígeno","Atropina más pralidoxima"],"a":3,"e":"El cuadro descrito es una intoxicación colinérgica aguda por organofosforados, que son liposolubles e irreversibles y se usan como insecticidas, malatión y paratión, y como gas nervioso, sarín. El tratamiento es atropina para los efectos muscarínicos más pralidoxima, que regenera la acetilcolinesterasa. Dar un anticolinesterásico como la fisostigmina o la neostigmina agravaría el cuadro.","w":["La fisostigmina es un anticolinesterásico: empeoraría la intoxicación.","La neostigmina también inhibe la colinesterasa y está contraindicada.","El flumazenilo revierte benzodiacepinas, no anticolinesterásicos.","Correcta: atropina para lo muscarínico y pralidoxima para regenerar la enzima."]},{"c":6,"t":"Toxicidad crónica por organofosforados","q":"¿A qué se debe la neuropatía periférica de la exposición crónica a organofosforados?","o":["A la neuropathy target esterase","Al bloqueo de receptores nicotínicos","Al déficit secundario de vitamina B12","A la inhibición de la acetilcolinesterasa"],"a":0,"e":"La toxicidad crónica por organofosforados se manifiesta como neuropatía periférica, con debilidad muscular y pérdida sensorial, y desmielinización, pero el mecanismo no es la inhibición de la acetilcolinesterasa: se debe a la neuropathy target esterase. Ese matiz la separa de la toxicidad aguda colinérgica, que sí responde a la inhibición enzimática y se trata con atropina y pralidoxima.","w":["Correcta: es una enzima distinta de la acetilcolinesterasa.","No hay bloqueo de receptores en este mecanismo.","El déficit de B12 se asocia a la exposición crónica a óxido nitroso.","La inhibición de la acetilcolinesterasa explica el cuadro agudo, no el crónico."]},{"c":6,"t":"Criterio más importante en pediatría","q":"¿Cuáles son las dos condiciones que el niño no tolera de ninguna manera?","o":["Acidosis e hiperpotasemia","Hipoxia e hipotermia","Hipovolemia e hipertermia","Hipoglucemia e hipercapnia"],"a":1,"e":"Hay dos condiciones que el niño no tolera de ninguna manera: la hipoxia y la hipotermia, que llevan a bradicardia, y ese es el criterio más importante en anestesia pediátrica. En emergencia, con un niño que llega de madrugada con vómito o trauma e hipotérmico, la reanimación se hace muy difícil. Las barreras propias del escenario pediátrico son los padres en crisis emocional, la información indirecta y la anatomía distinta de la vía aérea.","w":["No son las dos condiciones señaladas como críticas en el tema.","Correcta: hipoxia e hipotermia, ambas con bradicardia como respuesta.","La hipertermia no figura en el par descrito.","La hipoglucemia importa, pero el par crítico descrito es otro."]},{"c":6,"t":"Talla anormal en el recién nacido","q":"Recién nacido de término con peso por debajo del percentil 10. ¿Qué conducta corresponde?","o":["Restringir aportes de glucosa","Iniciar insulina en infusión continua","Dar dextrosa al 10% para mantener normoglucemia","Administrar bicarbonato profiláctico"],"a":2,"e":"El recién nacido de término es el de 37 a 42 semanas y se clasifica como normal para la talla, pequeño por debajo del percentil 10 o grande por encima del 90. Una talla anormal implica inestabilidad de la homeostasis de la glucosa, por lo que hay que administrar dextrosa al 10% para mantener la normoglucemia. La hipoglucemia neonatal se define por debajo de 45 mg por 100 ml.","w":["Restringir glucosa agravaría el riesgo de hipoglucemia.","La insulina no tiene indicación en este escenario.","Correcta: la talla anormal desestabiliza la glucemia y obliga a aportar dextrosa.","El bicarbonato profiláctico no forma parte del manejo descrito."]},{"c":6,"t":"Hiperinsulinismo de rebote","q":"Recién nacido llamativamente tranquilo tras recibir soluciones de dextrosa muy concentrada en reanimación intrauterina. ¿Qué hay que sospechar?","o":["Hipotermia por exposición prolongada","Hiperglucemia con diuresis osmótica","Sedación por paso placentario de opioides","Hipoglucemia por hiperinsulinismo de rebote"],"a":3,"e":"El páncreas del recién nacido, ante cargas de dextrosa muy concentrada como las soluciones naranja usadas en reanimación intrauterina, puede reaccionar con hiperinsulinismo de rebote y producir hipoglucemia posterior. La perla clínica es desconfiar del recién nacido tranquilo tras esas soluciones: puede estar hipoglucémico, no normal. La clínica incluye temblor, convulsiones, apnea, cianosis y rechazo del alimento.","w":["La hipotermia es un riesgo aparte, no la consecuencia de esas soluciones.","El resultado descrito es hipoglucemia, no hiperglucemia.","El paso placentario de opioides es otro escenario, sin relación con la dextrosa.","Correcta: la tranquilidad puede ser el primer signo de hipoglucemia."]},{"c":6,"t":"Hipoglucemia neonatal","q":"¿Por debajo de qué valor se define la hipoglucemia neonatal?","o":["45 mg por 100 ml","70 mg por 100 ml","20 mg por 100 ml","100 mg por 100 ml"],"a":0,"e":"La hipoglucemia neonatal se define por debajo de 45 mg por 100 ml, es más frecuente en hijos de madre diabética y prematuros, y se manifiesta con temblor, convulsiones, agitación, apnea, cianosis, sudoración, rechazo del alimento y paro cardíaco. El tratamiento es 250 a 500 mg/kg de glucosa en solución al 25% seguido de 4 a 6 mg/kg/min de glucosada al 10%; si no se alcanzan 80 a 120 mg/ml hay que pensar en hiperinsulinismo.","w":["Correcta: 45 mg por 100 ml es el umbral neonatal descrito.","Ese valor corresponde al umbral del adulto.","El umbral descrito es más alto que ese valor.","Cien mg por 100 ml es una glucemia normal."]},{"c":6,"t":"Anatomía de la vía aérea pediátrica","q":"¿A qué nivel se encuentra la glotis en el niño?","o":["A nivel de T1","A nivel de C2","A nivel de C4","A nivel de C6"],"a":1,"e":"En el niño la glotis es anterior y cefálica, a nivel de C2, más alta que en el adulto, hay macroglosia relativa y la epiglotis tiene forma de omega y es flexible. El calibre de la vía es un cono inverso, a diferencia del adulto que es cilíndrico, y la resistencia es inversamente proporcional a la cuarta potencia del r

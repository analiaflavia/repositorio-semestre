lidad de la anestesia general en obstetricia se asocia casi siempre a la incapacidad para acceder o ventilar la vía aérea, por la vía aérea difícil fisiológica del embarazo: edema de mucosas, aumento de peso y mamas que dificultan la laringoscopia. La mortalidad de la regional, en cambio, se debe a bloqueo simpático excesivo por encima de T4 o a toxicidad de anestésicos locales.","w":["Correcta: el fallo de vía aérea es la causa dominante en la general.","La toxicidad por anestésicos locales corresponde a la técnica regional.","El bloqueo alto es causa de mortalidad de la anestesia regional.","La hipertermia maligna no es la causa descrita en este contexto."]},{"c":9,"t":"Estómago lleno en el embarazo","q":"¿Por qué todo embarazo se considera estómago lleno?","o":["Porque el ayuno preoperatorio es imposible","El útero grávido enlentece el vaciamiento gástrico","Porque la náusea impide el vaciamiento","Porque la progesterona aumenta la acidez"],"a":1,"e":"Todo embarazo se considera estómago lleno por el enlentecimiento mecánico del vaciamiento gástrico que produce el útero grávido, con el consiguiente riesgo de broncoaspiración. Es el fundamento de que la succinilcolina se use en obstetricia para inducción de secuencia rápida, y de que la incompetencia de la unión gastroesofágica ocurra ya con 15 cmH2O de presión intragástrica, frente a 28 en el paciente normal.","w":["El ayuno se cumple, pero no elimina la condición de estómago lleno.","Correcta: el mecanismo descrito es mecánico, por el útero grávido.","La náusea es un síntoma, no la causa del retraso descrito.","La acidez no es el mecanismo del retraso del vaciamiento."]},{"c":9,"t":"Paso placentario","q":"¿Qué grupo de fármacos apenas atraviesa la placenta?","o":["Los anestésicos locales","Los opioides","Los bloqueadores neuromusculares","Las benzodiacepinas"],"a":2,"e":"Casi todos los fármacos atraviesan la placenta, incluidos los opioides y los anestésicos locales, excepto en gran medida los bloqueadores neuromusculares, por ser moléculas ionizadas y de alto peso molecular. Esa propiedad permite relajar a la madre sin paralizar al feto. Las benzodiacepinas sí cruzan la placenta y la leche materna.","w":["Los anestésicos locales también atraviesan la placenta.","Los opioides cruzan la placenta con facilidad.","Correcta: su carga y peso molecular limitan el paso placentario.","Las benzodiacepinas cruzan placenta y leche materna."]},{"c":9,"t":"Técnica para analgesia de parto","q":"¿Qué técnica regional se prefiere para la analgesia del trabajo de parto?","o":["Subaracnoidea en dosis única","Bloqueo paravertebral bilateral","Infiltración local del periné","Peridural con catéter"],"a":3,"e":"En obstetricia la subaracnoidea en dosis única es más rápida y se prefiere para cesárea, mientras la peridural con catéter es la preferida para analgesia de trabajo de parto porque permite mantener la analgesia por horas y ajustarla según la evolución. Hoy el catéter se coloca desde 1 cm de dilatación, cuando antes se esperaba a 6 cm.","w":["La dosis única no permite mantener la analgesia durante el trabajo de parto.","No es la técnica descrita para analgesia obstétrica.","La infiltración local no cubre el dolor del trabajo de parto.","Correcta: el catéter permite analgesia prolongada y ajustable."]},{"c":9,"t":"RCP en la embarazada","q":"¿Cuándo debe iniciarse la reanimación en la paciente obstétrica?","o":["De inmediato, sin esperar ausencia total de signos vitales","Tras confirmar asistolia en el monitor","Después de extraer al feto","Al confirmar ausencia de todo signo vital"],"a":0,"e":"En el contexto obstétrico la reanimación debe iniciarse inmediatamente, sin esperar a la ausencia total de todo signo vital, y el desfibrilador está indicado únicamente en la fibrilación ventricular y la taquicardia ventricular sin pulso. En la asistolia y la actividad eléctrica sin pulso no se desfibrila: se hace reanimación de alta calidad más adrenalina.","w":["Correcta: la reanimación es inmediata, sin demoras diagnósticas.","No hace falta caracterizar el ritmo para iniciar compresiones.","La reanimación materna precede a cualquier decisión sobre el feto.","Esperar la ausencia total de signos retrasa una maniobra que salva vidas."]},{"c":10,"t":"Peso de las complicaciones cardiovasculares","q":"¿Qué porcentaje de las muertes postoperatorias en cirugía no cardiaca representan las complicaciones cardiovasculares?","o":["Del 1 al 2%","Del 20 al 50%","Del 5 al 10%","Más del 80%"],"a":1,"e":"Las enfermedades cardiovasculares son la causa más común de complicaciones a medida que aumenta la edad, y las complicaciones cardiovasculares representan del 20 al 50% de las muertes postoperatorias en cirugía no cardiaca. Los factores de riesgo preoperatorios principales son el síndrome coronario agudo previo y la insuficiencia cardiaca congestiva.","w":["Ese es el porcentaje de mortalidad atribuible a la anestesia.","Correcta: entre una quinta parte y la mitad de las muertes postoperatorias.","Subestima el peso real de la causa cardiovascular.","Ninguna serie atribuye esa proporción a causas cardiovasculares."]},{"c":10,"t":"Factores de riesgo preoperatorios","q":"¿Cuáles son los dos factores de riesgo preoperatorios principales en cirugía cardiovascular?","o":["Hipertensión controlada y tabaquismo","Diabetes tipo 2 y dislipidemia","Síndrome coronario agudo previo e insuficiencia cardiaca","Edad avanzada y obesidad"],"a":2,"e":"Los factores de riesgo preoperatorios principales son el síndrome coronario agudo previo y la insuficiencia cardiaca congestiva. Las enfermedades cardiovasculares son la causa más común de complicaciones a medida que aumenta la edad, y las complicaciones cardiovasculares representan del 20 al 50% de las muertes postoperatorias en cirugía no cardiaca.","w":["Son factores relevantes pero no los principales descritos.","Contribuyen al riesgo global sin ser los dos principales.","Correcta: coronariopatía previa e insuficiencia cardiaca encabezan la lista.","La edad y la obesidad modifican el riesgo sin ser los factores señalados."]},{"c":10,"t":"Circuito de derivación cardiopulmonar","q":"¿Cuál de los siguientes NO es un componente del circuito de derivación cardiopulmonar?","o":["La bomba principal","El oxigenador","El intercambiador de calor","El vaporizador de agente inhalado"],"a":3,"e":"La preparación prequirúrgica de la cirugía cardiaca con circulación extracorpórea incluye la derivación cardiopulmonar a través de circuitos básicos, reservorio de la máquina de derivación, oxigenador, intercambiador de calor y bomba principal. Los accesorios de la bomba son la aspiración de cardiotomía, el desalojo del ventrículo izquierdo o vent, la bomba de cardioplejia y la ultrafiltración. El vaporizador pertenece a la máquina de anestesia.","w":["La bomba principal impulsa la sangre en la derivación.","El oxigenador es componente esencial del circuito.","El intercambiador de calor forma parte del circuito.","Correcta: el vaporizador es parte de la máquina de anestesia."]},{"c":10,"t":"Opioides en dosis altas","q":"¿Por qué se toleran altas dosis de opioides en cirugía cardiovascular?","o":["El paciente entrará en extracorpórea y ventilación mecánica","Porque se combinan con naloxona profiláctica","Porque la extracorpórea elimina el opioide del plasma","Porque el opioide no deprime la respiración a esas dosis"],"a":0,"e":"En el transoperatorio de la cirugía cardiovascular se requiere anestesia general, que puede combinarse con epidural torácica alta, altas dosis de opioides, anestesia endovenosa y técnicas mixtas o balanceadas. La razón por la que se toleran altas dosis de opioides es que en esta cirugía no importa la depresión cardiorrespiratoria del opioide, porque el paciente entrará en circulación extracorpórea y ventilación mecánica.","w":["Correcta: la ventilación y la circulación quedan asumidas por la máquina.","No se usa naloxona profiláctica con esa finalidad.","La extracorpórea no depura el opioide.","Los opioides sí deprimen la respiración, también a dosis altas."]},{"c":10,"t":"Las 6H","q":"¿Cuál de las siguientes NO forma parte de las 6H del paro cardiorrespiratorio?","o":["Hipoxia","Hipoglucemia por insulina","Hipotermia","Hidrogeniones"],"a":1,"e":"Las 6H del paro son hipoxia, hipovolemia, hipotermia, hidrogeniones o acidosis, hipo o hiperkalemia e hipoglucemia. Las 6T son tromboembolismo pulmonar, trombosis coronaria, taponamiento cardíaco, trauma, tóxicos y tensión, es decir neumotórax a tensión. La hipoglucemia sí figura entre las 6H, pero no se define por su causa farmacológica.","w":["La hipoxia es la primera de las 6H.","Correcta: la hipoglucemia figura como tal, sin especificar su causa.","La hipotermia forma parte de las 6H.","Los hidrogeniones, es decir la acidosis, están entre las 6H."]},{"c":10,"t":"Las 6T","q":"¿A qué se refiere la T de tensión en las 6T del paro?","o":["A la tensión de la pared ventricular","A la hipertensión arterial severa","Al neumotórax a tensión","A la tensión superficial alveolar"],"a":2,"e":"Las 6T del paro son tromboembolismo pulmonar, trombosis coronaria, taponamiento cardíaco, trauma, tóxicos y tensión, es decir neumotórax a tensión. Junto con las 6H, agrupan las causas reversibles que hay que descartar durante la reanimación, además de las causas por obstrucción de vía aérea, ventilatorias, circulatorias y otras como quemaduras y anafilaxia.","w":["No se refiere a la tensión parietal ventricular.","La hipertensión no es causa reversible de paro en esta lista.","Correcta: la T de tensión designa el neumotórax a tensión.","La tensión superficial alveolar no es una causa de paro."]},{"c":10,"t":"Diagnóstico de paro","q":"¿Cuál es el hallazgo cardinal para diagnosticar un paro cardiorrespiratorio?","o":["Ausencia de pulso radial","Midriasis arreactiva","Cianosis peribucal","Ausencia de pulso carotídeo bilateral"],"a":3,"e":"El diagnóstico de paro se hace por ausencia de pulso carotídeo bilateral, con la salvedad de que en menores de un año el cuello corto y grueso lo hace más difícil de palpar, inconsciencia en 10 a 20 segundos, apnea o respiración agónica en 15 a 30 segundos y midriasis arreactiva. La secuencia de actuación es CABD: compresión, vía aérea, ventilación y desfibrilación.","w":["El pulso radial puede faltar en hipotensión sin paro.","La midriasis arreactiva acompaña, pero no es el hallazgo cardinal.","La cianosis es un signo tardío e inespecífico.","Correcta: la ausencia de pulso carotídeo bilateral es el hallazgo central."]},{"c":10,"t":"Secuencia CABD","q":"Ordene la secuencia CABD de la reanimación:","o":["Compresión, vía aérea, ventilación, desfibrilación","Ventilación, compresión, desfibrilación, vía aérea","Desfibrilación, compresión, vía aérea, ventilación","Vía aérea, ventilación, compresión, desfibrilación"],"a":0,"e":"La secuencia actual es CABD: compresión torácica, airway o vía aérea, breathing o ventilación y desfibrilación. El cambio de orden respecto del antiguo ABC refleja la prioridad de las compresiones, que generan del 25 al 30% del gasto cardiaco normal y por eso nunca deben interrumpirse más de 10 segundos, ni siquiera para intubar.","w":["Correcta: las compresiones van primero, antes de la vía aérea.","La ventilación no precede a las compresiones.","La desfibrilación es el último paso de la secuencia.","Ese es el antiguo esquema ABC, hoy superado."]},{"c":10,"t":"Gasto generado por las compresiones","q":"¿Qué porcentaje del gasto cardiaco normal generan las compresiones torácicas?","o":["Más del 90%","Del 25 al 30%","Del 5 al 10%","Del 60 al 70%"],"a":1,"e":"Las compresiones torácicas aumentan la presión intratorácica, igualan la presión de los vasos intratorácicos y generan una diferencia de presión arteriovenosa que permite el flujo extratorácico; producen del 25 al 30% del gasto cardiaco normal, y por eso nunca se deben interrumpir más de 10 segundos, ni siquiera para intubar.","w":["Ninguna maniobra externa alcanza ese nivel de gasto.","Correcta: entre un cuarto y un tercio del gasto cardiaco normal.","Subestima el aporte descrito de las compresiones.","Sobreestima con mucho la eficacia de las compresiones."]},{"c":10,"t":"Compresiones en el adulto","q":"¿Cuál es la profundidad mínima de las compresiones en el adulto?","o":["Dos centímetros","Ocho centímetros","Cinco centímetros","Cuatro centímetros"],"a":2,"e":"En el adulto las compresiones se hacen a más de 100 por minuto, con ciclo 30:2 con uno o dos reanimadores, profundidad mínima de 2 pulgadas o 5 cm, con la fuerza en el talón de la mano entre los pezones, sin interrumpir en pacientes intubados y con fuerza suficiente para generar un pulso carotídeo o femoral palpable.","w":["Dos centímetros es insuficiente para generar flujo.","Ocho centímetros excede la profundidad recomendada.","Correcta: mínimo 2 pulgadas, es decir 5 cm.","Cuatro centímetros corresponde al neonato."]},{"c":10,"t":"Compresiones en el neonato","q":"¿Cuál es la relación compresión-ventilación en el neonato con dos operarios?","o":["Cinco a uno","Treinta a dos","Tres a uno","Quince a dos"],"a":3,"e":"En el neonato el ciclo es 30:2 con un solo operario y 15:2 con dos operarios, con profundidad de una pulgada y media o 4 cm, comprimiendo en el tercio medio del esternón con los dedos índice y mayor, anular y mayor, o ambos pulgares, que es la técnica preferida con dos operarios.","w":["No es una relación descrita en el tema.","El 30:2 en el neonato corresponde a un solo operario.","Tampoco corresponde a las relaciones descritas.","Correcta: con dos operarios el ciclo neonatal es 15:2."]},{"c":10,"t":"Complicación de las compresiones en el anticoagulado","q":"¿Qué complicación de las compresiones es propia del paciente anticoagulado?","o":["Hemopericardio","Traumatismo hepático","Neumotórax","Fractura esternal"],"a":0,"e":"Las complicaciones de las compresiones torácicas son fracturas costales, fractura esternal, neumotórax, rotura cardiaca, hemopericardio en pacientes anticoagulados y traumatismo hepático izquierdo. Son un precio aceptable frente a la alternativa y no justifican comprimir con menos fuerza: esta debe ser suficiente para generar un pulso carotídeo o femoral palpable.","w":["Correcta: la anticoagulación favorece el sangrado pericárdico.","El traumatismo hepático izquierdo tampoco es exclusivo.","El neumotórax no es exclusivo del anticoagulado.","La fractura esternal puede ocurrir en cualquier paciente."]},{"c":10,"t":"Maniobra de Heimlich","q":"¿Dónde se coloca el puño en la maniobra de Heimlich del adulto?","o":["Sobre el apéndice xifoides","Justo por encima del ombligo","Por debajo del ombligo","En el tercio medio del esternón"],"a":1,"e":"En la maniobra de Heimlich del adulto se coloca el puño justo por encima del ombligo, se cubre con la otra mano y se presiona hacia arriba y adentro con fuerza suficiente para levantar al paciente del suelo. En niños mayores de un año la posición es la misma, pero sin presionar con tanta fuerza como para levantar al niño del suelo.","w":["Comprimir sobre el xifoides aumenta el riesgo de fractura.","Correcta: por encima del ombligo, en el epigastrio bajo.","Por debajo del ombligo la maniobra pierde eficacia.","El tercio medio del esternón es el punto de compresión neonatal."]},{"c":10,"t":"Saturación objetivo en reanimación","q":"¿Cuál es la saturación objetivo durante la reanimación y por qué no conviene sobre-oxigenar?","o":["Cerca del 80%, para reducir el consumo miocárdico","Cerca del 88%, para evitar vasoconstricción","Cerca del 94%, por los radicales libres de oxígeno","Del 100%, para maximizar el aporte tisular"],"a":2,"e":"Las complicaciones de la ventilación en reanimación son la insuflación gástrica, la hiperventilación, que reduce el retorno venoso y el gasto cardiaco, y la hiperoxia, que aumenta los radicales libres de oxígeno: hay que mantener una saturación objetivo cercana al 94% y no sobre-oxigenar. El volumen de cada ventilación debe ser solo el suficiente para causar elevación visible del tórax.","w":["Un 80% es hipoxemia grave.","Un 88% deja al paciente en hipoxemia.","Correcta: 94% evita tanto la hipoxia como el daño por hiperoxia.","La hiperoxia genera radicales libres y no aporta beneficio."]},{"c":10,"t":"Intubación durante la reanimación","q":"¿Cuánto tiempo como máximo puede interrumpirse la ventilación o la compresión para intubar?","o":["Hasta 3 minutos","No hay límite establecido","Hasta 60 segundos","De 10 a 15 segundos"],"a":3,"e":"La intubación durante la reanimación se hace solo cuando la ventilación abierta no es suficiente, y nunca hay que dejar de ventilar o comprimir más de 10 a 15 segundos por intentar intubar. La mascarilla laríngea es una alternativa fácil y rápida, con sellado anatómico, compatible con ventilación espontánea, con presión positiva y con la propia reanimación.","w":["Tres minutos de pausa es inaceptable en reanimación.","Sí existe un límite estricto de segundos.","Un minuto de pausa compromete la perfusión coronaria y cerebral.","Correcta: la pausa máxima aceptable es de 10 a 15 segundos."]},{"c":10,"t":"Mecanismo de la desfibrilación","q":"¿Cómo restaura el ritmo la desfibrilación?","o":["Despolariza todo el miocardio y deja una pausa","Repolariza de forma progresiva el miocardio","Estimula selectivamente el nodo sinusal","Aumenta la conducción del nodo auriculoventricular"],"a":0,"e":"El desfibrilador envía una corriente eléctrica de intensidad determinada que provoca la despolarización simultánea del miocardio, causando una pausa de 5 a 10 segundos que permite al nodo sinusal reasumir el control del ritmo. La fibrilación es la contracción espontánea e incontrolada de las fibras del músculo cardiaco, y la descarga interrumpe ese caos eléctrico.","w":["Correcta: despolarización masiva seguida de pausa para que mande el nodo sinusal.","El mecanismo es despolarización, no repolarización progresiva.","La descarga afecta a todo el miocardio, no solo al nodo.","No actúa mejorando la conducción nodal."]},{"c":10,"t":"Indicaciones de desfibrilación","q":"Paciente en paro con asistolia en el monitor. ¿Qué corresponde hacer?","o":["Desfibrilar y administrar atropina","Reanimación de alta calidad con adrenalina","Desfibrilar a máxima energía","Colocar marcapasos transcutáneo antes de comprimir"],"a":1,"e":"Las únicas indicaciones de desfibrilación son la fibrilación ventricular y la taquicardia ventricular sin pulso. Está contraindicada en el paro con asistolia y en la actividad eléctrica sin pulso: en esos casos corresponde reanimación de alta calidad más adrenalina, 1 mg cada 3 a 5 minutos. La atropina tampoco se usa en asistolia ni en actividad eléctrica sin pulso.","w":["Ni la desfibrilación ni la atropina están indicadas en asistolia.","Correcta: en asistolia se comprime y se da adrenalina, no se desfibrila.","Desfibrilar una asistolia es el error clásico que hay que evitar.","El marcapasos no precede a las compresiones."]},{"c":10,"t":"Adrenalina en el paro","q":"¿Cuál es la dosis de adrenalina en el paro cardiorrespiratorio del adulto?","o":["10 mg cada 3 a 5 minutos","1 mg cada 30 minutos","1 mg cada 3 a 5 minutos","0,1 mg cada 3 minutos"],"a":2,"e":"La adrenalina es una catecolamina agonista alfa y beta, con predominio beta, y se administra 1 mg cada 3 a 5 minutos por vía intravenosa en el paro, diluyendo una ampolla en 9 ml de salino al 0,9% en bolo lento. Es el fármaco que enciende el motor: la analogía del profesor es que sin adrenalina las compresiones son como pisar el acelerador de un carro apagado.","w":["Diez veces la dosis descrita.","El intervalo descrito es de 3 a 5 minutos.","Correcta: 1 mg cada 3 a 5 minutos por vía intravenosa.","Una décima parte de la dosis indicada."]},{"c":10,"t":"Atropina y bloqueo vagal","q":"¿Con cuántos miligramos acumulados de atropina se logra bloqueo vagal completo?","o":["Con 0,5 mg","Con 10 mg","Con 1 mg","Con 3 mg"],"a":3,"e":"La atropina es antagonista competitivo de receptores muscarínicos, vagolítico, y aumenta la frecuencia del nodo sinusal y la conducción del nodo auriculoventricular; se usa 1 mg cada 3 minutos en el paro, con máximo de 0,5 mg en niños. El bloqueo vagal completo se alcanza con 3 mg acumulados. Está contraindicada en el broncoespasmo severo y no se usa en asistolia ni actividad eléctrica sin pulso.","w":["Medio miligramo es el máximo descrito en niños.","Diez miligramos excede con mucho la dosis descrita.","Un miligramo es la dosis unitaria, no la acumulada de bloqueo completo.","Correcta: 3 mg acumulados producen bloqueo vagal completo."]},{"c":10,"t":"Efecto beta de la dopamina","q":"¿En qué rango de dosis aparece el efecto beta de la dopamina?","o":["De 2 a 10 microgramos por kilo y minuto","De 0,2 a 2 microgramos por kilo y minuto","Por debajo de 0,1 microgramos por kilo y minuto","Por encima de 10 microgramos por kilo y minuto"],"a":0,"e":"La dopamina se prepara con 200 a 800 mg en 250 cc de dextrosa al 5% o salino, a 60 microgotas por minuto ajustables. Sus efectos dependen de la dosis: el efecto dopa de 0,2 a 2 microgramos por kilo y minuto aumenta la diuresis y vasodilata; el efecto beta de 2 a 10 aumenta tensión, frecuencia y contractilidad; y el efecto alfa aparece por encima de 10.","w":["Correcta: el rango beta va de 2 a 10 microgramos por kilo y minuto.","Ese es el rango del efecto dopaminérgico.","Por debajo de ese umbral no hay efecto clínico apreciable.","Por encima de 10 predomina el efecto alfa."]},{"c":10,"t":"Contraindicación de la dobutamina","q":"¿En qué situación está contraindicada la dobutamina?","o":["En el paciente que no responde a dopamina","En la estenosis subaórtica","En la insuficiencia cardiaca congestiva","En la hipertensión pulmonar"],"a":1,"e":"La dobutamina es agonista beta 1, inotrópico positivo sin acción dopaminérgica, y se prepara con 250 mg en 250 ml de dextrosa al 5% a 20-80 ml/h. Sus indicaciones son la hipertensión pulmonar y los pacientes que no responden a dopamina, y está contraindicada en la estenosis subaórtica, porque aumentar la contractilidad agrava la obstrucción dinámica al tracto de salida.","w":["La falta de respuesta a dopamina es indicación, no contraindicación.","Correcta: aumentar la contractilidad agrava la obstrucción subaórtica.","La insuficiencia cardiaca es el contexto habitual de uso de un inotrópico.","La hipertensión pulmonar es una de sus indicaciones."]},{"c":10,"t":"Bicarbonato en el paro","q":"¿Cuál es la dosis inicial de bicarbonato de sodio en el paro?","o":["10 meq/kg","0,1 meq/kg","1 meq/kg","0,5 meq/kg"],"a":2,"e":"El bicarbonato de sodio neutraliza los hidrogeniones y actúa como amortiguador del medio interno, e inactiva catecolaminas en la hiperkalemia. Su dosificación en el paro es 1 meq/kg y luego 0,5 meq/min tras 20 minutos. Ese mismo bicarbonato, a 1 meq/kg, forma parte del tratamiento de la hiperpotasemia por succinilcolina.","w":["Diez veces la dosis descrita.","Una décima parte de la dosis indicada.","Correcta: 1 meq/kg como dosis inicial.","Ese valor corresponde al mantenimiento por minuto tras 20 minutos."]},{"c":11,"t":"Lipidemia postprandial","q":"¿Cómo afecta la lipidemia postprandial a la velocidad de inducción con un inhalado?","o":["La hace más rápida, al aumentar el gasto cardiaco","No la modifica de forma apreciable","La hace más rápida, al reducir la captación","La hace más lenta, al aumentar la solubilidad"],"a":3,"e":"Los cambios fisiológicos modifican la solubilidad de los inhalados. La lipidemia postprandial, con el anestésico más soluble en grasa, aumenta la solubilidad sangre-gas, aumenta la captación y disminuye la velocidad de inducción. La anemia hace lo contrario: reduce la solubilidad y la captación, y acelera la inducción.","w":["El gasto cardiaco es otra variable, y elevarlo también frena la inducción.","Sí modifica la solubilidad sangre-gas de forma relevante.","Ese es el efecto de la anemia, no de la lipidemia.","Correcta: más solubilidad implica más captación e inducción más lenta."]},{"c":11,"t":"Anemia y solubilidad","q":"¿Qué efecto tiene la anemia sobre la inducción con anestésicos inhalados?","o":["La acelera, al disminuir la captación","La frena, al aumentar la captación","La frena, al reducir el transporte de oxígeno","No tiene efecto sobre la inducción"],"a":0,"e":"La anemia disminuye la solubilidad sangre-gas, disminuye la captación y aumenta la velocidad de inducción. Es el efecto opuesto a la lipidemia postprandial, que aumenta la solubilidad y frena la inducción. La regla general es que mayor captación equivale a inducción más lenta.","w":["Correcta: menos captación significa inducción más rápida.","Ese es el efecto de la lipidemia postprandial.","El transporte de oxígeno no es el mecanismo descrito.","Sí modifica la velocidad de inducción."]},{"c":11,"t":"Gasto cardiaco y sobredosis","q":"Paciente con gasto cardiaco muy bajo al que se administra un anestésico soluble. ¿Qué riesgo tiene?","o":["Despertar intraoperatorio","Sobredosis por menor captación","Broncoespasmo por irritación","Inducción imposible por escasa captación"],"a":1,"e":"Un gasto cardiaco aumentado incrementa la captación del anestésico y hace la inducción más lenta, porque la sangre retira agente del alvéolo antes de que suba la presión parcial. Un gasto cardiaco disminuido reduce la captación y aumenta el riesgo de sobredosis con anestésicos solubles, porque la presión alveolar y por tanto cerebral sube más rápido de lo esperado.","w":["El riesgo es el opuesto: profundidad excesiva, no superficial.","Correcta: con poca captación la presión alveolar sube y se sobredosifica.","La irritación de vía aérea depende del agente, no del gasto cardiaco.","La inducción no se vuelve imposible: al contrario, se acelera."]},{"c":11,"t":"Coeficiente sangre-gas del halotano","q":"El halotano tiene un coeficiente sangre-gas de 2,4. ¿Qué implica en la práctica?","o":["Baja solubilidad con inducción rápida","Escasa potencia con MAC alta","Alta solubilidad con inducción lenta","Alta potencia con MAC baja"],"a":2,"e":"Un coeficiente sangre-gas alto significa mayor solubilidad, mayor captación e inducción más lenta. El halotano tiene lambda de 2,4, con alta solubilidad e inducción lenta; el óxido nitroso tiene 0,47, con baja solubilidad e inducción rápida. La solubilidad y la potencia son parámetros independientes: la potencia se mide con la MAC.","w":["Ese es el significado de un coeficiente bajo, como el del óxido nitroso.","La potencia y la solubilidad son parámetros independientes.","Correcta: coeficiente alto equivale a inducción lenta.","La potencia se mide con la MAC, no con el coeficiente sangre-gas."]},{"c":11,"t":"Grupo rico en vasos","q":"¿Qué órganos forman el grupo rico en vasos?","o":["Músculo, piel, grasa y hueso","Pulmón, pleura y diafragma","Intestino, bazo y páncreas","Cerebro, corazón, hígado, riñón y endocrinos"],"a":3,"e":"El grupo rico en vasos está formado por cerebro, corazón, hígado, riñón y órganos endocrinos, y recibe primero el anestésico y alcanza primero el equilibrio, lo que explica que el efecto clínico aparezca antes de que se saturen músculo y grasa. Aumentar la ventilación alveolar acelera la inducción, especialmente con anestésicos muy solubles.","w":["Esos son los grupos de perfusión intermedia y lenta.","No es el agrupamiento descrito en el tema.","El grupo incluye cerebro y corazón, no solo vísceras abdominales.","Correcta: son los órganos de mayor perfusión por unidad de masa."]},{"c":11,"t":"Ventilación alveolar","q":"¿Con qué tipo de anestésico se nota más el efecto de aumentar la ventilación alveolar?","o":["Con los muy solubles","Con los que no requieren pigmento","Con los de MAC muy alta","Con los poco solubles"],"a":0,"e":"Aumentar la ventilación alveolar acelera la inducción, especialmente con anestésicos muy solubles, porque en ellos la captación sanguínea es el factor limitante y la mayor entrega alveolar compensa esa pérdida. En los poco solubles la presión alveolar sube rápido de todos modos, así que el margen de mejora es menor.","w":["Correcta: en los muy solubles la ventilación compensa la alta captación.","El requisito de pigmento se refiere al láser, no a los inhalados.","La MAC mide potencia, no velocidad de instalación.","En los poco solubles la inducción ya es rápida de por sí."]},{"c":11,"t":"Efecto del segundo gas","q":"¿En qué consiste el efecto del segundo gas?","o":["Un segundo agente inhalado desplaza al primero del receptor GABA","Una alta concentración de óxido nitroso acelera la captación de otro inhalado","La mezcla de dos halogenados duplica la MAC efectiva","El segundo agente administrado prolonga la eliminación del primero"],"a":1,"e":"El efecto del segundo gas consiste en que una alta concentración de óxido nitroso acelera la captación de otro anestésico inhalado administrado al mismo tiempo. Es una de las razones por las que el óxido nitroso, aun siendo una anestesia pobre por su MAC de 105, se combina con otros agentes: no aporta potencia, pero acelera la instalación del que sí la tiene.","w":["No se trata de competencia por el receptor.","Correcta: el óxido nitroso a alta concentración acelera al agente acompañante.","Las MAC de agentes combinados se suman, no se duplican.","El efecto es sobre la captación, no sobre la eliminación."]},{"c":11,"t":"Perlas: síntoma más frecuente tras bloqueo","q":"¿Cuál es el síntoma más frecuente después de un bloqueo regional?","o":["Parestesia persistente","Retención urinaria","Dolor de espalda","Cefalea postpunción"],"a":2,"e":"El dolor de espalda es el síntoma más frecuente después de un bloqueo regional, dato que conviene separar de la cefalea postpunción, que es la complicación más característica del bloqueo subaracnoideo, y de la hipotensión, que es la complicación inmediata más frecuente. La médula espinal termina en L1 en el adulto y el bloqueo se coloca por debajo de ese nivel.","w":["La parestesia persistente es una complicación infrecuente.","La retención urinaria puede ocurrir, sin ser el síntoma más frecuente.","Correcta: es el síntoma más frecuente descrito tras el bloqueo.","La cefalea es característica pero menos frecuente que el dolor de espalda."]},{"c":11,"t":"Perlas: duración de los coloides","q":"¿Cuál es la vida media de los coloides?","o":["De 20 a 30 minutos","De 12 a 24 horas","De 1 a 2 horas","De 3 a 6 horas"],"a":3,"e":"Los coloides tienen vida media de 3 a 6 horas, frente a los 20 a 30 minutos de los cristaloides, porque su alto peso molecular mantiene la presión oncótica y los retiene en el espacio intravascular. Se indican en reanimación junto a los cristaloides una vez que estos superan los 3 a 4 litros antes de la transfusión, y son útiles en hipovolemia severa y quemados.","w":["Ese es el rango de los cristaloides.","Excede la permanencia descrita para los coloides.","Subestima la vida media descrita.","Correcta: de 3 a 6 horas de permanencia intravascular."]},{"c":11,"t":"Perlas: fentanilo","q":"¿Cuál es la duración aproximada del fentanilo?","o":["Unos 90 minutos","Unos 10 minutos","Unos 30 segundos","Unas 6 horas"],"a":0,"e":"El fentanilo es de 80 a 100 veces más potente que la morfina, muy liposoluble, con inicio rápido en unos 10 minutos y duración corta de unos 90 minutos, metabolizado por CYP450. Sus efectos adversos son hipotensión, depresión respiratoria y rigidez muscular, el tórax leñoso, que puede dificultar la ventilación.","w":["Correcta: unos 90 minutos de duración clínica.","Diez minutos es su tiempo de inicio, no su duración.","Ese tiempo corresponde al inicio del tiopental.","Excede con mucho la duración descrita."]},{"c":12,"t":"Caso: desaturación súbita en paciente intubado","q":"Paciente intubado que saturaba bien y de pronto desatura, con ascenso de la presión inspiratoria pico. ¿Cuál es la primera sospecha?","o":["Embolia pulmonar intraoperatoria","Intubación bronquial por desplazamiento del tubo","Neumotórax a tensión establecido","Broncoespasmo por liberación de histamina"],"a":1,"e":"Ante un paciente intubado y ventilado que saturaba bien y de pronto empieza a bajar la saturación hay que pensar en intubación bronquial por desplazamiento del tubo. El signo más temprano suele ser el aumento de la presión inspiratoria pico, y se apoya en ruidos respiratorios unilaterales, imposibilidad de palpar el manguito en la escotadura esternal y menor distensibilidad de la bolsa. La capnografía no descarta este problema.","w":["La embolia cursa con caída del CO2 espirado y deterioro hemodinámico.","Correcta: el desplazamiento del tubo es la causa a descartar primero.","El neumotórax a tensión añade compromiso hemodinámico marcado.","El broncoespasmo eleva presiones pero de forma difusa y con sibilancias."]},{"c":12,"t":"Caso: mialgias postoperatorias","q":"Paciente que recibió opioide, hipnótico, relajante y gas, y presenta mialgias intensas al día siguiente. ¿Qué fármaco lo explica?","o":["Fentanilo","Sevoflurano","Succinilcolina","Rocuronio"],"a":2,"e":"Las mialgias postoperatorias tras recibir opioide, hipnótico, relajante y gas orientan a succinilcolina: las fasciculaciones lesionan las fibras musculares y elevan mioglobina y creatincinasa. Son más frecuentes en mujeres y en procedimientos cortos o ambulatorios, con incidencia del 0,2 al 89%, y se previenen con precurarización más diazepam a 0,05 mg/kg.","w":["El fentanilo da rigidez muscular aguda, no mialgias diferidas.","El sevoflurano produce relajación muscular, no fasciculaciones.","Correcta: las fasciculaciones de la succinilcolina explican las mialgias.","Los no despolarizantes como el rocuronio no producen fasciculaciones."]},{"c":12,"t":"Caso: arritmias tras anestésico local en la embarazada","q":"Embarazada que desarrolla arritmias inmediatamente después de un anestésico local. ¿Cuál es la causa y el agente más implicado?","o":["Bloqueo simpático excesivo; lidocaína neurotóxica","Sobredosis acumulada; procaína de metabolismo plasmático","Reacción alérgica al conservante; bupivacaína cardiotóxica","Infiltración vascular accidental; bupivacaína"],"a":3,"e":"La embarazada con arritmias o fibrilación tras un anestésico local orienta a infiltración vascular accidental: los anestésicos locales tienen alta afinidad por proteínas y cardiotoxicidad, sobre todo la bupivacaína, que por vía intravenosa produce hipotensión, bloqueo auriculoventricular y ritmos idioventriculares. El manejo específico es el rescate lipídico y la prevención es la dosis de prueba.","w":["El bloqueo alto produce hipotensión, no arritmias ventriculares.","La procaína tiene metabolismo plasmático rápido y menor toxicidad.","La alergia se asocia a los ésteres y no produce arritmias.","Correcta: inyección intravascular accidental de un agente cardiotóxico."]},{"c":12,"t":"Caso: hipertenso ansioso","q":"Paciente hipertenso controlado y muy ansioso llevado a cirugía. ¿Qué se espera al inducir y por qué?","o":["Hipotensión, por el inductor y la pérdida del tono simpático","Bradicardia extrema, por reflejo vagal exagerado","Ningún cambio hemodinámico relevante","Hipertensión del rebote, por suspensión del antihipertensivo"],"a":0,"e":"En el paciente hipertenso controlado y ansioso llevado a cirugía, con la inducción se espera hipotensión: los inductores vasodilatan y deprimen la contractilidad, y además se pierde el tono simpático compensador que la ansiedad estaba sosteniendo. Ese caso ilustra por qué el paciente ansioso pasa de ASA I a ASA II y por qué la premedicación cambia el escenario hemodinámico.","w":["Correcta: se suma la vasodilatación del inductor a la pérdida del tono simpático.","La bradicardia extrema no es la respuesta descrita.","El cambio hemodinámico es esperable y relevante.","La respuesta esperada es hipotensión, no hipertensión de rebote."]},{"c":12,"t":"Caso: elección de inductor en el politraumatizado","q":"Politraumatizado inestable que requiere inducción inmediata. ¿Qué inductores son de elección?","o":["Propofol o midazolam","Ketamina o etomidato","Propofol o tiopental","Tiopental o midazolam"],"a":1,"e":"En el politraumatizado la familia de inductores se elige según la estabilidad hemodinámica: si está inestable se prefieren la ketamina, por su efecto simpaticomimético que eleva la tensión y el gasto, y el etomidato, por producir la mínima depresión cardiovascular de todos los inductores. Hay que evitar el propofol, que puede bajar hasta un 30% la tensión sistólica, y el tiopental, inótropo negativo y venodilatador.","w":["El propofol es el que más vasodilata de los inductores.","Correcta: ketamina por simpaticomimética y etomidato por estable.","Ambos deprimen la hemodinámica y agravarían la inestabilidad.","El tiopental es inótropo negativo y el midazolam también deprime."]},{"c":12,"t":"Caso: convulsiones tras bloqueo interescalénico","q":"Paciente con convulsiones tónico-clónicas inmediatamente después de un bloqueo interescalénico. ¿Cuál es el manejo inmediato correcto?","o":["Glucosa hiperosmolar","Dantroleno intravenoso","Emulsión lipídica intravenosa","Naloxona intravenosa"],"a":2,"e":"Las convulsiones tónico-clónicas inmediatamente después de un bloqueo son el cuadro de toxicidad sistémica por anestésico local, y el manejo inmediato es la administración de lípidos intravenosos: bolo de 1,5 ml/kg en un minuto más infusión continua de 0,25 ml/kg/min, porque los lípidos secuestran el anestésico de la circulación. Los distractores típicos son atropina, dantroleno, glucosa hiperosmolar y naloxona.","w":["La glucosa hiperosmolar solo aplicaría en hipoglucemia.","El dantroleno trata la hipertermia maligna.","Correcta: el rescate lipídico es el tratamiento específico del LAST.","La naloxona revierte opioides."]},{"c":12,"t":"Caso: hipotensión tras raquídea","q":"Paciente hipotenso a los 5 minutos de una raquídea, sin respuesta a elevar las piernas ni a la carga de líquidos. ¿Qué sigue?","o":["Repetir la carga de líquidos","Colocar en Trendelenburg extremo","Administrar atropina","Efedrina o fenilefrina"],"a":3,"e":"La hipotensión es la complicación inmediata más frecuente del bloqueo subaracnoideo, por bloqueo simpático con vasodilatación y descenso del retorno venoso. El manejo tiene tres pasos en orden: elevar las piernas, aumentar los líquidos intravenosos y, si persiste, vasopresores como efedrina o fenilefrina. Ya agotados los dos primeros, corresponde el vasopresor.","w":["Insistir con líquidos sin respuesta retrasa el tratamiento eficaz.","El Trendelenburg extremo no es el paso descrito en la secuencia.","La atropina corrige bradicardia, no la vasodilatación.","Correcta: agotados los dos primeros pasos, toca el vasopresor."]},{"c":12,"t":"Caso: cefalea postural tras bloqueo","q":"Paciente joven con cefalea que desaparece acostada y empeora al incorporarse, dos días después de una raquídea. ¿Qué es y qué se hace primero?","o":["Cefalea postpunción; hidratación, cafeína y reposo plano","Hipertensión intracraneal; manitol intravenoso","Cefalea postpunción; parche hemático de inmediato","Meningitis química; antibióticos empíricos"],"a":0,"e":"La cefalea postpunción es inmediata, más frecuente en jóvenes y característicamente postural: desaparece acostado y empeora al incorporarse. El manejo inicial es conservador, con hidratación, derivados de cafeína y reposo en posición plana; si no resuelve, el parche hemático con 10 a 20 ml de sangre autóloga en el espacio peridural resuelve el 100% de los casos.","w":["Correcta: primero medidas conservadoras, reservando el parche para después.","La cefalea por hipertensión intracraneal empeora acostado, no de pie.","El parche se reserva para cuando el manejo conservador falla.","No hay datos de infección en el cuadro descrito."]},{"c":12,"t":"Caso: niño hipotérmico en emergencia","q":"Lactante que llega de madrugada con vómito y trauma, hipotérmico y bradicárdico. ¿Qué explica la bradicardia?","o":["La acidosis metabólica compensada","La hipoxia y la hipotermia","El dolor no tratado","La hipovolemia aislada"],"a":1,"e":"Hay dos condiciones que el niño no tolera de ninguna manera: la hipoxia y la hipotermia, que llevan a bradicardia, y ese es el criterio más importante en anestesia pediátrica. En emergencia, con un niño que llega de madrugada con vómito o trauma e hipotérmico, la reanimación se hace muy difícil. A eso se suman las barreras de los padres en crisis y la información indirecta.","w":["La acidosis compensada no explica por sí sola la bradicardia.","Correcta: ambas condiciones producen bradicardia en el niño.","El dolor produce taquicardia, no bradicardia.","La hipovolemia contribuye, pero el par crítico descrito es otro."]},{"c":12,"t":"Caso: resistencia al pasar el tubo en el niño","q":"Al intubar a un niño de 3 años, el tubo pasa la glotis y se encuentra resistencia. ¿Qué se hace?","o":["Cambiar a un tubo con manguito","Retirar y colocar mascarilla laríngea","No forzarlo, por la forma en embudo de su vía aérea","Avanzar con presión suave y constante"],"a":2,"e":"En el adulto la vía aérea es cilíndrica y si el tubo pasa la glotis no hay problema aunque siga avanzando, a lo sumo va al bronquio derecho. En el niño la vía tiene forma de embudo, así que si se sigue introduciendo el tubo se puede romper la vía aérea: nunca hay que forzarlo si hay resistencia, aunque ya haya pasado la glotis.","w":["El manguito no resuelve el problema y añade riesgo en menores de 8 años.","No hace falta retirar el tubo, solo dejar de avanzarlo.","Correcta: la resistencia obliga a detenerse por la anatomía en embudo.","Avanzar con presión es lo que puede lesionar la vía aérea."]},{"c":12,"t":"Caso: cálculo de líquidos","q":"Niño de 25 kg con 6 horas de ayuno. ¿Cuál es su mantenimiento horario y su déficit acumulado?","o":["85 ml/h y 510 ml","65 ml/h y 650 ml","100 ml/h y 600 ml","65 ml/h y 390 ml"],"a":3,"e":"Con la regla 4-2-1: 40 ml por los primeros 10 kg, 20 por los siguientes 10 y 5 por los 5 restantes, lo que da 65 ml/h. El déficit por ayuno se estima multiplicando el índice de mantenimiento por las horas de ayuno: 65 por 6 igual a 390 ml. Es el mismo procedimiento del ejemplo del documento, con un paciente de 45 kg, índice de 75 ml/h y 8 horas de ayuno, que acumulaba 600 ml.","w":["Los 85 ml/h corresponden a un paciente de 45 kg.","El déficit resulta de multiplicar por 6 horas, no por 10.","Cien ml/h excede el resultado de aplicar la regla al peso dado.","Correcta: 40 más 20 más 5 igual a 65 ml/h, y 65 por 6 igual a 390 ml."]},{"c":12,"t":"Caso: vía aérea difícil anticipada","q":"Paciente con nódulo tiroideo que desvía la tráquea, programado para cirugía electiva. ¿Cuál es la conducta correcta?","o":["Cambiar el plan anestésico de antemano","Proceder con laringoscopia directa habitual","Decidir el día de la cirugía según la laringoscopia","Cancelar la cirugía hasta resolver el nódulo"],"a":0,"e":"Si al examinar la boca ya se ve una clase III o IV de Mallampati, o si existe un nódulo tiroideo que desvía la tráquea, hay que cambiar el plan anestésico de antemano y no improvisar el día de la cirugía: de lo contrario, en palabras del profesor, la laringoscopia trae una tremenda sorpresa. El videolaringoscopio es de gran ayuda en Mallampati III y IV, cuello corto, macroglosia y trauma facial.","w":["Correcta: anticipar el plan es la conducta que evita la sorpresa intraoperatoria.","Proceder sin ajustar el plan es exactamente lo que se quiere evitar.","Improvisar el día de la cirugía es el error señalado por el profesor.","No hace falta cancelar: hace falta planificar la vía aérea."]},{"c":12,"t":"Caso: paro con asistolia","q":"Paciente en paro con asistolia. ¿Cuál es el error más frecuente en este escenario?","o":["Asegurar la vía aérea","Desfibrilar","Administrar adrenalina","Comprimir el tórax"],"a":1,"e":"En el paro con asistolia y en la actividad eléctrica sin pulso la desfibrilación está contraindicada: corresponde reanimación de alta calidad más adrenalina, 1 mg cada 3 a 5 minutos. Las únicas indicaciones de desfibrilación son la fibrilación ventricular y la taquicardia ventricular sin pulso. La atropina tampoco se usa en asistolia ni en actividad eléctrica sin pulso.","w":["Asegurar la vía aérea forma parte del manejo correcto.","Correcta: desfibrilar una asistolia es el error clásico del escenario.","La adrenalina está indicada en la asistolia.","Las compresiones son la base del tratamiento en cualquier paro."]},{"c":12,"t":"Caso: bradicardia tras neostigmina","q":"Paciente que a los 4 minutos de recibir neostigmina desarrolla bradicardia marcada. ¿Qué ocurrió y cómo se previene?","o":["Bloqueo residual; repetir la dosis de neostigmina","Reacción alérgica; administrar corticoide y antihistamínico","Efecto muscarínico; darle el anticolinérgico de entrada","Sobredosis de neostigmina; reducir a la mitad la dosis"],"a":2,"e":"La neostigmina inhibe la acetilcolinesterasa y produce efectos muscarínicos con respuesta vagal: bradicardia, depresión del nodo sinusal, bloqueo auriculoventricular e incluso paro cardíaco. La perla del profesor es estar pendiente de ese efecto, que aparece a los 3 a 5 minutos, y dar el anticolinérgico, atropina o glicopirrolato, de una vez, sin esperar a que la bradicardia se instale.","w":["Repetir la dosis agravaría la bradicardia.","No se trata de una reacción alérgica sino de un efecto farmacológico previsible.","Correcta: es el efecto muscarínico esperable y se previene anticipando la atropina.","No es una sobredosis: es el efecto muscarínico propio del fármaco."]}];
const UNI = [{"c":1,"n":"1 · Preanestésica, vía aérea y máquina"},{"c":2,"n":"2A · Anestésicos endovenosos"},{"c":3,"n":"2B · Opioides y benzodiacepinas"},{"c":4,"n":"2C · Relajantes musculares y reversión"},{"c":5,"n":"3 · Inhalatorios y anticolinérgicos"},{"c":6,"n":"4 · Anticolinesterásicos y pediatría"},{"c":7,"n":"5 · Anestésicos locales y bloqueos"},{"c":8,"n":"6 · Líquidos, transfusión y ácido-base"},{"c":9,"n":"7 · Dolor, geriatría y embarazo"},{"c":10,"n":"8 · Cardiovascular y RCP"},{"c":11,"n":"9 · Mikhail 101 y perlas Haiyil"},{"c":12,"n":"10 · Casos clínicos integradores"}];


const S = {
  mode:"all", sel:new Set(), size:25, skip:false, shuffle:true,
  seen:{}, ok:{}, bad:{},          // por índice global
  rondas:[],                        // % de cada ronda cerrada
  pool:[], i:0, answered:false, order:[], view:"home", rOk:0, rBad:0
};

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; };
const pct = (a,b) => b? Math.round(a/b*100) : 0;

/* ---------- selección de preguntas ---------- */
function base(){
  let ix = Q.map((q,i)=>i);
  if(S.mode==="unit") ix = ix.filter(i => S.sel.has(Q[i].c));
  if(S.mode==="bad")  ix = ix.filter(i => S.bad[i]);
  if(S.mode==="good") ix = ix.filter(i => S.ok[i]);
  if(S.skip && S.mode!=="bad" && S.mode!=="good") ix = ix.filter(i => !S.seen[i]);
  return ix;
}
function updateGo(){
  const n = base().length, b = $("#go");
  if(!b) return;
  b.disabled = n===0;
  b.textContent = n===0 ? "No hay preguntas con estos filtros"
    : "Empezar · " + Math.min(n, S.size===0?n:S.size) + " preguntas";
}

/* ---------- HUD ---------- */
function hud(){
  const v = Object.keys(S.seen).length;
  const g = Object.values(S.ok).filter(Boolean).length;
  const m = Object.values(S.bad).filter(Boolean).length;
  const prom = S.rondas.length ? Math.round(S.rondas.reduce((a,b)=>a+b,0)/S.rondas.length) : pct(g,g+m);
  $("#hud").innerHTML =
    `<div class="chip">vistas <b>${v}</b>/${Q.length}</div>`+
    `<div class="chip g">buenas <b>${g}</b></div>`+
    `<div class="chip r">malas <b>${m}</b></div>`+
    `<div class="chip a">promedio <b>${prom}%</b></div>`;
}
function suture(){
  const s = $("#suture");
  if(S.view!=="quiz"){ s.innerHTML=""; return; }
  s.innerHTML="";
  S.pool.forEach((gi,k)=>{
    const i = el("i");
    if(k < S.i) i.className = S.lastRes[k] ? "ok":"bad";
    else if(k===S.i) i.className="cur";
    s.appendChild(i);
  });
}

/* ---------- RONDA ---------- */
function start(){
  let ix = base();
  for(let k=ix.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [ix[k],ix[j]]=[ix[j],ix[k]]; }
  if(S.size>0) ix = ix.slice(0,S.size);
  S.pool = ix; S.i = 0; S.rOk = 0; S.rBad = 0; S.lastRes = [];
  S.view="quiz"; render();
}

function render(){
  const gi = S.pool[S.i], q = Q[gi];
  S.answered=false;
  S.order = q.o.map((_,k)=>k);
  if(S.shuffle) for(let k=S.order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [S.order[k],S.order[j]]=[S.order[j],S.order[k]]; }

  const app = $("#app"); app.innerHTML="";
  const f = el("div","field");
  const meta = el("div","meta");
  const u = UNI.find(x=>x.c===q.c);
  const st = el("span","tag s","Anestesiología");
  st.style.background = "var(--amber)";
  meta.append(st, el("span","tag",u?u.n:""), el("span","count",
    `${S.i+1} / ${S.pool.length} · quedan ${S.pool.length-S.i-1}`));
  f.appendChild(meta);
  f.appendChild(el("h2","stem",q.q));

  const ans = el("div","answers"); ans.id="answers";
  S.order.forEach((orig,k)=>{
    const row = el("div","ansrow");
    const b = el("button","ans",
      `<span class="key">${k+1}</span><span>${q.o[orig]}</span>`);
    b.onclick=()=>pick(k);
    row.appendChild(b);
    ans.appendChild(row);
  });
  f.appendChild(ans);
  f.appendChild(el("div",null,'<div id="after"></div>'));
  app.appendChild(f);
  suture(); hud();
}

function pick(k){
  if(S.answered) return;
  S.answered=true;
  const gi = S.pool[S.i], q = Q[gi];
  const elegido = S.order[k];
  const bien = elegido === q.a;

  S.seen[gi]=true;
  if(bien){ S.ok[gi]=true; delete S.bad[gi]; S.rOk++; }
  else    { S.bad[gi]=true; delete S.ok[gi]; S.rBad++; }
  S.lastRes[S.i]=bien;

  const rows = document.querySelectorAll("#answers .ansrow");
  S.order.forEach((orig,pos)=>{
    const btn = rows[pos].querySelector(".ans");
    btn.disabled = true;
    const esOk = orig === q.a;
    btn.classList.add(esOk?"good":"wrong");
    const n = el("div","note "+(esOk?"good":"wrong"), q.w[orig]);
    rows[pos].appendChild(n);
  });

  const after = $("#after");
  const c = el("div","concept",
    `<h3>Concepto clave — ${q.t}</h3><p>${q.e}</p>`);
  after.appendChild(c);
  const nav = el("div","navrow");
  const b = el("button","btn primary",
    S.i+1 < S.pool.length ? "Siguiente" : "Ver resultados");
  b.onclick=next;
  const h = el("button","btn","Salir al inicio");
  h.onclick=()=>{ cerrarRonda(); home(); };
  nav.append(h,b); after.appendChild(nav);
  after.appendChild(el("div","hint","Enter para continuar"));
  b.focus();
  suture(); hud();
}

function next(){
  if(S.i+1 < S.pool.length){ S.i++; render(); }
  else results();
}
function cerrarRonda(){
  if(S.rOk+S.rBad>0) S.rondas.push(pct(S.rOk,S.rOk+S.rBad));
  S.rOk=S.rBad=0;
}

/* ---------- RESULTADOS ---------- */
function results(){
  cerrarRonda();
  S.view="res"; suture(); hud();
  const app = $("#app"); app.innerHTML="";
  const total = S.pool.length;
  const aciertos = S.lastRes.filter(Boolean).length;
  const p = pct(aciertos,total);
  const prom = S.rondas.length ? Math.round(S.rondas.reduce((a,b)=>a+b,0)/S.rondas.length) : p;
  const cob = pct(Object.keys(S.seen).length, Q.length);

  const hero = el("div","hero");
  hero.innerHTML = `<div class="sub">Ronda cerrada</div>
    <div class="big">${p}<small>%</small></div>
    <p>${aciertos} de ${total} correctas</p>`;
  app.appendChild(hero);

  const g = el("div","resgrid");
  [[p+"%","esta ronda"],[prom+"%","promedio global"],
   [cob+"%","banco cubierto"],[S.rondas.length,"rondas hechas"]]
  .forEach(([v,l])=> g.appendChild(el("div","res",`<b>${v}</b><span>${l}</span>`)));
  app.appendChild(g);

  const c = el("div","card"); c.appendChild(el("h2",null,"Dominio por unidad"));
  const bars = el("div","bars");
  let alguna=false;
  UNI.forEach(u=>{
    const ids = Q.map((q,i)=>[q,i]).filter(([q])=>q.c===u.c).map(([,i])=>i);
    const vis = ids.filter(i=>S.seen[i]).length;
    if(!vis) return;
    alguna=true;
    const ok = ids.filter(i=>S.ok[i]).length;
    const v = pct(ok,vis);
    bars.appendChild(el("div","bar",
      `<div class="lab"><div>${u.n}</div><span>${ok}/${vis} · ${v}%</span></div>
       <div class="track"><div class="fill" style="width:${v}%"></div></div>`));
  });
  if(!alguna) bars.appendChild(el("div","empty","Aún no hay unidades respondidas."));
  c.appendChild(bars); app.appendChild(c);

  const nav = el("div","navrow");
  const a = el("button","btn primary","Otra ronda igual");
  a.onclick=start;
  const b = el("button","btn","Volver al inicio");
  b.onclick=home;
  const f = el("button","btn","Repasar falladas");
  f.onclick=()=>{ S.mode="bad"; start(); };
  nav.append(b,f,a); app.appendChild(nav);
}

/* ---------- teclado ---------- */
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz") return;
  if(["1","2","3","4"].includes(e.key)){ e.preventDefault(); pick(+e.key-1); }
  if(e.key==="Enter" && S.answered){ e.preventDefault(); next(); }
});

adio, de modo que el edema aumenta la resistencia mucho más que en el adulto.","w":["T1 corresponde aproximadamente al nivel de la carina.","Correcta: la glotis pediátrica es alta, a nivel de C2.","En el adulto la glotis se sitúa más caudal.","Ese nivel es más bajo que el descrito en el niño."]},{"c":6,"t":"Resistencia de la vía aérea del niño","q":"¿Por qué un edema mínimo de la mucosa aumenta tanto la resistencia en el niño?","o":["Porque la epiglotis es flexible y en omega","Porque la glotis es anterior y cefálica","La resistencia es inversamente proporcional al radio a la cuarta","Porque el niño respira solo por la nariz"],"a":2,"e":"El calibre de la vía aérea del niño es un cono inverso y la resistencia es inversamente proporcional a la cuarta potencia del radio, de modo que el edema o el engrosamiento de la mucosa aumentan la resistencia mucho más que en el adulto. Ese principio físico es el que hace tan peligroso cualquier edema glótico en pediatría, y el que justifica no traumatizar la vía aérea al intubar.","w":["La forma de la epiglotis dificulta la laringoscopia, no la resistencia.","La posición de la glotis afecta a la técnica, no al cálculo de resistencia.","Correcta: una reducción pequeña del radio multiplica la resistencia.","La respiración nasal obligada importa en el neonato, pero no es el mecanismo."]},{"c":6,"t":"Forma de la vía aérea del niño","q":"Al intubar a un niño el tubo pasa la glotis y luego se encuentra resistencia. ¿Qué hay que hacer?","o":["Retirar el tubo y usar mascarilla laríngea","Avanzar con presión suave y constante","Cambiar a hoja curva y reintentar","No forzar, porque la vía en embudo puede romperse"],"a":3,"e":"En el adulto la vía aérea es cilíndrica, de modo que si el tubo pasa la glotis no hay problema aunque siga avanzando, a lo sumo va al bronquio derecho. En el niño la vía tiene forma de embudo, así que si se sigue introduciendo el tubo más allá de lo debido se puede romper la vía aérea: nunca hay que forzarlo si hay resistencia, aunque ya haya pasado la glotis.","w":["No hace falta retirar el tubo: basta con no forzarlo más.","Avanzar con presión es exactamente lo que puede lesionar la vía aérea.","El problema no es la hoja del laringoscopio sino la profundidad del tubo.","Correcta: la resistencia es señal de alto, no de insistir."]},{"c":6,"t":"Posición del lactante","q":"¿Cómo se coloca la cabeza del lactante para el manejo de la vía aérea?","o":["En posición neutra con campo bajo los hombros","En rotación lateral de 30 grados","En hiperextensión como en el adulto","En flexión cervical máxima"],"a":0,"e":"En lactantes y niños el occipucio prominente obliga a colocar un campo enrollado bajo los hombros y mantener la posición neutra, no hiperextender como en el adulto. Junto con la elección de hoja recta tipo Miller en menores de 2 años, es una de las adaptaciones anatómicas propias de la vía aérea pediátrica, con glotis alta en C2 y epiglotis flexible en omega.","w":["Correcta: el occipucio prominente exige compensar para lograr posición neutra.","La rotación lateral no forma parte de la alineación descrita.","La hiperextensión es la maniobra del adulto, no del lactante.","La flexión cervical máxima obstruye la vía aérea."]},{"c":6,"t":"Hoja de laringoscopio en el lactante","q":"¿Qué hoja de laringoscopio se prefiere en menores de 2 años?","o":["Hoja curva de Macintosh 3","Hoja recta de Miller","Hoja recta de Miller 2","Hoja curva de Macintosh 2"],"a":1,"e":"En menores de 2 años se prefiere la hoja recta tipo Miller porque ofrece mejor visualización dada la anatomía del niño. La tabla por edades asigna Miller 0 al prematuro, Miller 0-1 al neonato de término, Miller 1 de 6 a 12 meses, Miller 1 o Wis-Hipple 1,5 de 1 a 2 años, Wis 1,5 o Macintosh 2 de 2 a 8 años, y Miller 2 o Macintosh 3 por encima de 8 años.","w":["La Macintosh 3 se reserva para mayores de 8 años.","Correcta: la hoja recta se adapta mejor a la epiglotis flexible del lactante.","La Miller 2 corresponde a mayores de 8 años.","La Macintosh 2 corresponde a la franja de 2 a 8 años."]},{"c":6,"t":"Tubo con manguito en pediatría","q":"¿Por qué en menores de 8 años se usan tubos sin manguito?","o":["Porque el niño no tolera presión positiva","Porque el manguito impide la fuga de gas","El propio calibre en embudo sella la vía","Porque el manguito no cabe en el tubo"],"a":2,"e":"Los tubos orotraqueales en menores de 8 años se usan generalmente sin manguito porque el propio calibre de la vía en embudo sella adecuadamente, y hay que permitir una fuga de gas de 20 a 25 cmH2O. Con manguito hay mayor riesgo de daño por baja distensibilidad pulmonar si no se ajusta bien. Las fórmulas útiles son tamaño igual a edad entre 4 más 4 y profundidad igual a tres veces el diámetro interno.","w":["El niño sí tolera ventilación con presión positiva.","La fuga controlada de 20-25 cmH2O es deseable, y el manguito la eliminaría.","Correcta: la anatomía en embudo hace innecesario el manguito.","Existen tubos pediátricos con manguito: no es una cuestión de tamaño."]},{"c":6,"t":"Cálculo del tubo pediátrico","q":"Según la fórmula, ¿qué tamaño de tubo corresponde a un niño de 4 años?","o":["4,5","6,0","4,0","5,0"],"a":3,"e":"La fórmula del tamaño del tubo es la edad dividida entre 4 más 4: para un niño de 4 años, 4 entre 4 es 1, más 4 igual a 5,0. La fórmula de la hoja de laringoscopio es la edad más 16 dividido entre 4, y la profundidad de inserción en centímetros es tres veces el tamaño del tubo, es decir su diámetro interno en milímetros: en este caso 15 cm.","w":["Ese calibre queda por debajo de lo que da la fórmula.","Aplicando la fórmula, 6,0 correspondería a un niño de 8 años.","Ese tamaño corresponde a un lactante de 6 a 12 meses.","Correcta: 4 entre 4 más 4 da 5,0 de diámetro interno."]},{"c":6,"t":"Profundidad de inserción","q":"Si el tubo elegido es de 4,5 mm de diámetro interno, ¿a qué profundidad debe quedar?","o":["13,5 cm","18 cm","9 cm","4,5 cm"],"a":0,"e":"La profundidad de inserción en centímetros es igual a tres veces el tamaño del tubo, es decir su diámetro interno en milímetros: con un tubo de 4,5 la profundidad es 13,5 cm. Conviene tener juntas las tres fórmulas porque se confunden: tamaño igual a edad entre 4 más 4, hoja igual a edad más 16 entre 4 y profundidad igual a tres veces el diámetro interno.","w":["Correcta: tres por 4,5 da 13,5 cm de profundidad.","Ese valor cuadruplicaría el diámetro interno.","El factor de la fórmula es tres, no dos.","La profundidad se calcula multiplicando, no coincide con el diámetro."]},{"c":6,"t":"Premedicación pediátrica","q":"¿Cuál es la ventaja del midazolam oral como premedicación en el niño?","o":["Aporta analgesia además de sedación","Efecto mínimo sobre la respiración","Inicio en menos de 5 minutos","Sabor agradable y buena aceptación"],"a":1,"e":"El midazolam oral se usa a 0,5-0,75 mg/kg con inicio de 10 a 15 minutos, y su ventaja es el efecto mínimo sobre la respiración, aunque es amargo. Por vía rectal la misma dosis, efectiva pero no en niños mayores; nasal 0,2-0,3 mg/kg con inicio de 5 a 10 minutos, efectiva pero arde; e intravenosa 0,05 mg/kg con inicio de 1 a 2 minutos. El fentanilo oral tiene mejor sabor y da analgesia, con prurito como inconveniente.","w":["No aporta analgesia: las benzodiacepinas no son analgésicas.","Correcta: apenas deprime la ventilación, lo que lo hace seguro por vía oral.","Por vía oral tarda de 10 a 15 minutos.","El midazolam oral es amargo; el de mejor sabor es el fentanilo."]},{"c":6,"t":"Ketamina intramuscular en el niño","q":"¿En qué niño resulta especialmente útil la ketamina intramuscular?","o":["En el niño con cirugía oftalmológica programada","En el niño con antecedente de laringoespasmo","En el niño combativo que no permite acceso venoso","En el niño con hipertensión intracraneal"],"a":2,"e":"La ketamina intramuscular a 2-3 mg/kg tiene inicio de 3 a 5 minutos y es útil en niños combativos, aunque aumenta las secreciones; por vía oral se usa a 6,9 mg/kg con inicio de 15 a 20 minutos y puede dar nistagmo o alucinaciones. La combinación oral de ketamina con midazolam, 2,5 con 0,25 mg/kg, ofrece mejor inicio y recuperación que el midazolam solo.","w":["En oftalmología hay que evitarla porque eleva la presión intraocular.","No es el fármaco indicado para prevenir laringoespasmo.","Correcta: permite sedar sin vía venosa al niño que no colabora.","La ketamina eleva la presión intracraneal y está contraindicada ahí."]},{"c":6,"t":"Relajantes en pediatría","q":"¿Cuál es la dosis de rocuronio para secuencia rápida en pediatría?","o":["0,1 mg/kg","0,45 mg/kg","2,0 mg/kg","1,0 mg/kg"],"a":3,"e":"En pediatría el rocuronio se usa a 0,45-0,46 mg/kg de forma habitual y a 1,0 mg/kg para secuencia rápida, con duración intermedia a prolongada. La succinilcolina se usa a 1,5-2 mg/kg con duración corta, el cisatracurio a 0,1-0,2 mg/kg y el vecuronio y el pancuronio a 0,1 mg/kg. Hay que recordar que la succinilcolina no se usa de rutina en niños por el riesgo de hiperpotasemia.","w":["Esa dosis corresponde al vecuronio y al pancuronio.","Ese es el rango habitual, no el de secuencia rápida.","Duplica la dosis descrita para secuencia rápida.","Correcta: se dobla la dosis habitual para acortar la latencia."]},{"c":6,"t":"Fase de excitación","q":"Durante la inducción inhalatoria un niño presenta obstrucción de la vía aérea, rigidez y taquipnea. ¿Qué corresponde hacer?","o":["Profundizar la anestesia, porque la fase cede","Retirar el agente de inmediato","Administrar succinilcolina de rescate","Intubar sin esperar la resolución"],"a":0,"e":"En la inducción inhalatoria, indicada en menores de 8 años para evitar la punción venosa hasta que el niño esté dormido, aparece una fase de excitación con obstrucción de la vía aérea, movimientos espontáneos, rigidez, taquipnea y taquicardia, que desaparece al profundizar la anestesia. El sevoflurano se inicia a dosis crecientes o al 8% en niños combativos, mientras el desflurano y el isoflurano no se usan por irritantes.","w":["Correcta: es una fase transitoria que se resuelve profundizando el plano.","Retirar el agente devuelve al niño a la fase de excitación.","No hace falta relajante: la fase cede con mayor profundidad anestésica.","Intubar en plano intermedio favorece el laringoespasmo."]},{"c":6,"t":"Momento de la extubación pediátrica","q":"¿Por qué el profesor prefiere extubar al niño en anestesia profunda con buen patrón ventilatorio?","o":["Para reducir el consumo de oxígeno","Para evitar el laringoespasmo del plano intermedio","Para evitar el vómito postoperatorio","Para acelerar la recuperación en sala"],"a":1,"e":"El profesor prefiere extubar en anestesia profunda con un patrón ventilatorio adecuado, más que con el niño despierto peleando el tubo, por el riesgo de laringoespasmo cuando el estímulo del tubo actúa en un plano anestésico intermedio. Ese laringoespasmo es el que puede generar presiones intratorácicas muy negativas y edema pulmonar por presión negativa.","w":["El consumo de oxígeno no es el motivo de esta preferencia.","Correcta: el plano intermedio con tubo es el escenario clásico de laringoespasmo.","El antiemético del caso sería el propofol, no el momento de extubación.","La recuperación no se acelera por extubar en plano profundo."]},{"c":6,"t":"Cálculo de líquidos pediátricos","q":"Aplicando la regla 4-2-1, ¿cuál es el mantenimiento horario de un niño de 25 kg?","o":["85 ml/h","50 ml/h","65 ml/h","100 ml/h"],"a":2,"e":"La regla 4-2-1 asigna 4 ml/kg/h para los primeros 10 kg, 2 ml/kg/h para los siguientes 10 y 1 ml/kg/h por cada kilo por encima de 20. Para 25 kg: 40 más 20 más 5 igual a 65 ml/h. El ejemplo del documento usa un paciente de 45 kg: 40 más 20 más 25 igual a 85 ml/h. Ese índice se emplea después para estimar el déficit por ayuno.","w":["Ese es el resultado para un paciente de 45 kg.","Subestima el aporte: los primeros 10 kg ya suponen 40 ml/h.","Correcta: 40 más 20 más 5 igual a 65 ml/h.","Excede el resultado que da la regla para este peso."]},{"c":6,"t":"Déficit por ayuno","q":"El mismo niño de 25 kg llega con 6 horas de ayuno. ¿Cuál es su déficit acumulado?","o":["260 ml","650 ml","150 ml","390 ml"],"a":3,"e":"Las deficiencias preexistentes por ayuno se estiman multiplicando el índice normal de mantenimiento por la duración del ayuno. Con un índice de 65 ml/h y 6 horas de ayuno: 65 por 6 igual a 390 ml. Es el mismo procedimiento del ejemplo del documento, donde un paciente con índice de 75 ml/h y 8 horas de ayuno acumulaba 600 ml.","w":["El cálculo correcto multiplica 65 por 6, no por 4.","Ese resultado correspondería a un índice mayor o más horas.","Subestima el déficit acumulado en 6 horas.","Correcta: 65 ml/h multiplicado por 6 horas da 390 ml."]},{"c":6,"t":"Umbral de transfusión en el niño","q":"¿Qué porcentaje del volumen sanguíneo puede perder un niño con hematocrito normal antes de requerir transfusión?","o":["Un 20%","Un 5%","Un 35%","Un 50%"],"a":0,"e":"Los niños con hematocrito normal pueden perder hasta un 20% del volumen sanguíneo antes de requerir transfusión. El volumen a transfundir se calcula como el volumen sanguíneo del paciente por el hematocrito deseado menos el actual, dividido entre el hematocrito de la unidad. Las plaquetas se dan a 5-10 ml/kg, y 10 ml/kg elevan alrededor de 100.000 por milímetro cúbico; el plasma fresco congelado a 10 ml/kg.","w":["Correcta: hasta un 20% de pérdida se tolera sin transfundir.","Subestima mucho la tolerancia descrita.","El umbral descrito es del 20%.","Un 50% de pérdida es incompatible con esperar para transfundir."]},{"c":6,"t":"Complicación iónica de la transfusión masiva","q":"¿Por qué la transfusión masiva produce hipocalcemia?","o":["Por consumo en la cascada de coagulación","Por el citrato del conservante","Por liberación de potasio eritrocitario","Por dilución del calcio plasmático"],"a":1,"e":"Cuando el volumen transfundido se acerca al volumen sanguíneo del paciente aparecen trombocitopenia, agotamiento de factores de coagulación, hipocalcemia por el citrato del conservante y liberación de potasio en grandes volúmenes. El citrato quela el calcio ionizado; la hiperpotasemia, en cambio, procede de los eritrocitos almacenados. Son dos mecanismos distintos que conviene no mezclar.","w":["El consumo de factores explica la coagulopatía, no la hipocalcemia.","Correcta: el citrato quela el calcio ionizado circulante.","El potasio liberado produce hiperpotasemia, no hipocalcemia.","La dilución contribuye, pero el mecanismo descrito es la quelación."]},{"c":6,"t":"Escala visual analógica","q":"Un niño señala 6 en la escala visual analógica. ¿Qué tratamiento corresponde?","o":["Solo medidas no farmacológicas","Opioides fuertes con anestesia regional","Opioides suaves con antiinflamatorios","Paracetamol y antiinflamatorios solos"],"a":2,"e":"La escala visual analógica va de 0, sin dolor, a 10, el peor dolor imaginable, y la señala el propio paciente: leve de 1 a 3, moderado de 4 a 7 e intenso de 8 a 10. El tratamiento depende del número: leve con paracetamol y antiinflamatorios, moderado con opioides suaves más antiinflamatorios, e intenso con opioides fuertes como morfina o fentanilo más anestesia regional o multimodal.","w":["Un dolor moderado requiere tratamiento farmacológico.","Los opioides fuertes se reservan para 8 a 10.","Correcta: un 6 es dolor moderado y corresponde a opioide suave con AINE.","Ese esquema es el del dolor leve, de 1 a 3."]},{"c":6,"t":"Vía aérea difícil en el síndrome de Down","q":"¿Qué dificulta la intubación en el niño con síndrome de Down?","o":["El ano imperforado","El coloboma","La micrognatia","La macroglosia"],"a":3,"e":"La dificultad de intubación aparece por micrognatia en el Pierre Robin y el Treacher Collins, y por lengua grande en el síndrome de Down. El síndrome CHARGE incluye coloboma, cardiopatía congénita, retardo, hipoplasia genital y anomalía de oídos, y la asociación VACTERL agrupa defectos vertebrales, ano imperforado, fístula traqueoesofágica y defectos renales y de extremidades.","w":["El ano imperforado pertenece a la asociación VACTERL.","El coloboma forma parte del síndrome CHARGE.","La micrognatia corresponde a Pierre Robin y Treacher Collins.","Correcta: la macroglosia relativa complica la laringoscopia en el Down."]},{"c":6,"t":"Obstrucción de coanas","q":"¿Por qué la obstrucción de coanas es una emergencia en el recién nacido?","o":["Porque el recién nacido respira por la nariz","Porque produce hipertensión pulmonar inmediata","Porque se asocia a cardiopatía congénita","Porque impide la alimentación enteral"],"a":0,"e":"En la revisión de cabeza y cuello del recién nacido hay que recordar que respira por la nariz, de modo que la obstrucción de coanas es una emergencia. Otros hallazgos relevantes son la dificultad de intubación por micrognatia o macroglosia, y el hemangioma de alerta, que atrapa y consume plaquetas y genera diátesis hemorrágica.","w":["Correcta: es respirador nasal obligado y la obstrucción compromete la ventilación.","La hipertensión pulmonar no es la consecuencia inmediata descrita.","La asociación con cardiopatía no es constante ni explica la urgencia.","El problema es respiratorio antes que nutricional."]},{"c":6,"t":"Mecánica torácica del recién nacido","q":"¿Por qué el recién nacido presenta respiración paradójica y crisis de apnea?","o":["Cierre precoz de las suturas craneales","Caja costal distensible y diafragma ineficaz","Caja costal rígida y diafragma hipertrófico","Exceso de fibras tipo I en el diafragma"],"a":1,"e":"El tórax del recién nacido tiene una caja costal distensible que colapsa con facilidad y una contracción ineficaz del diafragma por su escasa proporción de fibra tipo I, lo que produce respiración paradójica y crisis de apnea. El sistema nervioso es el menos maduro al nacer, lo que predispone a hemorragias intraventriculares, depresión respiratoria y convulsiones.","w":["Las suturas craneales permanecen abiertas en el neonato.","Correcta: tórax colapsable con diafragma poco resistente a la fatiga.","La caja costal del neonato es distensible, no rígida.","El problema es la escasez de fibras tipo I, no su exceso."]},{"c":7,"t":"Mecanismo de los anestésicos locales","q":"¿Qué canal bloquean los anestésicos locales?","o":["El canal de potasio, en su subunidad beta","El canal de cloro del receptor GABA","El canal de sodio, en su subunidad alfa","El canal de calcio dependiente de voltaje"],"a":2,"e":"Los anestésicos locales se unen a la subunidad alfa y bloquean los canales de sodio, lo que los convierte en estabilizantes de membrana y antiarrítmicos, y tienen índice terapéutico bajo. Se administran con vasoconstrictor, típicamente epinefrina, lo que mejora su acción, disminuye el sangrado y reduce los efectos adversos sistémicos al frenar su absorción.","w":["El canal de potasio no es su diana.","El canal de cloro pertenece al receptor GABA-A.","Correcta: bloquean el canal de sodio dependiente de voltaje.","El canal de calcio corresponde a otros grupos farmacológicos."]},{"c":7,"t":"Anestésico local en tejido infectado","q":"Se infiltra lidocaína en una zona con pus y no hace efecto. ¿Por qué?","o":["El pus lo diluye por debajo del umbral","El pH alcalino lo precipita","Las bacterias lo metabolizan","El pH ácido ioniza el fármaco"],"a":3,"e":"Los anestésicos locales no actúan sobre moléculas ionizadas, y en presencia de pus el pH ácido ioniza el fármaco, de modo que no puede entrar a la membrana para hacer su efecto. Ese mismo principio explica que el inicio de acción dependa del pKa, más rápido cuanto más cercano al pH fisiológico, y que la infección del área sea contraindicación absoluta de los bloqueos regionales.","w":["No es un problema de dilución sino de estado de ionización.","El medio del absceso es ácido, no alcalino.","Las bacterias no metabolizan el anestésico local.","Correcta: la forma ionizada no atraviesa la membrana."]},{"c":7,"t":"Química de los anestésicos locales","q":"¿Qué parte de la molécula define la clasificación en ésteres y amidas?","o":["La cadena intermedia","El grupo hidroxilo lateral","El anillo bencénico","La amina terciaria terminal"],"a":0,"e":"La molécula del anestésico local tiene tres partes: un grupo lipofílico, el anillo bencénico; una cadena intermedia que puede ser éster o amida, y que es la base de la clasificación; y un grupo hidrofílico, una amina terciaria. Son bases débiles y suelen tener carga positiva. Una regla práctica es que las amidas llevan dos letras i en el nombre.","w":["Correcta: éster o amida en la cadena intermedia define los dos grupos.","No es el grupo que define la clasificación.","El anillo bencénico es el grupo lipofílico común a todos.","La amina terciaria es el grupo hidrofílico, también común."]},{"c":7,"t":"Metabolismo de ésteres y amidas","q":"Relacione el metabolismo de los ésteres con el de las amidas:","o":["Ésteres por citocromo P450 hepático; amidas por pseudocolinesterasa plasmática","Ésteres por pseudocolinesterasa; amidas por citocromo P450","Ésteres por hidrólisis renal directa; amidas por citocromo P450 hepático","Ésteres por pseudocolinesterasa; amidas por reacción de Hoffman plasmática"],"a":1,"e":"Los ésteres se metabolizan por pseudocolinesterasa plasmática, con hidrólisis muy rápida y excreción renal; las amidas se metabolizan en el hígado por citocromo P450, mediante desalquilación N e hidroxilación. De ahí que los ésteres tengan menor toxicidad sistémica y las amidas mayor riesgo tóxico si se acumulan. Los ésteres son cocaína, procaína, clorprocaína y benzocaína.","w":["Invierte ambas vías metabólicas.","Correcta: plasma para los ésteres e hígado para las amidas.","Los ésteres se hidrolizan en plasma, no en el riñón.","La reacción de Hoffman corresponde al atracurio y el cisatracurio."]},{"c":7,"t":"Identificación del grupo","q":"¿Cuál de los siguientes anestésicos locales es un éster?","o":["Mepivacaína","Bupivacaína","Procaína","Ropivacaína"],"a":2,"e":"Los ésteres son la cocaína, la procaína, la clorprocaína y la benzocaína, y según el profesor casi no se usan; las amidas son la lidocaína, la bupivacaína, la levobupivacaína, la mepivacaína, la ropivacaína y la prilocaína. Los ésteres tienen metabolismo plasmático y por tanto menor toxicidad sistémica; las amidas, metabolismo hepático y mayor riesgo tóxico si se acumulan.","w":["La mepivacaína es una amida.","La bupivacaína es una amida, además cardiotóxica.","Correcta: la procaína es un éster de metabolismo plasmático.","La ropivacaína también pertenece al grupo de las amidas."]},{"c":7,"t":"Cronología del bloqueo","q":"Ordene lo que se bloquea con un anestésico local, de primero a último:","o":["Motricidad, tacto, analgesia, simpático","Tacto, simpático, analgesia, motricidad","Analgesia, simpático, motricidad, tacto","Simpático, analgesia, tacto, motricidad"],"a":3,"e":"La cronología del bloqueo es: primero bloqueo simpático, con vasodilatación y aumento de la temperatura; segundo analgesia; tercero tacto; y cuarto motricidad, que es lo último en bloquearse y lo primero en recuperarse. Esa secuencia explica que la hipotensión por bloqueo simpático sea la complicación inmediata más frecuente del bloqueo subaracnoideo.","w":["Invierte por completo la secuencia.","El tacto se bloquea en tercer lugar, no primero.","El bloqueo simpático precede a la analgesia.","Correcta: el simpático cae primero y la función motora al final."]},{"c":7,"t":"Lidocaína y bupivacaína","q":"Relacione la duración de la lidocaína con la característica tóxica de la bupivacaína:","o":["Lidocaína 60-90 minutos; bupivacaína cardiotóxica","Lidocaína 60-90 minutos; bupivacaína sin toxicidad cardiaca descrita","Lidocaína 60-90 minutos; bupivacaína neurotóxica a dosis muy altas solamente","Lidocaína 120-180 minutos; bupivacaína cardiotóxica con arritmias ventriculares"],"a":0,"e":"La lidocaína dura de 60 a 90 minutos, se usa al 1% para procedimientos y al 2% cuando es necesario, y es neurotóxica a dosis altas. La bupivacaína dura de 120 a 180 minutos, al 0,25% y al 0,5%, y es cardiotóxica: por vía intravenosa produce hipotensión, bloqueo auriculoventricular y ritmos idioventriculares. La toxicidad es directamente proporcional a la potencia del agente.","w":["Correcta: 60 a 90 minutos y cardiotoxicidad de la bupivacaína.","La cardiotoxicidad es el rasgo más temido de la bupivacaína.","La neurotoxicidad a dosis altas se describe para la lidocaína.","Ciento veinte a 180 minutos corresponde a la bupivacaína."]},{"c":7,"t":"Síntomas menores de toxicidad","q":"¿Cuáles son los síntomas menores de la toxicidad por anestésicos locales?","o":["Paro cardiorrespiratorio","Tinnitus y sabor metálico","Convulsiones y agitación","Bloqueo auriculoventricular"],"a":1,"e":"Los efectos adversos menores de los anestésicos locales son el tinnitus y el sabor metálico, y los mayores la agitación con convulsiones y el paro cardiorrespiratorio. El tratamiento de los menores es la cesación de la administración; en los mayores hay que proteger la vía aérea, dar oxígeno y manejar la convulsión o el paro, además del rescate lipídico.","w":["El paro cardiorrespiratorio es la manifestación más grave.","Correcta: tinnitus y sabor metálico son las primeras señales de alarma.","La agitación con convulsiones ya es un efecto mayor.","El bloqueo auriculoventricular corresponde a la cardiotoxicidad grave."]},{"c":7,"t":"Síndrome LAST","q":"Paciente que tras un bloqueo refiere entumecimiento de lengua, tinnitus, visión borrosa e inquietud, como si estuviera borracho. ¿Qué está ocurriendo?","o":["Bloqueo simpático excesivo","Reacción alérgica al metilparabeno","Toxicidad sistémica por anestésico local","Hipoglucemia perioperatoria"],"a":2,"e":"El síndrome de toxicidad sistémica por anestésicos locales, LAST, cursa con entumecimiento de la lengua, mareo, tinnitus, visión borrosa, inquietud, agitación, paranoia, depresión del sistema nervioso central, espasmos musculares, convulsiones y paro respiratorio: el paciente parece borracho. Su tratamiento específico es la emulsión lipídica intravenosa, que atrapa el anestésico y lo secuestra de la circulación.","w":["El bloqueo simpático excesivo produce hipotensión, no este cuadro neurológico.","La alergia por metilparabeno se asocia a ésteres y da cuadro cutáneo.","Correcta: es el cuadro descrito del síndrome LAST.","La hipoglucemia no explica el tinnitus ni el entumecimiento lingual."]},{"c":7,"t":"Rescate lipídico","q":"¿Cuál es el bolo inicial del rescate lipídico en la toxicidad por anestésico local?","o":["0,25 ml/kg en un minuto","0,025 ml/kg en un minuto","15 ml/kg en un minuto","1,5 ml/kg en un minuto"],"a":3,"e":"Ante toxicidad sistémica por anestésico local, por ejemplo convulsiones tras un bloqueo interescalénico, el manejo inmediato es la administración de lípidos intravenosos: bolo de 1,5 ml/kg en un minuto más infusión continua de 0,25 ml/kg/min. Los lípidos secuestran el anestésico de la circulación, reduciendo su toxicidad neurológica y cardiovascular.","w":["Ese valor corresponde a la infusión de mantenimiento por minuto.","Muy por debajo de la dosis eficaz descrita.","Diez veces la dosis descrita.","Correcta: 1,5 ml/kg en un minuto es el bolo inicial."]},{"c":7,"t":"Distractores del rescate lipídico","q":"En la toxicidad sistémica por anestésico local, ¿cuál de estos fármacos NO tiene indicación?","o":["Dantroleno","Anticonvulsivante","Oxígeno","Emulsión lipídica"],"a":0,"e":"El documento subraya los distractores típicos de examen en la toxicidad por anestésico local: atropina, útil en la bradicardia; dantroleno, tratamiento de la hipertermia maligna; glucosa hiperosmolar, para la hipoglucemia; y naloxona, para opioides. El tratamiento correcto es la emulsión lipídica intravenosa, junto con protección de la vía aérea, oxígeno y manejo de la convulsión.","w":["Correcta: el dantroleno trata la hipertermia maligna, no el LAST.","El manejo de la convulsión es parte del tratamiento de los efectos mayores.","El oxígeno forma parte del manejo inmediato.","La emulsión lipídica es el tratamiento específico."]},{"c":7,"t":"Excepción vascular","q":"Todos los anestésicos locales producen vasodilatación, EXCEPTO uno. ¿Cuál?","o":["Procaína","Cocaína","Lidocaína","Bupivacaína"],"a":1,"e":"A nivel cardiovascular los anestésicos locales deprimen el automatismo miocárdico, reducen la duración del periodo refractario efectivo y relajan el músculo liso produciendo vasodilatación, excepto la cocaína, que es vasoconstrictora. La lidocaína a dosis bajas se usa como tratamiento de arritmias y la bupivacaína intravenosa produce hipotensión, bloqueo auriculoventricular y arritmias.","w":["La procaína, como éster, también produce vasodilatación.","Correcta: la cocaína es la única vasoconstrictora del grupo.","La lidocaína sigue la regla general y vasodilata.","La bupivacaína también vasodilata, además de ser cardiotóxica."]},{"c":7,"t":"Alergia a anestésicos locales","q":"¿Con qué grupo es más frecuente la alergia y por qué conservante?","o":["Con los ésteres, por el bisulfito de sodio","Con las amidas, por el bisulfito de sodio","Con los ésteres, por el metilparabeno","Con las amidas, por el metilparabeno"],"a":2,"e":"La alergia es más común con los ésteres y se relaciona con el conservante metilparabeno. Los anestésicos locales además disminuyen la respuesta inflamatoria porque inhiben el ácido lisofosfatídico. En el aparato respiratorio pueden producir apnea por parálisis del nervio frénico y de los intercostales, y relajan el músculo liso bronquial; la lidocaína disminuye el reflejo hipóxico.","w":["El conservante implicado descrito es el metilparabeno.","Ni el grupo ni el conservante coinciden con lo descrito.","Correcta: ésteres y metilparabeno son la asociación descrita.","La alergia verdadera se asocia sobre todo a los ésteres."]},{"c":7,"t":"Raíces del plexo braquial","q":"¿Qué raíces forman el plexo braquial?","o":["De C6 a T2","De C4 a C8","De C3 a C7","De C5 a T1"],"a":3,"e":"El plexo braquial está formado por las ramas ventrales principales de C5 a T1, y una cubierta de fascia derivada de la fascia prevertebral y escalena lo envuelve, extendiéndose desde el agujero intervertebral hasta la porción superior del brazo: esa vaina es la referencia anatómica del bloqueo. La referencia clásica es la fosa interescalénica, entre el escaleno anterior y el medio.","w":["El plexo braquial no incluye T2.","No coincide con la formación descrita del plexo braquial.","Ese rango corresponde más al plexo cervical.","Correcta: ramas ventrales de C5 a T1."]},{"c":7,"t":"Territorio deficitario del interescalénico","q":"¿Qué nervio queda mal bloqueado con el abordaje interescalénico?","o":["El cubital","El musculocutáneo","El axilar","El radial"],"a":0,"e":"El bloqueo interescalénico se usa para hombro, brazo y antebrazo, y bloquea más intensamente C5 a C7 que C8 y T1, por lo que no es adecuado para el nervio cubital. Puede causar bloqueo del hemidiafragma, motivo por el cual nunca se hace bilateral, y también síndrome de Horner con ptosis, anhidrosis y miosis.","w":["Correcta: el cubital depende de C8 y T1, mal cubiertos por este abordaje.","El musculocutáneo es el que suele fallar en el abordaje axilar.","El axilar depende de C5-C6, bien bloqueadas.","El radial queda bien cubierto por las raíces altas."]},{"c":7,"t":"Síndrome de Horner tras bloqueo","q":"Paciente con ptosis, miosis y anhidrosis tras un bloqueo interescalénico. ¿Qué ocurre?","o":["Lesión del nervio frénico","Bloqueo simpático cervical asociado","Toxicidad sistémica por el anestésico","Punción accidental de la arteria vertebral"],"a":1,"e":"El bloqueo interescalénico puede producir síndrome de Horner, con ptosis, anhidrosis y miosis, por difusión del anestésico hacia la cadena simpática cervical; también puede causar bloqueo del hemidiafragma, y por eso nunca se hace bilateral. El abordaje supraclavicular comparte ambos riesgos y añade el de neumotórax por proximidad pleural.","w":["El bloqueo frénico produce disnea, no la tríada oculosimpática.","Correcta: la difusión al simpático cervical explica la tríada.","La toxicidad sistémica cursa con tinnitus, agitación y convulsiones.","La punción vascular daría un cuadro tóxico, no un Horner."]},{"c":7,"t":"Riesgo del abordaje supraclavicular","q":"¿Cuál es el riesgo característico del bloqueo supraclavicular del plexo braquial?","o":["Cefalea postpunción","Síndrome de cola de caballo","Neumotórax","Hematoma epidural"],"a":2,"e":"En el abordaje supraclavicular el plexo va muy compactado entre las primeras costillas, con orientación vertical, lo que permite una excelente anestesia de brazo, antebrazo y mano. Su riesgo característico es el neumotórax por la proximidad pleural; también puede bloquear el diafragma, por lo que nunca se hace bilateral, y dar síndrome de Horner.","w":["La cefalea postpunción es propia del bloqueo subaracnoideo.","El síndrome de cola de caballo es una complicación neuroaxial.","Correcta: la pleura queda inmediatamente por debajo del punto de punción.","El hematoma epidural pertenece al riesgo de los bloqueos neuroaxiales."]},{"c":7,"t":"Ventaja del bloqueo axilar","q":"¿Cuál es la ventaja del abordaje axilar frente al interescalénico y el supraclavicular?","o":["Bloquea mejor el hombro y la escápula","No requiere ecografía ni neuroestimulador","Tiene menor riesgo de toxicidad sistémica","Se puede hacer bilateral sin riesgo de neumotórax"],"a":3,"e":"El bloqueo axilar sirve para antebrazo y mano y se puede hacer bilateral sin riesgo de neumotórax, lo que es su gran ventaja: la arteria subclavia se convierte en axilar por debajo de la clavícula y se busca el pulso arterial con el brazo a 90 grados. Su limitación es que el nervio musculocutáneo ya dejó la vaina y está dentro del coracobraquial, por lo que a veces queda mal bloqueado.","w":["El hombro se cubre mejor con el abordaje interescalénico.","Hoy todos los abordajes se guían por ecografía o neuroestimulador.","El riesgo tóxico depende de la dosis, no del abordaje.","Correcta: al alejarse de la pleura permite el bloqueo bilateral."]},{"c":7,"t":"Terminación de la médula espinal","q":"¿A qué nivel termina la médula espinal en el adulto?","o":["En L1","En L4","En S2","En T12"],"a":0,"e":"La médula espinal termina en L1 en el adulto y más abajo en el niño, razón por la cual el abordaje pediátrico se hace más caudal, a nivel de S4-S5. La referencia de nivel es la línea de Tuffier, entre ambas crestas ilíacas posterosuperiores, aproximadamente L4, y siempre se aborda por debajo del cono medular para no lesionar la médula.","w":["Correcta: el cono medular termina en L1 en el adulto.","L4 es la línea de Tuffier, referencia de punción.","S2 corresponde al final del saco dural, no de la médula.","T12 queda por encima del final de la médula."]},{"c":7,"t":"Línea de Tuffier","q":"¿Qué referencia anatómica marca aproximadamente L4?","o":["La línea entre últimas costillas flotantes","La línea entre crestas ilíacas posterosuperiores","La línea entre espinas ilíacas anterosuperiores","La línea entre ángulos escapulares inferiores"],"a":1,"e":"La línea de Tuffier es la línea imaginaria entre ambas crestas ilíacas posterosuperiores y corresponde aproximadamente a L4: se usa para elegir el nivel de punción por debajo del cono medular, que en el adulto termina en L1. El paciente se coloca sentado o en decúbito lateral, y en embarazadas suele preferirse sentada por la dificultad para flexionar.","w":["Las costillas flotantes no se usan como referencia del nivel lumbar.","Correcta: es la línea de Tuffier, referencia estándar del nivel lumbar.","Las referencias son posterosuperiores, no anterosuperiores.","Los ángulos escapulares marcan aproximadamente T7."]},{"c":7,"t":"Capas del bloqueo subaracnoideo","q":"Ordene las estructuras que se atraviesan tras el ligamento interespinoso:","o":["Aracnoides, duramadre, ligamento amarillo, espacio epidural","Duramadre, ligamento amarillo, espacio epidural, aracnoides","Ligamento amarillo, espacio epidural, duramadre, aracnoides","Espacio epidural, ligamento amarillo, aracnoides, duramadre"],"a":2,"e":"Las capas que se atraviesan son, en orden: piel, tejido celular subcutáneo, ligamento supraespinoso, ligamento interespinoso, ligamento amarillo, espacio epidural, duramadre espinal, aracnoides y espacio subaracnoideo con líquido cefalorraquídeo. El ligamento amarillo precede al espacio epidural, y por eso al llegar a él se siente resistencia y justo después, con la pérdida de resistencia, se está en el peridural.","w":["Invierte por completo la secuencia de planos.","La duramadre está después del espacio epidural.","Correcta: amarillo, epidural, duramadre y aracnoides en ese orden.","El ligamento amarillo precede al espacio epidural."]},{"c":7,"t":"Agujas espinales y cefalea","q":"¿Por qué las agujas de 25 a 27 G producen menos cefalea que las de 22 a 23 G?","o":["Requieren menos volumen de anestésico","Permiten una inyección más lenta","Atraviesan menos planos anatómicos","Dejan un orificio dural más pequeño"],"a":3,"e":"Las agujas espinales tienen un estilete removible que ocluye la luz por completo y pueden ser de punta afilada o de punta roma, como las Sprotte, Whitacre y Quincke. Las agujas finas, de 25 a 27 G, dan mucho menos riesgo de cefalea que las gruesas de 22 a 23 G que se usaban antes, porque el orificio dural que dejan es menor y por tanto la fuga de líquido cefalorraquídeo es menor.","w":["El volumen depende de la técnica, no del calibre de la aguja.","La velocidad de inyección no explica la diferencia en cefalea.","Atraviesan los mismos planos, con independencia del calibre.","Correcta: menor orificio dural implica menor fuga de líquido cefalorraquídeo."]},{"c":7,"t":"Baricidad","q":"Se administra bupivacaína hiperbárica y se coloca al paciente en Trendelenburg. ¿Qué ocurrirá con el nivel del bloqueo?","o":["Se dispersará más cefálico","No se modificará de forma previsible","Descenderá hacia las raíces lumbares bajas","Quedará confinado al sacro"],"a":0,"e":"La baricidad sirve para controlar hasta qué nivel sube o baja la anestesia raquídea. La solución hiperbárica, como la lidocaína al 5% o la bupivacaína hiperbárica, es más densa que el líquido cefalorraquídeo y se hunde, de modo que en Trendelenburg, con la cabecera baja, se dispersa más cefálico. La isobárica tiene dispersión previsible y la hipobárica sube en posición de Fowler.","w":["Correcta: al ser más densa desciende, y con cabecera baja eso es hacia cefálico.","La dispersión es precisamente previsible según baricidad y posición.","En Trendelenburg la solución densa se desplaza hacia cefálico, no caudal.","Confinarla al sacro requeriría posición sentada con solución hiperbárica."]},{"c":7,"t":"Cefalea postpunción","q":"¿Cuál es la característica que define la cefalea postpunción?","o":["Se acompaña de fiebre alta","Es postural: mejora acostado","Empeora en decúbito supino","Es continua y no varía con la postura"],"a":1,"e":"La cefalea postpunción es inmediata, más frecuente en jóvenes y característicamente postural: desaparece acostado y empeora al sentarse o incorporarse, descrita como un martillazo en la cabeza. El manejo conservador es hidratación, derivados de cafeína y reposo en posición plana; si no resuelve, el parche hemático con 10 a 20 ml de sangre autóloga en el espacio peridural resuelve el 100% de los casos.","w":["La fiebre obligaría a descartar una complicación infecciosa.","Correcta: el componente postural es su rasgo diagnóstico.","Empeora al incorporarse, no en decúbito.","La invariabilidad postural orientaría a otra causa de cefalea."]},{"c":7,"t":"Tratamiento definitivo de la cefalea postpunción","q":"La cefalea postpunción no cede con hidratación, cafeína y reposo. ¿Cuál es el siguiente paso?","o":["Repetir la punción con aguja fina","Emulsión lipídica intravenosa","Parche hemático peridural","Opioides intravenosos en infusión"],"a":2,"e":"Si el manejo conservador con hidratación, derivados de cafeína y reposo en posición plana no resuelve la cefalea postpunción, se hace parche hemático: se inyectan 10, 15 o 20 ml de sangre autóloga en el espacio peridural, que sella el orificio dural y resuelve el 100% de los casos. Con agujas finas de 25 a 27 G la incidencia es mucho menor que con las gruesas.","w":["Repetir la punción añadiría un nuevo orificio dural.","La emulsión lipídica trata la toxicidad por anestésicos locales.","Correcta: el parche hemático sella el orificio y resuelve todos los casos.","Los opioides alivian el síntoma pero no corrigen la fuga dural."]},{"c":7,"t":"Hipotensión tras bloqueo neuroaxial","q":"Paciente hipotenso minutos después de una raquídea. ¿Cuál es el primer paso del manejo?","o":["Colocar en Fowler","Iniciar efedrina en bolo","Administrar atropina","Elevar las piernas"],"a":3,"e":"La hipotensión es la complicación inmediata más frecuente del bloqueo subaracnoideo y se debe al bloqueo simpático, con vasodilatación periférica y descenso del retorno venoso. El manejo tiene tres pasos en orden: elevar las piernas, aumentar los líquidos intravenosos y, si persiste, vasopresores como efedrina o fenilefrina. Otras complicaciones son bradicardia, náuseas y parestesias.","w":["La posición de Fowler agravaría la caída del retorno venoso.","Los vasopresores son el tercer paso, no el primero.","La atropina trata la bradicardia, no la vasodilatación.","Correcta: la maniobra postural restituye retorno venoso de inmediato."]},{"c":7,"t":"Ventaja de la peridural","q":"¿Cuál es la gran ventaja del bloqueo peridural frente al subaracnoideo?","o":["Permite dosis continua con catéter","Requiere menos volumen de anestésico","No produce bloqueo simpático","Su instalación es más rápida"],"a":0,"e":"La gran ventaja del bloqueo peridural es que se puede administrar en dosis única o continua con catéter, manteniendo el bloqueo por horas, lo que lo hace ideal para el trabajo de parto o cirugías largas. Hoy el catéter se coloca desde 1 cm de dilatación, cuando antes se esperaba a 6 cm. La subaracnoidea, en cambio, es de dosis única y más rápida, preferida para cesárea.","w":["Correcta: el catéter permite mantener y ajustar el bloqueo durante horas.","La peridural requiere más volumen y concentración, no menos.","También produce bloqueo simpático y por tanto hipotensión.","La instalación más rápida es la de la subaracnoidea."]},{"c":7,"t":"Pérdida de resistencia","q":"¿Qué se siente al llegar al espacio peridural con la técnica de pérdida de resistencia?","o":["Pérdida de resistencia inmediata desde la piel","Resistencia en el ligamento amarillo y luego su pérdida","Resistencia sostenida sin pérdida posterior","Salida de líquido cefalorraquídeo claro"],"a":1,"e":"En el bloqueo peridural se atraviesan las mismas capas hasta el espacio epidural, sin atravesar la duramadre: al llegar al ligamento amarillo se siente resistencia y justo después, con la pérdida de resistencia, se está en el espacio peridural. Es la técnica más usada, aunque da falsos positivos; la gota colgante da aún más y casi no se usa. No ocurre cefalea salvo punción húmeda accidental.","w":["La resistencia aparece al llegar al ligamento amarillo, no desde la piel.","Correcta: resistencia del ligamento amarillo seguida de su pérdida.","La pérdida de resistencia es justamente el signo de haber entrado.","La salida de líquido indica punción dural, no espacio peridural."]},{"c":7,"t":"Dosis de prueba","q":"¿Para qué sirve la dosis de prueba en el bloqueo peridural?","o":["Medir el nivel de dermatoma alcanzado","Valorar la sensibilidad al anestésico","Detectar inyección subaracnoidea o intravascular","Confirmar la profundidad del espacio"],"a":2,"e":"La dosis de prueba en el bloqueo peridural sirve para detectar una administración subaracnoidea o intravascular accidental, y se calcula 1 a 2 ml de anestésico local por segmento a bloquear. Es una medida de seguridad complementaria a la pérdida de resistencia, que puede dar falsos positivos, y cobra importancia porque la infiltración vascular accidental es la causa del cuadro de arritmias tras un anestésico local.","w":["El nivel de dermatoma se comprueba después, con hielo o aguja.","No es una prueba de alergia ni de sensibilidad individual.","Correcta: descarta que la punta esté en el espacio subaracnoideo o en un vaso.","La profundidad se determina por la pérdida de resistencia."]},{"c":7,"t":"Contraindicaciones absolutas","q":"Todas las siguientes son contraindicaciones absolutas del bloqueo regional, EXCEPTO una. ¿Cuál?","o":["Coagulopatía","Estenosis aórtica severa","Infección del área de punción","Falta de cooperación del paciente"],"a":3,"e":"Las contraindicaciones absolutas del bloqueo regional son la infección del área, la hipovolemia, la estenosis aórtica o mitral severa, las coagulopatías y el rechazo del paciente. Las relativas son la sepsis, la falta de cooperación y la deformidad de columna. Las controvertidas son la cirugía previa de columna y la barrera de idioma.","w":["La coagulopatía es contraindicación absoluta por riesgo de hematoma.","La estenosis aórtica severa es absoluta por su dependencia de precarga.","La infección del área figura entre las absolutas.","Correcta: la falta de cooperación es contraindicación relativa, no absoluta."]},{"c":7,"t":"Hipovolemia y bloqueo neuroaxial","q":"Paciente con embarazo ectópico roto y tensión de 70/40. ¿Por qué está contraindicado el bloqueo neuroaxial?","o":["El bloqueo simpático anularía el retorno venoso","El anestésico local deprimiría el miocardio","El bloqueo motor impediría compensar","La punción aumentaría el sangrado intraabdominal"],"a":0,"e":"La hipovolemia severa es la contraindicación absoluta más preguntada, transversal al bloqueo subaracnoideo y al peridural. La razón fisiológica es que el bloqueo produce vasodilatación periférica por bloqueo simpático y con ello disminuye el retorno venoso: si el paciente ya está hipovolémico, como en un shock hemorrágico por ruptura de embarazo ectópico con tensión de 70/40, el bloqueo puede colapsar la circulación.","w":["Correcta: sumar vasodilatación a una hipovolemia colapsa la circulación.","A dosis de bloqueo no hay depresión miocárdica directa relevante.","El problema es hemodinámico por bloqueo simpático, no motor.","La punción lumbar no modifica el sangrado intraabdominal."]},{"c":7,"t":"Volumen de anestésico","q":"Relacione el volumen de anestésico que requiere la peridural con el de la subaracnoidea:","o":["La subaracnoidea requiere el triple de volumen","La peridural requiere más volumen y concentración","La peridural requiere menos volumen y concentración que la otra","Ambas requieren exactamente la misma dosis total"],"a":1,"e":"La cantidad de anestésico local, en volumen y concentración, necesaria para la anestesia epidural es mayor que para la subaracnoidea, porque en la epidural el fármaco debe difundir hasta las raíces sin el vehículo del líquido cefalorraquídeo. Esa diferencia es relevante porque la toxicidad sistémica depende de la dosis total y el bloqueo epidural conlleva mayor riesgo de infiltración vascular accidental.","w":["La subaracnoidea trabaja con dosis mucho menores.","Correcta: la epidural exige dosis mayores que la subaracnoidea.","Invierte la relación de dosis entre ambas técnicas.","Las dosis no son equivalentes entre ambas técnicas."]},{"c":7,"t":"Bloqueo sensitivo y motor","q":"¿Cuál es la relación sensitivo-motora aproximada del bloqueo subaracnoideo?","o":["Diez a uno","Uno a uno","Tres a uno","Uno a tres"],"a":2,"e":"El bloqueo subaracnoideo es sensitivo-motor potente, con relación sensitivo a motor de aproximadamente 3 a 1; el peridural es más sensitivo que motor, de modo que el paciente puede mover las extremidades. Esa diferencia hace del peridural la técnica de elección para analgesia de trabajo de parto, donde interesa quitar el dolor sin abolir la capacidad de pujar.","w":["Sobreestima el predominio sensitivo del bloqueo subaracnoideo.","No es una relación equilibrada: predomina lo sensitivo.","Correcta: predomina el bloqueo sensitivo en proporción de 3 a 1.","Invierte la relación descrita."]},{"c":7,"t":"Apnea por anestésicos locales","q":"¿Por qué un anestésico local puede producir apnea?","o":["Por depresión directa del centro respiratorio","Por broncoconstricción intensa","Por bloqueo de la placa neuromuscular","Por parálisis del frénico y los intercostales"],"a":3,"e":"En el aparato respiratorio los anestésicos locales pueden producir apnea por parálisis del nervio frénico y de los intercostales, un mecanismo mecánico y no central, y relajan el músculo liso bronquial; la lidocaína disminuye el reflejo hipóxico. Ese es el fundamento de que el bloqueo interescalénico y el supraclavicular puedan comprometer el hemidiafragma y nunca se hagan bilaterales.","w":["No es un efecto central sino periférico y mecánico.","Relajan el músculo liso bronquial: no broncoconstriñen.","No actúan sobre la placa neuromuscular.","Correcta: la apnea es por parálisis de los músculos respiratorios."]},{"c":7,"t":"Abordaje pediátrico del neuroaxial","q":"¿Por qué en el niño el abordaje subaracnoideo se hace más caudal, en S4-S5?","o":["Porque su médula termina más abajo","Porque su saco dural es más corto","Porque la línea de Tuffier está más alta","Porque el ligamento amarillo es más grueso"],"a":0,"e":"La médula espinal termina en L1 en el adulto y más abajo en el niño, razón por la cual el abordaje pediátrico se hace más caudal, a nivel de S4-S5, para quedar por debajo del cono medular y no lesionar la médula. La irrigación medular corre por la arteria espinal anterior, un par de arterias espinales posteriores y la arteria radicular de Adamkiewicz.","w":["Correcta: el cono medular pediátrico es más caudal que en el adulto.","El saco dural del niño se extiende más abajo, no menos.","La referencia de Tuffier no explica el cambio de nivel.","El grosor del ligamento amarillo no determina el nivel de punción."]},{"c":8,"t":"Estimación de pérdidas quirúrgicas","q":"Según la regla práctica de la grabación, ¿a cuántos mililitros equivale una compresa empapada?","o":["Unos 300 ml","De 100 a 150 ml","Unos 10 ml","Unos 600 ml"],"a":1,"e":"La valoración del volumen intravascular se apoya en hematocritos seriados, pH arterial, sodio y cloro urinarios y BUN con creatinina. La regla práctica para estimar pérdidas quirúrgicas es que una gasa equivale a unos 10 ml, una compresa a 100-150 ml y el succionador a unos 600 ml, cifras que permiten cuantificar el sangrado sin depender solo de la impresión visual.","w":["No es la cifra descrita para ninguno de los tres.","Correcta: la compresa se estima en 100 a 150 ml.","Los 10 ml corresponden a la gasa.","Los 600 ml corresponden al succionador."]},{"c":8,"t":"Primera línea en el choque hipovolémico","q":"¿Qué tipo de solución es la primera línea en el choque hipovolémico?","o":["Albúmina al 20%","Coloides","Cristaloides","Almidones sintéticos"],"a":2,"e":"Las soluciones cristaloides son acuosas, con iones de bajo peso molecular, y son la primera línea en el choque hipovolémico, además de estar indicadas en quemados y en el traumatismo craneoencefálico. Por su bajo peso molecular se distribuyen rápido y tienen vida media corta, de 20 a 30 minutos. Los coloides se añaden junto a los cristaloides una vez que estos superan los 3 a 4 litros.","w":["La albúmina es un coloide y no es primera línea.","Los coloides se suman después, no de entrada.","Correcta: los cristaloides encabezan la reanimación del choque hipovolémico.","Los almidones son coloides sintéticos, tampoco de primera línea."]},{"c":8,"t":"Vida media de cristaloides y coloides","q":"Relacione la vida media de los cristaloides con la de los coloides:","o":["Cristaloides 20-30 minutos; coloides 24 horas intravasculares","Cristaloides 2-3 horas; coloides 20-30 minutos intravasculares","Cristaloides 3-6 horas; coloides 20-30 minutos intravasculares","Cristaloides 20-30 minutos; coloides 3-6 horas"],"a":3,"e":"Los cristaloides tienen bajo peso molecular, se distribuyen rápido y su vida media es corta, de 20 a 30 minutos. Los coloides tienen alto peso molecular, mantienen la presión oncótica coloidal del plasma, permanecen intravasculares y su vida media es de 3 a 6 horas. Esa diferencia explica por qué en la hipovolemia severa los coloides complementan a los cristaloides.","w":["Las 24 horas exceden la permanencia descrita del coloide.","Sobreestima la permanencia del cristaloide.","Invierte ambas vidas medias.","Correcta: minutos para el cristaloide y horas para el coloide."]},{"c":8,"t":"Tonicidad de los cristaloides","q":"¿Cuál de las siguientes soluciones es hipotónica?","o":["Glucosa al 5%","Glucosa al 5% en NaCl","Salina fisiológica","Lactato de Ringer"],"a":0,"e":"La glucosa al 5% es hipotónica, con 253 mOsm/L y 50 g/L de glucosa. La salina fisiológica es isotónica con 308 mOsm/L, 154 de sodio y 154 de cloro; el lactato de Ringer es isotónico con 273 mOsm/L, 130 de sodio, 109 de cloro, 4 de potasio, 3 de calcio y 28 de lactato; y la glucosa al 5% en cloruro de sodio es hipertónica con 432 mOsm/L.","w":["Correcta: 253 mOsm/L la sitúan por debajo de la osmolaridad plasmática.","Esa mezcla es hipertónica, con 432 mOsm/L.","La salina fisiológica es isotónica, con 308 mOsm/L.","El lactato de Ringer es isotónico, con 273 mOsm/L."]},{"c":8,"t":"Composición del lactato de Ringer","q":"¿Cuánto lactato aporta el lactato de Ringer?","o":["50 mEq/L","28 mEq/L","109 mEq/L","4 mEq/L"],"a":1,"e":"El lactato de Ringer es isotónico, con 273 mOsm/L, y aporta 130 mEq de sodio, 109 de cloro, 4 de potasio, 3 de calcio y 28 de lactato. Es una de las soluciones más equilibradas frente a la salina fisiológica, que aporta 154 de sodio y 154 de cloro sin otros electrolitos ni buffer.","w":["No es la cifra descrita para ninguno de sus componentes.","Correcta: 28 mEq/L de lactato como amortiguador.","Ciento nueve mEq/L corresponde al cloro.","Cuatro mEq/L corresponde al potasio."]},{"c":8,"t":"Mecanismo de los coloides","q":"¿Por qué los coloides permanecen en el espacio intravascular?","o":["Porque se unen al endotelio capilar","Porque bloquean la filtración glomerular","Mantienen la presión oncótica del plasma","Porque son hipertónicos respecto al plasma"],"a":2,"e":"Los coloides tienen alto peso molecular, con proteínas, polímeros grandes y glucosa, de modo que mantienen la presión oncótica coloidal del plasma y permanecen intravasculares. Contienen albúmina, polímeros sintéticos de glucosa y almidones, tienen vida media de 3 a 6 horas y se indican en reanimación junto a los cristaloides una vez que estos superan los 3 a 4 litros.","w":["No actúan uniéndose al endotelio.","No modifican la filtración glomerular como mecanismo.","Correcta: su tamaño retiene agua por presión oncótica.","No es un efecto de tonicidad sino de presión oncótica."]},{"c":8,"t":"Cálculo del déficit por ayuno","q":"Paciente con índice de mantenimiento de 75 ml/h y 8 horas de ayuno. ¿Cuál es su déficit?","o":["150 ml","375 ml","800 ml","600 ml"],"a":3,"e":"Las deficiencias preexistentes por ayuno se estiman multiplicando el índice normal de mantenimiento por la duración del ayuno: 75 por 8 igual a 600 ml, que es el ejemplo literal del documento. El tratamiento preoperatorio con líquidos incluye el reemplazo de pérdidas normales, las deficiencias persistentes y las pérdidas por la herida quirúrgica; otras pérdidas son la evaporación, el tercer espacio y el trauma tisular.","w":["Muy por debajo del déficit acumulado en 8 horas.","Ese resultado no se obtiene con los datos del enunciado.","Sobreestima el producto de 75 por 8.","Correcta: 75 multiplicado por 8 da 600 ml de déficit."]},{"c":8,"t":"Otras pérdidas intraoperatorias","q":"¿De qué depende la pérdida por evaporación durante la cirugía?","o":["Del tamaño de la herida quirúrgica","Del peso del paciente","De la temperatura corporal central","De la duración del ayuno previo"],"a":0,"e":"Las otras pérdidas intraoperatorias son la evaporación, proporcional al tamaño de la herida quirúrgica, la redistribución interna hacia el tercer espacio y el trauma tisular. Junto con el reemplazo de las pérdidas normales, las deficiencias persistentes por ayuno y las pérdidas por la herida, componen el tratamiento preoperatorio e intraoperatorio con líquidos.","w":["Correcta: cuanto mayor es la superficie expuesta, mayor es la evaporación.","El peso determina el índice de mantenimiento.","La temperatura influye, pero el factor descrito es el tamaño de la herida.","El ayuno determina el déficit previo, no la evaporación."]},{"c":8,"t":"Donante universal","q":"¿Qué grupo sanguíneo es donante universal?","o":["O positivo","O negativo","A negativo","AB positivo"],"a":1,"e":"En el sistema ABO, el grupo O negativo carece de antígenos A y B en el eritrocito y del antígeno D, por lo que puede donar a todos: es el donante universal. El AB positivo no tiene anticuerpos anti-A ni anti-B en el plasma y expresa el antígeno D, por lo que puede recibir de todos: es el receptor universal.","w":["El O positivo expresa el antígeno D y no es donante universal.","Correcta: sin antígenos A, B ni D puede donar a cualquier receptor.","El A negativo solo puede donar a receptores A y AB.","El AB positivo es el receptor universal, no el donante."]},{"c":8,"t":"Anticuerpos del grupo A","q":"¿Qué anticuerpos tiene en el plasma un paciente del grupo A?","o":["Carece de anticuerpos","Anti-A y anti-B","Anti-B","Anti-A"],"a":2,"e":"En el sistema ABO cada grupo tiene en el plasma los anticuerpos contra el antígeno que no posee: el grupo A tiene antígeno A y anticuerpos anti-B; el grupo B tiene antígeno B y anti-A; el AB tiene ambos antígenos y ningún anticuerpo, de ahí que sea receptor universal; y el O no tiene antígenos y sí anti-A y anti-B, de ahí que sea donante universal.","w":["El grupo sin anticuerpos plasmáticos es el AB.","Tener ambos anticuerpos corresponde al grupo O.","Correcta: el grupo A produce anticuerpos contra el antígeno que le falta.","No se producen anticuerpos contra el propio antígeno."]},{"c":8,"t":"Definición de ácido","q":"Según Brønsted-Lowry, ¿qué es un ácido?","o":["Una especie que capta electrones","Un receptor de protones","Un compuesto que produce hidroxilos","Un donador de protones"],"a":3,"e":"Según Brønsted-Lowry, el ácido es la especie química que actúa como donador de protones y la base la que actúa como receptor de protones. Según Arrhenius, el ácido contiene hidrógeno y reacciona con agua formando iones hidrógeno, y la base produce iones hidroxilo en agua. Un buffer es una solución con ácido débil más base conjugada, o base débil más ácido conjugado.","w":["Captar electrones corresponde a la definición de Lewis.","Recibir protones define a la base.","Producir hidroxilos define a la base de Arrhenius.","Correcta: donar protones define al ácido en Brønsted-Lowry."]},{"c":8,"t":"Valores normales del equilibrio ácido-base","q":"¿Cuál es el valor normal de bicarbonato plasmático?","o":["24 mEq/L","40 mEq/L","7,4 mEq/L","12 mEq/L"],"a":0,"e":"Los valores normales son pH de 7,4, concentración de hidrogeniones de 40 nEq/L, PCO2 de 40 mmHg y bicarbonato de 24 mEq/L. Conviene recordar que el 40 se repite en la PCO2 y en los nanoequivalentes de hidrógeno, mientras el bicarbonato es 24. Esos valores son la referencia para clasificar los cuatro trastornos ácido-base.","w":["Correcta: 24 mEq/L es el bicarbonato normal.","Cuarenta corresponde a la PCO2 en mmHg y a los hidrogeniones en nEq/L.","El 7,4 es el pH, no el bicarbonato.","Un bicarbonato de 12 indica acidosis metabólica."]},{"c":8,"t":"Interpretación gasométrica","q":"Paciente con pH 7,28, PaCO2 58 mmHg y bicarbonato 25 mEq/L. ¿Qué trastorno tiene?","o":["Alcalosis metabólica","Acidosis respiratoria","Acidosis metabólica","Alcalosis respiratoria"],"a":1,"e":"En la acidosis respiratoria el trastorno primario es el aumento de la PaCO2, que dirige la reacción hacia la derecha, aumenta los hidrogeniones y baja el pH arterial: aquí el pH está bajo con PaCO2 elevada y bicarbonato prácticamente normal, lo que indica un cuadro respiratorio agudo. La forma aguda compensa a las 6-12 horas y la crónica a las 12-24, sin alcanzar su nivel hasta los 3-5 días.","w":["En la alcalosis metabólica el bicarbonato estaría elevado.","Correcta: pH bajo con PaCO2 alta y bicarbonato normal.","En la acidosis metabólica el bicarbonato estaría descendido.","En la alcalosis respiratoria el pH sería alto y la PaCO2 baja."]},{"c":8,"t":"Compensación de la acidosis respiratoria","q":"¿En cuánto tiempo compensa una acidosis respiratoria aguda?","o":["En 3 a 5 días","En 12 a 24 horas","En 6 a 12 horas","En 30 minutos"],"a":2,"e":"En la acidosis respiratoria aguda la compensación ocurre a las 6-12 horas. En la crónica, la compensación empieza a las 12-24 horas pero no alcanza su nivel hasta los 3-5 días, porque depende de la reabsorción renal de bicarbonato, que es un mecanismo lento comparado con el ajuste ventilatorio.","w":["Ese plazo corresponde a la compensación completa de la forma crónica.","Ese es el inicio de la compensación en la forma crónica.","Correcta: la forma aguda compensa en 6 a 12 horas.","La compensación renal no es tan rápida."]},{"c":8,"t":"Causas de acidosis metabólica","q":"¿Cuál de las siguientes NO es causa de acidosis metabólica?","o":["Dilución rápida del extracelular","Consumo por ácido fuerte no volátil","Pérdida digestiva de bicarbonato","Exceso de actividad mineralocorticoide"],"a":3,"e":"La acidosis metabólica es un descenso primario del bicarbonato, y sus causas son el consumo por un ácido fuerte no volátil, la pérdida renal o digestiva de bicarbonato y la dilución rápida del líquido extracelular con líquido sin bicarbonato. El exceso de actividad mineralocorticoide, en cambio, causa alcalosis metabólica resistente al cloruro.","w":["La dilución con líquido sin bicarbonato figura entre las causas.","El consumo por ácido fuerte es una de las causas descritas.","La pérdida digestiva de bicarbonato sí acidifica.","Correcta: produce alcalosis metabólica resistente al cloruro."]},{"c":8,"t":"Alcalosis respiratoria","q":"En la alcalosis respiratoria, ¿cuánto baja el bicarbonato por cada 10 mmHg de descenso agudo de la PaCO2?","o":["2 mEq/L","0,2 mEq/L","10 mEq/L","5 mEq/L"],"a":0,"e":"La alcalosis respiratoria es un descenso primario del CO2 por ventilación alveolar inadecuadamente aumentada respecto a la producción de CO2. El bicarbonato plasmático suele disminuir 2 mEq/L por cada 10 mmHg de reducción aguda de la PaCO2 por debajo de 40. La alcalosis metabólica, en cambio, es un aumento primario del bicarbonato.","w":["Correcta: 2 mEq/L por cada 10 mmHg de caída aguda de la PaCO2.","Infravalora el ajuste del bicarbonato.","Sobreestima mucho el ajuste esperado.","No es la proporción descrita en el tema."]},{"c":8,"t":"Alcalosis metabólica sensible al cloruro","q":"Paciente con vómitos repetidos y alcalosis metabólica. ¿De qué tipo se trata y por qué?","o":["Resistente al cloruro, por exceso mineralocorticoide","Sensible al cloruro, por déficit de cloruro de sodio","Sensible al cloruro, por hiperventilación asociada","Resistente al cloruro, por pérdida de potasio"],"a":1,"e":"La alcalosis metabólica es un aumento primario del bicarbonato y se divide en sensible al cloruro, secundaria a déficit de cloruro de sodio o reducción del líquido extracelular, como ocurre en el vómito, y resistente al cloruro, secundaria a exceso de actividad mineralocorticoide. La distinción tiene consecuencia terapéutica: la sensible responde a la reposición de cloruro y volumen.","w":["El exceso mineralocorticoide da la forma resistente al cloruro.","Correcta: el vómito produce la forma sensible al cloruro.","La hiperventilación produce alcalosis respiratoria, no metabólica.","La pérdida de potasio acompaña al cuadro, pero no lo clasifica."]},{"c":9,"t":"Definición de dolor","q":"¿Cuál de los siguientes elementos forma parte de la definición de dolor?","o":["La demostración de lesión tisular","La duración superior a 6 meses","El componente emocional","La respuesta a opioides"],"a":2,"e":"El dolor es una experiencia sensorial y emocional desagradable, asociada a un daño tisular real o potencial. Los dos elementos importan: el componente emocional, que explica por qué la escala visual analógica la decide el paciente y no el médico, y el carácter potencial del daño, que permite hablar de dolor sin lesión demostrable, como en el dolor neuropático.","w":["El daño puede ser potencial, no necesariamente demostrado.","La duración clasifica el dolor en agudo o crónico, no lo define.","Correcta: el dolor es sensorial y emocional por definición.","La respuesta al tratamiento no define el dolor."]},{"c":9,"t":"Alodinia","q":"Paciente en quien el simple roce de la sábana produce dolor. ¿Cómo se llama ese fenómeno?","o":["Hiperalgesia","Hiperestesia","Disestesia","Alodinia"],"a":3,"e":"La alodinia es cuando algo que normalmente no duele comienza a doler, como el roce de una sábana. La hiperalgesia es cuando un estímulo que ya era doloroso duele mucho más de lo normal, la hiperestesia es un aumento de la sensibilidad, no una reducción, y la disestesia es una sensación anormal y desagradable, espontánea o provocada, como ardor o electricidad incómoda.","w":["La hiperalgesia amplifica un estímulo que ya dolía.","La hiperestesia es aumento de sensibilidad en general.","La disestesia es una sensación desagradable, no necesariamente por roce.","Correcta: un estímulo normalmente indoloro se vuelve doloroso."]},{"c":9,"t":"Hiperalgesia","q":"¿Qué define a la hiperalgesia?","o":["Un estímulo doloroso duele mucho más de lo normal","Un estímulo no doloroso produce dolor","No se percibe sensación alguna","Se percibe menos dolor de lo esperado"],"a":0,"e":"La hiperalgesia ocurre cuando un estímulo que ya era doloroso duele mucho más de lo normal. La alodinia es que algo que normalmente no duele comience a doler; la hipoalgesia consiste en una menor respuesta al dolor; y la anestesia implica no percibir ninguna sensación, ni dolor, ni tacto, ni temperatura.","w":["Correcta: amplificación de la respuesta a un estímulo ya nociceptivo.","Esa es la definición de alodinia.","No percibir ninguna sensación es anestesia.","Percibir menos dolor es hipoalgesia."]},{"c":9,"t":"Anestesia dolorosa","q":"Paciente que refiere dolor en una zona que está adormecida. ¿Cómo se denomina?","o":["Neuralgia","Anestesia dolorosa","Parestesia","Disestesia"],"a":1,"e":"La anestesia dolorosa es cuando duele una zona que está anestesiada o adormecida, un fenómeno paradójico propio del dolor neuropático. La disestesia es una sensación anormal y desagradable como ardor; la neuralgia es dolor en el territorio de un nervio; y la parestesia es una sensación anormal sin estímulo aparente, usualmente no dolorosa, como hormigueo.","w":["La neuralgia sigue el territorio de un nervio, con sensibilidad conservada.","Correcta: coexisten la pérdida de sensibilidad y el dolor en la misma zona.","La parestesia suele ser indolora.","La disestesia no implica que la zona esté anestesiada."]},{"c":9,"t":"Parestesia y disestesia","q":"Relacione la disestesia con la parestesia según su carácter doloroso:","o":["Disestesia dolorosa en territorio nervioso; parestesia indolora sin estímulo","Disestesia indolora; parestesia desagradable como ardor o electricidad","Disestesia desagradable; parestesia habitualmente indolora","Disestesia por estímulo leve; parestesia por estímulo doloroso previo"],"a":2,"e":"La disestesia es una sensación anormal y desagradable, espontánea o provocada, como ardor o electricidad incómoda; la parestesia es una sensación anormal sin estímulo aparente, usualmente no dolorosa, como el hormigueo o los pins and needles. La neuralgia es dolor en el territorio de un nervio y la radiculopatía una alteración de una raíz que puede causar dolor irradiado, déficit sensitivo o debilidad.","w":["El dolor en territorio nervioso es la neuralgia.","Invierte ambos términos.","Correcta: la disestesia molesta y la parestesia habitualmente no duele.","No es el criterio que las separa."]},{"c":9,"t":"Radiculopatía","q":"¿Qué caracteriza a la radiculopatía?","o":["Aumento generalizado de la sensibilidad","Sensación de hormigueo sin estímulo aparente","Dolor en el territorio de un nervio periférico","Alteración de una raíz con dolor irradiado o déficit"],"a":3,"e":"La radiculopatía es una alteración de una raíz nerviosa que puede causar dolor irradiado, déficit sensitivo o debilidad. Se distingue de la neuralgia, que es dolor en el territorio de un nervio; de la parestesia, sensación anormal sin estímulo aparente y usualmente indolora; y de la hiperestesia, que es aumento de la sensibilidad.","w":["El aumento de sensibilidad es la hiperestesia.","El hormigueo sin estímulo es la parestesia.","El dolor en territorio de un nervio es la neuralgia.","Correcta: el compromiso es radicular, con dolor irradiado y déficit."]},{"c":9,"t":"Clasificación fisiopatológica","q":"Relacione el dolor nociceptivo con el neuropático según su origen:","o":["Nociceptivo por nociceptores periféricos; neuropático por lesión neural","Nociceptivo por nociceptores; neuropático de origen psicógeno puro","Nociceptivo visceral puro; neuropático por sobrecarga muscular crónica","Nociceptivo por lesión neural adquirida; neuropático por nociceptores periféricos"],"a":0,"e":"Según la fisiopatología, el dolor es nociceptivo cuando hay activación o sensibilización de nociceptores periféricos, y neuropático cuando hay lesión o alteración adquirida de estructuras neurales periféricas o centrales. Según la etiología se clasifica en oncológico o postoperatorio, y según la región en cefalea, lumbalgia y otras.","w":["Correcta: nociceptores en el nociceptivo y lesión neural en el neuropático.","El dolor neuropático tiene base orgánica en el sistema nervioso.","El nociceptivo puede ser somático o visceral, no solo visceral.","Invierte ambas categorías."]},{"c":9,"t":"Procesos del dolor agudo","q":"Ordene los cuatro procesos que involucra el dolor agudo:","o":["Modulación, percepción, transducción, transmisión","Transducción, transmisión, modulación, percepción","Percepción, modulación, transmisión, transducción","Transmisión, transducción, percepción, modulación"],"a":1,"e":"El dolor agudo está causado por estímulos dolorosos debidos a lesión, enfermedad o función anormal de músculos o vísceras, permite localizar, detectar y limitar el daño tisular, e involucra cuatro procesos en este orden: transducción, transmisión, modulación y percepción. El dolor crónico persiste más allá del tiempo razonable de curación, con duración de 1 a 6 meses.","w":["La modulación ocurre antes de la percepción, no al inicio.","Correcta: del estímulo periférico a la experiencia consciente.","Invierte por completo la secuencia.","La transducción precede a la transmisión."]},{"c":9,"t":"Dolor somático profundo","q":"¿Cómo es el dolor somático profundo?","o":["Punzante y bien localizado","Quemante y superficial","Sordo y mal localizado","Cólico e intermitente"],"a":2,"e":"El dolor somático superficial se genera en piel y tejidos, está bien localizado y es punzante y agudo; el profundo nace de tendones, músculos, articulaciones y hueso, es sordo y no está bien localizado. El dolor visceral tiene cuatro subtipos: visceral verdadero localizado, parietal localizado, visceral referido y parietal referido.","w":["Punzante y bien localizado es el somático superficial.","El dolor quemante superficial orienta a compromiso neuropático.","Correcta: origen en tendón, músculo, articulación y hueso, mal localizado.","El carácter cólico es propio del dolor visceral."]},{"c":9,"t":"Dermatoma del ombligo","q":"¿Qué dermatoma corresponde al ombligo?","o":["T6","T4","L1","T10"],"a":3,"e":"El ombligo corresponde al dermatoma T10, y el anestesiólogo prueba el nivel alcanzado por un bloqueo pinchando o tocando con hielo o aguja de forma seriada. El nivel importa: en obstetricia, la mortalidad de la anestesia regional se debe a bloqueo simpático excesivo, es decir un bloqueo alto por encima de T4, o a toxicidad de anestésicos locales.","w":["T6 se sitúa por encima del nivel umbilical.","T4 corresponde aproximadamente a la línea intermamilar.","L1 queda por debajo del ombligo.","Correcta: T10 es la referencia umbilical."]},{"c":9,"t":"Anestesia geriátrica","q":"¿Cuál es el cambio farmacológico principal en el paciente geriátrico?","o":["Reducción del requerimiento anestésico","Mayor velocidad de eliminación renal","Aumento del requerimiento anestésico","Menor unión de fármacos a proteínas"],"a":0,"e":"El cambio farmacológico principal en geriatría es la reducción del requerimiento anestésico, y la regla es start low, go slow: empezar bajo y avanzar despacio. La excreción de fármacos está disminuida, lo que prolonga el efecto de relajantes, opioides y benzodiacepinas, de modo que la dosis y el intervalo deben ajustarse a la baja.","w":["Correcta: el anciano necesita menos anestésico para el mismo efecto.","La excreción está disminuida, no acelerada.","El requerimiento disminuye con la edad, no aumenta.","La unión a proteínas no es el cambio principal descrito."]},{"c":9,"t":"Riesgos del anciano","q":"¿Por qué el paciente geriátrico desatura más rápido en apnea?","o":["Por anemia crónica asociada","Por menor capacidad funcional residual","Por mayor consumo basal de oxígeno","Por mayor espacio muerto anatómico"],"a":1,"e":"En geriatría hay que cuidar la obstrucción de la vía aérea porque la menor capacidad funcional residual hace que el paciente desature más rápido, lo que acorta el margen que da la preoxigenación. También hay que vigilar tanto la sobrecarga como el déficit de volumen, porque el corazón hipertrófico tolera mal ambos extremos, y recordar que la excreción de fármacos está disminuida.","w":["La anemia no es el mecanismo descrito en el tema.","Correcta: menos reserva alveolar equivale a menos tiempo de apnea segura.","El consumo basal de oxígeno no aumenta con la edad de forma relevante.","El espacio muerto no es el factor señalado."]},{"c":9,"t":"Volumen en el anciano","q":"¿Por qué el corazón hipertrófico del anciano tolera mal la sobrecarga y el déficit de volumen?","o":["Porque el retorno venoso está abolido","Porque la frecuencia cardiaca es fija","Su curva de función es estrecha en ambos extremos","Porque coexiste con insuficiencia renal"],"a":2,"e":"La perla clínica de la anestesia geriátrica es tener cuidado con la sobrecarga y el déficit de volumen, porque el corazón hipertrófico tolera mal ambos extremos: con poco volumen no llena adecuadamente y con exceso se congestiona. A eso se suman la menor capacidad funcional residual, que acelera la desaturación, y la excreción disminuida de fármacos.","w":["El retorno venoso está conservado, solo peor tolerado en sus extremos.","La frecuencia cardiaca no está fija en el anciano.","Correcta: el margen entre hipovolemia y congestión es estrecho.","La insuficiencia renal puede coexistir, pero no es la razón descrita."]},{"c":9,"t":"Principio inviolable en obstetricia","q":"En una emergencia obstétrica, ¿a quién se prioriza?","o":["Al feto, por su vulnerabilidad","A quien la familia decida en el momento","A quien tenga mayor probabilidad de sobrevivir","A la madre, aunque haya expresado lo contrario"],"a":3,"e":"El principio inviolable número uno es siempre salvar a la madre, incluso si la paciente expresó preferencia contraria antes del procedimiento: el feto es la segunda prioridad, y salvando a la madre casi siempre se salva también al producto. La mortalidad materna mide el desarrollo de un país, y la directamente atribuible a la anestesia es mínima, menor del 1%.","w":["El feto es la segunda prioridad según el principio descrito.","La decisión no se delega a la familia en ese momento.","No se decide por probabilidad: la prioridad está establecida.","Correcta: la madre es la prioridad, y salvándola se salva al producto."]},{"c":9,"t":"Causas de muerte materna","q":"¿Cuál es la principal causa real de muerte materna?","o":["La hemorragia","El evento tromboembólico","Los trastornos hipertensivos","La sepsis"],"a":0,"e":"Las verdaderas causas de muerte materna son la hemorragia, que es la principal, los trastornos hipertensivos del embarazo como preeclampsia, eclampsia y síndrome HELLP, la sepsis y los eventos tromboembólicos. La mortalidad materna directamente atribuible a la anestesia es mínima, menor del 1%, y la mortalidad materna se usa como parámetro que mide el desarrollo de un país.","w":["Correcta: la hemorragia encabeza la lista de causas.","El tromboembolismo cierra la lista de causas descritas.","Los trastornos hipertensivos son la segunda causa.","La sepsis figura después de los trastornos hipertensivos."]},{"c":9,"t":"Técnica de elección en cesárea","q":"¿Por qué se prefiere la anestesia regional sobre la general para la cesárea?","o":["Evita el paso placentario de fármacos","Tiene menor morbimortalidad materna","Permite prescindir del ayuno","Elimina el riesgo de hipotensión"],"a":1,"e":"Para cesárea siempre se prefiere la anestesia regional sobre la general porque tiene menor morbimortalidad materna. La general se reserva para indicaciones específicas: desprendimiento prematuro de placenta con sangrado activo e hipovolemia, prolapso de cordón umbilical, síndrome de HELLP con riesgo de convulsión y placenta previa oclusiva total con sangrado.","w":["Los anestésicos locales también atraviesan la placenta.","Correcta: la menor morbimortalidad materna es la razón principal.","Todo embarazo se considera estómago lleno, con cualquier técnica.","La hipotensión por bloqueo simpático es un riesgo propio de la regional."]},{"c":9,"t":"Indicación de anestesia general por urgencia","q":"Prolapso de cordón umbilical con necesidad de extracción inmediata. ¿Qué técnica corresponde y por qué?","o":["General, porque la paciente está hipovolémica","Regional, porque tiene menor morbimortalidad","General, porque no hay tiempo para instalar un bloqueo","Regional, porque permite catéter continuo"],"a":2,"e":"La anestesia general en la embarazada se reserva para cuatro escenarios: el desprendimiento prematuro de placenta, porque con sangrado activo la paciente entra en hipovolemia, contraindicación absoluta del bloqueo; el prolapso de cordón, porque hay que extraer al bebé en segundos y no hay tiempo de instalar un bloqueo; el síndrome de HELLP, por el riesgo de convulsión; y la placenta previa oclusiva total con sangrado.","w":["La hipovolemia es el motivo en el desprendimiento de placenta.","La regional es preferible en general, pero aquí no hay tiempo.","Correcta: el factor decisivo aquí es el tiempo, medido en segundos.","El catéter continuo es una ventaja para el parto, no para esta urgencia."]},{"c":9,"t":"Indicación por hipovolemia","q":"¿Cuál de las siguientes indicaciones de anestesia general en obstetricia se justifica por hipovolemia?","o":["Síndrome de HELLP","Presentación podálica","Prolapso de cordón umbilical","Desprendimiento prematuro de placenta"],"a":3,"e":"El desprendimiento prematuro de placenta con sangrado activo lleva a la paciente a hipovolemia, que es contraindicación absoluta para el bloqueo regional, y por eso obliga a anestesia general. El prolapso de cordón se justifica por falta de tiempo, el síndrome de HELLP por el riesgo de convulsión y eclampsia, y la placenta previa oclusiva total por el sangrado.","w":["El HELLP se justifica por el riesgo de convulsión.","La presentación podálica no figura entre las indicaciones descritas.","El prolapso de cordón se decide por la urgencia temporal.","Correcta: el sangrado activo produce la hipovolemia que contraindica el bloqueo."]},{"c":9,"t":"Mortalidad de la anestesia general en obstetricia","q":"¿A qué se asocia casi siempre la mortalidad de la anestesia general en obstetricia?","o":["A no poder acceder o ventilar la vía aérea","A la toxicidad del los anestésicos locales","Al bloqueo simpático por encima de T4","A la hipertermia maligna intraoperatoria"],"a":0,"e":"La morta

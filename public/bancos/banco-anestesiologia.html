<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capnograma · Banco de Anestesiología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0B1015; --panel:#141C24; --panel2:#1C2732;
  --line:#26333F; --line2:#3B4E5E;
  --ink:#EAF2F6; --muted:#8FA3B0;
  --amber:#3FD0C9; --bone:#F0B429;
  --ok:#4FD18B; --bad:#FF6B7F;
  --disp:'Sora',system-ui,sans-serif;
  --text:'Rubik',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(63,208,201,.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(240,180,41,.06), transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 90px}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(21,10,18,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:940px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .seal{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line2)}
.brand b{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;display:block;margin-top:-2px}
.hud{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--muted);white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}
.chip.g b{color:var(--ok)} .chip.r b{color:var(--bad)} .chip.a b{color:var(--amber)}
.suture{display:flex;gap:2px;height:4px;background:var(--panel);padding:0 18px 0}
.suture i{flex:1;background:var(--line);border-radius:1px;transition:background .2s}
.suture i.ok{background:var(--ok)} .suture i.bad{background:var(--bad)}
.suture i.cur{background:var(--amber)}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:46px 0 26px}
.crest img{width:74px;height:74px;border-radius:50%;box-shadow:0 0 0 2px var(--line2),0 10px 34px rgba(0,0,0,.55)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,6vw,46px);margin:16px 0 4px;letter-spacing:-.5px}
.hero .sub{font-family:var(--mono);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--amber)}
.hero p{color:var(--muted);max-width:560px;margin:14px auto 0;font-size:15px}
.trace{display:block;width:min(320px,80%);height:34px;margin:20px auto 0;opacity:.9}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:26px 0}

/* ---------- CARDS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mode{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--ink);cursor:pointer;font-family:var(--text);font-size:14px;
  transition:border-color .15s,transform .15s,background .15s;
}
.mode:hover{border-color:var(--line2);transform:translateY(-1px)}
.mode.on{border-color:var(--amber);background:#173034}
.mode b{display:block;font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:12.5px}
.mode:disabled{opacity:.38;cursor:not-allowed;transform:none}

.subj{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.subj:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--amber))}
.subj:first-child{margin-top:0}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:7px}
.cl{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13.5px;transition:border-color .15s;
}
.cl:hover{border-color:var(--line2)}
.cl.on{border-color:var(--amber);background:#173034}
.cl .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);flex:none;position:relative}
.cl.on .box{background:var(--amber);border-color:var(--amber)}
.cl.on .box:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--void);border-width:0 2px 2px 0;transform:rotate(43deg)}
.cl .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.pill{
  font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);transition:all .15s;
}
.pill:hover{border-color:var(--line2)}
.pill.on{background:var(--bone);border-color:var(--bone);color:var(--void);font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

.launch{
  position:sticky;bottom:16px;width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;
  background:var(--amber);color:#04201F;font-family:var(--disp);font-weight:800;font-size:16px;
  letter-spacing:.3px;box-shadow:0 12px 34px rgba(0,0,0,.5);margin-top:6px;
}
.launch:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed;box-shadow:none}

/* ---------- PREGUNTA ---------- */
.field{padding-top:22px}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.tag.s{color:var(--void);font-weight:600}
.count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.stem{font-family:var(--disp);font-weight:600;font-size:clamp(18px,2.6vw,22px);line-height:1.42;margin:0 0 18px}
.answers{display:flex;flex-direction:column;gap:9px}
.ansrow{display:flex;flex-direction:column}
.ans{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;
  color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s;
}
.ans:hover:not(:disabled){border-color:var(--line2);transform:translateX(2px)}
.ans:disabled{cursor:default}
.ans .key{
  font-family:var(--mono);font-size:11px;width:21px;height:21px;flex:none;border-radius:6px;
  display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);margin-top:1px;
}
.ans.good{border-color:var(--ok);background:rgba(88,192,138,.10)}
.ans.good .key{background:var(--ok);color:#052014;border-color:var(--ok);font-weight:600}
.ans.wrong{border-color:var(--bad);background:rgba(255,111,139,.08)}
.ans.wrong .key{background:var(--bad);color:#210408;border-color:var(--bad);font-weight:600}
.note{
  font-size:13.5px;color:var(--muted);padding:8px 14px 2px 46px;line-height:1.5;
  animation:fade .22s ease both;
}
.note.good{color:#9ce3c1} .note.wrong{color:#f3b3bd}
.concept{
  margin-top:18px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--amber);
  border-radius:11px;padding:15px 16px;animation:fade .25s ease both;
}
.concept h3{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--amber);margin:0 0 7px}
.concept p{margin:0;font-size:14.5px;line-height:1.62;color:#dbe7ee}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.navrow{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:13px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--ink);font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#04201F;font-weight:800}
.hint{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--line2);margin-top:12px;letter-spacing:.5px}

/* ---------- RESULTADOS ---------- */
.big{font-family:var(--disp);font-weight:800;font-size:clamp(52px,13vw,86px);line-height:1;
  text-align:center;margin:8px 0 2px}
.big small{font-size:.32em;color:var(--muted);font-weight:600}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0}
.res{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center}
.res b{display:block;font-family:var(--disp);font-weight:800;font-size:24px}
.res span{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:10px}
.bar .lab span{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
.bar .track{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--amber),var(--ok));transition:width .5s}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .ans:hover:not(:disabled),.mode:hover{transform:none}
}
@media(max-width:560px){
  .brand span{display:none}
  .hud .chip{font-size:10px;padding:3px 7px}
  .note{padding-left:16px}
}
</style>
</head>

<script>
const Q = [{"c":1,"t":"Definición de anestesiología","q":"La anestesiología se define como la ausencia de toda sensibilidad táctil y dolorosa. ¿Qué atributo forma parte esencial de esa definición?","o":["Que sea reversible","Que sea de carácter total","Que abola los reflejos","Que requiera intubación"],"a":0,"e":"La anestesiología es la ausencia parcial o total, de manera reversible, de toda sensibilidad táctil y dolorosa: cuando la ausencia es parcial se habla de anestesia regional y cuando es total, de anestesia general. La reversibilidad es parte de la definición, y es lo que separa a la anestesia de una lesión neurológica. La mortalidad relacionada con la anestesia es menor del 1 al 2%.","w":["Correcta: sin reversibilidad no se habla de anestesia sino de daño neurológico.","La ausencia puede ser parcial, que es la anestesia regional.","El tiopental, por ejemplo, no suprime los reflejos de vía aérea superior.","La intubación es un recurso de manejo de la vía aérea, no parte de la definición."]},{"c":1,"t":"Mortalidad perioperatoria","q":"En cirugía no cardiaca, ¿hasta qué porcentaje puede llegar la mortalidad postoperatoria de causa cardiovascular?","o":["Del 1 al 2%","Del 25 al 50%","Del 70 al 90%","Del 5 al 8%"],"a":1,"e":"La mortalidad relacionada directamente con la anestesia es menor del 1 al 2%. En cambio, en cirugía no cardiaca la mortalidad postoperatoria por causa cardiovascular puede llegar al 25-50%, y las complicaciones cardiovasculares representan del 20 al 50% de las muertes postoperatorias. Esa desproporción es la que justifica que el profesor exija evaluación cardiovascular en todo paciente electivo sin importar la edad.","w":["Ese es el porcentaje de mortalidad atribuible a la anestesia en sí.","Correcta: es la cifra que justifica la evaluación cardiovascular universal.","Ninguna serie atribuye esa mortalidad a la cirugía no cardiaca.","Subestima el peso real de la causa cardiovascular en el postoperatorio."]},{"c":1,"t":"Regla del paciente electivo","q":"Llega a quirófano un paciente electivo sin evaluación preanestésica previa. ¿Cuál es la conducta correcta?","o":["Premedicar y evaluarlo mientras hace efecto","Pedir solo laboratorios y continuar","No administrar ningún fármaco hasta evaluarlo","Proceder si el paciente es joven y sano"],"a":2,"e":"La regla es no tocar ni administrar ningún fármaco a un paciente electivo sin evaluación preanestésica previa. El fundamento es que las complicaciones de la anestesia ocurren cuando hay desconocimiento del paciente o mala planeación del procedimiento. En el paciente sano y asintomático la evaluación incluye signos vitales, vía aérea, corazón, pulmón y aparato locomotor, y no se recomiendan laboratorios extra.","w":["Premedicar antes de evaluar invierte el orden y puede enmascarar hallazgos.","Los laboratorios extra no se recomiendan en el paciente sano y no sustituyen la evaluación.","Correcta: la evaluación precede a cualquier fármaco en cirugía electiva.","La juventud no exime de la evaluación, que hoy se exige sin importar la edad."]},{"c":1,"t":"Utilidad de la clasificación ASA","q":"¿Qué evalúa exactamente la clasificación ASA?","o":["La capacidad funcional en METs","La dificultad de la intubación","La complejidad de la cirugía","El riesgo de la anestesia"],"a":3,"e":"La clasificación ASA de la Sociedad Americana de Anestesiología evalúa el riesgo de la anestesia, según el estado sistémico del paciente. No mide la complejidad quirúrgica, que se valora aparte como cirugía de bajo o alto riesgo; la dificultad de intubación se predice con Mallampati, la regla 3-3-2, Cormack-Lehane y el acrónimo LEMON; y la capacidad funcional se mide en METs.","w":["Los METs miden tolerancia al ejercicio, no riesgo anestésico global.","Para eso existen Mallampati, Cormack-Lehane y la regla 3-3-2.","La complejidad quirúrgica se clasifica de forma independiente al ASA.","Correcta: es una escala del riesgo anestésico basada en el estado del paciente."]},{"c":1,"t":"ASA en el paciente con angina inestable","q":"Paciente con angina inestable y un infarto hace 3 meses, programado para cirugía electiva. ¿Qué clase ASA le corresponde?","o":["ASA IV","ASA III","ASA II","ASA V"],"a":0,"e":"El ASA IV describe enfermedad sistémica grave e incapacitante que amenaza constantemente la vida, con riesgo de mortalidad cercano al 8%: insuficiencia cardiaca, respiratoria o renal descompensadas, angina inestable, miocarditis activa, infarto o evento cerebrovascular de menos de 6 meses, EPOC con oxígeno crónico, cetoacidosis y politraumatizado. La angina estable y el infarto antiguo, en cambio, son ASA III.","w":["Correcta: angina inestable e infarto de menos de 6 meses definen el ASA IV.","El ASA III incluye angina estable e infarto antiguo, no inestable ni reciente.","El ASA II es enfermedad leve controlada sin limitación funcional.","El ASA V es el moribundo con expectativa menor de 24 horas sin cirugía."]},{"c":1,"t":"ASA en la gestante sana","q":"Gestante de 26 años, sin patología alguna, programada para cesárea electiva. ¿Cómo se clasifica?","o":["ASA III","ASA II","ASA I con sufijo E","ASA I"],"a":1,"e":"El ASA I exige un paciente sano que además no sea neonato, ni anciano, ni gestante. La gestante sana entra en ASA II, junto con el neonato, la hipertensión y la diabetes controladas, la obesidad con IMC de 30 a 40 y el fumador; incluso un paciente sano pero ansioso por la cirugía pasa de ASA I a ASA II. El sufijo E se agrega solo si la cirugía es de emergencia, y aquí es electiva.","w":["El ASA III requiere enfermedad sistémica grave con limitación funcional.","Correcta: el embarazo por sí solo clasifica a la paciente como ASA II.","La E se reserva a la cirugía de emergencia, y esta cesárea es electiva.","El ASA I excluye por definición a la gestante, el neonato y el anciano."]},{"c":1,"t":"Ejemplos de ASA III","q":"Todos los siguientes son ejemplos de ASA III, EXCEPTO uno. ¿Cuál?","o":["Angina estable","Insuficiencia renal moderada","Miocarditis activa","EPOC"],"a":2,"e":"El ASA III agrupa enfermedad sistémica grave pero no incapacitante, con limitación funcional y mortalidad de alrededor del 1,2%: cardiopatía severa, diabetes e hipertensión no compensadas, insuficiencia renal moderada a severa, infarto antiguo, obesidad mayor de 40, angina estable, insuficiencia cardiaca o evento cerebrovascular de más de 6 meses y EPOC. La miocarditis activa pertenece al ASA IV, donde la enfermedad amenaza la vida de forma constante.","w":["La angina estable figura expresamente entre los ejemplos de ASA III.","La insuficiencia renal moderada a severa es un ejemplo clásico de ASA III.","Correcta: la miocarditis activa es ASA IV, no III.","El EPOC sin oxígeno crónico es ASA III; con oxígeno crónico pasa a IV."]},{"c":1,"t":"Mortalidad por clase ASA","q":"¿Cuál es el riesgo aproximado de mortalidad del ASA IV?","o":["25%","1,2%","0,1%","8%"],"a":3,"e":"El riesgo de mortalidad del ASA III es de alrededor del 1,2% y el del ASA IV cercano al 8%. Ese salto de casi siete veces entre dos clases contiguas es lo que hace tan relevante distinguir la enfermedad grave no incapacitante, con limitación funcional, de la enfermedad grave que amenaza la vida de forma constante.","w":["Se aproxima más a la mortalidad cardiovascular postoperatoria global.","El 1,2% corresponde al ASA III.","Una cifra tan baja no refleja una enfermedad que amenaza la vida.","Correcta: el ASA IV se asocia a una mortalidad aproximada del 8%."]},{"c":1,"t":"Alcance del consentimiento informado","q":"¿Por qué el consentimiento por escrito no evita una demanda?","o":["Solo acredita que el paciente conocía el riesgo","Porque el paciente puede revocarlo después","Porque no tiene validez legal si es genérico","Porque no lo firma también el anestesiólogo"],"a":0,"e":"El consentimiento consiste en proporcionar al paciente una explicación razonable de las opciones de tratamiento anestésico disponibles; de no hacerlo, el médico queda expuesto legalmente a una demanda. Pero el consentimiento no evita la demanda: lo que hace es dejar constancia de que el paciente conocía la posibilidad de la complicación. Es un documento de información, no un escudo legal.","w":["Correcta: documenta la información recibida, no impide la reclamación.","La revocabilidad existe, pero no es la razón por la que no evita la demanda.","El problema no es la validez del documento sino su alcance protector.","La firma del anestesiólogo no cambia el alcance legal del documento."]},{"c":1,"t":"Umbral de METs","q":"¿A partir de cuántos METs se considera aceptable la capacidad funcional para ir a cirugía sin más estudios?","o":["2 METs","4 METs","6 METs","10 METs"],"a":1,"e":"Los METs miden capacidad funcional y tolerancia al ejercicio. Con 4 METs o más y sin síntomas se procede a cirugía sin más estudios, sin importar la edad; por debajo de 4 METs la capacidad es baja y hay mayor riesgo de complicaciones perioperatorias, sobre todo cardiovasculares. La otra regla es que si la cirugía es de bajo riesgo se va directo a quirófano, sin importar los factores de riesgo del paciente.","w":["Dos METs describen una capacidad funcional muy limitada.","Correcta: 4 METs es el umbral que permite proceder sin estudios adicionales.","Exigir 6 METs dejaría fuera a pacientes que el libro considera aptos.","Diez METs corresponden a una capacidad funcional excelente."]},{"c":1,"t":"Paciente con buena capacidad funcional","q":"Hombre de 74 años, asintomático, sube dos pisos de escaleras sin detenerse. Va a cirugía electiva. ¿Qué corresponde hacer?","o":["Diferir hasta valoración cardiológica","Pedir ecocardiograma por la edad","Proceder a cirugía sin más estudios","Pedir prueba de esfuerzo antes"],"a":2,"e":"Si el paciente tiene buena capacidad funcional, 4 METs o más, y está asintomático, se procede a cirugía sin más estudios, sin importar la edad: subir dos pisos sin detenerse supera ese umbral. La edad por sí sola dejó de ser criterio para exigir estudios adicionales, aunque el profesor sí exige evaluación cardiovascular como parte de la valoración preanestésica de todo paciente electivo.","w":["Diferir la cirugía en este escenario retrasa sin beneficio.","La edad aislada no justifica estudios si la capacidad funcional es buena.","Correcta: capacidad funcional conservada y ausencia de síntomas permiten proceder.","La prueba de esfuerzo no aporta en un paciente que ya demuestra 4 METs."]},{"c":1,"t":"Cartílagos de la laringe","q":"¿Cuál de los siguientes cartílagos laríngeos es impar?","o":["Cuneiforme","Aritenoides","Corniculado","Cricoides"],"a":3,"e":"La laringe tiene 9 cartílagos: 3 impares, que ocupan la línea media y son el tiroides, el cricoides y el epiglótico, y 3 pares, que son el corniculado, el cuneiforme y el aritenoides. El punto focal del manejo de la vía aérea son los cartílagos, especialmente los impares, porque marcan la línea media, referencia imprescindible para cualquier abordaje.","w":["El cuneiforme también es par.","El aritenoides es par, uno a cada lado de la línea media.","El corniculado es uno de los tres cartílagos pares.","Correcta: el cricoides es impar, junto con el tiroides y el epiglótico."]},{"c":1,"t":"Inervación laríngea","q":"Relacione la rama interna del laríngeo superior con la rama externa según su función:","o":["Interna sensitiva; externa motora","Ambas puramente sensitivas","Ambas mixtas sensitivomotoras","Interna motora; externa sensitiva"],"a":0,"e":"La rama laríngea superior procede del nervio vago, décimo par craneal, y se divide en laríngeo interno, que es sensitivo, y laríngeo externo, que es motor. La inervación sensitiva de la vía aérea superior deriva toda de nervios craneales: la mucosa nasal anterior por ramas oftálmicas del quinto par y la posterior por la rama maxilar esfenopalatina. El bloqueo del laríngeo interno permite instrumentar la vía aérea sin reflejo.","w":["Correcta: interna sensitiva y externa motora, ambas del vago.","La rama externa aporta inervación motora, no sensitiva.","Cada rama tiene una función definida, no mixta.","Invierte las dos ramas del laríngeo superior."]},{"c":1,"t":"Músculos de la fonación","q":"¿Qué músculo abre las cuerdas vocales?","o":["Aritenoideo lateral","Cricoaritenoideo posterior","Tiroaritenoideo","Cricotiroideo"],"a":1,"e":"La regla mnemotécnica del tema es que la crica abre: los músculos cricoaritenoideos posteriores son los que abren las cuerdas vocales, mientras que los aritenoideos laterales las cierran. La denervación bilateral del vago deja las cuerdas flácidas en posición media, un efecto similar al que produce la succinilcolina, y es el fundamento de que la parálisis recurrencial bilateral aguda produzca estridor.","w":["El aritenoideo lateral cierra las cuerdas vocales.","Correcta: el cricoaritenoideo posterior es el único abductor de la glotis.","El tiroaritenoideo participa en la aducción, no en la apertura.","El cricotiroideo actúa tensando la cuerda vocal."]},{"c":1,"t":"Lesión recurrencial bilateral","q":"Paciente tiroidectomizado que en el postoperatorio inmediato presenta estridor y distrés respiratorio. ¿Qué lesión hay que sospechar?","o":["Laríngeo recurrente unilateral","Vago unilateral","Laríngeo recurrente bilateral aguda","Laríngeo superior unilateral"],"a":2,"e":"La tabla de lesiones nerviosas y voz es de alto rendimiento: el laríngeo superior unilateral da efectos mínimos y el bilateral ronquera con fatiga de la voz; el laríngeo recurrente unilateral da ronquera, el bilateral agudo estridor y distrés respiratorio, y el bilateral crónico afonía. La lesión del vago unilateral produce ronquera y la bilateral, afonía. El cuadro agudo bilateral es el único que constituye una emergencia de vía aérea.","w":["Una sola cuerda paralizada produce ronquera, no obstrucción.","El vago unilateral se manifiesta como ronquera.","Correcta: solo la forma bilateral aguda obstruye la glotis y da estridor.","La lesión del laríngeo superior unilateral cursa con efectos mínimos."]},{"c":1,"t":"Clasificación de Mallampati","q":"Relacione el Mallampati clase I con el clase IV según lo que se visualiza:","o":["Clase I: paladar blando y base de la úvula; clase IV: paladar blando con fauces visibles","Clase I: solo paladar duro; clase IV: paladar blando, fauces y pilares amigdalinos","Clase I: paladar blando con úvula completa; clase IV: solo la base de la úvula visible","Clase I: paladar blando, fauces, úvula y pilares; clase IV: solo paladar duro"],"a":3,"e":"El Mallampati predice la dificultad de intubación y se evalúa en sedestación, con apertura bucal máxima, sacando la lengua y sin fonación. La clase I permite ver paladar blando, fauces, úvula y pilares amigdalinos; la II paladar blando, fauces y úvula; la III paladar blando y base de la úvula; y la IV solo el paladar duro. Si ya se ve una clase III o IV hay que cambiar el plan anestésico de antemano.","w":["Esa descripción corresponde a las clases III y II respectivamente.","Invierte los extremos de la clasificación.","Ver solo la base de la úvula corresponde a la clase III.","Correcta: visibilidad total en la clase I y solo paladar duro en la IV."]},{"c":1,"t":"Regla del 3-3-2","q":"En la regla del 3-3-2, ¿qué distancia debe admitir dos dedos?","o":["Del hioides al cartílago tiroides","Del tiroides al esternón","Del mentón al hioides","La apertura interincisiva"],"a":0,"e":"La regla del 3-3-2 es una evaluación rápida de la vía aérea: 3 dedos de apertura bucal o distancia interincisivos, que corresponde a unos 4-5 cm; 3 dedos entre el mentón y el hioides; y 2 dedos entre el hioides y el cartílago tiroides. Complementa al Mallampati y al acrónimo LEMON, que agrupa aspecto externo, evaluación de ejes, Mallampati, obstrucción de la vía aérea y movilidad del cuello.","w":["Correcta: esa es la única de las tres medidas que se mide con dos dedos.","Esa distancia no forma parte de la regla.","La distancia mentón-hioides debe admitir tres dedos.","La apertura bucal debe admitir tres dedos."]},{"c":1,"t":"Cormack-Lehane grado III","q":"Durante la laringoscopia directa solo se observa la epiglotis. ¿Cómo se interpreta este hallazgo?","o":["Grado II, cierto grado de dificultad","Grado III, intubación muy difícil pero no imposible","Grado III, intubación imposible sin traqueostomía","Grado IV, requiere técnicas especiales"],"a":1,"e":"El Cormack-Lehane valora la apertura glótica en laringoscopia directa: grado I cuerdas visibles en su totalidad, intubación fácil; grado II cuerdas parcialmente visibles, con cierto grado de dificultad; grado III solo se observa la epiglotis, intubación muy difícil pero no imposible; y grado IV no se observa ni la epiglotis, con intubación posible solo mediante técnicas especiales.","w":["En el grado II se alcanzan a ver parcialmente las cuerdas.","Correcta: ver solo la epiglotis es grado III, difícil pero abordable.","El grado III no obliga a vía quirúrgica: sigue siendo intubable.","En el grado IV no se visualiza ni la epiglotis."]},{"c":1,"t":"Acrónimo LEMON","q":"En el acrónimo LEMON de predicción de intubación difícil, ¿qué evalúa la N?","o":["La permeabilidad nasal","El número de dientes","La movilidad del cuello","El tamaño del cuello"],"a":2,"e":"El acrónimo LEMON agrupa: Look externally, es decir rasgos faciales como retrognatia, obesidad, macroglosia y bocio; Evaluate, la relación de los ejes faringe-laringe-boca; Mallampati score; Obstrucción de la vía aérea; y Neck mobility, la movilidad del cuello. Es la sistematización que permite anticipar el plan en lugar de improvisar el día de la cirugía.","w":["La permeabilidad nasal tampoco figura en LEMON.","El número de dientes no forma parte del acrónimo.","Correcta: la N corresponde a neck mobility, la movilidad cervical.","El tamaño del cuello se valora dentro del aspecto externo, la L."]},{"c":1,"t":"Técnica de laringoscopia","q":"Ordene correctamente los pasos de la laringoscopia directa:","o":["Elevar el mango, introducir por la derecha, desplazar la lengua, exponer cuerdas","Desplazar la lengua, introducir por la derecha, hacer palanca, exponer cuerdas","Introducir por la izquierda, elevar el mango, desplazar la lengua, exponer cuerdas","Introducir por la derecha, desplazar la lengua, elevar el mango, exponer cuerdas"],"a":3,"e":"La técnica es tomar el laringoscopio con la mano izquierda, abrir la boca, introducir la hoja por el lado derecho, desplazar la lengua de derecha a izquierda, apoyar la punta en la vallécula si la hoja es curva o levantar la epiglotis si es recta, elevar el mango alejándolo del paciente en plano perpendicular sin hacer nunca palanca sobre los dientes, exponer las cuerdas vocales y pasar la sonda con la mano derecha.","w":["No se puede elevar el mango antes de haber introducido la hoja.","Hacer palanca sobre los dientes es precisamente lo que hay que evitar.","La hoja se introduce por el lado derecho de la boca.","Correcta: entrada por la derecha, lengua a la izquierda, elevación y exposición."]},{"c":1,"t":"Límites de la mascarilla laríngea","q":"¿De qué NO protege la mascarilla laríngea?","o":["De la regurgitación gástrica","De la obstrucción por la lengua","De las secreciones faríngeas","De la pérdida de vía aérea al sedar"],"a":0,"e":"La mascarilla laríngea tiene conector proximal de 15 mm y manguito elíptico inflable distal, se inserta a ciegas en la hipofaringe deslizándose contra el paladar duro, y su posición queda limitada por la base de la lengua arriba, los senos piriformes a los lados y el esfínter esofágico superior abajo. Protege parcialmente de las secreciones faríngeas, pero no protege de la regurgitación gástrica ni de la broncoaspiración: por eso no sustituye al tubo en el estómago lleno.","w":["Correcta: no sella frente al contenido gástrico ni evita la broncoaspiración.","Al asentar sobre la hipofaringe mantiene la vía aérea permeable.","De las secreciones faríngeas sí protege, aunque solo de forma parcial.","Precisamente sirve para mantener la vía aérea durante la sedación."]},{"c":1,"t":"Combitube","q":"Relacione el tubo azul del Combitube con el tubo claro según su extremo distal:","o":["Azul: punta abierta sin perforaciones; claro: punta ocluida con perforaciones laterales","Azul: punta ocluida con perforaciones laterales; claro: punta abierta sin perforaciones","Azul: doble manguito distal de 15 mL; claro: manguito proximal único de 100 mL","Azul: punta ocluida y más corta; claro: punta abierta con perforaciones laterales amplias"],"a":1,"e":"El Combitube esófago-traqueal está formado por dos tubos fusionados con conectores de 15 mm y dos manguitos, el proximal de 100 mL y el distal de 15 mL. El tubo azul es el más largo, con la punta distal ocluida, y el gas sale por perforaciones laterales; el tubo claro es más corto, con la punta abierta y sin perforaciones. Esa doble configuración permite ventilar tanto si el dispositivo queda en esófago como si queda en tráquea.","w":["Invierte la configuración de ambos tubos.","Correcta: el azul es ciego con perforaciones laterales y el claro tiene punta abierta.","Los manguitos son del dispositivo, no rasgos que distingan cada tubo.","El tubo azul es el más largo de los dos, no el más corto."]},{"c":1,"t":"Ojo de Murphy","q":"¿Para qué sirve el ojo de Murphy de la sonda endotraqueal?","o":["Medir la profundidad de inserción","Facilitar el paso a través de la glotis","Disminuir el riesgo de oclusión de la punta","Alojar el globo piloto del manguito"],"a":2,"e":"Las sondas de Magill son de cloruro de polivinilo y tienen el extremo biselado para facilitar la visualización y la inserción, con riesgo alto de obstrucción de la punta. Las sondas Murphy incorporan el ojo de Murphy, un orificio lateral que disminuye el riesgo de oclusión, de modo que si la punta se obstruye el gas sigue pasando. El tamaño se designa por el diámetro interno en milímetros.","w":["La profundidad se estima con marcas y con la fórmula del tubo.","La entrada por la glotis se facilita con el bisel, no con el orificio lateral.","Correcta: es un orificio lateral que permite el paso de gas si la punta se ocluye.","El globo piloto es parte del sistema de manguito, en el extremo proximal."]},{"c":1,"t":"Hojas de laringoscopio","q":"Relacione la hoja curva de Macintosh con la hoja recta de Miller según dónde se apoyan:","o":["Macintosh en la vallécula; Miller se apoya en el cartílago cricoides directamente","Macintosh levanta la epiglotis; Miller se apoya en la vallécula del paciente","Macintosh sobre los incisivos; Miller levanta la epiglotis de forma directa","Macintosh en la vallécula; Miller levanta la epiglotis"],"a":3,"e":"Las hojas curvas, tipo Macintosh, se apoyan en la vallécula, el espacio entre la base de la lengua y la epiglotis; las hojas rectas, tipo Miller, Wisconsin o Wis-Hipple, levantan la epiglotis directamente. En menores de 2 años se prefiere la hoja recta de Miller por la anatomía del niño, con epiglotis flexible en omega y glotis alta a nivel de C2.","w":["El cricoides no es punto de apoyo de ninguna hoja.","Invierte el punto de apoyo de las dos hojas.","Apoyarse en los incisivos es un error técnico, no un diseño.","Correcta: la curva se apoya en la vallécula y la recta carga la epiglotis."]},{"c":1,"t":"Verificación de la intubación","q":"¿Cuál es el método más fiable para confirmar la correcta colocación del tubo endotraqueal?","o":["Capnografía con CO2 exhalado","Elevación visible del tórax","Auscultación de ambos campos","Oximetría de pulso sostenida"],"a":0,"e":"El método más fiable para verificar la colocación del tubo endotraqueal es la detección de CO2 exhalado por capnografía. La auscultación y la elevación torácica ayudan pero son menos fiables, y la oximetría es tardía y poco sensible, sobre todo si el paciente inspira altas concentraciones de oxígeno. Eso sí, la capnografía no excluye la intubación bronquial: el tubo puede estar demasiado profundo y seguir mostrando CO2.","w":["Correcta: el CO2 exhalado sostenido es el estándar de verificación.","La elevación torácica puede ocurrir incluso con ventilación de un solo pulmón.","Es útil, pero menos fiable que el registro de CO2 exhalado.","La oximetría se altera tarde y depende de la fracción de oxígeno inspirada."]},{"c":1,"t":"Sospecha de intubación bronquial","q":"Paciente recién intubado con capnografía positiva, ruidos respiratorios unilaterales y ascenso de la presión inspiratoria pico. ¿Qué ocurre?","o":["Hay broncoespasmo por histamina","El tubo está en un bronquio","Hay un neumotórax a tensión","El tubo está en el esófago"],"a":1,"e":"La combinación de capnografía positiva con ruidos unilaterales y ascenso de la presión inspiratoria pico indica intubación bronquial: el tubo está dentro del árbol traqueobronquial, por eso hay CO2, pero demasiado profundo, de modo que todo el volumen entra en un pulmón. El signo más temprano suele ser precisamente el aumento de la presión pico, y se apoya en la imposibilidad de palpar el manguito en la escotadura esternal y en la disminución de la distensibilidad de la bolsa.","w":["El broncoespasmo eleva presiones pero de forma difusa y con sibilancias.","Correcta: CO2 presente con asimetría y presión alta define la intubación bronquial.","El neumotórax a tensión cursa con deterioro hemodinámico, no solo asimetría.","En el esófago no habría CO2 exhalado sostenido en la capnografía."]},{"c":1,"t":"Límite de la capnografía","q":"¿Por qué la presencia de CO2 en la capnografía no descarta una intubación bronquial?","o":["Porque el CO2 tarda 3 minutos en aparecer","Porque el CO2 puede proceder del estómago","El tubo sigue en la vía aérea, solo demasiado profundo","Porque la capnografía mide CO2 inspirado"],"a":2,"e":"La capnografía confirma que el tubo está en la vía aérea, no que esté a la profundidad correcta: en la intubación bronquial el tubo sigue dentro del árbol traqueobronquial y por eso el CO2 exhalado se detecta con normalidad. Para descartarla hacen falta otros datos: presión inspiratoria pico en ascenso, ruidos unilaterales, manguito no palpable en la escotadura esternal y menor distensibilidad de la bolsa.","w":["El CO2 aparece de inmediato si el tubo está en la vía aérea.","El CO2 gástrico daría una curva pequeña y decreciente, no sostenida.","Correcta: verifica la vía aérea, no la profundidad del tubo.","La capnografía mide el CO2 exhalado, que es lo que confirma la ventilación."]},{"c":1,"t":"Fuga en la mascarilla facial","q":"La bolsa reservorio se desinfla aunque la válvula esté cerrada. ¿Qué indica este hallazgo?","o":["Agotamiento de la cal sodada","Obstrucción completa del tubo","Laringoespasmo establecido","Fuga alrededor de la mascarilla facial"],"a":3,"e":"Si la bolsa reservorio se desinfla con la válvula cerrada, la técnica de mascarilla facial es inadecuada y hay fuga alrededor de la mascarilla. El escenario opuesto son las presiones altas en el circuito con mínimo movimiento torácico y escasos ruidos respiratorios, que sugieren obstrucción de la vía aérea o del tubo. Un tercer cuadro es el laringoespasmo, con presiones intratorácicas muy negativas por la lucha del paciente.","w":["La cal sodada agotada se manifiesta por cambio de color y reinhalación de CO2.","La obstrucción produce presiones altas, no pérdida de volumen en la bolsa.","El laringoespasmo genera presiones negativas por esfuerzo inspiratorio.","Correcta: el gas escapa por el sello imperfecto entre mascarilla y cara."]},{"c":1,"t":"Presiones altas en el circuito","q":"Presiones altas en el circuito, mínimo movimiento torácico y escasos ruidos respiratorios. ¿Cuál es la sospecha?","o":["Obstrucción de la vía aérea o del tubo","Fuga en el sello de la mascarilla","Sobredosis de relajante muscular","Desconexión del circuito ventilatorio"],"a":0,"e":"Las presiones altas en el circuito con mínimo movimiento torácico y escasos ruidos respiratorios sugieren obstrucción de la vía aérea o del tubo: el gas no puede entrar y la presión sube. Es el cuadro complementario de la fuga alrededor de la mascarilla, donde la bolsa se desinfla, y del laringoespasmo, donde el paciente genera presiones intratorácicas muy negativas.","w":["Correcta: presión alta sin ventilación efectiva apunta a obstrucción.","La fuga se manifiesta con caída de presión y bolsa que se desinfla.","El relajante paraliza, pero no eleva la presión de la vía aérea.","La desconexión también baja la presión del circuito."]},{"c":1,"t":"Preoxigenación","q":"¿Cuántos minutos de apnea permite mantener una preoxigenación adecuada?","o":["De 1 a 2 minutos","De 5 a 8 minutos","De 15 a 20 minutos","De 30 a 45 segundos"],"a":1,"e":"Antes de la inducción se administra oxígeno al 100% para reemplazar el nitrógeno de la capacidad residual funcional, creando una reserva que mantiene la oxigenación durante 5 a 8 minutos de apnea. Ese margen se acorta cuando aumenta el consumo de oxígeno, como en la sepsis o el embarazo, o cuando disminuye la capacidad residual funcional, como en la obesidad o la ascitis.","w":["Infravalora el beneficio real de la desnitrogenación.","Correcta: la reserva alveolar sostiene la oxigenación de 5 a 8 minutos.","Quince a veinte minutos excede con mucho la reserva alcanzable.","La preoxigenación aporta minutos, no segundos."]},{"c":1,"t":"Factores que acortan la apnea segura","q":"¿Cuál de las siguientes situaciones NO acorta el tiempo de apnea tras preoxigenar?","o":["Ascitis a tensión","Obesidad","Anemia crónica compensada","Embarazo"],"a":2,"e":"El tiempo de apnea que permite la preoxigenación se reduce por dos vías: aumento del consumo de oxígeno, como en la sepsis y el embarazo, o disminución de la capacidad residual funcional, como en la obesidad y la ascitis. La anemia no figura entre esos factores; su efecto descrito en el temario es otro, sobre la solubilidad de los inhalados: disminuye la captación y acelera la velocidad de inducción.","w":["La ascitis reduce la capacidad residual funcional por efecto mecánico.","La obesidad reduce la capacidad residual funcional.","Correcta: la anemia no está entre los factores que acortan la apnea segura.","El embarazo aumenta el consumo de oxígeno."]},{"c":1,"t":"Función del vaporizador","q":"¿Por qué el vaporizador es indispensable en la máquina de anestesia?","o":["Porque mide el flujo en litros por minuto","Porque filtra el CO2 antes de reinhalarlo","Porque mezcla el oxígeno con el aire","Los anestésicos inhalatorios son líquidos"],"a":3,"e":"Los anestésicos llamados inhalatorios son en realidad líquidos, y la vía aérea no maneja líquidos: el vaporizador es el que los convierte en gas, por eso es indispensable. Cada vaporizador es específico para un solo gas y no son intercambiables, motivo por el cual el sevoflurano tiene su código de color amarillo. El flujómetro mide los litros por minuto y el canister contiene la cal sodada.","w":["Medir el flujo por minuto corresponde al flujómetro.","Filtrar el CO2 es función del canister con cal sodada.","La mezcla de gases frescos se regula con los flujómetros.","Correcta: convierte el agente líquido en gas administrable por la vía aérea."]},{"c":1,"t":"Cal sodada agotada","q":"El canister de la máquina de anestesia pasa de blanco a violeta. ¿Qué significa y qué hay que hacer?","o":["La cal sodada se agotó; cambiarla de inmediato","El circuito tiene una fuga; revisar conexiones","El agente inhalado se condensó; purgar el circuito","El flujo de oxígeno es insuficiente; aumentarlo"],"a":0,"e":"El canister contiene la cal sodada, que filtra el CO2 exhalado para que el paciente no lo reinhale. Cuando se agota cambia de color, de blanco a violeta o morado, y hay que cambiarla de inmediato. El ciclo ventilatorio entrega oxígeno y agente inhalado en la inspiración por la válvula inspiratoria y recibe CO2 y agua en la espiración por la válvula espiratoria, ambas unidireccionales.","w":["Correcta: el viraje de color indica agotamiento y obliga a recambio inmediato.","Una fuga no produce cambio de color en el absorbedor.","La condensación del agente no se expresa como viraje del canister.","El flujo de oxígeno no modifica el color de la cal sodada."]},{"c":1,"t":"Laringoespasmo y edema pulmonar","q":"Paciente que lucha contra una glotis cerrada durante la extubación. ¿Qué complicación puede desarrollar?","o":["Neumotórax a tensión por barotrauma","Edema pulmonar por presión negativa","Atelectasia por reabsorción","Embolia gaseosa venosa"],"a":1,"e":"Cuando el paciente lucha contra una glotis cerrada en laringoespasmo genera presiones intratorácicas muy negativas, y eso puede producir edema pulmonar por presión negativa. Es una de las razones por las que el profesor prefiere extubar en anestesia profunda con patrón ventilatorio adecuado, en lugar de con el paciente despierto peleando el tubo en un plano intermedio, escenario clásico de laringoespasmo.","w":["El barotrauma requiere presión positiva elevada, no esfuerzo inspiratorio.","Correcta: la presión intratorácica muy negativa arrastra líquido al alvéolo.","La atelectasia por reabsorción se relaciona con oxígeno al 100% mantenido.","La embolia gaseosa exige entrada de aire al torrente venoso."]},{"c":1,"t":"Medida de la cánula orofaríngea","q":"¿Cómo se elige el tamaño de la cánula de Guedel?","o":["De la narina al orificio externo del oído","Del mentón al cartílago cricoides","De la comisura labial al lóbulo de la oreja","De la arcada dentaria a la escotadura esternal"],"a":2,"e":"La cánula de Guedel u orofaríngea se mide desde la comisura labial hasta el lóbulo de la oreja, y la cánula nasal desde las narinas hasta el orificio externo del oído. Elegir mal la longitud es contraproducente: una corta no separa la lengua de la pared posterior y una demasiado larga puede desencadenar reflejos. La mascarilla facial tiene orificio de 22 mm y cuerpo transparente para observar el gas exhalado o el vómito.","w":["Esa es la medida de la cánula nasofaríngea.","El cricoides no se usa como referencia para la cánula oral.","Correcta: comisura labial a lóbulo de la oreja es la referencia de la cánula oral.","La escotadura esternal sirve para palpar el manguito, no para medir la cánula."]},{"c":1,"t":"Rendimiento de la premedicación","q":"¿Cuánto disminuyen los requerimientos anestésicos con una buena premedicación?","o":["Hasta un 5%","Hasta un 70%","Hasta un 50%","Hasta un 20%"],"a":3,"e":"Los objetivos de la premedicación son reducir la ansiedad, aliviar el dolor preoperatorio, dar amnesia perioperatoria y prevenir la náusea, el vómito y la neumonitis por aspiración. La perla cuantitativa del tema es que con buena premedicación se disminuyen hasta un 20% los requerimientos anestésicos y con buenos potenciadores hasta un 15% adicional.","w":["Subestima el beneficio descrito en el tema.","Ninguna medida preoperatoria alcanza ese nivel de ahorro anestésico.","Un 50% excede la reducción atribuida a la premedicación.","Correcta: hasta un 20% de reducción con una premedicación bien hecha."]},{"c":1,"t":"Arteria cricotiroidea","q":"¿De qué arteria emerge la arteria cricotiroidea?","o":["De la tiroidea superior","De la carótida interna","De la tiroidea inferior","De la subclavia derecha"],"a":0,"e":"La irrigación de la laringe procede de ramas de las arterias tiroideas. La arteria cricotiroidea emerge de la arteria tiroidea superior, que es la primera rama de la carótida externa, y cruza la membrana cricotiroidea; la propia tiroidea superior pasa lateral a esa membrana. Conocer ese detalle importa porque la membrana cricotiroidea es la vía de acceso quirúrgico urgente a la vía aérea.","w":["Correcta: nace de la tiroidea superior, primera rama de la carótida externa.","La carótida interna no da ramas cervicales de este territorio.","La tiroidea inferior procede del tronco tirocervical y no da esta rama.","La subclavia irriga el cuello por otras vías, no la membrana cricotiroidea."]},{"c":1,"t":"Raíz de las complicaciones anestésicas","q":"Según el tema, ¿cuándo ocurren las complicaciones de la anestesia?","o":["Por premedicar antes de la inducción","Por desconocer al paciente o planear mal","Por pedir menos estudios de los necesarios","Por usar técnica regional en vez de general"],"a":1,"e":"El principio del tema es que las complicaciones de la anestesia ocurren cuando hay un desconocimiento del paciente o cuando hay una mala planeación del procedimiento. De ahí la regla de no administrar ningún fármaco a un paciente electivo sin evaluación previa, y de cambiar el plan de antemano si ya se anticipa una vía aérea difícil, en lugar de improvisar el día de la cirugía.","w":["La premedicación adecuada disminuye los requerimientos anestésicos.","Correcta: desconocer al paciente y planear mal son las dos raíces del problema.","El exceso o defecto de estudios no es la causa señalada en el tema.","La técnica regional bien indicada reduce morbimortalidad en varios escenarios."]},{"c":1,"t":"Anatomía de la faringe","q":"¿Qué estructura marca la separación funcional entre orofaringe y laringofaringe?","o":["Un plano imaginario posterior","El cartílago cricoides","La epiglotis","El hueso hioides"],"a":2,"e":"La faringe es una estructura fibromuscular en forma de U que va desde la base del cráneo hasta el cartílago cricoides, donde comienza el esófago. La epiglotis, situada en la base de la lengua, es la separación funcional entre orofaringe y laringofaringe, y evita la aspiración durante la deglución. La nasofaringe, en cambio, está separada de la orofaringe por un plano imaginario posterior.","w":["El plano imaginario separa nasofaringe de orofaringe.","El cricoides marca el límite inferior de la faringe y el inicio del esófago.","Correcta: la epiglotis separa funcionalmente oro y laringofaringe.","El hioides es una referencia de la regla 3-3-2, no un límite faríngeo."]},{"c":1,"t":"Videolaringoscopio","q":"¿En qué paciente aporta mayor ventaja el videolaringoscopio?","o":["Mallampati I con buena apertura bucal","Paciente en apnea prolongada","Paciente con estómago lleno","Mallampati III-IV con cuello corto"],"a":3,"e":"El videolaringoscopio permite ver la glotis en una pantalla en lugar de depender de la línea de visión directa, y por eso es de gran ayuda en pacientes con Mallampati III o IV, cuello corto, macroglosia o trauma facial. El principio es anticiparse: si en la evaluación preanestésica ya se ve una clase III o IV, se cambia el plan de antemano y no se improvisa el día de la cirugía.","w":["En un Mallampati I la laringoscopia directa suele bastar.","La apnea exige ventilar, no solo mejorar la visualización.","El estómago lleno se maneja con secuencia rápida, no con un dispositivo óptico.","Correcta: su rendimiento máximo está en la vía aérea anatómicamente difícil."]},{"c":1,"t":"Posición del manguito","q":"¿Qué ocurre si el manguito del tubo endotraqueal queda por encima del cartílago cricoides?","o":["Disfonía postoperatoria y extubación accidental","Broncoaspiración masiva inmediata","Intubación bronquial con desaturación","Obstrucción completa del tubo"],"a":0,"e":"El manguito del tubo endotraqueal no debe palparse por encima del cartílago cricoides: una localización intralaríngea prolongada produce disfonía postoperatoria y aumenta el riesgo de extubación accidental. En el extremo opuesto, si el tubo avanza demasiado se produce intubación bronquial, cuyo signo más temprano es el ascenso de la presión inspiratoria pico.","w":["Correcta: el manguito intralaríngeo lesiona la glotis y facilita la salida del tubo.","La broncoaspiración se asocia a manguito insuflado de forma insuficiente.","La intubación bronquial ocurre cuando el tubo queda demasiado profundo.","La obstrucción se relaciona con acodamiento o secreciones, no con esta posición."]},{"c":1,"t":"Válvulas del circuito","q":"¿Qué recibe la máquina de anestesia durante la espiración?","o":["Óxido nitroso residual","Dióxido de carbono y agua","Solo vapor de agua","Oxígeno con el agente inhalado"],"a":1,"e":"En el ciclo ventilatorio la máquina entrega oxígeno más el agente inhalado durante la inspiración, a través de la válvula inspiratoria, y recibe dióxido de carbono y agua durante la espiración, a través de la válvula espiratoria; ambas válvulas son unidireccionales, lo que evita que se mezcle el gas fresco con el exhalado. Ese CO2 recibido es el que retiene la cal sodada del canister.","w":["El óxido nitroso solo está presente si se está administrando.","Correcta: el gas espirado aporta dióxido de carbono y agua al circuito.","Además del agua, el gas espirado lleva el dióxido de carbono que capta el canister.","Eso es lo que la máquina entrega en la inspiración."]},{"c":1,"t":"Examen de la dentadura","q":"¿Por qué se explora la dentadura en la evaluación preanestésica?","o":["Para decidir la vía de premedicación","Para estimar la clase de Mallampati","Por riesgo de daño y aspiración al intubar","Para calcular el tamaño del tubo"],"a":2,"e":"En el paciente sano y asintomático el examen físico incluye signos vitales, vía aérea, corazón, pulmón y aparato musculoesquelético. La dentadura se evalúa buscando dientes flojos o rotos, coronas, puentes y prótesis, por el riesgo de daño o de aspiración durante la intubación; el trauma dental figura entre las complicaciones descritas del procedimiento, junto con hipoxia, hipercapnia, mala colocación de la sonda y mal funcionamiento del equipo.","w":["La vía de premedicación no se decide por el estado dental.","El Mallampati depende de las estructuras faríngeas visibles, no de los dientes.","Correcta: dientes flojos o prótesis pueden dañarse o aspirarse al instrumentar.","El tamaño del tubo se estima por edad y calibre de la vía, no por la dentadura."]},{"c":2,"t":"Variables que determinan el efecto","q":"¿De qué dos variables depende el efecto de todo anestésico endovenoso?","o":["De la vía y de la alergia declarada","Del peso molecular y de la liposolubilidad","De la dosis y del peso molecular","De la dosis y la velocidad de administración"],"a":3,"e":"La regla general es que todos los anestésicos endovenosos producen efectos dependientes de la dosis y de la velocidad de administración. El profesor lo repite al hablar de benzodiacepinas: las dos variables que determinan el efecto adverso son esas, no la alergia que a veces reporta el paciente. De ahí que un mismo fármaco sea sedante o hipnótico según cuánto y cuán rápido se administre.","w":["Todos son endovenosos; la alergia referida suele ser intolerancia por dosis.","La liposolubilidad explica el inicio de acción, no el efecto adverso.","El peso molecular no modula el efecto clínico observado.","Correcta: cuánto se da y a qué velocidad se da."]},{"c":2,"t":"Barbitúricos y benzodiacepinas en el canal de cloro","q":"Relacione el efecto de los barbitúricos sobre el canal de cloro con el de las benzodiacepinas:","o":["Barbitúricos aumentan la duración de apertura; benzodiacepinas la frecuencia","Barbitúricos aumentan la duración de apertura; benzodiacepinas la conductancia total","Barbitúricos bloquean la apertura del canal; benzodiacepinas aumentan su frecuencia","Barbitúricos aumentan la frecuencia de apertura; benzodiacepinas la duración de esta"],"a":0,"e":"Los barbitúricos actúan en el receptor GABA-A, en un sitio propio de unión, y aumentan la duración de apertura de los canales de cloro; las benzodiacepinas forman parte del mismo complejo pero aumentan la frecuencia de apertura. Los barbitúricos se usan en inducción, como anticonvulsivantes, para sedación y protección cerebral, y producen depresión del sistema nervioso central, descenso de la frecuencia respiratoria e inhibición del complejo I de la cadena respiratoria.","w":["Correcta: duración con barbitúricos, frecuencia con benzodiacepinas.","La benzodiacepina modifica la frecuencia, no la conductancia.","Los barbitúricos potencian la acción del GABA, no la bloquean.","Invierte ambos mecanismos, que es el error clásico del tema."]},{"c":2,"t":"Biotransformación y duración","q":"Un barbitúrico con 100% de biotransformación, ¿qué duración de acción tendrá?","o":["Más de 8 horas","Menos de una hora","De 1 a 3 horas","De 3 a 6 horas"],"a":1,"e":"La regla es que a mayor porcentaje de biotransformación el hígado lo procesa más rápido, el fármaco dura menos y viceversa. Los tiobarbitúricos tiopental y tiamilal tienen 100% de biotransformación y duran menos de 1 hora: son los anestésicos generales endovenosos. Los de acción prolongada, como el fenobarbital, tienen 15% y duran más de 8 horas.","w":["Más de 8 horas corresponde al 15% de biotransformación.","Correcta: 100% de biotransformación equivale a acción ultracorta.","De 1 a 3 horas corresponde a los de acción corta, con 85%.","Ese rango corresponde a los de acción intermedia, con 50%."]},{"c":2,"t":"Identificación del barbitúrico","q":"Polvo higroscópico, olor azufrado, pH muy alcalino y unión a proteínas del 75%. ¿De qué fármaco se trata?","o":["Etomidato","Fenobarbital","Tiopental","Propofol"],"a":2,"e":"El tiopental es un polvo higroscópico con olor azufrado y pH muy alcalino, de modo que si se extravasa produce quemaduras del tejido, y su unión a proteínas es del 75%. Es sedante y anticonvulsivante a 1-2 mg/kg e hipnótico a 3-7 mg/kg, con inicio en 10 a 15 segundos y recuperación de la conciencia en 5 a 10 minutos. No produce analgesia.","w":["El etomidato no se describe con esas propiedades físicas.","El fenobarbital es de acción prolongada y no se usa como inductor.","Correcta: es el perfil físico característico del tiopental.","El propofol es un alquilfenol con pH de 7 a 8,5."]},{"c":2,"t":"Extravasación de tiopental","q":"¿Por qué la extravasación de tiopental produce quemaduras del tejido?","o":["Por ser un polvo higroscópico","Por su alta unión a proteínas","Por su olor azufrado","Por su pH muy alcalino"],"a":3,"e":"El tiopental tiene pH muy alcalino, y esa alcalinidad es la que lesiona el tejido cuando el fármaco sale de la vena. Es un polvo higroscópico con olor azufrado y unión a proteínas del 75%, pero ninguna de esas características explica el daño local. Su corta duración clínica se debe a la redistribución hacia músculo y grasa, pese a un metabolismo hepático lento.","w":["Ser higroscópico afecta a su conservación, no al tejido.","La unión a proteínas influye en la fracción libre, no en el daño local.","El olor es una característica organoléptica sin efecto tisular.","Correcta: el pH extremo es lo que produce la quemadura química."]},{"c":2,"t":"Tiopental y reflejos de vía aérea","q":"El tiopental produce apnea, pero ¿qué reflejo NO suprime?","o":["Los de la vía aérea superior","El reflejo pupilar a la luz","El reflejo nauseoso gástrico","Los reflejos osteotendinosos"],"a":0,"e":"El tiopental produce depresión respiratoria central, hipoventilación y apnea, por lo que requiere asistencia ventilatoria, pero no suprime los reflejos de la vía aérea superior: hay que tener cuidado al intubar porque puede desencadenar un reflejo espástico o laringoespasmo. Esa disociación entre apnea y reflejos conservados es la que obliga a asociar un relajante si se va a instrumentar la vía aérea.","w":["Correcta: conserva los reflejos laríngeos y puede dar laringoespasmo al intubar.","El reflejo pupilar no es el problema clínico descrito para el tiopental.","El reflejo nauseoso no es el que motiva la advertencia del tema.","Los reflejos osteotendinosos no condicionan la instrumentación de la vía aérea."]},{"c":2,"t":"Tiopental en el paciente hipovolémico","q":"Paciente hipovolémico en el que se decide inducir con tiopental. ¿Cuál es la conducta correcta?","o":["Duplicar la dosis por la menor unión a proteínas","Administrarlo en pequeños bolos con vasoactivos disponibles","Administrar la dosis completa en bolo rápido","Sustituirlo por propofol a dosis plena"],"a":1,"e":"El tiopental es inótropo negativo, produce venodilatación e hipotensión y aumenta la resistencia vascular periférica. En el paciente hemodinámicamente inestable o hipovolémico se administra en pequeños bolos y con fármacos vasoactivos disponibles. Si el paciente está francamente inestable, la elección son la ketamina o el etomidato, no el propofol, que vasodilata aún más.","w":["Aumentar la dosis agrava la depresión cardiovascular.","Correcta: titulación en pequeños bolos con vasoactivos preparados.","El bolo rápido es lo que precipita el colapso hemodinámico.","El propofol produce caídas de hasta el 30% de la tensión sistólica."]},{"c":2,"t":"Identidad química del propofol","q":"¿A qué familia química pertenece el propofol?","o":["A las ciclohexanonas","A los imidazoles","A los alquilfenoles","A los tiobarbitúricos"],"a":2,"e":"El propofol es un alquilfenol, concretamente el 2,6-diisopropilfenol, insoluble en agua pero que no necesita solvente para su administración intravenosa, con pH de 7 a 8,5. Es el fármaco número uno para la inducción de anestesia general y actúa deprimiendo el sistema nervioso central por potenciación del GABA.","w":["La ketamina es una ciclohexanona clorofenilada.","El etomidato es el que actúa desde un núcleo imidazólico.","Correcta: es el 2,6-diisopropilfenol, un alquilfenol.","El tiobarbitúrico de acción ultracorta es el tiopental."]},{"c":2,"t":"Caída tensional en la inducción","q":"Paciente politraumatizado en el que, tras la inducción, la tensión sistólica cae bruscamente. ¿Qué fármaco hay que sospechar?","o":["Ketamina","Etomidato","Succinilcolina","Propofol"],"a":3,"e":"La inducción con caída brusca de la tensión arterial obliga a pensar en propofol, por su vasodilatación profunda: produce descensos de hasta un 30% de la tensión sistólica, la diastólica y el gasto cardiaco, además de bradicardia y compromiso del flujo coronario. Por eso en el paciente inestable se prefieren la ketamina, que eleva la tensión, y el etomidato, que produce la mínima depresión cardiovascular.","w":["La ketamina aumenta la actividad simpática y sube la tensión arterial.","El etomidato es el inductor hemodinámicamente más estable.","La succinilcolina puede dar bradicardia, no vasodilatación profunda.","Correcta: el propofol vasodilata y puede bajar un 30% la tensión sistólica."]},{"c":2,"t":"Apnea por propofol","q":"¿En qué porcentaje de pacientes produce apnea el propofol?","o":["Del 80 al 84%","Del 40 al 45%","Menos del 10%","Del 20 al 24%"],"a":0,"e":"El propofol produce apnea hasta en el 80 a 84% de los casos, de modo que siempre requiere asistencia ventilatoria, y tiene sinergismo con los opioides potenciando su efecto apneico y depresor cardiorrespiratorio. A cambio disminuye la incidencia de náusea y vómito postoperatorio, que es una de sus grandes ventajas.","w":["Correcta: la apnea es la regla con el propofol, en más de cuatro de cada cinco.","La cifra descrita es bastante mayor.","Con esa frecuencia no haría falta asistencia ventilatoria sistemática.","Subestima mucho la frecuencia real de apnea."]},{"c":2,"t":"Ventaja antiemética","q":"¿Cuál de estos inductores disminuye la incidencia de náusea y vómito postoperatorio?","o":["Ketamina","Propofol","Etomidato","Tiopental"],"a":1,"e":"El propofol disminuye la incidencia de náusea y vómito postoperatorio, ventaja añadida a su papel como inductor de primera línea. El etomidato produce náusea y vómito entre sus efectos adversos, junto con mioclonías durante la inyección; la ketamina da sialorrea, disforia y alucinaciones al despertar; y el tiopental no tiene efecto antiemético descrito.","w":["La ketamina se asocia a sialorrea y fenómenos psíquicos al despertar.","Correcta: el efecto antiemético es una ventaja característica del propofol.","El etomidato produce náusea y vómito, no los previene.","El tiopental no aporta protección antiemética."]},{"c":2,"t":"Etomidato: ventaja e inconveniente","q":"Relacione la principal ventaja del etomidato con su principal efecto adverso:","o":["Mínima depresión cardiovascular; hipertermia maligna en el intraoperatorio","Analgesia intensa sin hipotensión; crisis adrenal aguda por supresión suprarrenal","Mínima depresión cardiovascular; crisis adrenal aguda","Mínima depresión respiratoria; crisis adrenal aguda por supresión suprarrenal"],"a":2,"e":"El etomidato actúa en el receptor GABA-A y es seguro en cardiopatía o inestabilidad hemodinámica porque produce la mínima depresión cardiovascular de todos los inductores. Su efecto adverso principal es la crisis adrenal aguda por supresión suprarrenal, ya que reduce la producción de esteroides, motivo por el cual no se usa en pacientes con patología adrenal de base. La dosis pediátrica es de 0,2 a 0,3 mg/kg.","w":["La hipertermia maligna se asocia a halogenados y succinilcolina.","El etomidato no produce analgesia: ese rasgo es exclusivo de la ketamina.","Correcta: el más estable en lo cardiovascular, con la suprarrenal como talón de Aquiles.","Su ventaja descrita es cardiovascular, no respiratoria."]},{"c":2,"t":"Contraindicación del etomidato","q":"¿En qué paciente conviene evitar el etomidato?","o":["Con antecedente de asma","Con insuficiencia renal crónica","Con hipertensión intracraneal","Con patología adrenal de base"],"a":3,"e":"El etomidato reduce la producción de esteroides y puede desencadenar una crisis adrenal aguda, por lo que no se usa en pacientes con patología adrenal de base. La hipertensión intracraneal es contraindicación de la ketamina, que eleva el flujo sanguíneo cerebral y la presión intracraneal; el asma es más bien indicación de ketamina por su broncodilatación.","w":["En el asma la ketamina resulta ventajosa por broncodilatar.","La insuficiencia renal no es la contraindicación descrita.","La hipertensión intracraneal contraindica la ketamina, no el etomidato.","Correcta: la supresión suprarrenal lo contraindica en la patología adrenal."]},{"c":2,"t":"Rasgo único de la ketamina","q":"¿Qué hace única a la ketamina entre los anestésicos endovenosos?","o":["Produce analgesia y eleva la tensión arterial","Produce amnesia sin depresión respiratoria","Es el único que no requiere metabolismo hepático","Es el único que no cruza la placenta"],"a":0,"e":"La ketamina es el único anestésico endovenoso que sí produce analgesia y que no disminuye la tensión arterial: de hecho la aumenta. Es muy liposoluble, con unión a proteínas del 40 al 50%, y produce anestesia disociativa por disociación entre tálamo y sistema límbico, con analgesia somática intensa y sueño superficial, por antagonismo no competitivo del receptor NMDA.","w":["Correcta: analgesia verdadera y ascenso tensional, ambas exclusivas.","La amnesia es propia de las benzodiacepinas.","La ketamina sí se metaboliza, con vida media de 2 a 3 horas.","Los bloqueadores neuromusculares son los que apenas cruzan la placenta."]},{"c":2,"t":"Anestesia disociativa","q":"¿Qué estructuras disocia la ketamina para producir anestesia disociativa?","o":["Cerebelo y núcleos de la base","Tálamo y sistema límbico","Hipotálamo y hipófisis","Corteza y tronco encefálico"],"a":1,"e":"La ketamina disocia el tálamo del sistema límbico, lo que se traduce en analgesia somática intensa con sueño superficial. Su vida media es de 2 a 3 horas y la dosis de inducción de 1,5 a 3 mg/kg, con duración de 10 a 15 minutos. Produce disforia por unión a receptores sigma y alucinaciones al despertar, que en el adulto se previenen combinándola con benzodiacepinas.","w":["El cerebelo y los núcleos de la base no participan en la disociación descrita.","Correcta: la disociación talamolímbica define el cuadro.","El eje hipotálamo-hipófisis se relaciona con el etomidato y los esteroides.","El eje cortico-troncal no es el descrito para este fármaco."]},{"c":2,"t":"Ketamina en el paciente en shock","q":"Paciente en shock con tensión de 50/30 que requiere inducción urgente. ¿Qué inductor conviene y por qué?","o":["Midazolam, porque su depresión es reversible con flumazenilo","Propofol, porque su despertar es rápido y previsible","Ketamina, porque estimula el simpático y sube la tensión","Tiopental, porque protege del daño cerebral isquémico"],"a":2,"e":"La ketamina aumenta la actividad simpática y produce ascenso de la tensión arterial y del gasto cardiaco, broncodilatación y taquicardia. El ejemplo de clase es el paciente en shock con tensión de 50/30 que al recibir ketamina sube a cifras de 70/50 u 80/60, el llamado efecto de fiesta simpaticomimético. Es la elección en el hipotenso, junto con el etomidato en el politraumatizado inestable.","w":["El midazolam produce inotropismo negativo y no rescata la tensión.","El propofol puede bajar un 30% la tensión sistólica y agravar el shock.","Correcta: es el único inductor que eleva la tensión arterial.","El tiopental es inótropo negativo y venodilatador."]},{"c":2,"t":"Ketamina y presión intracraneal","q":"¿Por qué la ketamina está contraindicada en la hipertensión intracraneal?","o":["Produce vasoconstricción cerebral extrema","Bloquea la autorregulación del flujo cerebral","Aumenta la producción de líquido cefalorraquídeo","Aumenta el flujo sanguíneo cerebral y la presión"],"a":3,"e":"La ketamina aumenta el flujo sanguíneo cerebral y eleva la presión intracraneal, por lo que se contraindica en la hipertensión intracraneal, a diferencia del tiopental y el propofol, que reducen el consumo de oxígeno cerebral, el flujo y la presión intracraneal. También produce disforia por receptores sigma y alucinaciones al despertar.","w":["No produce vasoconstricción: vasodilata el lecho cerebral.","La pérdida de autorregulación se describe con sevoflurano a más de 1,5 MAC.","El aumento de producción de líquido cefalorraquídeo se describe con enflurano.","Correcta: eleva flujo y presión intracraneal, lo contrario de lo buscado."]},{"c":2,"t":"Ketamina y ventilación","q":"¿Cuál de las siguientes afirmaciones sobre la ketamina y la ventilación es correcta?","o":["Mantiene la respuesta al CO2 y la apnea es infrecuente","Abole la respuesta al CO2 de forma dependiente de dosis","Produce apnea en más del 80% de los casos","Deprime la ventilación más que el tiopental"],"a":0,"e":"La ketamina no tiene efecto depresor sobre la ventilación, mantiene la respuesta al CO2, no cambia la frecuencia respiratoria y la apnea es infrecuente: no produce apnea como el propofol o el tiopental. Esa propiedad es la que la hace útil cuando no se quiere perder la ventilación espontánea, y contrasta con el 80 a 84% de apnea del propofol.","w":["Correcta: conserva la respuesta al CO2 y raramente produce apnea.","La respuesta al CO2 se mantiene, y ese es su rasgo diferencial.","Esa cifra corresponde al propofol.","Deprime la ventilación menos que el tiopental, no más."]},{"c":2,"t":"Sialorrea por ketamina","q":"¿Con qué grupo farmacológico se combina la ketamina para contrarrestar la sialorrea?","o":["Con un betabloqueante","Con un anticolinérgico","Con un anticolinesterásico","Con un antihistamínico H2"],"a":1,"e":"La ketamina produce sialorrea, por eso se combina con un anticolinérgico, que reduce mucho las secreciones salivales por bloqueo de receptores muscarínicos M3. Es excelente en niños, porque en pediatría no tienen vivencias negativas, y en adultos se combina con benzodiacepinas para evitar la disociación. Hay que tener cuidado en cirugía oftalmológica porque produce nistagmo y eleva la presión intraocular.","w":["El betabloqueante no modifica la secreción salival.","Correcta: el bloqueo muscarínico seca las secreciones que la ketamina provoca.","Un anticolinesterásico aumentaría las secreciones y agravaría el problema.","El antihistamínico H2 actúa sobre la secreción gástrica."]},{"c":2,"t":"Ketamina en oftalmología","q":"¿Qué dos efectos oculares de la ketamina obligan a precaución en cirugía oftalmológica?","o":["Midriasis con cicloplejia y glaucoma agudo","Diplopía y descenso de la presión intraocular","Nistagmo y ascenso de la presión intraocular","Miosis puntiforme y descenso de la presión"],"a":2,"e":"En cirugía oftalmológica hay que tener cuidado con la ketamina porque produce nistagmo y eleva la presión intraocular. Coincide en eso con la succinilcolina, que también la aumenta, con máximo a los 2 a 4 minutos, y está contraindicada en procesos oftalmológicos salvo que se abra la cámara anterior. La midriasis con cicloplejia y el glaucoma de ángulo cerrado son efectos de los anticolinérgicos.","w":["Esos son los efectos oculares de los anticolinérgicos.","La ketamina eleva la presión intraocular, no la reduce.","Correcta: nistagmo y aumento de la presión intraocular.","La miosis puntiforme es signo de intoxicación por opioides."]},{"c":2,"t":"Sinergismo propofol-opioide","q":"¿Qué consecuencia tiene el sinergismo entre propofol y opioides?","o":["Prolonga la duración del bloqueo neuromuscular","Anula el efecto antiemético del propofol","Antagoniza la depresión respiratoria del opioide","Potencia el efecto apneico y depresor cardiorrespiratorio"],"a":3,"e":"El propofol tiene sinergismo con los opioides: potencia el efecto apneico y depresor cardiorrespiratorio del opioide. Como por sí solo ya produce apnea en más del 80% de los casos, la combinación obliga a asistencia ventilatoria y a titular ambos fármacos. La cara favorable del sinergismo es que permite reducir dosis de cada uno, en la misma lógica de los potenciadores que disminuyen los requerimientos anestésicos.","w":["El bloqueo neuromuscular no depende de esta combinación.","El efecto antiemético del propofol se mantiene.","No hay antagonismo: los efectos depresores se refuerzan.","Correcta: la depresión respiratoria y cardiovascular se suma."]},{"c":3,"t":"Opioides y opiáceos","q":"¿Qué diferencia a un opiáceo de un opioide?","o":["El opiáceo deriva de la amapola","El opiáceo actúa en receptores opioides","El opiáceo carece de efecto analgésico","El opiáceo es de origen sintético"],"a":0,"e":"Los opioides son sustancias naturales, semisintéticas o sintéticas que actúan sobre receptores opioides; los opiáceos son un subgrupo derivado naturalmente de la amapola Papaver somniferum, como el opio, la morfina, la codeína y la tebaína. Todo opiáceo es opioide, pero no todo opioide es opiáceo: el fentanilo, la meperidina, la metadona, el tapentadol y el tramadol son sintéticos.","w":["Correcta: el origen natural en la amapola define al opiáceo.","Actuar en receptores opioides define al grupo completo, no al subgrupo.","Los opiáceos son analgésicos potentes, como la morfina.","Lo sintético es justo lo contrario del criterio del opiáceo."]},{"c":3,"t":"Mecanismo de los opioides","q":"Los receptores opioides están acoplados a proteína Gi. ¿Qué movimiento iónico producen?","o":["Sale sodio postsináptico y entra más calcio presináptico","Sale potasio postsináptico y entra menos calcio presináptico","Entra cloro postsináptico y sale potasio presináptico","Entra potasio postsináptico y sale más calcio presináptico"],"a":1,"e":"Los receptores opioides están ligados a proteína Gi: aumentan la salida de potasio postsináptico y disminuyen la entrada de calcio presináptico, lo que hiperpolariza la neurona y frena la liberación de neurotransmisores. Así inhiben la liberación de acetilcolina, noradrenalina, serotonina, glutamato y sustancia P. El metabolismo es hepático por glucuronidación inactiva.","w":["El bloqueo del canal de sodio es el mecanismo de los anestésicos locales.","Correcta: salida de potasio e inhibición de la entrada de calcio.","El cloro corresponde al receptor GABA-A, no al opioide.","Invierte ambos flujos iónicos."]},{"c":3,"t":"Subtipos del receptor mu","q":"Relacione el efecto del subtipo mu 1 con el del subtipo mu 2:","o":["Mu 1: depresión respiratoria; mu 2: analgesia supraespinal y sedación","Mu 1: sedación con analgesia espinal; mu 2: dependencia física progresiva","Mu 1: analgesia supraespinal; mu 2: depresión respiratoria","Mu 1: analgesia supraespinal; mu 2: disforia con alucinaciones al despertar"],"a":2,"e":"El receptor mu produce analgesia supraespinal a través de mu 1 y depresión respiratoria a través de mu 2, además de dependencia física y rigidez muscular. Sus agonistas son la morfina, la Met-encefalina, la endorfina beta y el fentanilo. Esa separación explica por qué la investigación siempre ha buscado disociar analgesia de depresión respiratoria dentro del mismo receptor.","w":["Invierte los dos subtipos.","La sedación con analgesia espinal es propia del receptor kappa.","Correcta: mu 1 analgesia supraespinal, mu 2 depresión respiratoria.","La disforia con alucinaciones corresponde al receptor sigma."]},{"c":3,"t":"Receptor kappa","q":"¿Cuáles son los efectos clínicos del receptor kappa?","o":["Disforia y estimulación respiratoria","Analgesia supraespinal y euforia","Efecto epileptógeno y conductual","Sedación y analgesia espinal"],"a":3,"e":"El receptor kappa produce sedación y analgesia espinal, y entre sus agonistas figuran morfina, nalbufina, butorfanol, dinorfina y oxicodona. Coincide con lo que el documento dice de la nalbufina: agonista kappa con analgesia espinal y disforia, y antagonista mu. El receptor delta se relaciona con analgesia, efectos conductuales y actividad epileptógena, y el sigma con disforia, alucinaciones y estimulación respiratoria.","w":["Esos efectos definen al receptor sigma.","La analgesia supraespinal corresponde al receptor mu.","El efecto epileptógeno se atribuye al receptor delta.","Correcta: sedación y analgesia de nivel espinal."]},{"c":3,"t":"Ketamina y receptor sigma","q":"¿Qué receptor opioide comparte la ketamina con la pentazocina y la nalorfina?","o":["El receptor sigma","El receptor kappa","El receptor delta","El receptor mu"],"a":0,"e":"El receptor sigma produce disforia, alucinaciones y estimulación respiratoria, y entre sus agonistas están la pentazocina, la nalorfina y la ketamina. Eso conecta dos temas: la ketamina produce disforia por unión a receptores sigma y alucinaciones al despertar, y para evitarlo en adultos se combina con benzodiacepinas. Es también el único receptor que estimula en lugar de deprimir la respiración.","w":["Correcta: sigma explica la disforia y las alucinaciones de la ketamina.","El kappa agrupa nalbufina, butorfanol y oxicodona.","Los agonistas delta descritos son la Leu-encefalina y la endorfina beta.","El receptor mu tiene como agonistas a morfina y fentanilo."]},{"c":3,"t":"Clasificación por origen","q":"¿Cuál de los siguientes opioides es semisintético?","o":["Meperidina","Hidromorfona","Metadona","Codeína"],"a":1,"e":"La clasificación por origen ordena a los opioides en naturales, con morfina, codeína y heroína; semisintéticos, con hidromorfona, oximorfona, hidrocodona y oxicodona; y sintéticos, con fentanilo, meperidina, metadona, tapentadol y tramadol. Los opioides endógenos son las encefalinas cerebrales, la beta endorfina y la dinorfina.","w":["La meperidina es sintética.","Correcta: la hidromorfona es un derivado semisintético de la morfina.","La metadona es sintética.","La codeína es un opiáceo natural de la amapola."]},{"c":3,"t":"Agonistas mixtos","q":"Todos los siguientes son agonistas-antagonistas mixtos, EXCEPTO uno. ¿Cuál?","o":["Pentazocina","Butorfanol","Naltrexona","Nalbufina"],"a":2,"e":"Los agonistas mixtos son la nalbufina, la pentazocina, la buprenorfina y el butorfanol; los antagonistas son la naloxona, la naltrexona y la metilnaltrexona. La nalbufina es agonista kappa, con analgesia espinal y disforia, y antagonista mu, por lo que precipita abstinencia en el paciente dependiente de un agonista completo. La pentazocina y la buprenorfina son agonistas parciales.","w":["La pentazocina es agonista parcial dentro del grupo de los mixtos.","El butorfanol figura expresamente entre los mixtos.","Correcta: la naltrexona es un antagonista puro, de uso oral.","La nalbufina es el ejemplo clásico de agonista-antagonista mixto."]},{"c":3,"t":"Efecto cardiovascular de los opioides","q":"¿Por qué los opioides producen hipotensión y bradicardia?","o":["Por liberación masiva de histamina","Por depresión miocárdica directa","Por bloqueo directo del nodo sinusal","Por descenso del tono simpático"],"a":3,"e":"Los opioides producen vasodilatación, hipotensión y bradicardia por descenso del tono simpático. Sus otros efectos son analgesia, euforia o disforia, miosis, sedación y efecto antitusivo en el sistema nervioso; depresión respir
